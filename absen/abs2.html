<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Siswa</title>

<style>
body{
  font-family: system-ui;
  background:#eaf2ff;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px;
}

.container{
  max-width:420px;
  width:100%;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  margin-bottom:20px;
}

label{font-size:13px;margin-top:12px;display:block}

select,input,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

button{
  margin-top:20px;
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* ===== TABEL BELUM ABSEN ===== */
.table-box{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  display:none; /* DISSEMBUNYIKAN DULU */
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  border:1px solid #e2e8f0;
  padding:8px;
}

th{
  background:#f1f5f9;
}

/* ===== POPUP ===== */
#popup{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-card{
  background:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  width:300px;
}

.popup-card button{
  background:#22c55e;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h3 style="text-align:center">Absensi Siswa</h3>

<label>Kelas</label>
<select id="kelas"><option value="">-- Pilih Kelas --</option></select>

<label>Nama</label>
<select id="nama" disabled>
  <option value="">-- Pilih Nama --</option>
</select>

<label>Jenis Kelamin</label>
<input id="jk" readonly>

<label>No Meja</label>
<select id="noMeja"><option value="">-- Pilih --</option></select>

<label>Tanggal</label>
<input id="tanggal" readonly>

<label>Status</label>
<select id="status">
<option value="">-- Pilih --</option>
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alpa</option>
</select>

<button onclick="submitAbsensi()" id="btn">Simpan Presensi</button>
<div id="msg"></div>
</div>

<!-- TABEL BELUM ABSEN (AKAN MUNCUL SETELAH SIMPAN) -->
<div class="table-box" id="tableBox">
<h4>📋 Teman yang Belum Absen Hari Ini</h4>
<p id="ringkas"></p>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama Siswa</th>
</tr>
</thead>
<tbody id="tbl"></tbody>
</table>
</div>

</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-card">
    <h3 id="popupTitle"></h3>
    <p id="popupText"></p>
    <button onclick="tutupPopup()">OK</button>
  </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbxoRAOtKcG-1binkkGCFrpEAo1iLoMAhA8qVhUydVszr9hHYEu9s-BA-_MtEZcbKPbJ/exec";

const kelas = document.getElementById("kelas");
const nama = document.getElementById("nama");
const jk = document.getElementById("jk");
const status = document.getElementById("status");
const noMeja = document.getElementById("noMeja");
const tanggal = document.getElementById("tanggal");
const tbl = document.getElementById("tbl");
const ringkas = document.getElementById("ringkas");
const tableBox = document.getElementById("tableBox");

tanggal.value = new Date().toLocaleString("id-ID");

for(let i=1;i<=40;i++){
  noMeja.innerHTML += `<option>Meja ${i}</option>`;
}

// LOAD DATA SISWA
let dataSiswa=[];

fetch(API_URL + "?action=getDataSiswa")
.then(r=>r.json())
.then(d=>{
  dataSiswa=d;
  [...new Set(d.map(s=>s.rombel))].forEach(k=>{
    kelas.innerHTML += `<option>${k}</option>`;
  });
});

// PILIH KELAS (TIDAK LOAD BELUM ABSEN LAGI)
kelas.onchange=()=>{
  nama.innerHTML='<option value="">-- Pilih Nama --</option>';
  nama.disabled=true;
  jk.value="";

  dataSiswa.filter(s=>s.rombel===kelas.value)
    .forEach(s=>{
      nama.innerHTML+=
      `<option data-jk="${s.jk}">${s.nama}</option>`;
    });

  nama.disabled=false;
};

// PILIH NAMA → CEK DIRI OTOMATIS
nama.onchange=()=>{
  jk.value = nama.selectedOptions[0]?.dataset.jk || "";
  cekDiri();
};

// CEK DIRI (POPUP)
function cekDiri(){
  if(!nama.value || !kelas.value) return;

  fetch(`${API_URL}?action=checkAbsensi&nama=${encodeURIComponent(nama.value)}&rombel=${encodeURIComponent(kelas.value)}`)
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="sudah"){
      popup("✅ SUDAH ABSEN",
      `Kamu sudah absen sebagai: ${res.statusAbsen}`);
    }else{
      popup("⚠️ BELUM ABSEN",
      "Silakan isi presensi sekarang.");
    }
  });
}

// LOAD DAFTAR BELUM ABSEN (HANYA DIPANGGIL SETELAH SIMPAN)
function loadBelumAbsen(){
  if(!kelas.value) return;

  tableBox.style.display="block"; // MUNCULKAN TABEL

  fetch(`${API_URL}?action=getBelumAbsen&rombel=${encodeURIComponent(kelas.value)}`)
  .then(r=>r.json())
  .then(res=>{
    tbl.innerHTML="";
    ringkas.innerText =
      `Kelas ${res.kelas} — Total ${res.totalSiswa} siswa, `+
      `${res.sudahAbsen} sudah absen, `+
      `${res.belumAbsen} belum absen.`;

    if(res.daftarBelum.length===0){
      tbl.innerHTML =
      `<tr><td colspan="2">✅ Semua siswa sudah absen</td></tr>`;
      return;
    }

    res.daftarBelum.forEach((n,i)=>{
      tbl.innerHTML +=
      `<tr><td>${i+1}</td><td>${n}</td></tr>`;
    });
  });
}

// SUBMIT ABSENSI
function submitAbsensi(){
  const fd=new URLSearchParams();
  fd.append("action","submitAbsensi");
  fd.append("nama",nama.value);
  fd.append("jk",jk.value);
  fd.append("rombel",kelas.value);
  fd.append("status",status.value);
  fd.append("noMeja",noMeja.value);

  fetch(API_URL,{method:"POST",body:fd})
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="success"){
      popup("✅ BERHASIL","Absen tersimpan"); // ← sesuai permintaan
      loadBelumAbsen(); // ← baru muncul setelah klik simpan
    }else{
      popup("⚠️ GAGAL","Kamu sudah absen hari ini");
    }
  });
}

// POPUP
function popup(title,text){
  document.getElementById("popupTitle").innerText=title;
  document.getElementById("popupText").innerText=text;
  document.getElementById("popup").style.display="flex";
}

function tutupPopup(){
  document.getElementById("popup").style.display="none";
}
</script>
</body>
</html>
