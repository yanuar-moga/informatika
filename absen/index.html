<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Siswa</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <!-- LOGO -->
    <img src="assets/logo.png" class="logo" alt="Logo Sekolah">

    <h2>Absensi Siswa</h2>
    <p class="subtitle">SMP Negeri 1 Moga</p>

    <!-- FORM (WAJIB) -->
    <form id="formAbsensi">

      <!-- KELAS -->
      <label for="kelas">Kelas</label>
      <select id="kelas" required>
        <option value="">-- Pilih Kelas --</option>
      </select>

      <!-- NAMA -->
      <label for="nama">Nama Siswa</label>
      <select id="nama" disabled required>
        <option value="">-- Pilih Nama --</option>
      </select>

      <!-- JK -->
      <label for="jk">Jenis Kelamin</label>
      <input type="text" id="jk" readonly>

      <!-- TANGGAL -->
      <label for="tanggal">Tanggal Presensi</label>
      <input type="text" id="tanggal" readonly>

      <!-- STATUS -->
      <label for="status">Status Kehadiran</label>
      <select id="status" required>
        <option value="">-- Pilih Status --</option>
        <option value="Hadir">Hadir</option>
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
        <option value="Alpa">Alpa</option>
      </select>

      <!-- SUBMIT -->
      <button type="submit">
        Simpan Presensi
      </button>

      <!-- PESAN -->
      <div id="msg"></div>

    </form>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
