<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Siswa</title>

<style>
body{
  font-family: system-ui;
  background:#eaf2ff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.card{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:360px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}
label{font-size:13px;margin-top:12px;display:block}
select,input,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}
button{
  margin-top:20px;
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}
#msg{text-align:center;margin-top:12px}
  .logo {
  display: block;
  margin: 0 auto 12px auto;
  max-width: 90px;
}

</style>
</head>

<body>
<div class="card">

  <img src="assets/logo.png" alt="Logo Sekolah" class="logo">

  <h3 style="text-align:center">Absensi Siswa</h3>


<label>Kelas</label>
<select id="kelas"><option value="">-- Pilih Kelas --</option></select>

<label>Nama</label>
<select id="nama" disabled><option value="">-- Pilih Nama --</option></select>

<label>Jenis Kelamin</label>
<input id="jk" readonly>

<label>No Meja</label>
<select id="noMeja"><option value="">-- Pilih --</option></select>

<label>Tanggal</label>
<input id="tanggal" readonly>

<label>Status</label>
<select id="status">
<option value="">-- Pilih --</option>
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alpa</option>
</select>

<button onclick="submitAbsensi()" id="btn">Simpan Presensi</button>
<div id="msg"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxoRAOtKcG-1binkkGCFrpEAo1iLoMAhA8qVhUydVszr9hHYEu9s-BA-_MtEZcbKPbJ/exec";

const kelas = document.getElementById("kelas");
const nama = document.getElementById("nama");
const jk = document.getElementById("jk");
const status = document.getElementById("status");
const noMeja = document.getElementById("noMeja");
const tanggal = document.getElementById("tanggal");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

let dataSiswa = [];

tanggal.value = new Date().toLocaleString("id-ID");

for(let i=1;i<=40;i++){
  noMeja.innerHTML += `<option>Meja ${i}</option>`;
}

// LOAD DATA SISWA
fetch(API_URL + "?action=getDataSiswa")
.then(r=>r.json())
.then(d=>{
  dataSiswa=d;
  [...new Set(d.map(s=>s.rombel))].forEach(k=>{
    kelas.innerHTML += `<option>${k}</option>`;
  });
});

// PILIH KELAS
kelas.onchange=()=>{
  nama.innerHTML='<option value="">-- Pilih Nama --</option>';
  nama.disabled=true;
  jk.value="";
  dataSiswa.filter(s=>s.rombel===kelas.value)
    .forEach(s=>{
      nama.innerHTML+=`<option data-jk="${s.jk}">${s.nama}</option>`;
    });
  nama.disabled=false;
};

// PILIH NAMA
nama.onchange=()=>{
  jk.value=nama.selectedOptions[0]?.dataset.jk||"";
};

// SUBMIT
function submitAbsensi(){
  btn.disabled=true;
  btn.innerText="Menyimpan...";

  const fd=new URLSearchParams();
  fd.append("action","submitAbsensi");
  fd.append("nama",nama.value);
  fd.append("jk",jk.value);
  fd.append("rombel",kelas.value);
  fd.append("status",status.value);
  fd.append("noMeja",noMeja.value);

  fetch(API_URL,{method:"POST",body:fd})
  .then(r=>r.json())
  .then(res=>{
    msg.innerText =
      res.status==="success" ? "✅ Presensi tersimpan" :
      res.status==="duplicate" ? "⚠️ Sudah absen" :
      "❌ "+res.message;
    btn.disabled=false;
    btn.innerText="Simpan Presensi";
  })
  .catch(()=>{
    msg.innerText="❌ Gagal menyimpan";
    btn.disabled=false;
    btn.innerText="Simpan Presensi";
  });
}
</script>
</body>
</html>
