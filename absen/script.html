<script>
let dataSiswa = [];

// Tanggal
document.getElementById("tanggal").value =
  new Date().toLocaleString("id-ID");

// LOAD DATA SISWA
google.script.run.withSuccessHandler(data => {
  dataSiswa = data;

  // Ambil rombel unik
  const rombelUnik = [...new Set(data.map(s => s.rombel))];

  const kelasSelect = document.getElementById("kelas");
  rombelUnik.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r;
    opt.textContent = r;
    kelasSelect.appendChild(opt);
  });

}).getDataSiswa();

// PILIH ROMBEL
kelas.onchange = () => {
  nama.disabled = false;
  nama.innerHTML = `<option value="">-- Pilih Nama --</option>`;

  dataSiswa
    .filter(s => s.rombel === kelas.value)
    .forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.nama;
      opt.textContent = s.nama;
      opt.dataset.jk = s.jk;
      nama.appendChild(opt);
    });
};

// PILIH NAMA
nama.onchange = () => {
  jk.value = nama.selectedOptions[0]?.dataset.jk || "";
};

// SUBMIT
function submitAbsensi() {
  msg.innerText = "⏳ Menyimpan...";

  google.script.run.withSuccessHandler(res => {
    if (res.status === "success") {
      msg.innerText = "✅ Presensi berhasil";
    } else if (res.status === "duplicate") {
      msg.innerText = "⚠️ Sudah presensi hari ini";
    } else {
      msg.innerText = "❌ " + res.message;
    }
  }).submitAbsensi({
    rombel: kelas.value,
    nama: nama.value,
    jk: jk.value,
    status: status.value
  });
}
</script>
