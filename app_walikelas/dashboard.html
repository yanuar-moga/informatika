<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Administrasi Guru</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:Inter,Arial,sans-serif;
}

.header{
  background:#020617;
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1e293b;
}

.header h2{
  margin:0;
  font-weight:800;
  color:#38bdf8;
}

.card{
  background:#0f172a;
  padding:24px;
  border-radius:20px;
  max-width:1200px;
  margin:30px auto;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

select,button{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-weight:600;
}

button{
  background:#38bdf8;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #1e293b;
}

th{
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="header">
  <h2 id="judul">Dashboard Guru</h2>
</div>

<div class="card">

  <div class="row">
    <select id="pilihKelas"></select>
    <button onclick="muatSiswa()">Tampilkan Siswa</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama Siswa</th>
        <th>Kelas</th>
      </tr>
    </thead>
    <tbody id="tbl"></tbody>
  </table>

</div>

<script>
/* ===== LOAD MASTER DATA (KELAS) ===== */
google.script.run.withSuccessHandler(function(res){
  let sel = document.getElementById("pilihKelas");
  sel.innerHTML = "<option value=''>-- Pilih Kelas --</option>";

  res.kelas.forEach(k=>{
    sel.innerHTML += `<option value="${k}">${k}</option>`;
  });

}).getMasterData();

/* ===== AMBIL SISWA PER KELAS ===== */
function muatSiswa(){
  let kls = document.getElementById("pilihKelas").value;
  if(!kls){
    alert("Pilih kelas dulu!");
    return;
  }

  google.script.run.withSuccessHandler(tampilkanSiswa)
    .getSiswaByKelas(kls);
}

/* ===== TAMPILKAN KE TABEL ===== */
function tampilkanSiswa(arr){
  let tbody = document.getElementById("tbl");
  tbody.innerHTML = "";

  arr.forEach((nama, i)=>{
    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${nama}</td>
        <td>${document.getElementById("pilihKelas").value}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
