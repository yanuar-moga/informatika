<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Guru / Wali</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:Inter,Arial,sans-serif;
}
.header{
  background:#020617;
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1e293b;
}
.header h2{margin:0;font-weight:800;color:#38bdf8}
.header button{
  background:#ef4444;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.card{
  background:#0f172a;
  padding:24px;
  border-radius:20px;
  max-width:1200px;
  margin:30px auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.stat{
  background:#020617;
  padding:18px;
  border-radius:14px;
  text-align:center;
  font-weight:600;
}

.control{
  margin:20px 0;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

select,button{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-weight:600;
}

button{
  background:#38bdf8;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #1e293b;
  text-align:left;
}

th{
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<!-- CEK LOGIN LOCAL -->
<script>
if(sessionStorage.getItem("isLogin") !== "true"){
  location.href = "index.html";
}
</script>

<div class="header">
  <h2 id="userTitle">Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="card">

  <div class="grid">
    <div class="stat" id="t1">Total</div>
    <div class="stat" id="t2">Laki</div>
    <div class="stat" id="t3">Perempuan</div>
    <div class="stat" id="t4">KIP</div>
  </div>

  <div class="control">
    <select id="filter" onchange="loadSiswa(this.value)">
      <option value="">Semua</option>
      <option value="L">Laki-laki</option>
      <option value="P">Perempuan</option>
      <option value="KIP">Penerima KIP</option>
      <option value="YATIM">Yatim / Piatu</option>
    </select>

    <button onclick="cetak('absensi')">Cetak Absensi PDF</button>
    <button onclick="cetak('leger')">Cetak Leger PDF</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>JK</th>
        <th>NIS</th>
        <th>NISN</th>
      </tr>
    </thead>
    <tbody id="tbl"></tbody>
  </table>

</div>

<script>
/* API Google Apps Script Anda */
const API = 
"https://script.google.com/macros/s/AKfycbxVg9psHAIjOsqdfSFT18HCCXn_1aAwCRGGoQtyJkfDEQd7gwv5qCmd8vhTGn2zdpgQCg/exec";

/* ambil email dari sessionStorage */
const email = sessionStorage.getItem("email");

let kelasAktif = "";

/* ambil data user & set judul */
fetch(`${API}?action=login&email=${email}`)
  .then(r => r.json())
  .then(u => {
    if(u.error){
      alert(u.error);
      sessionStorage.clear();
      location.href="index.html";
      return;
    }
    kelasAktif = u.kelas;
    userTitle.innerText = `${u.nama} (${u.role}) - ${kelasAktif}`;

    /* load data awal */
    loadSiswa();
    loadStat();
  });

/* load siswa */
function loadSiswa(filter=""){
  fetch(`${API}?action=siswa&kelas=${kelasAktif}&filter=${filter}`)
    .then(r=>r.json())
    .then(d=>{
      tbl.innerHTML = d.map(s=>`
        <tr>
          <td>${s.nama}</td>
          <td>${s.jk}</td>
          <td>${s.nis || "-"}</td>
          <td>${s.nisn || "-"}</td>
        </tr>
      `).join("");
    });
}

/* load statistik */
function loadStat(){
  fetch(`${API}?action=statistik&kelas=${kelasAktif}`)
    .then(r=>r.json())
    .then(s=>{
      t1.innerText = `Total: ${s.total}`;
      t2.innerText = `L: ${s.laki}`;
      t3.innerText = `P: ${s.perempuan}`;
      t4.innerText = `KIP: ${s.kip}`;
    });
}

/* cetak PDF */
function cetak(t){
  window.open(`${API}?action=${t}PDF&kelas=${kelasAktif}`);
}

/* logout */
window.logout = function(){
  sessionStorage.clear();
  location.href="index.html";
};
</script>

</body>
</html>
