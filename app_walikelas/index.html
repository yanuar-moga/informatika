<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - Aplikasi Wali Kelas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  background:linear-gradient(135deg,#e0f2fe,#f8fafc);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#020617;
}

.login-card{
  width:360px;
  background:#ffffff;
  border-radius:20px;
  padding:30px 26px 24px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  text-align:center;
}

.logo{width:80px;margin-bottom:12px;}

.title{
  margin:6px 0 20px;
  color:#0284c7;
  font-size:22px;
  font-weight:800;
}

.field{display:flex;flex-direction:column;margin-bottom:14px;}

.input-field{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #e2e8f0;
  font-size:14px;
  height:42px;
  outline:none;
  background:#f8fafc;
}

.btn-primary{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.footer{margin-top:18px;font-size:12px;color:#475569;}
</style>
</head>

<body>

<div class="login-card">

  <img src="assets/logo.png" alt="Logo Sekolah" class="logo">
  <h1 class="title">Aplikasi Guru Wali</h1>

  <form id="loginForm">

    <div class="field">
      <input id="email" type="email" class="input-field"
             placeholder="email@gmail.com" required>
    </div>

    <div class="field">
      <input id="password" type="password" class="input-field"
             placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-primary">Masuk</button>

  </form>

  <div class="footer">© 2026 Sistem Administrasi Sekolah</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_Dl5cdFBh_dyhkhthI2gclhWoz4ZHYls",
  authDomain: "login-2f19a.firebaseapp.com",
  projectId: "login-2f19a",
  appId: "1:751593178422:web:1d36294b46d1a954b15f97"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "dashboard.html"; // ✅ PINDAH PASTI
    })
    .catch(err => {
      alert("Login gagal:\n" + err.message);
    });
});
</script>

</body>
</html>
