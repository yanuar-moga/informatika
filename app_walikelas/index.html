<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Administrasi Guru</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020617;color:white;font-family:Inter}
.card{background:#0f172a;padding:24px;border-radius:20px;max-width:1100px;margin:40px auto}
button,select,input{padding:10px;border-radius:10px;border:none}
button{background:#38bdf8;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:#020617;padding:16px;border-radius:14px;text-align:center}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #1e293b}
</style>
</head>

<body>

<div class="card" id="login">
  <h2>Login Guru / Wali</h2>
  <input id="nama" placeholder="Nama">
  <button onclick="login()">Masuk</button>
</div>

<div class="card" id="app" style="display:none">
  <h2 id="title"></h2>

  <div class="grid">
    <div class="stat" id="t1"></div>
    <div class="stat" id="t2"></div>
    <div class="stat" id="t3"></div>
    <div class="stat" id="t4"></div>
  </div>

  <select onchange="load(this.value)">
    <option value="">Semua</option>
    <option value="L">Laki</option>
    <option value="P">Perempuan</option>
    <option value="KIP">Penerima KIP</option>
    <option value="YATIM">Yatim</option>
  </select>

  <button onclick="pdf('absensi')">Cetak Absensi</button>
  <button onclick="pdf('leger')">Cetak Leger</button>

  <table>
    <thead><tr><th>Nama</th><th>JK</th><th>NISN</th></tr></thead>
    <tbody id="tbl"></tbody>
  </table>
</div>

<script>
const API = "PASTE_WEBAPP_URL";
let kelas = "";

function login(){
 fetch(`${API}?action=login&nama=${nama.value}`)
 .then(r=>r.json())
 .then(u=>{
  if(u.error) return alert(u.error);
  kelas = u.kelas;
  login.style.display="none";
  app.style.display="block";
  title.innerText = `${u.nama} (${u.role})`;
  load();
  stat();
 });
}

function load(f=""){
 fetch(`${API}?action=siswa&kelas=${kelas}&filter=${f}`)
 .then(r=>r.json())
 .then(d=>{
  tbl.innerHTML = d.map(s=>`
    <tr><td>${s.nama}</td><td>${s.jk}</td><td>${s.nisn}</td></tr>
  `).join("");
 });
}

function stat(){
 fetch(`${API}?action=statistik&kelas=${kelas}`)
 .then(r=>r.json())
 .then(s=>{
  t1.innerText=`Total: ${s.total}`;
  t2.innerText=`L: ${s.laki}`;
  t3.innerText=`P: ${s.perempuan}`;
  t4.innerText=`KIP: ${s.kip}`;
 });
}

function pdf(t){
 window.open(`${API}?action=${t}PDF&kelas=${kelas}`);
}
</script>
</body>
</html>
