<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>CBT Asesmen Informatika</title>

    <style>
        :root {
            --primary: #2f5597;
            --accent: #ffc107;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f4f7f9;
            --text: #333;
            --footer-bg: #000; /* Warna Hitam untuk Footer */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            user-select: none; /* Mencegah copy-paste soal */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: var(--primary);
            color: #fff;
            padding: 0 20px;
            height: 60px;
            display: none; 
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .timer-box {
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
        }

        /* LAYOUT UTAMA */
        .wrap {
            display: flex;
            flex: 1; /* Membuat konten mengisi ruang yang tersedia agar footer terdorong ke bawah */
        }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-soal {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-height: 400px;
        }

        .nomor-soal {
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .teks-soal {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .img-soal {
            max-width: 100%;
            display: block;
            margin: 0 auto 20px;
            border-radius: 4px;
        }

        /* PILIHAN JAWABAN */
        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opsi-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opsi-item:hover { background: #f0f4ff; }
        .opsi-item input { margin-right: 15px; transform: scale(1.2); }
        .opsi-item.selected {
            background: #e8f0fe;
            border-color: var(--primary);
            font-weight: 600;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 20px;
        }

        .grid-nomor {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .num {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .num.active { border: 2px solid var(--primary); color: var(--primary); }
        .num.done { background: var(--success); color: #fff; border-color: var(--success); }

        .nav-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .blue { background: var(--primary); color: #fff; }
        .green { background: var(--success); color: #fff; }
        .red { background: var(--danger); color: #fff; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
        .box { background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px; text-align:center; border-top: 5px solid var(--primary); }
        
        .login-container { flex: 1; display:flex; align-items:center; justify-content:center; background: var(--primary); }
        .login-box { width:90%; max-width:380px; background:#fff; padding:30px; border-radius:12px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }

        /* FOOTER STYLE */
        .main-footer {
            background: var(--footer-bg);
            color: #fff;
            text-align: center;
            padding: 12px 10px;
            font-size: 0.85rem;
            border-top: 2px solid var(--accent);
        }

        @media (max-width: 768px) {
            .wrap { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #ddd; order: 2; box-sizing: border-box; }
            .content { order: 1; }
            
            /* Penyesuaian kotak nomor agar tidak terlalu besar di HP */
            .grid-nomor {
                grid-template-columns: repeat(6, 1fr); /* Menambah kolom di HP agar lebih compact */
                gap: 6px;
            }
            .num {
                aspect-ratio: auto;
                height: 40px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="header" id="mainHeader">
    <div>
        <strong id="namaDisp"></strong><br>
        <span id="kelasDisp" style="font-size: 0.75rem; opacity: 0.8;"></span>
    </div>
    <div class="timer-box" id="timer">00:00</div>
    <button onclick="keluar()" class="btn red" style="padding: 5px 10px; font-size: 0.7rem;">KELUAR</button>
</div>

<div id="app"></div>

<footer class="main-footer">
    CBT Asesmen Informatika Ver 1.1 | Dev by MB &copy; 2026
</footer>

<div id="modalBox" class="modal">
    <div class="box">
        <h3 id="mTitle" style="color: var(--primary); margin-top: 0;"></h3>
        <div id="mMsg" style="margin: 15px 0; font-size: 0.95rem; line-height: 1.4;"></div>
        <div id="mAct" style="display:flex; justify-content: center; gap: 10px;"></div>
    </div>
</div>

<script>
// URL WEB APP GAS
const API = "https://script.google.com/macros/s/AKfycbwJhsKy_JrQKBMB-_A5rfewVE1an2nnY3o5KwYq7ZnQ9zLpP58G9M-1h5D8N744xNEB/exec"; 

let dataSiswa = [];
let state = { soal: [], index: 0, jawaban: [] };

function modal(t, m, btns) {
    const mAct = document.getElementById("mAct");
    mAct.innerHTML = "";
    document.getElementById("mTitle").innerText = t;
    document.getElementById("mMsg").innerHTML = m;
    btns.forEach(b => {
        let x = document.createElement("button");
        x.className = "btn " + b.cls;
        x.innerText = b.text;
        x.onclick = () => { document.getElementById("modalBox").style.display = "none"; if (b.cb) b.cb(); };
        mAct.appendChild(x);
    });
    document.getElementById("modalBox").style.display = "flex";
}

function loginUI() {
    document.getElementById("mainHeader").style.display = "none";
    const app = document.getElementById("app");
    app.innerHTML = `
    <div class="login-container">
        <div class="login-box">
            <div style="text-align:center; margin-bottom: 15px;">
                <img src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png" alt="Logo" style="width: 80px; height: auto;">
            </div>
            <h2 style="text-align:center; color:var(--primary); margin-top: 0;">REMIDIAL ASAT</h2>
            <p style="text-align:center; font-size: 0.85rem; color: #666; margin-top: -10px; margin-bottom: 20px;">Informatika Kelas 7</p>
            
            <div class="form-group">
                <label>PILIH KELAS</label>
                <select id="kelasSelect"><option>Memuat kelas...</option></select>
            </div>
            <div class="form-group">
                <label>NAMA SISWA</label>
                <select id="username"><option value="">-- Pilih Nama --</option></select>
            </div>
            <div class="form-group">
                <label>TOKEN</label>
                <input id="token" style="text-transform: uppercase; font-weight:bold; text-align:center" placeholder="Ketik Token">
            </div>
            <button id="btnLogin" class="btn blue" style="width:100%;" onclick="login()">KERJAKAN REMIDIAL</button>
        </div>
    </div>`;

    fetch(API).then(r => r.json()).then(d => {
        dataSiswa = d;
        let k = [...new Set(d.map(x => x.kelas))];
        let sel = document.getElementById('kelasSelect');
        sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        k.forEach(x => sel.innerHTML += `<option>${x}</option>`);
        sel.onchange = () => {
            let kVal = sel.value;
            let un = document.getElementById('username');
            un.innerHTML = '<option value="">-- Pilih Nama --</option>';
            dataSiswa.filter(x => x.kelas == kVal).forEach(s => {
                un.innerHTML += `<option value="${s.username}" data-nama="${s.nama}">${s.nama}</option>`;
            });
        };
    }).catch(() => {
        modal("Koneksi Gagal", "Gagal terhubung ke server. Periksa jaringan Anda.", [{text:"OK", cls:"blue"}]);
    });
}

async function login() {
    let selName = document.getElementById('username');
    let user = selName.value;
    let namaReal = selName.options[selName.selectedIndex]?.getAttribute('data-nama');
    let kls = document.getElementById('kelasSelect').value;
    let token = document.getElementById('token').value;

    if (!user || !token) {
        return modal("Peringatan", "Silakan Pilih Nama & Isi Token terlebih dahulu!", [{text:"OK", cls:"blue"}]);
    }

    document.getElementById('btnLogin').innerText = "Verifikasi...";
    
    let device = navigator.userAgent;
    let ip = "-";

    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        ip = data.ip;
    } catch (e) {
        console.error("Gagal mendapatkan IP:", e);
    }
    
    fetch(API, {
        method: "POST",
        body: JSON.stringify({ 
            mode: "login", 
            username: user, 
            nama: namaReal, 
            kelas: kls, 
            token: token,
            ip: ip,      
            device: device 
        })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "success") {
            localStorage.setItem("user", JSON.stringify(res));
            localStorage.setItem("layer", "konfirmasi");
            init();
        } else {
            modal("Gagal Masuk", res.msg, [{text:"COBA LAGI", cls:"red"}]);
            document.getElementById('btnLogin').innerText = "MASUK UJIAN";
        }
    })
    .catch(err => {
        modal("Error", "Terjadi kesalahan koneksi ke server.", [{text:"OK", cls:"red"}]);
        document.getElementById('btnLogin').innerText = "MASUK UJIAN";
    });
}

function showKonfirmasi() {
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("mainHeader").style.display = "none";
    document.getElementById("app").innerHTML = `
    <div style="max-width:600px; margin:40px auto; background:#e0e0e0; padding:30px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.1); font-family: Arial, sans-serif; color: #333;">
        <div style="line-height: 1.8; font-size: 1.1rem;">
            <p style="margin: 5px 0;">Nama : <b>${u.nama}</b></p>
            <p style="margin: 5px 0;">Kelas : <b>${u.kelas}</b></p>
            <p style="margin: 5px 0;">Mata Pelajaran : <b>Informatika</b></p>
            <p style="margin: 5px 0;">Semester : <b>Genap</b></p>
            <p style="margin: 5px 0;">Tahun Pelajaran : <b>2026 - 2027</b></p>
        </div>
        <hr style="border: 0; border-top: 1px solid #999; margin: 20px 0;">
        <div style="font-size: 1.05rem;">
            <p><b>Informasi Ujian:</b></p>
            <ul style="margin-left: -10px;">
                <li>Jumlah soal: Otomatis</li>
                <li>Durasi: 90 menit</li>
            </ul>
        </div>
        <button class="btn" onclick="startExam()" 
            style="width:100%; background: #ff5722; color: white; padding: 15px; font-size: 1.1rem; border-radius: 10px; margin-top: 25px; font-weight: bold; border: none; cursor: pointer;">
            KERJAKAN UJIAN
        </button>
    </div>`;
}

function startExam() {
    localStorage.setItem("layer", "soal");
    fetch(API + "?mode=soal").then(r => r.json()).then(d => {
        let saved = localStorage.getItem("cbt_state");
        if (saved) {
            state = JSON.parse(saved);
        } else {
            state.soal = d;
            state.jawaban = new Array(d.length).fill("");
            state.index = 0;
            localStorage.setItem("cbt_state", JSON.stringify(state));
        }
        render();
        startTimer();
    });
}

function startTimer() {
    let end = localStorage.getItem("endTime");
    if (!end) {
        end = Date.now() + (90 * 60 * 1000); 
        localStorage.setItem("endTime", end);
    }
    const timerInt = setInterval(() => {
        let sisa = Math.floor((end - Date.now()) / 1000);
        if (sisa <= 0) { 
            clearInterval(timerInt); 
            submitAction(); 
            return; 
        }
        let m = Math.floor(sisa / 60);
        let s = sisa % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

function render() {
    document.getElementById("mainHeader").style.display = "flex";
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("namaDisp").innerText = u.nama;
    document.getElementById("kelasDisp").innerText = u.kelas;

    let s = state.soal[state.index];
    let sideGrid = '';
    state.soal.forEach((_, i) => {
        let cls = "num" + (i === state.index ? " active" : "") + (state.jawaban[i] ? " done" : "");
        sideGrid += `<div class="${cls}" onclick="state.index=${i};render()">${i+1}</div>`;
    });

    let opsHtml = '';
    ["A","B","C","D","E"].forEach(o => {
        if(s.pilihan[o]) {
            let isSel = state.jawaban[state.index] === o;
            opsHtml += `<div class="opsi-item ${isSel?'selected':''}" onclick="jawab('${o}')">
                <input type="radio" name="q" ${isSel?'checked':''}> <span>${o}. ${s.pilihan[o]}</span>
            </div>`;
        }
    });

    document.getElementById("app").innerHTML = `
    <div class="wrap">
        <div class="content">
            <div class="card-soal">
                <div class="nomor-soal">NOMOR ${state.index + 1}</div>
                ${s.gambar ? `<img src="${s.gambar}" class="img-soal">` : ''}
                <div class="teks-soal">${s.soal}</div>
                <div class="opsi-container">${opsHtml}</div>
                <div class="nav-footer">
                    <button class="btn blue" onclick="state.index--;render()" ${state.index==0?'disabled':''}>KEMBALI</button>
                    ${state.index == state.soal.length-1 
                        ? `<button class="btn green" onclick="popupSubmit()">SELESAI</button>` 
                        : `<button class="btn blue" onclick="state.index++;render()">LANJUT</button>`}
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="grid-nomor">${sideGrid}</div>
        </div>
    </div>`;
}

function jawab(v) {
    state.jawaban[state.index] = v;
    localStorage.setItem("cbt_state", JSON.stringify(state));
    render();
}

function popupSubmit() {
    modal("Selesai?", "Kirim jawaban sekarang?", [{text:"BATAL",cls:"blue"}, {text:"KIRIM",cls:"green",cb:submitAction}]);
}

function submitAction() {
    document.getElementById("app").innerHTML = "<div style='text-align:center;padding:50px;flex:1'><h2>Mengirim Jawaban...</h2><p>Mohon tunggu, jangan tutup halaman ini.</p></div>";
    let u = JSON.parse(localStorage.getItem("user"));
    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            mode: "submit",
            idLogin: u.idLogin,
            nama: u.nama,
            kelas: u.kelas,
            jawaban: state.jawaban
        })
    }).then(r => r.json()).then(res => {
        localStorage.clear();
        document.getElementById("mainHeader").style.display = "none";
        document.getElementById("app").innerHTML = `
        <div style='text-align:center;padding:50px;flex:1'>
            <h2 style="color:var(--success)">TERIMA KASIH</h2>
            <p>Jawaban berhasil dikirim dan tersimpan di server.</p>
            <div style="font-size:2rem; margin:20px 0;">Nilai Anda: <b>${res.nilai}</b></div>
            <button class='btn blue' onclick='location.reload()'>LOGOUT</button>
        </div>`;
    }).catch(err => {
        modal("Pengiriman Gagal", "Gagal mengirim jawaban. Silakan coba klik Selesai lagi.", [{text:"OK", cls:"blue"}]);
        render();
    });
}

function keluar() { 
    modal("Keluar Ujian?", "Data yang belum terkirim mungkin akan hilang. Anda yakin ingin keluar?", [
        {text: "BATAL", cls: "blue"},
        {
            text: "KELUAR", 
            cls: "red", 
            cb: () => {
                localStorage.clear(); 
                location.reload(); 
            }
        }
    ]);
}

function init() {
    let layer = localStorage.getItem("layer");
    if (!localStorage.getItem("user")) loginUI();
    else if (layer === "konfirmasi") showKonfirmasi();
    else if (layer === "soal") startExam();
}

init();
</script>
</body>
</html>
