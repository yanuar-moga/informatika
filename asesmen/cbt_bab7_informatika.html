<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Informatika</title>

<style>
/* (CSS kamu tetap, tidak diubah) */
body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}
.container{max-width:900px;width:95%;margin:auto;margin-top:20px;background:white;padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
.header{display:flex;justify-content:space-between;align-items:center;}
.userBox{text-align:center;min-width:160px;}
.userInfo{font-size:14px;font-weight:600;}
.status{font-size:13px;margin-top:4px;display:none;}
.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}
#btnLogout{margin-top:6px;background:#ef4444;display:none;}
.logo{display:block;margin:auto;width:90px;margin-bottom:10px;}
h2{text-align:center;margin-bottom:20px;font-weight:700;color:#1e293b;}
.loginBox{max-width:320px;margin:auto;}
.loginBox label{display:block;margin-top:12px;}
.inputBox,select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:4px;box-sizing:border-box;}
.passwordCheck{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;}
button{background:#2563eb;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;width:100%;}
#nomor{display:flex;flex-wrap:wrap;margin-top:10px;}
#nomor span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:3px;background:#e2e8f0;border-radius:6px;cursor:pointer;}
.dijawab{background:#22c55e!important;color:white;}
#progressBox{height:8px;background:#e5e7eb;border-radius:10px;margin-top:10px;}
#progressBar{height:8px;width:0%;background:#2563eb;border-radius:10px;}
.opsi{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:10px;border:2px solid #e2e8f0;}
.opsi.aktif{border:2px solid #2563eb;background:#eff6ff;}
.circle{width:34px;height:34px;border-radius:50%;border:2px solid #94a3b8;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.opsi.aktif .circle{background:#2563eb;color:white;}
</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<h2>CBT Informatika</h2>

<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<br>
<button onclick="login()">Login</button>

</div>

<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div style="display:flex;gap:10px;margin-top:10px;">
<button onclick="prev()">Prev</button>
<button onclick="kirim()" id="btnKirim">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

/* ======================
CONFIG
====================== */
var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyfmlPkyhY6uz9Whhvp-Qp7TbnbeVPJzE207gSE7CpmR0jROwpkJyRdI4Bbb2c_1mc/exec";

/* ======================
STATE
====================== */
var soal=[], jawaban=[], no=0;
var nama="", kelas="", jk="";
var waktu=1800;
var sudahSubmit=false;

/* ======================
API
====================== */
function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

/* ======================
LOGIN
====================== */
function login(){

nama=document.getElementById("nama").value;
var password=document.getElementById("password").value;

if(!nama||!password){alert("Lengkapi login!");return;}

gas("login",{nama:nama,password:password},function(res){

if(res.status=="ok"){

jk=res.jk;
kelas=res.kelas;

localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);
localStorage.setItem("jk",jk);

startUjian();

}else alert("Login gagal");

});

}

function startUjian(){

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML=nama+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();
timer();

}

/* ======================
LOAD DATA
====================== */
function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option>Pilih</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){
kelas=document.getElementById("kelas").value;
gas("getNama",{kelas:kelas},function(data){
var n=document.getElementById("nama");
n.innerHTML="<option>Pilih</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
n.appendChild(o);
});
});
}

/* ======================
SOAL
====================== */
function loadSoal(){

gas("getSoal",{},function(data){

soal=data;
jawaban=new Array(soal.length).fill("");

document.getElementById("nomor").innerHTML="";

soal.forEach((s,i)=>{
document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

tampil();

});

}

function tampil(){

var s=soal[no];

var html="<b>"+(no+1)+".</b> "+s.pertanyaan+"<br><br>";

if(s.gambar){
html+="<img src='"+s.gambar+"' style='max-width:100%'><br><br>";
}

/* 🔥 PAKAI KEY ASLI */
s.opsi.forEach(o=>{

var aktif = jawaban[no]==o.key ? "aktif":"";

html+=`
<div class="opsi ${aktif}" onclick="jawab('${o.key}',this)">
<div class="circle">${o.key}</div>
<div>${o.text}</div>
</div>
`;

});

document.getElementById("soal").innerHTML=html;

updateProgress();

}

function jawab(v,el){

jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

document.getElementById("n"+no).classList.add("dijawab");

localStorage.setItem("jawaban",JSON.stringify(jawaban));

updateProgress();

}

/* ======================
NAV
====================== */
function next(){if(no<soal.length-1){no++;tampil();}}
function prev(){if(no>0){no--;tampil();}}
function goto(n){no=n;tampil();}

/* ======================
PROGRESS
====================== */
function updateProgress(){
var j=jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

/* ======================
SUBMIT
====================== */
function kirim(){

if(sudahSubmit) return;

gas("submitJawaban",{
jawaban:jawaban,
nama:nama,
kelas:kelas
},function(nilai){

alert("Nilai: "+nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

});

}

/* ======================
TIMER
====================== */
function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
if(d<10)d="0"+d;
document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;
if(waktu<=0) kirim();
},1000);
}

/* ======================
LOGOUT
====================== */
function logout(){
localStorage.clear();
location.reload();
}

/* ======================
INIT
====================== */
window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");

if(n&&k){

nama=n;
kelas=k;

startUjian();

var jwb=localStorage.getItem("jawaban");
if(jwb) jawaban=JSON.parse(jwb);

}

document.getElementById("kelas").addEventListener("change",loadNama);

}

</script>

</body>
</html>
