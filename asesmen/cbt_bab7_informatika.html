<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Ujian Sekolah</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

/* CONTAINER */
.container{
max-width:900px;
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.userBox{
text-align:center;
min-width:160px;
}

.userInfo{
font-size:14px;
font-weight:600;
}

.status{
font-size:13px;
margin-top:4px;
display:none;
}

.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{
margin-top:6px;
background:#ef4444;
display:none;
}

/* LOGO */
.logo{
display:block;
margin:auto;
width:90px;
margin-bottom:10px;
}

/* JUDUL */
h2{
text-align:center;
margin-bottom:20px;
font-weight:700;
color:#1e293b;
}

/* LOGIN */
.loginBox{
max-width:320px;
margin:auto;
}

.loginBox label{
display:block;
margin-top:12px;
}

/* INPUT FIX */
.inputBox,
select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:4px;
box-sizing:border-box;
display:block;
}

select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background:white;
}

/* CHECKBOX PASSWORD */
.passwordCheck{
margin-top:8px;
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.passwordCheck input{
width:auto;
}

/* BUTTON */
button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:500;
width:100%;
}

button:disabled{
background:#94a3b8;
cursor:not-allowed;
}

/* NOMOR */
#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
}

#nomor span{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
margin:3px;
background:#e2e8f0;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.dijawab{
background:#22c55e!important;
color:white;
}

/* PROGRESS */
#progressBox{
height:8px;
background:#e5e7eb;
border-radius:10px;
margin-top:10px;
}

#progressBar{
height:8px;
width:0%;
background:#2563eb;
border-radius:10px;
}

/* SOAL */
#soal{
margin-top:15px;
}

/* OPSI */
.opsi{
display:block;
padding:8px;
border-radius:8px;
margin-bottom:6px;
cursor:pointer;
}

.opsi:hover{
background:#f1f5f9;
}

/* NAV */
.navBtn{
display:flex;
gap:10px;
margin-top:15px;
}

.navBtn button{
flex:1;
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>

</div>

<img class="logo" src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png">

<h2>CBT Ujian Sekolah</h2>

<!-- LOGIN -->
<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" id="showPass" onclick="lihatPassword()">
<label for="showPass">Tampilkan Password</label>
</div>

<br>
<button onclick="login()">Login</button>

</div>

<!-- UJIAN -->
<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>

<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Prev</button>
<button id="btnKirim" onclick="kirim()">Selesai</button>
<button onclick="next()">Next</button>
</div>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyfmlPkyhY6uz9Whhvp-Qp7TbnbeVPJzE207gSE7CpmR0jROwpkJyRdI4Bbb2c_1mc/exec";

var soal=[],jawaban=[],no=0;
var nama,jk,kelas;
var waktu=1800;
var sudahSubmit=false;

/* FETCH */
function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

/* SHOW PASSWORD */
function lihatPassword(){
var p=document.getElementById("password");
p.type = (p.type==="password") ? "text" : "password";
}

/* LOGIN */
function login(){

nama=document.getElementById("nama").value;
var password=document.getElementById("password").value;

if(!nama||!password){alert("Lengkapi login!");return;}

gas("login",{nama:nama,password:password},function(res){

if(res.status=="ok"){

jk=res.jk;
kelas=res.kelas;

localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);
localStorage.setItem("jk",jk);

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();
timer();

}else alert("Login gagal");

});

}

/* LOAD */
function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option>Pilih Kelas</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){
kelas=document.getElementById("kelas").value;
gas("getNama",{kelas:kelas},function(data){
var n=document.getElementById("nama");
n.innerHTML="<option>Pilih Nama</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
n.appendChild(o);
});
});
}

/* SOAL */
function loadSoal(){

gas("getSoal",{},function(data){

soal=data;
jawaban=[];

document.getElementById("nomor").innerHTML="";

data.forEach((s,i)=>{
jawaban.push("");
document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

tampil();

});

}

/* TAMPIL */
function tampil(){

var s=soal[no];

var html="<h3>"+(no+1)+". "+s.pertanyaan+"</h3>";

if(s.gambar && s.gambar.trim()!=""){
html+="<img src='"+s.gambar+"' style='max-width:100%;margin:10px 0;border-radius:10px'><br>";
}

var huruf=["A","B","C","D","E"];

s.opsi.forEach((o,i)=>{
var cek=jawaban[no]==o.key?"checked":"";
html+="<label class='opsi'><input type='radio' name='soal"+no+"' value='"+o.key+"' "+cek+" onclick='jawab(\""+o.key+"\")'> <b>"+huruf[i]+".</b> "+o.text+"</label>";
});

document.getElementById("soal").innerHTML=html;

}

/* JAWAB */
function jawab(v){
jawaban[no]=v;
document.getElementById("n"+no).classList.add("dijawab");

localStorage.setItem("jawaban",JSON.stringify(jawaban));
updateProgress();
}

/* NAV */
function next(){if(no<soal.length-1){no++;tampil();}}
function prev(){if(no>0){no--;tampil();}}
function goto(n){no=n;tampil();}

/* PROGRESS */
function updateProgress(){
var j=jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

/* KIRIM */
function kirim(){

if(sudahSubmit) return;

gas("submitJawaban",{
jawaban:jawaban,
nama:nama,
kelas:kelas
},function(nilai){

alert("Nilai Anda : "+nilai);

sudahSubmit=true;
document.getElementById("btnKirim").disabled=true;

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

});

}

/* TIMER */
function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
d=d<10?"0"+d:d;
document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;
if(waktu<=0) kirim();
},1000);
}

/* LOGOUT */
function logout(){
if(confirm("Logout?")){
localStorage.clear();
location.reload();
}
}

/* AUTO LOGIN */
window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");

if(n&&k){

nama=n;
kelas=k;

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

var jwb=localStorage.getItem("jawaban");
if(jwb) jawaban=JSON.parse(jwb);

loadSoal();
timer();

}

window.onbeforeunload=function(){
return "Ujian sedang berlangsung!";
}

}

document.getElementById("kelas").addEventListener("change",loadNama);

</script>

</body>
</html>
