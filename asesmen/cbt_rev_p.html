<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Bab7 Algoritma dan Pemrograman</title>

<style>

body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}

.container{
max-width:900px;width:95%;margin:auto;margin-top:20px;
background:white;padding:20px;border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{display:flex;justify-content:space-between;align-items:center;}

.userBox{text-align:center;min-width:160px;}

.userInfo{font-size:14px;font-weight:600;}

.status{font-size:13px;margin-top:4px;display:none;}
.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{margin-top:6px;background:#ef4444;display:none;}

.logo{display:block;margin:auto;width:90px;margin-bottom:10px;}

h2{text-align:center;margin-bottom:20px;font-weight:700;color:#1e293b;}

.loginBox{max-width:320px;margin:auto;}

.loginBox label{display:block;margin-top:12px;}

.inputBox,select{
width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;
margin-top:4px;box-sizing:border-box;
}

.passwordCheck{
margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;
}

button{
background:#2563eb;color:white;border:none;
padding:10px;border-radius:8px;cursor:pointer;width:100%;
}

#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
margin-bottom:20px;
}

#nomor span{
width:32px;height:32px;display:flex;align-items:center;justify-content:center;
margin:3px;background:#e2e8f0;border-radius:6px;cursor:pointer;
font-size:13px;
}

.dijawab{background:#22c55e!important;color:white;}

#progressBox{height:8px;background:#e5e7eb;border-radius:10px;margin-top:10px;}
#progressBar{height:8px;width:0%;background:#2563eb;border-radius:10px;}

#soal{
margin-top:10px;
padding:15px;
border-radius:12px;
background:#f8fafc;
}

.soalText{
line-height:1.6;
margin-bottom:15px;
}

.opsi{
display:flex;
align-items:flex-start;
gap:12px;
padding:14px;
border-radius:12px;
cursor:pointer;
margin-bottom:12px;
border:2px solid #e2e8f0;
transition:0.2s;
}

.opsi:hover{background:#f1f5f9;}

.opsi.aktif{border:2px solid #2563eb;background:#eff6ff;}

.circle{
width:34px;height:34px;border-radius:50%;
border:2px solid #94a3b8;
display:flex;align-items:center;justify-content:center;font-weight:bold;
}

.opsi.aktif .circle{background:#2563eb;color:white;}

.navBtn{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.navBtn button{
width:auto;
padding:10px 16px;
}

/* POPUP */
#popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.15);
backdrop-filter:blur(3px);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.popupBox{
background:white;
padding:25px;
border-radius:16px;
width:320px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.popupBox h3{color:#2563eb;}

.popupBtn{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.popupBtn button{
flex:1;
margin:5px;
}

.btn-batal{background:#3b82f6;}
.btn-kirim{background:#f97316;}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png">

<h2>Asesmen Bab 7 - Algoritma dan Pemrograman</h2>

<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" onclick="lihatPassword()"> Tampilkan Password
</div>

<br>
<button onclick="login()">Login</button>

<div style="text-align:center;margin-top:15px;font-size:13px;color:#64748b;">
© 2026 MB All Rights Reserved
</div>

</div>

<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div class="navBtn">
<button id="btnPrev" onclick="prev()">Sebelumnya</button>
<button id="btnNext" onclick="next()">Selanjutnya</button>
</div>

</div>

</div>

<!-- POPUP -->
<div id="popup">
<div class="popupBox">

<h3>Konfirmasi Jawaban</h3>

<p>Apa kamu yakin dengan jawabanmu?</p>

<label>
<input type="checkbox" id="cekKirim">
Saya yakin jawaban sudah benar
</label>

<div class="popupBtn">
<button class="btn-batal" onclick="tutupPopup()">Batal</button>
<button class="btn-kirim" id="btnKirim" onclick="submitFinal()">Kirim</button>
</div>

</div>
</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbyfmlPkyhY6uz9Whhvp-Qp7TbnbeVPJzE207gSE7CpmR0jROwpkJyRdI4Bbb2c_1mc/exec";

var soal=[], jawaban=[], no=0;
var nama="", kelas="", jk="", id="";
var waktu=1800;

function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

function lihatPassword(){
var p=document.getElementById("password");
p.type = p.type==="password"?"text":"password";
}

function login(){

nama=document.getElementById("nama").value;
kelas=document.getElementById("kelas").value;
var password=document.getElementById("password").value;

if(!nama||!kelas||!password){
alert("Lengkapi login!");
return;
}

gas("login",{nama:nama,kelas:kelas,password:password},function(res){

if(res.status=="ok"){

id = res.id;
jk = res.jk;

localStorage.setItem("id",id);
localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);

start();

}else if(res.status=="sudah_login"){
alert("Akun sedang digunakan!");
}else{
alert("Login gagal");
}

});
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();
timer();
}

function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option value=''>Pilih Kelas</option>";

data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){
kelas=document.getElementById("kelas").value;

if(!kelas) return;

gas("getNama",{kelas:kelas},function(data){
var n=document.getElementById("nama");
n.innerHTML="<option value=''>Pilih Nama</option>";

data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
n.appendChild(o);
});
});
}

function loadSoal(){

gas("getSoal",{},function(data){

soal=data;

var simpan = localStorage.getItem("jawaban");
if(simpan){
jawaban = JSON.parse(simpan);
}else{
jawaban=new Array(soal.length).fill("");
}

document.getElementById("nomor").innerHTML="";

soal.forEach((s,i)=>{
document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";
});

tampil();

});
}

function tampil(){

var s=soal[no];

var html="<div class='soalText'><b>"+(no+1)+".</b> "+s.pertanyaan+"</div>";

if(s.gambar){
html+="<img src='"+s.gambar+"' style='max-width:100%;margin:10px 0;border-radius:10px'>";
}

s.opsi.forEach(o=>{
var aktif=jawaban[no]==o.key?"aktif":"";

html+=`
<div class="opsi ${aktif}" data-key="${o.key}" onclick="pilihOpsi(this)">
<div class="circle">${o.key}</div>
<div class="teks">${o.text}</div>
</div>`;
});

document.getElementById("soal").innerHTML=html;

updateNav();
updateProgress();
}

function pilihOpsi(el){
var v = el.getAttribute("data-key");
jawaban[no]=v;

document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
el.classList.add("aktif");

document.getElementById("n"+no).classList.add("dijawab");

localStorage.setItem("jawaban", JSON.stringify(jawaban));

updateProgress();
}

function goto(n){ no=n; tampil(); }

function updateNav(){

var btnPrev=document.getElementById("btnPrev");
var btnNext=document.getElementById("btnNext");

if(no==0){
btnPrev.style.display="none";
btnNext.innerText="Selanjutnya";
}
else if(no==soal.length-1){
btnPrev.style.display="inline-block";
btnNext.innerText="Selesai";
}
else{
btnPrev.style.display="inline-block";
btnNext.innerText="Selanjutnya";
}
}

function next(){ if(no<soal.length-1){no++; tampil();} else{bukaPopup();} }
function prev(){ if(no>0){no--; tampil();} }

function bukaPopup(){ document.getElementById("popup").style.display="flex"; }
function tutupPopup(){ document.getElementById("popup").style.display="none"; }

function submitFinal(){
if(!document.getElementById("cekKirim").checked){
alert("Centang konfirmasi terlebih dahulu!");
return;
}
kirim();
tutupPopup();
}

function kirim(){

var btn=document.getElementById("btnKirim");
btn.disabled=true;
btn.innerText="Mengirim...";

gas("submitJawaban",{
jawaban:jawaban,
id:id
},function(res){

if(res.status==="blocked"){

var sisa=15;
btn.innerText="Tunggu "+sisa+" detik";

var interval=setInterval(()=>{
sisa--;
btn.innerText="Tunggu "+sisa+" detik";

if(sisa<=0){
clearInterval(interval);
btn.disabled=false;
btn.innerText="Kirim";
}
},1000);

alert(res.msg);
return;
}

if(res.status==="ok"){

alert("Nilai Anda : "+res.nilai);

btn.disabled=false;
btn.innerText="Kirim";

document.getElementById("statusUjian").innerHTML="Sudah Mengerjakan";
document.getElementById("statusUjian").classList.remove("belum");
document.getElementById("statusUjian").classList.add("sudah");

}
});
}

function updateProgress(){
var j=jawaban.filter(x=>x!="").length;
document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

function timer(){
setInterval(()=>{
waktu--;
var m=Math.floor(waktu/60);
var d=waktu%60;
if(d<10)d="0"+d;
document.getElementById("timer").innerHTML="⏱️ "+m+":"+d;
if(waktu<=0) kirim();
},1000);
}

function logout(){
if(confirm("Logout?")){
gas("logout",{id:id},function(){
localStorage.clear();
location.reload();
});
}
}

window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");
var i=localStorage.getItem("id");

if(n&&k&&i){
nama=n;
kelas=k;
id=i;
start();
}

document.getElementById("kelas").addEventListener("change",loadNama);

window.onbeforeunload=function(){
return "Ujian sedang berlangsung!";
}

}

</script>

</body>
</html>
