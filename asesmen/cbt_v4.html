<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT - Algoritma & Pemrograman</title>

<style>
body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}

.container{
max-width:900px;width:95%;margin:auto;margin-top:20px;
background:white;padding:20px;border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2{text-align:center;}

.inputBox,select{
width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:5px;
}

button{
background:#2563eb;color:white;border:none;
padding:10px;border-radius:8px;width:100%;cursor:pointer;
margin-top:10px;
}

.soalBox{margin-top:20px;}
.opsi{margin:5px 0;padding:8px;border:1px solid #ccc;border-radius:8px;cursor:pointer;}

.navSoal{
display:flex;flex-wrap:wrap;gap:5px;margin-top:15px;
}
.navSoal button{
width:40px;height:40px;
}
.aktif{background:#2563eb;color:white;}
.terjawab{background:#22c55e;color:white;}

.timer{
text-align:center;font-size:18px;font-weight:bold;color:#ef4444;
margin-bottom:10px;
}

/* LOADING */
.loading{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;justify-content:center;align-items:center;
color:white;z-index:9999;flex-direction:column;
}
.hidden{display:none;}
.spinner{
width:50px;height:50px;border:6px solid #ccc;
border-top:6px solid #2196f3;border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{
0%{transform:rotate(0);}100%{transform:rotate(360deg);}
}
</style>

</head>

<body>

<div id="loading" class="loading hidden">
<div class="spinner"></div>
<p id="loadingText">Loading...</p>
</div>

<div class="container">

<h2>CBT Algoritma & Pemrograman</h2>

<!-- LOGIN -->
<div id="loginPage">
<select id="kelas"></select>
<select id="nama"></select>
<input type="password" id="password" class="inputBox" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- TOKEN -->
<div id="tokenPage" style="display:none">
<input type="text" id="token" class="inputBox" placeholder="Token Ujian">
<button onclick="cekToken()">Masuk Ujian</button>
</div>

<!-- UJIAN -->
<div id="ujianPage" style="display:none">

<div class="timer" id="timer">00:00</div>

<div id="soalBox"></div>

<div class="navSoal" id="navSoal"></div>

<button onclick="submitUjian()">Submit</button>

</div>

</div>

<script>

var URL="PASTE_URL_WEB_APP";

var soal=[],jawaban=[];
var indexSoal=0;
var waktu=3600; // 1 jam

/* LOADING */
function showLoading(t="Loading..."){
document.getElementById("loadingText").innerText=t;
document.getElementById("loading").classList.remove("hidden");
}
function hideLoading(){
document.getElementById("loading").classList.add("hidden");
}

/* FETCH */
function gas(func,data,cb){
showLoading();
fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({func:func,data:data})
})
.then(r=>r.text())
.then(t=>{
hideLoading();
cb(JSON.parse(t));
})
.catch(e=>{
hideLoading();
alert("Error server");
});
}

/* LOGIN */
function login(){
let n=nama.value;
let k=kelas.value;
let p=password.value;

gas("login",{nama:n,kelas:k,password:p},res=>{
if(res.status=="ok"){
localStorage.setItem("user",JSON.stringify(res));
document.getElementById("loginPage").style.display="none";
document.getElementById("tokenPage").style.display="block";
}else alert("Login gagal");
});
}

/* TOKEN */
function cekToken(){
let t=token.value;

gas("cekToken",{token:t},res=>{
if(res.status=="OK"){
mulaiUjian();
}else alert("Token salah");
});
}

/* LOAD SOAL */
function mulaiUjian(){
document.getElementById("tokenPage").style.display="none";
document.getElementById("ujianPage").style.display="block";

gas("getSoal",{},res=>{
soal=res;
jawaban=new Array(soal.length);
renderSoal();
renderNav();
startTimer();
});
}

/* RENDER SOAL */
function renderSoal(){
let s=soal[indexSoal];

let html=`<div class='soalBox'>
<b>Soal ${indexSoal+1}</b><br><br>
${s.pertanyaan}<br><br>
`;

["A","B","C","D","E"].forEach(o=>{
html+=`<div class='opsi' onclick='pilih("${o}")'>
${o}. ${s.opsi[o].text||""}
</div>`;
});

html+="</div>";

soalBox.innerHTML=html;
}

/* PILIH */
function pilih(o){
jawaban[indexSoal]=o;
localStorage.setItem("jawaban",JSON.stringify(jawaban));
renderNav();
}

/* NAVIGASI */
function renderNav(){
let html="";
for(let i=0;i<soal.length;i++){
let cls="";
if(i==indexSoal) cls="aktif";
if(jawaban[i]) cls="terjawab";
html+=`<button class='${cls}' onclick='goto(${i})'>${i+1}</button>`;
}
navSoal.innerHTML=html;
}

function goto(i){
indexSoal=i;
renderSoal();
}

/* TIMER */
function startTimer(){
setInterval(()=>{
waktu--;
let m=Math.floor(waktu/60);
let s=waktu%60;
timer.innerText=`${m}:${s<10?"0":""}${s}`;
if(waktu<=0) submitUjian();
},1000);
}

/* SUBMIT */
function submitUjian(){
if(!confirm("Yakin submit?"))return;

let user=JSON.parse(localStorage.getItem("user"));

gas("submitToQueue",{
user_id:user.user_id,
jawaban:jawaban
},res=>{
alert("Jawaban dikirim!");
localStorage.clear();
location.reload();
});
}

/* INIT */
window.onload=function(){
gas("getKelas",{},data=>{
kelas.innerHTML="<option>Pilih Kelas</option>";
data.forEach(x=>{
kelas.innerHTML+=`<option>${x}</option>`;
});
});

kelas.onchange=function(){
gas("getNama",{kelas:kelas.value},data=>{
nama.innerHTML="";
data.forEach(x=>{
nama.innerHTML+=`<option>${x}</option>`;
});
});
};
}

</script>

</body>
</html>
