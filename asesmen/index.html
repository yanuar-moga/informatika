<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>CBT Ujian Sekolah</title>

<style>

body{
font-family:'Segoe UI';
background:#f1f5f9;
margin:0;
}

.container{
width:900px;
margin:auto;
margin-top:40px;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* LOGO */

.logo{
display:block;
margin:auto;
width:120px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:30px;
}

/* LOGIN */

.loginBox{
width:320px;
margin:auto;
text-align:left;
}

.loginBox label{
display:block;
margin-top:14px;
font-weight:500;
}

.loginBox select,
.loginBox input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:4px;
box-sizing:border-box;
}

.loginBox select:focus,
.loginBox input:focus{
outline:none;
border:1px solid #2563eb;
box-shadow:0 0 5px rgba(37,99,235,0.4);
}

.passwordCheck{
margin-top:8px;
font-size:14px;
}

.passwordCheck input{
width:auto;
margin-right:6px;
}

/* BUTTON */

button{
background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

/* NOMOR SOAL */

#nomor span{
display:inline-flex;
align-items:center;
justify-content:center;
width:35px;
height:35px;
background:#e5e7eb;
border-radius:8px;
margin:4px;
cursor:pointer;
font-weight:bold;
}

.dijawab{
background:#22c55e!important;
color:white;
}

/* PROGRESS */

#progressBox{
width:100%;
height:10px;
background:#e5e7eb;
border-radius:10px;
}

#progressBar{
height:10px;
width:0%;
background:#2563eb;
border-radius:10px;
}

/* NAV BUTTON */

.navBtn{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:30px;
}

.navBtn button:nth-child(2){
margin:auto;
}

</style>

</head>

<body>

<div class="container">

<img class="logo" src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png">

<h2>CBT Ujian Sekolah</h2>

<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password">

<div class="passwordCheck">
<label>
<input type="checkbox" onclick="lihatPassword()"> Tampilkan Password
</label>
</div>

<div style="text-align:center;margin-top:20px;">
<button onclick="login()">Login</button>
</div>

</div>

<div id="ujian" style="display:none">

<div id="timer"></div>

<br>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<br>

<div id="nomor"></div>

<br>

<div id="soal"></div>

<div class="navBtn">

<button onclick="prev()">Prev</button>

<button onclick="kirim()">Selesai</button>

<button onclick="next()">Next</button>

</div>

</div>

</div>

<script>

var soal=[];
var jawaban=[];
var no=0;

var nama;
var jk;
var kelas;

var waktu=1800;

/* PASSWORD */

function lihatPassword(){

var p=document.getElementById("password");

if(p.type==="password"){
p.type="text";
}else{
p.type="password";
}

}

/* LOAD KELAS */

function loadKelas(){

google.script.run.withSuccessHandler(function(data){

var k=document.getElementById("kelas");

k.innerHTML="<option value=''>Pilih Kelas</option>";

data.forEach(function(x){

var o=document.createElement("option");
o.value=x;
o.text=x;

k.appendChild(o);

});

}).getKelas();

}

/* LOAD NAMA */

function loadNama(){

kelas=document.getElementById("kelas").value;

if(kelas=="") return;

google.script.run.withSuccessHandler(function(data){

var n=document.getElementById("nama");

n.innerHTML="<option value=''>Pilih Nama</option>";

data.forEach(function(x){

var o=document.createElement("option");
o.value=x;
o.text=x;

n.appendChild(o);

});

}).getNama(kelas);

}

/* LOGIN */

function login(){

nama=document.getElementById("nama").value;
var password=document.getElementById("password").value;

if(nama=="" || password==""){
alert("Lengkapi login terlebih dahulu");
return;
}

google.script.run.withSuccessHandler(function(res){

if(res.status=="ok"){

jk=res.jk;
kelas=res.kelas;

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

loadSoal();
timer();

}else{

alert("Login gagal");

}

}).login(nama,password);

}

/* LOAD SOAL */

function loadSoal(){

google.script.run.withSuccessHandler(function(data){

soal=data;

data.forEach(function(s,i){

jawaban.push("");

document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";

});

tampil();

}).getSoal();

}

/* TAMPIL SOAL */

function tampil(){

var s=soal[no];

var html="<h3>"+(no+1)+". "+s.pertanyaan+"</h3>";

if(s.gambar){
html+="<img src='"+s.gambar+"' style='max-width:400px'><br>";
}

s.opsi.forEach(function(o){

var cek = jawaban[no]==o.key ? "checked" : "";

html+="<label><input type='radio' name='j' value='"+o.key+"' "+cek+" onclick='jawab(\""+o.key+"\")'> "+o.text+"</label><br>";

});

document.getElementById("soal").innerHTML=html;

}

/* JAWAB */

function jawab(v){

jawaban[no]=v;

document.getElementById("n"+no).classList.add("dijawab");

updateProgress();

}

/* NAVIGASI */

function next(){
if(no<soal.length-1){no++;tampil();}
}

function prev(){
if(no>0){no--;tampil();}
}

function goto(n){
no=n;
tampil();
}

/* PROGRESS */

function updateProgress(){

var answered=jawaban.filter(x=>x!="").length;

var persen=(answered/soal.length)*100;

document.getElementById("progressBar").style.width=persen+"%";

}

/* KIRIM */

function kirim(){

google.script.run.withSuccessHandler(function(nilai){

alert("Nilai Anda : "+nilai);

location.reload();

}).submitJawaban(jawaban,nama,jk,kelas);

}

/* TIMER */

function timer(){

setInterval(function(){

waktu--;

var m=Math.floor(waktu/60);
var d=waktu%60;

document.getElementById("timer").innerHTML="Timer : "+m+":"+d;

if(waktu<=0){
kirim();
}

},1000);

}

document.getElementById("kelas").addEventListener("change",loadNama);

window.onload=loadKelas;

</script>

</body>
</html>
