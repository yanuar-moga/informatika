<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>CBT Sekolah</title>

<style>

body{
font-family:'Segoe UI',sans-serif;
background:#f3f4f6;
margin:0;
}

.container{

width:1000px;
margin:auto;
margin-top:40px;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);

}

select,input{

padding:10px;
border-radius:8px;
border:1px solid #ccc;

}

button{

background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;

}

#nomor span{

display:inline-flex;
align-items:center;
justify-content:center;
width:35px;
height:35px;
background:#e5e7eb;
border-radius:8px;
margin:3px;
cursor:pointer;

}

.aktif{

background:#2563eb!important;
color:white;

}

.dijawab{

background:#22c55e!important;
color:white;

}

#progressBox{

width:100%;
height:10px;
background:#e5e7eb;
border-radius:10px;

}

#progressBar{

height:10px;
width:0%;
background:#2563eb;
border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h2>CBT ASESMEN</h2>

<div id="login">

<select id="kelas"></select>

<br><br>

<select id="nama"></select>

<br><br>

<input type="password" id="password" placeholder="Password">

<br><br>

<button onclick="login()">Login</button>

</div>


<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<br>

<div id="nomor"></div>

<div id="soal"></div>

<br>

<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="kirim()">Selesai</button>

</div>

</div>


<script>

var soal=[];
var jawaban=[];
var no=0;

var nama;
var jk;
var kelas;

var waktu=1800;

function loadKelas(){

google.script.run.withSuccessHandler(function(data){

var k=document.getElementById("kelas");

data.forEach(function(x){

var o=document.createElement("option");

o.value=x;
o.text=x;

k.appendChild(o);

});

}).getKelas();

}



function loadNama(){

kelas=document.getElementById("kelas").value;

google.script.run.withSuccessHandler(function(data){

var n=document.getElementById("nama");

n.innerHTML="";

data.forEach(function(x){

var o=document.createElement("option");

o.value=x;
o.text=x;

n.appendChild(o);

});

}).getNama(kelas);

}



function login(){

nama=document.getElementById("nama").value;
var password=document.getElementById("password").value;

google.script.run.withSuccessHandler(function(res){

if(res.status=="ok"){

jk=res.jk;
kelas=res.kelas;

document.getElementById("login").style.display="none";
document.getElementById("ujian").style.display="block";

loadSoal();
timer();

}else{

alert("Login gagal");

}

}).login(nama,password);

}



function loadSoal(){

google.script.run.withSuccessHandler(function(data){

soal=data;

data.forEach(function(s,i){

jawaban.push("");

document.getElementById("nomor").innerHTML+=
"<span id='n"+i+"' onclick='goto("+i+")'>"+(i+1)+"</span>";

});

tampil();

}).getSoal();

}



function tampil(){

var s=soal[no];

var html="<h3>"+(no+1)+". "+s.pertanyaan+"</h3>";

if(s.gambar){

html+="<img src='"+s.gambar+"' style='max-width:400px'><br>";

}

s.opsi.forEach(function(o){

html+="<label><input type='radio' name='j' value='"+o.key+"' onclick='jawab(\""+o.key+"\")'> "+o.text+"</label><br>";

});

document.getElementById("soal").innerHTML=html;

}



function jawab(v){

jawaban[no]=v;

document.getElementById("n"+no).classList.add("dijawab");

updateProgress();

}



function next(){

if(no<soal.length-1){

no++;
tampil();

}

}



function prev(){

if(no>0){

no--;
tampil();

}

}



function goto(n){

no=n;

tampil();

}



function updateProgress(){

var answered=jawaban.filter(x=>x!="").length;

var persen=(answered/soal.length)*100;

document.getElementById("progressBar").style.width=persen+"%";

}



function kirim(){

google.script.run.withSuccessHandler(function(nilai){

alert("Nilai anda : "+nilai);

location.reload();

}).submitJawaban(jawaban,nama,jk,kelas);

}



function timer(){

setInterval(function(){

waktu--;

var m=Math.floor(waktu/60);
var d=waktu%60;

document.getElementById("timer").innerHTML="Timer : "+m+":"+d;

if(waktu<=0){

kirim();

}

},1000);

}



document.getElementById("kelas").onchange=loadNama;

loadKelas();

</script>

</body>
</html>
