<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Scratch SMP</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #e3f2fd;
}

.container {
    display: flex;
    height: 100vh;
}

/* LEFT PANEL */
.left {
    flex: 1;
    max-width: 300px;
    background: #ffffff;
    padding: 15px;
    border-right: 4px solid #2196f3;
}

/* RIGHT PANEL */
.right {
    flex: 3;
    padding: 25px 30px;
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-blue { background: #2196f3; color: white; }
.btn-green { background: #4caf50; color: white; }
.btn-orange { background: #ff9800; color: white; }
.btn-red { background: #f44336; color: white; }

/* TEXT BESAR (PENTING) */
#kelompok {
    font-size: 36px;
    font-weight: bold;
    color: #0d47a1;
}

#soal {
    font-size: 30px;
    font-weight: bold;
    line-height: 1.6;
}

#guide {
    font-size: 22px;
    line-height: 1.5;
}

/* IMAGE */
#imgJawaban {
    width: 100%;
    height: 300px;
    object-fit: contain;
    background: #f0f0f0;
    border-radius: 8px;
}

/* TIMER */
.timer {
    font-size: 34px;
    font-weight: bold;
    color: #d32f2f;
}

/* RANKING */
.rank-item {
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #000;
    font-weight: bold;
}

.rank-even { background: #e3f2fd; }
.rank-odd { background: #f5f5f5; }

/* 🔥 FULLSCREEN MODE (AUTO BESAR) */
:fullscreen #soal {
    font-size: 40px;
}

:fullscreen #kelompok {
    font-size: 46px;
}

:fullscreen .timer {
    font-size: 42px;
}

:fullscreen #guide {
    font-size: 26px;
}

:fullscreen #imgJawaban {
    height: 400px;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="card">
<h3>🎯 Kontrol</h3>
<button class="btn-blue" onclick="toggleJawaban()">Spoiler Jawaban</button>
<button class="btn-green" onclick="tambahSkor()">+ Skor</button>
<button class="btn-red" onclick="resetSkor()">Reset Skor</button>
<button class="btn-orange" onclick="toggleFullscreen()">Full Screen</button>
</div>

<div class="card">
<h3>🏆 Ranking</h3>
<div id="ranking"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="card">
<h2 id="kelompok">Kelompok: -</h2>
<h3 id="soal">Klik acak untuk mulai</h3>
<div class="timer">⏱ <span id="time">5:00</span></div>
</div>

<div class="card">
<h3>📘 Coding Guide (Hint)</h3>
<button class="btn-blue" onclick="toggleGuide()">Tampilkan Hint</button>
<p id="guide" style="display:none; margin-top:10px;"></p>
</div>

<div class="card">
<button class="btn-blue" onclick="acak()">🎲 Acak</button>
</div>

<div class="card" id="jawaban" style="display:none;">
<h3>✔ Jawaban</h3>
<img id="imgJawaban">
</div>

</div>

</div>

<script>
const kelompok = ["Kelompok 1","Kelompok 2","Kelompok 3","Kelompok 4","Kelompok 5","Kelompok 6"];

let kelompokQueue = [];

function shuffle(array){
for (let i = array.length - 1; i > 0; i--) {
let j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

function getNextKelompok(){
if(kelompokQueue.length === 0){
kelompokQueue = shuffle([...kelompok]);
}
return kelompokQueue.shift();
}

let skor = JSON.parse(localStorage.getItem("skor")) || {
"K1":0,"K2":0,"K3":0,"K4":0,"K5":0,"K6":0
};

let soalList = [
{soal:"Buat sprite bergerak ke kanan saat bendera hijau diklik", guide:"when green flag clicked → move 10 steps (repeat)", img:"assets/jawaban1.png"},
{soal:"Buat sprite berbicara Halo teman!", guide:"when green flag clicked → say 'Halo teman!' for 2 seconds", img:"assets/jawaban2.png"},
{soal:"Buat sprite bergerak naik saat diklik", guide:"when this sprite clicked → move y 10 steps", img:"assets/jawaban3.png"},
{soal:"Buat sprite berubah warna saat diklik", guide:"when this sprite clicked → change color effect by 25", img:"assets/jawaban4.png"},
{soal:"Buat sprite bergerak maju terus dan memantul", guide:"when green flag clicked → forever → move 10 steps → if on edge, bounce", img:"assets/jawaban5.png"},
{soal:"Buat sprite mengikuti mouse", guide:"when green flag clicked → forever → go to mouse pointer", img:"assets/jawaban6.png"},
{soal:"Buat sprite berpindah ke posisi acak", guide:"when green flag clicked → forever → go to random position", img:"assets/jawaban7.png"},
{soal:"Buat sprite berbunyi saat diklik", guide:"when this sprite clicked → play sound 'meow'", img:"assets/jawaban8.png"},
{soal:"Buat animasi berjalan Sprite akan terus berganti kostum setiap 0,5 detik", guide:"when green flag clicked → forever → next costume → wait 0.5 seconds", img:"assets/jawaban9.png"},
{soal:"Buat sprite berhenti saat menyentuh tepi", guide:"when green flag clicked → repeat until touching edge → move 10 steps", img:"assets/jawaban10.png"}
];

let currentKelompok="";
let timer;
let timeLeft=300;

function updateRanking(){
localStorage.setItem("skor", JSON.stringify(skor));

let data = Object.entries(skor).sort((a,b)=>b[1]-a[1]);

let html="";
data.forEach((d,i)=>{
let medal=["🥇","🥈","🥉"][i]||"🎖";
let style=(i%2==0)?"rank-item rank-even":"rank-item rank-odd";

html += `<div class="${style}">
${medal} Kelompok ${i+1} : ${d[1]}
</div>`;
});

document.getElementById("ranking").innerHTML=html;
}

function acak(){
if(soalList.length==0){alert("Soal habis");return;}

let k = getNextKelompok();
let i = Math.floor(Math.random()*soalList.length);
let s = soalList.splice(i,1)[0];

currentKelompok=k;

document.getElementById("kelompok").innerText=k;
document.getElementById("soal").innerText=s.soal;
document.getElementById("guide").innerText=s.guide;
document.getElementById("imgJawaban").src=s.img;

document.getElementById("jawaban").style.display="none";
document.getElementById("guide").style.display="none";

startTimer();
}

function toggleJawaban(){
let j=document.getElementById("jawaban");
j.style.display = j.style.display==="none"?"block":"none";
}

function toggleGuide(){
let g=document.getElementById("guide");
g.style.display = g.style.display==="none"?"block":"block";
}

function tambahSkor(){
let key="K"+(kelompok.indexOf(currentKelompok)+1);
skor[key]++;
updateRanking();
}

function resetSkor(){
localStorage.clear();
location.reload();
}

function startTimer(){
clearInterval(timer);
timeLeft = 300;

timer=setInterval(()=>{
let m = Math.floor(timeLeft/60);
let s = timeLeft%60;
s = s<10 ? "0"+s : s;

document.getElementById("time").innerText = m+":"+s;

if(timeLeft <= 10){
document.getElementById("time").style.color="red";
}

timeLeft--;

if(timeLeft<0){
clearInterval(timer);
alert("⏰ Waktu habis!");
}
},1000);
}

function toggleFullscreen(){
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen();
} else {
document.exitFullscreen();
}
}

updateRanking();
</script>

</body>
</html>
