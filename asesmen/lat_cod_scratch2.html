<style>
body { margin:0; font-family:Arial; background:#e3f2fd; }

.container { display:flex; height:100vh; }

.left {
    flex:1; max-width:280px;
    background:#fff; padding:15px;
    border-right:4px solid #2196f3;
}

.right { flex:3; padding:25px; }

.card {
    background:white; padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

button {
    width:100%; padding:10px;
    margin-top:8px;
    border:none; border-radius:8px;
    font-weight:bold; cursor:pointer;
}

select {
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    font-weight:bold;
}

.btn-blue{background:#2196f3;color:white;}
.btn-green{background:#4caf50;color:white;}
.btn-red{background:#f44336;color:white;}
.btn-orange{background:#ff9800;color:white;}

#kelompok { font-size:38px; color:#0d47a1; }
#soal { font-size:32px; font-weight:bold; line-height:1.5; }

.timer { font-size:34px; color:red; font-weight:bold; }

.rank-item {
    display:flex; justify-content:space-between;
    padding:10px; margin:5px 0;
    border-radius:10px; border:1px solid #000;
}
.rank-even{background:#e3f2fd;}
.rank-odd{background:#f5f5f5;}

/* MODE SCRATCH */
.scratch-box {
    margin-top:10px;
    padding:10px;
    background:#f1f8ff;
    border-left:5px solid #2196f3;
    border-radius:8px;
    font-family:monospace;
    white-space:pre-line;
}
</style>

<div class="container">

<div class="left">

<div class="card">
<h3>🎯 Kontrol</h3>

<select id="level">
<option value="dasar">🟢 Dasar</option>
<option value="menengah">🔵 Menengah</option>
<option value="logika">🟡 Logika</option>
<option value="lanjutan">🔴 Lanjutan</option>
</select>

<button class="btn-blue" onclick="acak()">🎲 Acak</button>
<button class="btn-green" onclick="tambahSkor()">+ Skor</button>
<button class="btn-red" onclick="resetSkor()">Reset</button>
<button class="btn-orange" onclick="fullscreen()">Full Screen</button>
</div>

<div class="card">
<h3>🏆 Ranking</h3>
<div id="ranking"></div>
</div>

</div>

<div class="right">

<div class="card">
<h2 id="kelompok">Kelompok: -</h2>
<h3 id="soal">Pilih level lalu klik acak</h3>
<div class="timer">⏱ <span id="time">5:00</span></div>
</div>

<div class="card">
<h3>💡 Petunjuk</h3>
<button class="btn-blue" onclick="toggleGuide()">Tampilkan Petunjuk</button>

<p id="guide" style="display:none;"></p>

<div id="scratch" class="scratch-box" style="display:none;"></div>

</div>

</div>
</div>

<script>
const kelompok=["Kelompok 1","Kelompok 2","Kelompok 3","Kelompok 4","Kelompok 5","Kelompok 6"];
let kelompokQueue=[];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function getNextKelompok(){
if(kelompokQueue.length===0){
kelompokQueue=shuffle([...kelompok]);
}
return kelompokQueue.shift();
}

let skor=JSON.parse(localStorage.getItem("skor"))||{
"K1":0,"K2":0,"K3":0,"K4":0,"K5":0,"K6":0
};

const soalData = {
dasar:[
{
soal:"Pergi ke meja 1 lalu duduk",
guide:"Gerakkan sprite ke arah meja, lalu lakukan aksi duduk",
scratch:`when green flag clicked
move steps
turn to direction
say "duduk"`
},
{
soal:"Pergi ke meja 5 lalu berhenti",
guide:"Gerakkan sprite lalu hentikan",
scratch:`when green flag clicked
move steps
stop`
}
],
menengah:[
{
soal:"Saat mulai, pergi ke meja 12 lalu ambil laptop",
guide:"Gunakan event mulai lalu aksi ambil",
scratch:`when green flag clicked
go to x:y
say "ambil laptop"`
},
{
soal:"Saat diklik, pergi ke meja 3 lalu berbicara Halo",
guide:"Gunakan event klik lalu blok say",
scratch:`when this sprite clicked
go to x:y
say "Halo teman!" for 2 seconds`
}
],
logika:[
{
soal:"Pergi ke meja 30, jika ada kursi duduk",
guide:"Gunakan kondisi if",
scratch:`when green flag clicked
if touching kursi then
say "duduk"`
},
{
soal:"Bergerak sampai ke meja 35 lalu berhenti",
guide:"Gunakan repeat until",
scratch:`when green flag clicked
repeat until touching meja 35
move steps`
}
],
lanjutan:[
{
soal:"Ambil laptop di meja 15 lalu bawa ke meja 2",
guide:"Gabungkan beberapa langkah",
scratch:`when green flag clicked
go to meja 15
say "ambil"
go to meja 2
say "letakkan"`
},
{
soal:"Pergi ke meja 25 lalu ke 26 lalu ke 27",
guide:"Gunakan urutan langkah",
scratch:`when green flag clicked
go to meja 25
go to meja 26
go to meja 27`
}
]
};

let currentKelompok="";
let timer;
let timeLeft=300;

function updateRanking(){
localStorage.setItem("skor",JSON.stringify(skor));
let data=Object.entries(skor).sort((a,b)=>b[1]-a[1]);

let html="";
data.forEach((d,i)=>{
let medal=["🥇","🥈","🥉"][i]||"🎖";
let style=(i%2==0)?"rank-item rank-even":"rank-item rank-odd";

html+=`
<div class="${style}">
<span>${medal} K${i+1}</span>
<span>${d[1]} poin</span>
</div>`;
});

document.getElementById("ranking").innerHTML=html;
}

function acak(){
let level=document.getElementById("level").value;
let soalList=soalData[level];

let k=getNextKelompok();
let i=Math.floor(Math.random()*soalList.length);
let s=soalList[i];

currentKelompok=k;

document.getElementById("kelompok").innerText=k;
document.getElementById("soal").innerText=s.soal;
document.getElementById("guide").innerText=s.guide;
document.getElementById("scratch").innerText=s.scratch;

document.getElementById("guide").style.display="none";
document.getElementById("scratch").style.display="none";

startTimer();
}

function toggleGuide(){
let g=document.getElementById("guide");
let s=document.getElementById("scratch");

let visible = g.style.display==="block";

g.style.display = visible?"none":"block";
s.style.display = visible?"none":"block";
}

function tambahSkor(){
let key="K"+(kelompok.indexOf(currentKelompok)+1);
skor[key]++;
updateRanking();
}

function resetSkor(){
localStorage.clear();
location.reload();
}

function startTimer(){
clearInterval(timer);
timeLeft=300;

timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;

document.getElementById("time").innerText=m+":"+s;

timeLeft--;

if(timeLeft<0){
clearInterval(timer);
alert("⏰ Waktu habis!");
}
},1000);
}

function fullscreen(){
document.documentElement.requestFullscreen();
}

updateRanking();
</script>
