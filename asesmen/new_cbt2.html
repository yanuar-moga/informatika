<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Bab7 Algoritma dan Pemrograman</title>

<style>

body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}

.container{
max-width:900px;width:95%;margin:auto;margin-top:20px;
background:white;padding:20px;border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{display:flex;justify-content:space-between;align-items:center;}

.userBox{text-align:center;min-width:160px;}

.userInfo{font-size:14px;font-weight:600;}

.status{font-size:13px;margin-top:4px;display:none;}
.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{margin-top:6px;background:#ef4444;display:none;}

.logo{display:block;margin:auto;width:90px;margin-bottom:10px;}

h2{text-align:center;margin-bottom:20px;font-weight:700;color:#1e293b;}

.loginBox{max-width:320px;margin:auto;}

.loginBox label{display:block;margin-top:12px;}

.inputBox,select{
width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;
margin-top:4px;box-sizing:border-box;
}

.passwordCheck{
margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;
}

button{
background:#2563eb;color:white;border:none;
padding:10px;border-radius:8px;cursor:pointer;width:100%;
}

#nomor{
display:flex;
flex-wrap:wrap;
margin-top:10px;
margin-bottom:20px;
}

#nomor span{
width:32px;height:32px;display:flex;align-items:center;justify-content:center;
margin:3px;background:#e2e8f0;border-radius:6px;cursor:pointer;
font-size:13px;
}

.dijawab{background:#22c55e!important;color:white;}

#progressBox{height:8px;background:#e5e7eb;border-radius:10px;margin-top:10px;}
#progressBar{height:8px;width:0%;background:#2563eb;border-radius:10px;}

#soal{
margin-top:10px;
padding:15px;
border-radius:12px;
background:#f8fafc;
}

.soalText{
line-height:1.6;
margin-bottom:15px;
}

.opsi{
display:flex;
align-items:flex-start;
gap:12px;
padding:14px;
border-radius:12px;
cursor:pointer;
margin-bottom:12px;
border:2px solid #e2e8f0;
transition:0.2s;
}

.opsi:hover{background:#f1f5f9;}

.opsi.aktif{border:2px solid #2563eb;background:#eff6ff;}

.circle{
width:34px;height:34px;border-radius:50%;
border:2px solid #94a3b8;
display:flex;align-items:center;justify-content:center;font-weight:bold;
}

.opsi.aktif .circle{background:#2563eb;color:white;}

.navBtn{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.navBtn button{
width:auto;
padding:10px 16px;
}

#popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.popupBox{
background:white;
padding:20px;
border-radius:12px;
width:320px;
text-align:center;
}

.popupBox button{
width:auto;
margin:5px;
padding:8px 16px;
}

/* ===== PERBAIKAN RAPIH DATA ===== */
.dataUser{
  margin-top:15px;
  font-size:14px;
}

.row{
  display:flex;
  margin-bottom:6px;
}

.label{
  width:180px;
  white-space:nowrap;
}

.label::after{
  content:" :";
}

.value{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* RESPONSIVE */
@media(max-width:480px){
  .row{
    flex-direction:column;
  }
  .label{
    width:auto;
  }
  .value{
    white-space:normal;
  }
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>

<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png">

<h2>Asesmen Bab 7 - Algoritma dan Pemrograman</h2>

<!-- LOGIN -->
<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" onclick="lihatPassword()"> Tampilkan Password
</div>

<br>
<button onclick="login()">Login</button>

</div>

<!-- TOKEN -->
<div id="tokenPage" class="loginBox" style="display:none">

<h3 style="text-align:center;">Selamat Datang</h3>

<div class="dataUser">
  <div class="row">
    <div class="label">Nama</div>
    <div class="value" id="t_nama"></div>
  </div>
  <div class="row">
    <div class="label">Kelas</div>
    <div class="value" id="t_kelas"></div>
  </div>
  <div class="row">
    <div class="label">Jenis Kelamin</div>
    <div class="value" id="t_jk"></div>
  </div>
  <div class="row">
    <div class="label">ID</div>
    <div class="value" id="t_id"></div>
  </div>
</div>

<label style="margin-top:15px;">Token Ujian</label>
<input type="text" id="token" class="inputBox">

<br><br>
<button onclick="cekToken()">Masuk Ujian</button>

</div>

<!-- UJIAN -->
<div id="ujian" style="display:none">

<div id="timer"></div>

<div id="progressBox">
<div id="progressBar"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div class="navBtn">
<button onclick="prev()">Sebelumnya</button>
<button onclick="next()">Selanjutnya</button>
</div>

</div>

</div>

<div id="popup">
<div class="popupBox">
<h3>Konfirmasi</h3>
<p>Yakin ingin mengirim jawaban?</p>
<label>
<input type="checkbox" id="cekKirim">
Ya, saya yakin akan kirim jawaban
</label>
<br><br>
<button onclick="tutupPopup()">Batal</button>
<button onclick="submitFinal()">Kirim</button>
</div>
</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbwwl3rKiOqpV6sF8sFmH8IFLv7KcFNYXf_y3nsmr7L8PyGx-tJi5U3cXQb2tei5DTbfWw/exec";

var soal=[], jawaban=[], no=0;
var nama="", kelas="", jk="", id="";
var waktu=1800;

function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback);
}

function lihatPassword(){
var p=document.getElementById("password");
p.type = p.type==="password"?"text":"password";
}

function login(){

nama=document.getElementById("nama").value;
kelas=document.getElementById("kelas").value;
var password=document.getElementById("password").value;

if(!nama||!kelas||!password){
alert("Lengkapi login!");
return;
}

gas("login",{nama:nama,kelas:kelas,password:password},function(res){

if(res.status=="ok"){

id = res.id;
jk = res.jk;

localStorage.setItem("id",id);
localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);

tampilToken();

}else{
alert("Login gagal");
}

});
}

function tampilToken(){

document.getElementById("login").style.display="none";
document.getElementById("tokenPage").style.display="block";

document.getElementById("t_nama").innerText = nama;
document.getElementById("t_kelas").innerText = kelas;
document.getElementById("t_jk").innerText = jk || "-";
document.getElementById("t_id").innerText = id;

document.getElementById("btnLogout").style.display="block";
document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;

}

function cekToken(){

var token=document.getElementById("token").value;

if(!token){
alert("Masukkan token!");
return;
}

gas("cekToken",{kelas:kelas,token:token},function(res){
if(res.status){start();}
else{alert(res.msg);}
});
}

function start(){
document.getElementById("tokenPage").style.display="none";
document.getElementById("ujian").style.display="block";

document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;
document.getElementById("btnLogout").style.display="block";
document.getElementById("statusUjian").style.display="block";

loadSoal();
timer();
}

function logout(){
localStorage.clear();
location.reload();
}

function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option value=''>Pilih Kelas</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){
kelas=document.getElementById("kelas").value;
if(!kelas)return;

gas("getNama",{kelas:kelas},function(data){
var n=document.getElementById("nama");
n.innerHTML="<option value=''>Pilih Nama</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
n.appendChild(o);
});
});
}

window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");
var i=localStorage.getItem("id");

if(n&&k&&i){
nama=n;
kelas=k;
id=i;
tampilToken();
}

document.getElementById("kelas").addEventListener("change",loadNama);

window.onbeforeunload=function(){
return "Ujian sedang berlangsung!";
}

}

</script>

</body>
</html>
