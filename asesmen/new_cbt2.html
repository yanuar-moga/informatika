<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Bab7 Algoritma dan Pemrograman</title>

<style>
body{font-family:'Segoe UI';background:#f1f5f9;margin:0;}

.container{
max-width:900px;width:95%;margin:auto;margin-top:20px;
background:white;padding:20px;border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{display:flex;justify-content:space-between;align-items:center;}
.userBox{text-align:center;min-width:160px;}
.userInfo{font-size:14px;font-weight:600;}

.status{font-size:13px;margin-top:4px;display:none;}
.status.belum{color:#f59e0b;}
.status.sudah{color:#22c55e;}

#btnLogout{margin-top:6px;background:#ef4444;display:none;}

.logo{display:block;margin:auto;width:90px;margin-bottom:10px;}

h2{text-align:center;margin-bottom:20px;font-weight:700;color:#1e293b;}

.loginBox{max-width:320px;margin:auto;}

.loginBox label{display:block;margin-top:12px;}

.inputBox,select{
width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;
margin-top:4px;box-sizing:border-box;
}

.passwordCheck{
margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;
}

button{
background:#2563eb;color:white;border:none;
padding:10px;border-radius:8px;cursor:pointer;width:100%;
}

#popup{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);display:none;
align-items:center;justify-content:center;
}

.popupBox{
background:white;padding:20px;border-radius:12px;
width:320px;text-align:center;
}

.dataUser{margin-top:15px;font-size:14px;}
.row{display:flex;margin-bottom:6px;}
.label{width:180px;}
.label::after{content:" :";}
.value{flex:1;}
</style>

</head>

<body>

<div class="container">

<div class="header">
<div></div>
<div class="userBox">
<div class="userInfo" id="userInfo"></div>
<div class="status belum" id="statusUjian">Belum Mengerjakan</div>
<button id="btnLogout" onclick="logout()">Logout</button>
</div>
</div>

<img class="logo" src="https://yanuar-moga.github.io/informatika/asesmen/assets/logo.png">

<h2>Asesmen Bab 7 - Algoritma dan Pemrograman</h2>

<!-- LOGIN -->
<div id="login" class="loginBox">

<label>Kelas</label>
<select id="kelas"></select>

<label>Nama</label>
<select id="nama"></select>

<label>Password</label>
<input type="password" id="password" class="inputBox">

<div class="passwordCheck">
<input type="checkbox" onclick="lihatPassword()"> Tampilkan Password
</div>

<br>
<button onclick="login()">Login</button>

</div>

<!-- TOKEN -->
<div id="tokenPage" class="loginBox" style="display:none">

<h3 style="text-align:center;">Selamat Datang</h3>

<div class="dataUser">
<div class="row"><div class="label">Nama</div><div class="value" id="t_nama"></div></div>
<div class="row"><div class="label">Kelas</div><div class="value" id="t_kelas"></div></div>
<div class="row"><div class="label">Jenis Kelamin</div><div class="value" id="t_jk"></div></div>
<div class="row"><div class="label">ID</div><div class="value" id="t_id"></div></div>
</div>

<label style="margin-top:15px;">Token Ujian</label>
<input type="text" id="token" class="inputBox">

<br><br>
<button onclick="cekToken()">Masuk Ujian</button>

</div>

</div>

<script>

var URL_SCRIPT="https://script.google.com/macros/s/AKfycbwwl3rKiOqpV6sF8sFmH8IFLv7KcFNYXf_y3nsmr7L8PyGx-tJi5U3cXQb2tei5DTbfWw/exec";

var nama="",kelas="",jk="",id="";

/* ================= FETCH FIX ================= */
function gas(func,data,callback){
fetch(URL_SCRIPT,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({func:func,data:data})
})
.then(res=>res.json())
.then(callback)
.catch(err=>{
console.error(err);
alert("Koneksi ke server gagal!");
});
}

function lihatPassword(){
var p=document.getElementById("password");
p.type = p.type==="password"?"text":"password";
}

/* ================= LOGIN FINAL ================= */
function login(){

nama=document.getElementById("nama").value.trim();
kelas=document.getElementById("kelas").value.trim();
var password=document.getElementById("password").value.trim();

if(!nama||!kelas||!password){
alert("Lengkapi login!");
return;
}

gas("login",{nama:nama,kelas:kelas,password:password},function(res){

if(res.status==="ok"){

id=res.id;
nama=res.nama;
kelas=res.kelas;
jk=res.jk;

localStorage.setItem("id",id);
localStorage.setItem("nama",nama);
localStorage.setItem("kelas",kelas);

tampilToken();

}else if(res.status==="sudah_login"){
alert("Akun sedang login di perangkat lain!");
}else{
alert("Login gagal (cek nama / password)");
}

});
}

function tampilToken(){
document.getElementById("login").style.display="none";
document.getElementById("tokenPage").style.display="block";

document.getElementById("t_nama").innerText=nama;
document.getElementById("t_kelas").innerText=kelas;
document.getElementById("t_jk").innerText=jk||"-";
document.getElementById("t_id").innerText=id;

document.getElementById("btnLogout").style.display="block";
document.getElementById("userInfo").innerHTML="👤 "+nama+" | "+kelas;
}

function cekToken(){
var token=document.getElementById("token").value.trim();

if(!token){
alert("Masukkan token!");
return;
}

gas("cekToken",{kelas:kelas,token:token},function(res){
if(res.status){
alert("Token valid, mulai ujian!");
}else{
alert(res.msg);
}
});
}

function logout(){
gas("logout",{id:id},function(){
localStorage.clear();
location.reload();
});
}

function loadKelas(){
gas("getKelas",{},function(data){
var k=document.getElementById("kelas");
k.innerHTML="<option value=''>Pilih Kelas</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
k.appendChild(o);
});
});
}

function loadNama(){
kelas=document.getElementById("kelas").value;
if(!kelas)return;

gas("getNama",{kelas:kelas},function(data){
var n=document.getElementById("nama");
n.innerHTML="<option value=''>Pilih Nama</option>";
data.forEach(x=>{
var o=document.createElement("option");
o.value=x;o.text=x;
n.appendChild(o);
});
});
}

window.onload=function(){

loadKelas();

var n=localStorage.getItem("nama");
var k=localStorage.getItem("kelas");
var i=localStorage.getItem("id");

if(n&&k&&i){
nama=n;kelas=k;id=i;
tampilToken();
}

document.getElementById("kelas").addEventListener("change",loadNama);

}

</script>

</body>
</html>
