<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penilaian Asesmen</title>

<style>
:root {
  --primary: #0d47a1;
  --secondary: #009688;
  --light: #f4f7fb;
}

* { box-sizing: border-box; }

body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
}

/* ===== WRAPPER ===== */
.wrapper {
  display: flex;
  width: 100vw;
  height: 100vh;
  background: white;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  background: var(--light);
  padding: 15px;
  overflow-y: auto;
}

.sidebar h3 {
  margin-top: 0;
  text-align: center;
  color: var(--primary);
}

.sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.sidebar li {
  padding: 10px 12px;
  margin-bottom: 6px;
  background: white;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  text-transform: uppercase;
}

.sidebar li.active,
.sidebar li:hover {
  background: var(--secondary);
  color: white;
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  background: var(--primary);
  color: white;
  padding: 15px;
  text-align: center;
}

/* ===== FILTER ===== */
.filter {
  padding: 12px;
  background: var(--light);
  text-align: center;
}

select, button {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
  font-size: 14px;
  margin: 4px;
}

button {
  background: var(--secondary);
  color: white;
  border: none;
  cursor: pointer;
}

/* ===== CONTENT ===== */
.content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.nama {
  font-size: 26px;
  font-weight: bold;
  color: var(--primary);
  text-align: center;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.nilai {
  font-size: 34px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 20px;
}

/* WARNA NILAI */
.orange { color: #f97316; }
.kuning { color: #facc15; }
.hijau  { color: #16a34a; }

.qa {
  background: var(--light);
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
}

.question {
  font-weight: bold;
  margin-bottom: 6px;
}

.answer {
  padding-left: 10px;
  border-left: 4px solid var(--secondary);
}

/* ===== FOOTER ===== */
.footer {
  padding: 12px;
  text-align: center;
  border-top: 1px solid #eee;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .wrapper { flex-direction: column; }
  .sidebar {
    width: 100%;
    max-height: 180px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList">
      <li>Pilih kelas</li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h2>PENILAIAN ASESMEN</h2>
    </div>

    <div class="filter">
      <select id="kelasSelect">
        <option value="">Pilih Rombel</option>
      </select>
      <button onclick="tampilkanData()">Tampilkan</button>
      <button onclick="downloadExcel()">⬇ Excel</button>
    </div>

    <div class="content">
      <div id="nama" class="nama">Silakan pilih kelas</div>
      <div id="qaList"></div>
    </div>

    <div class="footer">
      <button onclick="prevRow()">⬅ Sebelumnya</button>
      <button onclick="nextRow()">Berikutnya ➡</button>
    </div>

  </div>
</div>

<script>
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

let rows = [];
let filtered = [];
let index = 0;

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47).slice(0, -2));
    rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
    isiDropdown();
  });

function isiDropdown() {
  const select = document.getElementById("kelasSelect");
  [...new Set(rows.map(r => r[4]))].forEach(k => {
    if (!k) return;
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k;
    select.appendChild(opt);
  });
}

function tampilkanData() {
  const kelas = kelasSelect.value;
  if (!kelas) return alert("Pilih rombel terlebih dahulu");

  filtered = rows.filter(r => r[4] === kelas);
  index = 0;
  renderSidebar();
  render();
}

function renderSidebar() {
  siswaList.innerHTML = "";
  filtered.forEach((r, i) => {
    const li = document.createElement("li");
    li.textContent = r[1];
    li.onclick = () => { index = i; render(); };
    siswaList.appendChild(li);
  });
}

function hitung(start, end, r) {
  let benar = 0;
  for (let i = start; i <= end; i++) {
    if (r[i] == 1) benar++;
  }
  return benar * 20;
}

function render() {
  if (!filtered[index]) return;

  const r = filtered[index];
  nama.innerText = r[1].toUpperCase();

  const tp1 = hitung(5, 9, r);
  const tp2 = hitung(10,14, r);
  const tp3 = hitung(15,19, r);
  const tp4 = hitung(20,24, r);

  const total = Math.round((tp1 + tp2 + tp3 + tp4) / 4);

  let warna = "orange";
  if (total > 78) warna = "hijau";
  else if (total === 78) warna = "kuning";

  qaList.innerHTML = `
    <div class="nilai ${warna}">TOTAL NILAI : ${total}</div>

    <div class="qa">
      <div class="question">TP 1 (Soal 1–5)</div>
      <div class="answer">Nilai : ${tp1}</div>
    </div>

    <div class="qa">
      <div class="question">TP 2 (Soal 6–10)</div>
      <div class="answer">Nilai : ${tp2}</div>
    </div>

    <div class="qa">
      <div class="question">TP 3 (Soal 11–15)</div>
      <div class="answer">Nilai : ${tp3}</div>
    </div>

    <div class="qa">
      <div class="question">TP 4 (Soal 16–20)</div>
      <div class="answer">Nilai : ${tp4}</div>
    </div>
  `;

  document.querySelectorAll(".sidebar li")
    .forEach((li, i) => li.classList.toggle("active", i === index));
}

function nextRow() {
  if (index < filtered.length - 1) {
    index++; render();
  }
}

function prevRow() {
  if (index > 0) {
    index--; render();
  }
}

function downloadExcel() {
  let csv = "Nama,TP1,TP2,TP3,TP4,Total\n";
  rows.forEach(r => {
    const tp1 = hitung(5,9,r);
    const tp2 = hitung(10,14,r);
    const tp3 = hitung(15,19,r);
    const tp4 = hitung(20,24,r);
    const total = Math.round((tp1 + tp2 + tp3 + tp4) / 4);
    csv += `${r[1]},${tp1},${tp2},${tp3},${tp4},${total}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nilai_asesmen.csv";
  a.click();
}
</script>

</body>
</html>
