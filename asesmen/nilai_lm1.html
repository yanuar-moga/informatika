<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penilaian Asesmen</title>

<style>
body { margin:0; font-family:Segoe UI, Arial; }
.wrapper { display:flex; height:100vh; }
.sidebar { width:260px; background:#f4f7fb; padding:10px; overflow:auto; }
.sidebar li {
  list-style:none;
  padding:8px;
  margin:4px 0;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}
.sidebar li.active { background:#009688; color:#fff; }

.main { flex:1; display:flex; flex-direction:column; }
.header { background:#0d47a1; color:#fff; padding:12px; text-align:center; }
.filter { padding:10px; text-align:center; background:#eee; }
.content { flex:1; padding:20px; overflow:auto; }

.nama { font-size:26px; text-align:center; font-weight:bold; }
.nilai { font-size:34px; text-align:center; margin:10px 0; }
.hijau { color:#16a34a }
.kuning { color:#facc15 }
.orange { color:#f97316 }

.qa { background:#f4f7fb; padding:10px; border-radius:10px; margin-bottom:10px; }
</style>
</head>

<body>

<div class="wrapper">
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList"></ul>
  </div>

  <div class="main">
    <div class="header">PENILAIAN ASESMEN</div>

    <div class="filter">
      <select id="kelasSelect"></select>
      <button onclick="tampilkanData()">Tampilkan</button>
    </div>

    <div class="content">
      <div id="nama" class="nama">Pilih Kelas</div>
      <div id="qaList"></div>
    </div>
  </div>
</div>

<script>
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

let rows=[], filtered=[], index=0;

fetch(url)
.then(r=>r.text())
.then(t=>{
  const json = JSON.parse(t.substring(47).slice(0,-2));
  rows = json.table.rows.map(r=>r.c.map(c=>c?c.v:""));
  isiKelas();
});

function isiKelas(){
  const kelas = [...new Set(rows.map(r=>r[4]))];
  kelasSelect.innerHTML='<option value="">Pilih Rombel</option>';
  kelas.forEach(k=>{
    if(!k) return;
    kelasSelect.innerHTML+=`<option>${k}</option>`;
  });
}

function tampilkanData(){
  filtered = rows.filter(r=>r[4]===kelasSelect.value);
  index=0;
  renderSidebar();
  render();
}

function renderSidebar(){
  siswaList.innerHTML="";
  filtered.forEach((r,i)=>{
    const li=document.createElement("li");
    li.textContent=r[1];
    li.onclick=()=>{index=i; render();}
    siswaList.appendChild(li);
  });
}

function nilaiTP(start,end,r){
  let benar=0;
  for(let i=start;i<=end;i++){
    if(r[i]==1) benar++;
  }
  return benar*20;
}

function render(){
  if(!filtered[index]) return;
  const r=filtered[index];

  nama.innerText=r[1].toUpperCase();

  const tp1=nilaiTP(5,9,r);
  const tp2=nilaiTP(10,14,r);
  const tp3=nilaiTP(15,19,r);
  const tp4=nilaiTP(20,24,r);

  const total=Math.round((tp1+tp2+tp3+tp4)/4);
  let warna="orange";
  if(total>78) warna="hijau";
  else if(total==78) warna="kuning";

  qaList.innerHTML=`
    <div class="nilai ${warna}">TOTAL : ${total}</div>
    <div class="qa">TP1 (1–5) : ${tp1}</div>
    <div class="qa">TP2 (6–10) : ${tp2}</div>
    <div class="qa">TP3 (11–15) : ${tp3}</div>
    <div class="qa">TP4 (16–20) : ${tp4}</div>
  `;

  document.querySelectorAll(".sidebar li")
    .forEach((li,i)=>li.classList.toggle("active",i===index));
}
</script>

</body>
</html>
