<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Aplikasi Penilaian Asesmen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{display:flex;height:100vh}
.sidebar{width:260px;background:#1e293b;color:#fff;padding:15px;overflow-y:auto}
.sidebar h3{margin-top:0}
.sidebar button{
  width:100%;margin:4px 0;padding:8px;
  background:#334155;color:#fff;border:none;border-radius:5px;
  cursor:pointer;text-align:left
}
.sidebar button:hover{background:#475569}

.main{flex:1;padding:20px;overflow:auto}
select{padding:8px;width:250px}
.card{
  background:#fff;padding:20px;border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.1)
}
table{border-collapse:collapse;width:100%;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#e2e8f0}

.download{
  margin-top:15px;
  background:#16a34a;color:#fff;
  padding:10px 15px;border:none;border-radius:6px;
  cursor:pointer
}
</style>
</head>
<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>📚 Daftar Siswa</h3>
    <div id="studentList">Pilih rombel...</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="card">
      <h2>Penilaian Asesmen</h2>

      <label>Pilih Rombel:</label><br>
      <select id="kelasSelect" onchange="filterKelas()">
        <option value="">-- Pilih Kelas --</option>
      </select>

      <div id="nilaiArea"></div>

      <button class="download" onclick="downloadExcel()">⬇ Download Excel</button>
    </div>
  </div>

</div>

<script>
const sheetID = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

let dataSheet = [];
let siswaTerpilih = null;

fetch(url)
.then(res => res.text())
.then(text => {
  const json = JSON.parse(text.substring(47).slice(0, -2));
  dataSheet = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
  initKelas();
});

function initKelas(){
  const kelasSet = new Set();
  dataSheet.forEach(r => kelasSet.add(r[4]));
  kelasSet.forEach(k => {
    if(k){
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      kelasSelect.appendChild(opt);
    }
  });
}

function filterKelas(){
  studentList.innerHTML = "";
  nilaiArea.innerHTML = "";
  const kelas = kelasSelect.value;
  dataSheet.forEach(r => {
    if(r[4] === kelas){
      const btn = document.createElement("button");
      btn.textContent = r[1];
      btn.onclick = () => tampilNilai(r);
      studentList.appendChild(btn);
    }
  });
}

function hitungScore(data, start, end){
  let benar = 0;
  for(let i=start;i<=end;i++){
    if(data[i] == 1) benar++;
  }
  return benar * 20;
}

function tampilNilai(r){
  siswaTerpilih = r;
  nilaiArea.innerHTML = `
    <h3>${r[1]}</h3>
    <table>
      <tr><th>TP</th><th>Skor</th></tr>
      <tr><td>TP 1</td><td>${hitungScore(r,5,9)}</td></tr>
      <tr><td>TP 2</td><td>${hitungScore(r,10,14)}</td></tr>
      <tr><td>TP 3</td><td>${hitungScore(r,15,19)}</td></tr>
      <tr><td>TP 4</td><td>${hitungScore(r,20,24)}</td></tr>
    </table>
  `;
}

function downloadExcel(){
  let csv = "Nama,TP1,TP2,TP3,TP4\n";
  dataSheet.forEach(r=>{
    csv += `${r[1]},${hitungScore(r,5,9)},${hitungScore(r,10,14)},${hitungScore(r,15,19)},${hitungScore(r,20,24)}\n`;
  });

  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nilai_asesmen.csv";
  a.click();
}
</script>

</body>
</html>
