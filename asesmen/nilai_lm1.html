<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Siswa</title>

<!-- 📦 LIBRARY EXCEL -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { margin:0; font-family:Segoe UI, Arial; background:#f4f7fb; }
.wrapper { display:flex; height:100vh; }
.sidebar {
  width:260px; background:#fff; padding:10px;
  border-right:1px solid #ddd; overflow:auto;
}
.sidebar li {
  list-style:none; padding:8px; margin:4px 0;
  border-radius:8px; cursor:pointer;
  text-transform:uppercase;
}
.sidebar li.active { background:#009688; color:#fff; }

.main { flex:1; display:flex; flex-direction:column; }
.header { background:#0d47a1; color:#fff; padding:14px; text-align:center; }
.filter { padding:10px; background:#eee; text-align:center; }
.content { flex:1; padding:20px; overflow:auto; }

.nama { font-size:26px; font-weight:bold; text-align:center; }
.nilai { font-size:34px; text-align:center; margin:10px 0; }

.hijau { color:#16a34a }
.kuning { color:#facc15 }
.orange { color:#f97316 }

.qa { background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; }
.soal { display:flex; justify-content:space-between; padding:4px 0; }
.benar { color:#16a34a; font-weight:bold; }
.salah { color:#dc2626; font-weight:bold; }
</style>
</head>

<body>

<div class="wrapper">
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList"></ul>
  </div>

  <div class="main">
    <div class="header">PENILAIAN ASESMEN</div>

    <div class="filter">
      <select id="kelasSelect"></select>
      <button onclick="tampilkanData()">Tampilkan</button>
      <button onclick="downloadExcel()">⬇ Download Excel</button>
    </div>

    <div class="content">
      <div id="nama" class="nama">Pilih Kelas</div>
      <div id="qaList"></div>
    </div>
  </div>
</div>

<script>
/* ===================== KONFIGURASI ===================== */
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

/* KUNCI JAWABAN */
const kunci = [
  "Kumpulan informasi yang dapat diolah",
  "Jumlah siswa di kelas",
  "Data primer",
  "Membantu keputusan tepat",
  "Jumlah meja dan kursi",
  "SUM","AVERAGE","MAX","MIN","=SUM(A1:A5)",
  "Keputusan bersyarat",
  "=IF(B2>=75,\"LULUS\",\"REMIDI\")",
  "Logika","REMIDI","Keputusan otomatis",
  "Memudahkan mengolah data",
  "Menganalisis","Tersusun rapi",
  "Pengambilan keputusan","Jujur dan teliti"
];

let rows = [], filtered = [], index = 0;

/* ===================== LOAD DATA ===================== */
fetch(url)
.then(r => r.text())
.then(t => {
  const json = JSON.parse(t.substring(47).slice(0,-2));
  rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
  isiKelas();
});

function isiKelas(){
  const kelas = [...new Set(rows.map(r => r[4]))];
  kelasSelect.innerHTML = '<option value="">Pilih Kelas</option>';
  kelas.forEach(k => { if(k) kelasSelect.innerHTML += `<option>${k}</option>`; });
}

/* ===================== TAMPIL DATA ===================== */
function tampilkanData(){
  filtered = rows
    .filter(r => r[4] === kelasSelect.value)
    .sort((a,b) => a[2].localeCompare(b[2]));

  index = 0;
  renderSidebar();
  render();
}

function renderSidebar(){
  siswaList.innerHTML = "";
  filtered.forEach((r,i)=>{
    const li = document.createElement("li");
    li.textContent = r[2].toUpperCase();
    li.onclick = ()=>{ index=i; render(); };
    siswaList.appendChild(li);
  });
}

/* ===================== HITUNG NILAI ===================== */
function nilaiTP(start,end,row){
  let benar = 0;
  for(let i=start;i<=end;i++){
    if(String(row[5+i]).trim() === String(kunci[i]).trim()) benar++;
  }
  return benar * 20;
}

function render(){
  if(!filtered[index]) return;
  const r = filtered[index];
  nama.innerText = r[2].toUpperCase();

  const tp1 = nilaiTP(0,4,r);
  const tp2 = nilaiTP(5,9,r);
  const tp3 = nilaiTP(10,14,r);
  const tp4 = nilaiTP(15,19,r);
  const total = Math.round((tp1+tp2+tp3+tp4)/4);

  let warna = "orange";
  if(total > 78) warna = "hijau";
  else if(total == 78) warna = "kuning";

  let detail = "";
  for(let i=0;i<20;i++){
    const benar = String(r[5+i]).trim() === String(kunci[i]).trim();
    detail += `
      <div class="soal">
        <span>Soal ${i+1}</span>
        <span class="${benar?'benar':'salah'}">
          ${benar?'✅ Benar (+20)':'❌ Salah (0)'}
        </span>
      </div>`;
  }

  qaList.innerHTML = `
    <div class="nilai ${warna}">TOTAL NILAI : ${total}</div>
    <div class="qa">TP1 : ${tp1}</div>
    <div class="qa">TP2 : ${tp2}</div>
    <div class="qa">TP3 : ${tp3}</div>
    <div class="qa">TP4 : ${tp4}</div>
    <div class="qa"><b>Detail Jawaban</b>${detail}</div>
  `;

  document.querySelectorAll(".sidebar li")
    .forEach((li,i)=>li.classList.toggle("active", i===index));
}

/* ===================== DOWNLOAD EXCEL (XLSX + WARNA) ===================== */
function downloadExcel(){

  const dataSheet = [
    ["No","Nama Siswa","Kelas","TP1","TP2","TP3","TP4","TOTAL","PREDIKAT"]
  ];

  filtered.forEach((r,i)=>{
    const tp1 = nilaiTP(0,4,r);
    const tp2 = nilaiTP(5,9,r);
    const tp3 = nilaiTP(10,14,r);
    const tp4 = nilaiTP(15,19,r);
    const total = Math.round((tp1+tp2+tp3+tp4)/4);

    let predikat = "D (PERLU BIMBINGAN)";
    if(total >= 90) predikat = "A (SANGAT BAIK)";
    else if(total >= 80) predikat = "B (BAIK)";
    else if(total >= 70) predikat = "C (CUKUP)";

    dataSheet.push([
      i+1,
      r[2].toUpperCase(),
      r[4],
      tp1,tp2,tp3,tp4,
      total,
      predikat
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(dataSheet);

  /* CONDITIONAL FORMATTING TOTAL */
  ws["!conditionalFormatting"] = [{
    ref: `H2:H${dataSheet.length}`,
    rules: [
      { type:"cellIs", operator:"lessThan", formula:["78"],
        style:{ fill:{ fgColor:{ rgb:"FFC7CE" }}} },
      { type:"cellIs", operator:"equal", formula:["78"],
        style:{ fill:{ fgColor:{ rgb:"FFEB9C" }}} },
      { type:"cellIs", operator:"greaterThan", formula:["78"],
        style:{ fill:{ fgColor:{ rgb:"C6EFCE" }}} }
    ]
  }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
  XLSX.writeFile(wb, "Rekap_Nilai_Asesmen.xlsx");
}
</script>

</body>
</html>
