<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Akhir Final</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#1976d2;color:#fff}
</style>
</head>

<body>

<h2>Rekap Nilai Akhir</h2>
<button onclick="exportExcel()">Download Excel</button>
<table id="tabel">
<thead>
<tr>
<th>No</th><th>Nama</th><th>Kelas</th>
<th>TP1</th><th>TP2</th><th>TP3</th><th>TP4</th>
<th>TOTAL</th><th>PREDIKAT</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const KKM = 78;
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

fetch(url).then(r=>r.text()).then(t=>{
  const json = JSON.parse(t.substring(47).slice(0,-2));
  const rows = json.table.rows.map(r=>r.c.map(c=>c?c.v:""));

  const map = {};

  rows.forEach(r=>{
    const nama = String(r[2]).trim().toUpperCase();
    const kelas = r[4];
    const key = nama+"||"+kelas;
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });

  const hasil = [];

  Object.keys(map).forEach(key=>{
    const kiriman = map[key]; // urutan baris = urutan kirim
    const tpFinal = [];

    for(let tp=0;tp<4;tp++){
      const idx = 5 + tp*5;
      const nilaiAwal = kiriman[0].slice(idx,idx+5)
        .filter((v,i)=>v===kiriman[0][idx+i]).length*20;

      if(nilaiAwal >= KKM){
        tpFinal.push(nilaiAwal);
      } else {
        let lulus=false;
        for(let k=1;k<kiriman.length;k++){
          const nilaiUlang = kiriman[k].slice(idx,idx+5)
            .filter((v,i)=>v===kiriman[k][idx+i]).length*20;
          if(nilaiUlang >= KKM){
            tpFinal.push(KKM);
            lulus=true;
            break;
          }
        }
        if(!lulus){
          const terakhir = kiriman[kiriman.length-1]
            .slice(idx,idx+5)
            .filter((v,i)=>v===kiriman[kiriman.length-1][idx+i]).length*20;
          tpFinal.push(terakhir);
        }
      }
    }

    let total = Math.round(tpFinal.reduce((a,b)=>a+b,0)/4);
    if(total>=KKM) total=KKM;

    let pred="D (PERLU BIMBINGAN)";
    if(total>=90) pred="A (SANGAT BAIK)";
    else if(total>=80) pred="B (BAIK)";
    else if(total>=78) pred="C (CUKUP)";

    const [nama,kelas] = key.split("||");
    hasil.push({nama,kelas,tpFinal,total,pred});
  });

  const tbody = document.querySelector("tbody");
  hasil.forEach((s,i)=>{
    tbody.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td>${s.nama}</td>
        <td>${s.kelas}</td>
        <td>${s.tpFinal[0]}</td>
        <td>${s.tpFinal[1]}</td>
        <td>${s.tpFinal[2]}</td>
        <td>${s.tpFinal[3]}</td>
        <td>${s.total}</td>
        <td>${s.pred}</td>
      </tr>`;
  });
});

function exportExcel(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.table_to_sheet(document.getElementById("tabel"));
  XLSX.utils.book_append_sheet(wb,ws,"Nilai Akhir");
  XLSX.writeFile(wb,"Nilai_Akhir_FINAL.xlsx");
}
</script>

</body>
</html>
