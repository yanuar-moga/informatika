<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { margin:0; font-family:Segoe UI, Arial; background:#f4f7fb; }
.wrapper { display:flex; height:100vh; }
.sidebar { width:260px; background:#fff; padding:10px; border-right:1px solid #ddd; overflow:auto; }
.sidebar li { list-style:none; padding:8px; margin:4px 0; border-radius:8px; cursor:pointer; }
.sidebar li.active { background:#009688; color:#fff; }

.main { flex:1; display:flex; flex-direction:column; }
.header { background:#0d47a1; color:#fff; padding:14px; text-align:center; }
.filter { padding:10px; background:#eee; text-align:center; }
.content { flex:1; padding:20px; overflow:auto; }

.nama { font-size:26px; font-weight:bold; text-align:center; }
.nilai { font-size:34px; text-align:center; margin:10px 0; }
.qa { background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; }
</style>
</head>

<body>

<div class="wrapper">
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList"></ul>
  </div>

  <div class="main">
    <div class="header">PENILAIAN ASESMEN</div>
    <div class="filter">
      <select id="kelasSelect"></select>
      <button onclick="tampilkanData()">Tampilkan</button>
      <button onclick="downloadExcel()">⬇ Download Excel</button>
    </div>
    <div class="content">
      <div id="nama" class="nama">Pilih Kelas</div>
      <div id="qaList"></div>
    </div>
  </div>
</div>

<script>
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
const KKM = 78;

const kunci = [
  "Kumpulan informasi yang dapat diolah",
  "Jumlah siswa di kelas",
  "Data primer",
  "Membantu keputusan tepat",
  "Jumlah meja dan kursi",
  "SUM","AVERAGE","MAX","MIN","=SUM(A1:A5)",
  "Keputusan bersyarat",
  "=IF(B2>=75,\"LULUS\",\"REMIDI\")",
  "Logika","REMIDI","Keputusan otomatis",
  "Memudahkan mengolah data",
  "Menganalisis","Tersusun rapi",
  "Pengambilan keputusan","Jujur dan teliti"
];

let rows=[], filtered=[], index=0;

fetch(url).then(r=>r.text()).then(t=>{
  const json=JSON.parse(t.substring(47).slice(0,-2));
  rows=json.table.rows.map(r=>r.c.map(c=>c?String(c.v).trim():""));
  isiKelas();
});

function isiKelas(){
  const kelas=[...new Set(rows.map(r=>r[4]))];
  kelasSelect.innerHTML='<option value="">Pilih Kelas</option>';
  kelas.forEach(k=>k && (kelasSelect.innerHTML+=`<option>${k}</option>`));
}

function nilaiTP(start,end,row){
  let benar=0;
  for(let i=start;i<=end;i++){
    if(row[5+i]===kunci[i]) benar++;
  }
  return benar*20;
}

/* ===================== LOGIKA TP FINAL (BENAR) ===================== */
function hitungTPFinal(tpIndex, kiriman){
  const nilaiAwal = nilaiTP(tpIndex*5,tpIndex*5+4,kiriman[0]);
  if(nilaiAwal >= KKM) return nilaiAwal;

  for(let i=1;i<kiriman.length;i++){
    const n = nilaiTP(tpIndex*5,tpIndex*5+4,kiriman[i]);
    if(n >= KKM) return KKM;
  }

  const terakhir = nilaiTP(tpIndex*5,tpIndex*5+4,kiriman[kiriman.length-1]);
  return terakhir;
}

/* ===================== PROSES SISWA (ANTI DUPLIKAT) ===================== */
function prosesSiswa(kelas){
  const map={};

  rows.filter(r=>r[4]===kelas).forEach(r=>{
    const nama=r[2].replace(/\s+/g,' ').trim().toUpperCase();
    const key=nama+"||"+kelas;
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });

  return Object.keys(map).map(key=>{
    const kiriman=map[key].sort((a,b)=>(a[25]||1)-(b[25]||1));
    const tp=[0,1,2,3].map(i=>hitungTPFinal(i,kiriman));

    let total=Math.round(tp.reduce((a,b)=>a+b,0)/4);
    if(total>=KKM) total=KKM;

    let pred="D (PERLU BIMBINGAN)";
    if(total>=90) pred="A (SANGAT BAIK)";
    else if(total>=80) pred="B (BAIK)";
    else if(total>=78) pred="C (CUKUP)";

    return { nama:key.split("||")[0], kelas, tp, total, pred };
  }).sort((a,b)=>a.nama.localeCompare(b.nama));
}

function tampilkanData(){
  filtered=prosesSiswa(kelasSelect.value);
  index=0;
  renderSidebar();
  render();
}

function renderSidebar(){
  siswaList.innerHTML="";
  filtered.forEach((s,i)=>{
    const li=document.createElement("li");
    li.textContent=s.nama;
    li.onclick=()=>{index=i;render();};
    siswaList.appendChild(li);
  });
}

function render(){
  if(!filtered[index])return;
  const s=filtered[index];
  nama.innerText=s.nama;
  qaList.innerHTML=`
    <div class="nilai">TOTAL : ${s.total}</div>
    <div class="qa">TP1 : ${s.tp[0]}</div>
    <div class="qa">TP2 : ${s.tp[1]}</div>
    <div class="qa">TP3 : ${s.tp[2]}</div>
    <div class="qa">TP4 : ${s.tp[3]}</div>
    <div class="qa"><b>${s.pred}</b></div>
  `;
}

function downloadExcel(){
  const data=[["No","Nama","Kelas","TP1","TP2","TP3","TP4","TOTAL","PREDIKAT"]];
  filtered.forEach((s,i)=>{
    data.push([i+1,s.nama,s.kelas,...s.tp,s.total,s.pred]);
  });
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Nilai Akhir");
  XLSX.writeFile(wb,"Nilai_Akhir_Final.xlsx");
}
</script>

</body>
</html>
