<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilai Akhir Final Remidi</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { margin:0; font-family:Segoe UI, Arial; background:#f4f7fb; }
.wrapper { display:flex; height:100vh; }
.sidebar {
  width:260px; background:#fff; padding:10px;
  border-right:1px solid #ddd; overflow:auto;
}
.sidebar li {
  list-style:none; padding:8px; margin:4px 0;
  border-radius:8px; cursor:pointer;
  text-transform:uppercase;
}
.sidebar li.active { background:#009688; color:#fff; }

.main { flex:1; display:flex; flex-direction:column; }
.header { background:#0d47a1; color:#fff; padding:14px; text-align:center; }
.filter { padding:10px; background:#eee; text-align:center; }
.content { flex:1; padding:20px; overflow:auto; }

.nama { font-size:26px; font-weight:bold; text-align:center; }
.info { text-align:center; font-size:14px; margin-bottom:10px; }
.nilai { font-size:34px; text-align:center; margin:10px 0; }

.hijau { color:#16a34a }
.kuning { color:#facc15 }
.orange { color:#f97316 }

.qa { background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; }
.soal { display:flex; justify-content:space-between; padding:4px 0; }
.benar { color:#16a34a; font-weight:bold; }
.salah { color:#dc2626; font-weight:bold; }
</style>
</head>

<body>

<div class="wrapper">
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList"></ul>
  </div>

  <div class="main">
    <div class="header">NILAI AKHIR FINAL REMIDI</div>

    <div class="filter">
      <select id="kelasSelect"></select>
      <button onclick="tampilkanData()">Tampilkan</button>
      <button onclick="downloadExcel()">⬇ Download Excel</button>
    </div>

    <div class="content">
      <div id="nama" class="nama">Pilih Kelas</div>
      <div id="infoKelas" class="info"></div>
      <div id="qaList"></div>
    </div>
  </div>
</div>

<script>
/* ===================== KONFIGURASI ===================== */
const KKM = 78;
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

/* KUNCI JAWABAN */
const kunci = [
  "Kumpulan informasi yang dapat diolah",
  "Jumlah siswa di kelas",
  "Data primer",
  "Membantu keputusan tepat",
  "Jumlah meja dan kursi",
  "SUM","AVERAGE","MAX","MIN","=SUM(A1:A5)",
  "Keputusan bersyarat",
  "=IF(B2>=75,\"LULUS\",\"REMIDI\")",
  "Logika","REMIDI","Keputusan otomatis",
  "Memudahkan mengolah data",
  "Menganalisis","Tersusun rapi",
  "Pengambilan keputusan","Jujur dan teliti"
];

let rows = [];
let dataFinal = [];
let filtered = [];
let index = 0;

/* ===================== LOAD DATA ===================== */
fetch(url)
.then(r => r.text())
.then(t => {
  const json = JSON.parse(t.substring(47).slice(0,-2));
  rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
  prosesFinal();
  isiKelas();
});

/* ===================== HITUNG TP ===================== */
function hitungTP(row,tp){
  let benar = 0;
  for(let i=0;i<5;i++){
    const idx = tp*5+i;
    if(String(row[5+idx]).trim() === String(kunci[idx]).trim()) benar++;
  }
  return benar * 20;
}

/* ===================== PROSES FINAL REMIDI ===================== */
function prosesFinal(){
  const map = {};

  rows.forEach(r=>{
    const nama = String(r[2]).trim().toUpperCase();
    const kelas = r[4];
    if(!nama || !kelas) return;

    const key = nama+"||"+kelas;
    if(!map[key]) map[key] = [];
    map[key].push(r);
  });

  Object.values(map).forEach(kiriman=>{
    const tpFinal = [];

    for(let tp=0;tp<4;tp++){
      const nilai = kiriman.map(r => hitungTP(r,tp));
      if(nilai[0] >= KKM) tpFinal.push(nilai[0]);
      else{
        const lulus = nilai.slice(1).find(n => n >= KKM);
        tpFinal.push(lulus ? KKM : nilai[nilai.length-1]);
      }
    }

    let total = Math.round(tpFinal.reduce((a,b)=>a+b,0)/4);
    if(total > KKM) total = KKM;

    dataFinal.push({
      nama: kiriman[0][2].toUpperCase(),
      kelas: kiriman[0][4],
      tp: tpFinal,
      total,
      status: total >= KKM ? "LULUS" : "REMIDI",
      detailRow: kiriman[kiriman.length-1]
    });
  });
}

/* ===================== FILTER ===================== */
function isiKelas(){
  const kelas = [...new Set(dataFinal.map(d=>d.kelas))];
  kelasSelect.innerHTML = '<option value="">Pilih Kelas</option>';
  kelas.forEach(k => kelasSelect.innerHTML += `<option>${k}</option>`);
}

function tampilkanData(){
  filtered = dataFinal.filter(d => d.kelas === kelasSelect.value);
  index = 0;
  renderSidebar();
  render();
}

function renderSidebar(){
  siswaList.innerHTML = "";
  filtered.forEach((s,i)=>{
    const li = document.createElement("li");
    li.textContent = s.nama;
    li.onclick = ()=>{ index=i; render(); };
    siswaList.appendChild(li);
  });
}

/* ===================== RENDER DETAIL ===================== */
function render(){
  if(!filtered[index]) return;

  const s = filtered[index];
  nama.innerText = s.nama;
  infoKelas.innerText = `Kelas ${s.kelas} | Total Siswa Mengirim: ${filtered.length}`;

  let detailHTML = "";
  for(let i=0;i<20;i++){
    const jawaban = String(s.detailRow[5+i]).trim();
    const benar = jawaban === String(kunci[i]).trim();
    detailHTML += `
      <div class="soal">
        <span>Soal ${i+1}</span>
        <span class="${benar ? 'benar' : 'salah'}">
          ${benar ? '✅ Benar (+20)' : '❌ Salah (0)'}
        </span>
      </div>`;
  }

  qaList.innerHTML = `
    <div class="nilai">${s.total}</div>
    <div class="qa">KKM : ${KKM}</div>
    <div class="qa">STATUS : <b>${s.status}</b></div>
    <div class="qa">TP1 : ${s.tp[0]}</div>
    <div class="qa">TP2 : ${s.tp[1]}</div>
    <div class="qa">TP3 : ${s.tp[2]}</div>
    <div class="qa">TP4 : ${s.tp[3]}</div>
    <div class="qa"><b>Detail Jawaban</b>${detailHTML}</div>
  `;

  document.querySelectorAll(".sidebar li")
    .forEach((li,i)=>li.classList.toggle("active", i===index));
}

/* ===================== EXCEL ===================== */
function downloadExcel(){
  const data=[["No","Nama","Kelas","TP1","TP2","TP3","TP4","TOTAL","KKM","STATUS"]];
  filtered.forEach((s,i)=>{
    data.push([i+1,s.nama,s.kelas,...s.tp,s.total,KKM,s.status]);
  });

  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Final Remidi");
  XLSX.writeFile(wb,"Nilai_Akhir_Final_Remidi.xlsx");
}
</script>

</body>
</html>
