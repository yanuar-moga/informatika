<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Akhir Final Remidi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#1565c0;color:#fff}
</style>
</head>
<body>

<h2>Rekap Nilai Akhir (Final)</h2>
<button onclick="download()">Download Excel</button>

<table id="tabel">
<thead>
<tr>
<th>No</th><th>Nama</th><th>Kelas</th>
<th>TP1</th><th>TP2</th><th>TP3</th><th>TP4</th>
<th>TOTAL</th><th>PREDIKAT</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const KKM = 78;
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

fetch(url).then(r=>r.text()).then(t=>{
  const json = JSON.parse(t.substring(47).slice(0,-2));
  const rows = json.table.rows.map(r=>r.c.map(c=>c?c.v:""));

  const map = {};

  rows.forEach(r=>{
    const nama = String(r[2]).trim().toUpperCase();
    const kelas = r[4];
    const key = nama+"||"+kelas;
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });

  const hasil = [];

  Object.values(map).forEach(kiriman=>{
    const tpFinal = [];

    for(let tp=0;tp<4;tp++){
      const nilai = kiriman.map(r=>{
        let benar=0;
        for(let i=0;i<5;i++){
          if(String(r[5+tp*5+i]).trim() === String(r[5+tp*5+i]).trim()){
            benar++;
          }
        }
        return benar*20;
      });

      if(nilai[0] >= KKM){
        tpFinal.push(nilai[0]);
      } else {
        let naik = nilai.slice(1).find(n=>n>=KKM);
        tpFinal.push(naik ? KKM : nilai[nilai.length-1]);
      }
    }

    let total = Math.round(tpFinal.reduce((a,b)=>a+b,0)/4);
    if(total >= KKM) total = KKM;

    let pred="D (PERLU BIMBINGAN)";
    if(total>=90) pred="A (SANGAT BAIK)";
    else if(total>=80) pred="B (BAIK)";
    else if(total>=78) pred="C (CUKUP)";

    hasil.push({
      nama:kiriman[0][2].toUpperCase(),
      kelas:kiriman[0][4],
      tp:tpFinal,
      total,pred
    });
  });

  const tbody=document.querySelector("tbody");
  hasil.forEach((s,i)=>{
    tbody.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td>${s.nama}</td>
        <td>${s.kelas}</td>
        <td>${s.tp[0]}</td>
        <td>${s.tp[1]}</td>
        <td>${s.tp[2]}</td>
        <td>${s.tp[3]}</td>
        <td>${s.total}</td>
        <td>${s.pred}</td>
      </tr>`;
  });
});

function download(){
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.table_to_sheet(document.getElementById("tabel"));
  XLSX.utils.book_append_sheet(wb,ws,"Nilai Final");
  XLSX.writeFile(wb,"Nilai_Akhir_Final.xlsx");
}
</script>

</body>
</html>
