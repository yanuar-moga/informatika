<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { margin:0; font-family:Segoe UI, Arial; background:#f4f7fb; }
.wrapper { display:flex; height:100vh; }
.sidebar {
  width:260px; background:#fff; padding:10px;
  border-right:1px solid #ddd; overflow:auto;
}
.sidebar li {
  list-style:none; padding:8px; margin:4px 0;
  border-radius:8px; cursor:pointer;
  text-transform:uppercase;
}
.sidebar li.active { background:#009688; color:#fff; }

.main { flex:1; display:flex; flex-direction:column; }
.header { background:#0d47a1; color:#fff; padding:14px; text-align:center; }
.filter { padding:10px; background:#eee; text-align:center; }
.content { flex:1; padding:20px; overflow:auto; }

.nama { font-size:26px; font-weight:bold; text-align:center; }
.nilai { font-size:34px; text-align:center; margin:10px 0; }

.info { text-align:center; margin-bottom:10px; font-weight:bold; }

.hijau { color:#16a34a }
.kuning { color:#facc15 }
.orange { color:#f97316 }

.qa { background:#fff; padding:12px; border-radius:12px; margin-bottom:12px; }
.soal { display:flex; justify-content:space-between; padding:4px 0; }
.benar { color:#16a34a; font-weight:bold; }
.salah { color:#dc2626; font-weight:bold; }
</style>
</head>

<body>

<div class="wrapper">
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList"></ul>
  </div>

  <div class="main">
    <div class="header">PENILAIAN ASESMEN</div>

    <div class="filter">
      <select id="kelasSelect"></select>
      <button onclick="tampilkanData()">Tampilkan</button>
      <button onclick="downloadExcel()">⬇ Download Excel</button>
    </div>

    <div class="content">
      <div id="jumlah" class="info"></div>
      <div id="nama" class="nama">Pilih Kelas</div>
      <div id="qaList"></div>
    </div>
  </div>
</div>

<script>
/* ===================== KONFIGURASI ===================== */
const sheetId = "1wYkp-mZ96BXEin8mF8F3Z9brSjkPeFtB5k2IFm5Qxjc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

/* ===================== KUNCI JAWABAN ===================== */
const kunci = [
  "Kumpulan informasi yang dapat diolah",
  "Jumlah siswa di kelas",
  "Data primer",
  "Membantu keputusan tepat",
  "Jumlah meja dan kursi",
  "SUM","AVERAGE","MAX","MIN","=SUM(A1:A5)",
  "Keputusan bersyarat",
  "=IF(B2>=75,\"LULUS\",\"REMIDI\")",
  "Logika","REMIDI","Keputusan otomatis",
  "Memudahkan mengolah data",
  "Menganalisis","Tersusun rapi",
  "Pengambilan keputusan","Jujur dan teliti"
];

let rows = [];
let filtered = [];
let index = 0;

/* ===================== LOAD DATA ===================== */
fetch(url)
.then(r => r.text())
.then(t => {
  const json = JSON.parse(t.substring(47).slice(0,-2));
  rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
  isiKelas();
});

/* ===================== DROPDOWN KELAS ===================== */
function isiKelas(){
  const kelas = [...new Set(rows.map(r => r[4]))];
  kelasSelect.innerHTML = '<option value="">Pilih Kelas</option>';
  kelas.forEach(k => k && (kelasSelect.innerHTML += `<option>${k}</option>`));
}

/* ===================== DEDUPLIKASI DATA ===================== */
function ambilDataFinal(kelas){
  const map = {};
  rows.filter(r => r[4] === kelas).forEach(r=>{
    const key = r[2].toUpperCase();
    const kirim = Number(r[25]) || 1;
    if(!map[key] || kirim > map[key][25]){
      map[key] = r;
    }
  });
  return Object.values(map).sort((a,b)=>a[2].localeCompare(b[2]));
}

/* ===================== FILTER ===================== */
function tampilkanData(){
  filtered = ambilDataFinal(kelasSelect.value);
  index = 0;
  jumlah.innerText = `Jumlah Siswa (Final): ${filtered.length}`;
  renderSidebar();
  render();
}

/* ===================== SIDEBAR ===================== */
function renderSidebar(){
  siswaList.innerHTML = "";
  filtered.forEach((r,i)=>{
    const li = document.createElement("li");
    li.textContent = r[2];
    li.onclick = ()=>{ index=i; render(); };
    siswaList.appendChild(li);
  });
}

/* ===================== HITUNG TP ===================== */
function nilaiTP(start,end,row){
  let benar = 0;
  for(let i=start;i<=end;i++){
    if(String(row[5+i]).trim() === String(kunci[i]).trim()) benar++;
  }
  return benar * 20;
}

/* ===================== LOGIKA KKM ===================== */
function nilaiFinal(nilai,pengiriman){
  if(pengiriman > 1 && nilai >= 78) return 78;
  return nilai;
}

/* ===================== RENDER ===================== */
function render(){
  if(!filtered[index]) return;
  const r = filtered[index];
  const pengiriman = Number(r[25]) || 1;

  const tp1 = nilaiFinal(nilaiTP(0,4,r),pengiriman);
  const tp2 = nilaiFinal(nilaiTP(5,9,r),pengiriman);
  const tp3 = nilaiFinal(nilaiTP(10,14,r),pengiriman);
  const tp4 = nilaiFinal(nilaiTP(15,19,r),pengiriman);

  const nilaiMurni = Math.round((tp1+tp2+tp3+tp4)/4);
  const total = nilaiFinal(nilaiMurni,pengiriman);

  nama.innerText = r[2].toUpperCase();
  qaList.innerHTML = `
    <div class="nilai ${total==78?'kuning':total>78?'hijau':'orange'}">
      NILAI AKHIR : ${total}
    </div>
    <div class="qa">Pengiriman Ke: ${pengiriman}</div>
    <div class="qa">TP1: ${tp1}</div>
    <div class="qa">TP2: ${tp2}</div>
    <div class="qa">TP3: ${tp3}</div>
    <div class="qa">TP4: ${tp4}</div>
  `;

  document.querySelectorAll(".sidebar li")
    .forEach((li,i)=>li.classList.toggle("active",i===index));
}

/* ===================== EXCEL ===================== */
function downloadExcel(){
  const data = [["No","Nama","Kelas","TP1","TP2","TP3","TP4","Nilai Akhir","Pengiriman"]];
  filtered.forEach((r,i)=>{
    const p = Number(r[25])||1;
    const tp1 = nilaiFinal(nilaiTP(0,4,r),p);
    const tp2 = nilaiFinal(nilaiTP(5,9,r),p);
    const tp3 = nilaiFinal(nilaiTP(10,14,r),p);
    const tp4 = nilaiFinal(nilaiTP(15,19,r),p);
    const nilai = nilaiFinal(Math.round((tp1+tp2+tp3+tp4)/4),p);

    data.push([i+1,r[2],r[4],tp1,tp2,tp3,tp4,nilai,p]);
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Rekap Final");
  XLSX.writeFile(wb,"Rekap_Nilai_Final.xlsx");
}
</script>

</body>
</html>
