let rows=[],filtered=[],index=0;

function normalisasiNama(n){
  return String(n).toUpperCase().trim().replace(/\s+/g," ");
}

fetch(url)
.then(r=>r.text())
.then(t=>{
  const json=JSON.parse(t.substring(47).slice(0,-2));
  rows=json.table.rows.map(r=>r.c.map(c=>c?c.v:""));
  isiKelas();
});

function isiKelas(){
  kelasSelect.innerHTML='<option value="">Pilih Kelas</option>';
  Object.keys(masterKelas).forEach(k=>{
    kelasSelect.innerHTML+=`<option value="${k}">${k}</option>`;
  });
}

function tampilkanData(){

  const kelas=kelasSelect.value;
  if(!kelas) return alert("Pilih kelas dulu!");

  const master=masterKelas[kelas];

  const pengirim=new Set(
    rows.filter(r=>r[4]===kelas && r.slice(5,25).some(v=>String(v).trim()!==""))
    .map(r=>normalisasiNama(r[2]))
  );

  filtered=master.map(n=>{
    const d=rows.find(r=>normalisasiNama(r[2])===normalisasiNama(n)&&r[4]===kelas);
    return d||[,"",n,"",kelas];
  });

  index=0;
  renderSidebar(pengirim);
  render(pengirim);
}

function renderSidebar(pengirim){
  siswaList.innerHTML="";
  filtered.forEach((r,i)=>{
    const li=document.createElement("li");
    li.textContent=r[2];

    if(i===index) li.classList.add("active");
    if(!pengirim.has(normalisasiNama(r[2]))) li.classList.add("belum");

    li.onclick=()=>{index=i;render(pengirim);renderSidebar(pengirim);};
    siswaList.appendChild(li);
  });
}

function nilaiTP(s,e,row){
  let b=0;
  for(let i=s;i<=e;i++){
    if(String(row[5+i]).trim()===String(kunci[i]).trim()) b++;
  }
  return b*20;
}

function render(pengirim){

  const r=filtered[index];
  if(!r) return;

  nama.innerText=r[2];

  if(!pengirim.has(normalisasiNama(r[2]))){
    qaList.innerHTML=`<div class="nilai orange">BELUM MENGIRIM</div>`;
    return;
  }

  const tp1=nilaiTP(0,4,r);
  const tp2=nilaiTP(5,9,r);
  const tp3=nilaiTP(10,14,r);
  const tp4=nilaiTP(15,19,r);

  const total=Math.round((tp1+tp2+tp3+tp4)/4);
  const status=total>=78?"TUNTAS":"REMIDI";

  let detail="";
  for(let i=0;i<20;i++){
    const benar=String(r[5+i]).trim()===String(kunci[i]).trim();
    detail+=`<div class="soal">
      <span>Soal ${i+1}</span>
      <span class="${benar?'benar':'salah'}">${benar?'✅ Benar':'❌ Salah'}</span>
    </div>`;
  }

  qaList.innerHTML=`
    <div class="nilai ${total>=78?'hijau':'orange'}">${total}</div>
    <div class="qa">STATUS : <b>${status}</b></div>
    <div class="qa">TP1 : ${tp1}</div>
    <div class="qa">TP2 : ${tp2}</div>
    <div class="qa">TP3 : ${tp3}</div>
    <div class="qa">TP4 : ${tp4}</div>
    <div class="qa"><b>Detail Jawaban</b>${detail}</div>
  `;
}

function downloadExcelPerKelas(){

  const kelas=kelasSelect.value;
  if(!kelas) return alert("Pilih kelas!");

  let data=[["Nama","TP1","TP2","TP3","TP4","Total"]];

  filtered.forEach(r=>{
    const tp1=nilaiTP(0,4,r);
    const tp2=nilaiTP(5,9,r);
    const tp3=nilaiTP(10,14,r);
    const tp4=nilaiTP(15,19,r);
    const total=Math.round((tp1+tp2+tp3+tp4)/4);

    data.push([r[2],tp1,tp2,tp3,tp4,total]);
  });

  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,kelas);
  XLSX.writeFile(wb,`Rekap_${kelas}.xlsx`);
}
