<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen CBT - SMP Negeri 1 Moga</title>
    <style>
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; padding: 0; user-select: none; 
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100; border-bottom: 4px solid var(--gold);
        }

        .timer { 
            font-size: 16px; font-weight: bold; background: white; color: var(--primary-blue); 
            padding: 5px 12px; border-radius: 20px; border: 2px solid var(--gold);
        }

        .main-layout { display: flex; flex-direction: column; max-width: 1100px; margin: 10px auto; gap: 20px; padding: 0 15px 120px 15px; width: 100%; box-sizing: border-box; }
        @media (min-width: 768px) { .main-layout { flex-direction: row; } }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card { 
            background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border-left: 5px solid var(--primary-blue);
        }

        .opsi { 
            display: flex; align-items: center; padding: 12px; border: 1px solid #ddd; 
            border-radius: 10px; cursor: pointer; margin-bottom: 10px; background: #fff;
        }
        .opsi.selected { background: #e1ecff; border-color: var(--primary-blue); font-weight: bold; }

        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .kotak-nomor { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #e9ecef; border-radius: 6px; cursor: pointer; font-weight: bold; border: 1px solid #ddd; }
        .kotak-nomor.sudah { background: var(--success) !important; color: white; }
        .kotak-nomor.aktif { border: 2px solid var(--gold); background: #fff; }

        .footer-nav { 
            background: white; padding: 12px 20px; display: flex; 
            justify-content: space-between; align-items: center; 
            position: fixed; bottom: 0; width: 100%; border-top: 3px solid var(--gold); 
            z-index: 90; box-sizing: border-box;
        }

        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-nav { background: var(--btn-blue); color: white; min-width: 120px; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .modal-box { 
            background: white; width: 85%; max-width: 320px; border-radius: 15px; 
            text-align: center; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .main-footer { background: #222; color: #ccc; text-align: center; padding: 15px; font-size: 12px; margin-top: auto; border-top: 2px solid var(--gold); }

        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
    <p id="loadingText">Menyiapkan Soal...</p>
</div>

<div class="modal-overlay" id="modalConfirm" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;">
    <div class="modal-box">
        <h3 style="margin-top:0; color: var(--primary-blue);">Selesai Ujian?</h3>
        <p style="font-size: 14px; color: #555;">Pastikan semua jawaban telah terisi.</p>
        <div style="margin: 15px 0; background: #f8f9fa; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px;">
            <input type="checkbox" id="checkYakin" onchange="toggleKirimBtn()">
            <label for="checkYakin">Saya sudah yakin</label>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="flex:1; background:#ccc;" onclick="closeModal()">Batal</button>
            <button class="btn" id="btnFinalKirim" style="flex:1; background:var(--btn-red); color:white; opacity:0.4" disabled onclick="kirimJawaban()">Kirim</button>
        </div>
    </div>
</div>

<!-- ISI TETAP SAMA (tidak diubah) -->

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec"; 
const API_SOAL = "https://script.google.com/macros/s/AKfycbyP6AyagNPxUVcpV59JDCaVgqcD-yloDwicbwrv_wn6upZLqGzVWrpBhng4NkmunWM/exec";

let currentIdx = 0;
let listSoal = [];
let jawabanSiswa = {};
let userSession = JSON.parse(localStorage.getItem("user"));

window.onload = async () => {
    if (!userSession) { eksekusiLogoutTotal(); return; }

    // 🔥 TAMBAHAN: CATAT MULAI UJIAN
    await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "mulaiUjian",
            idLogin: userSession.idLogin,
            nama: userSession.nama
        })
    });

    document.getElementById('displayNama').innerText = userSession.nama;
    document.getElementById('displayKelas').innerText = `Kelas ${userSession.kelas}`;
    loadSoal();
};

async function kirimJawaban() {
    closeModal();
    document.getElementById('loading').style.display = "flex";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" }, // ✅ FIX
            body: JSON.stringify({
                action: "kirimJawaban",
                idLogin: userSession.idLogin,
                nama: userSession.nama,
                kelas: userSession.kelas,
                jawaban: jawabanSiswa
            })
        });

        const result = await response.json();
        if (result.status === "success") {
            tampilkanHasil(result.nilai);
        } else {
            alert("Gagal: " + result.msg);
        }
    } catch (e) {
        console.error(e);
        alert("Error koneksi ke server");
    }
}
</script>

</body>
</html>
