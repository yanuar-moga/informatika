<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen CBT - SMP Negeri 1 Moga</title>

    <style>
        /* === STYLE TETAP KONSISTEN === */
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .timer { 
            background: white; 
            color: var(--primary-blue); 
            padding: 5px 15px; 
            border-radius: 20px;
            font-weight: bold;
        }

        .main-layout { 
            display: flex; 
            flex-direction: column; 
            max-width: 1100px; 
            margin: 20px auto; 
            gap: 20px; 
            padding: 0 15px 160px; /* Ruang untuk footer info */
        }

        @media(min-width: 768px) { .main-layout { flex-direction: row; } }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .opsi {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .opsi:hover { background: #f0f4f8; }
        .opsi.selected {
            background: #e1ecff;
            border-color: var(--btn-blue);
            font-weight: bold;
            color: var(--primary-blue);
        }

        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .kotak-nomor {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #ccc;
        }
        .kotak-nomor.sudah { background: var(--success); color: white; border-color: var(--success); }
        .kotak-nomor.aktif { border: 3px solid var(--gold); transform: scale(1.1); }

        /* FOOTER & NAV */
        .nav-bottom {
            position: fixed; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between;
            background: white; padding: 10px 20px;
            border-top: 1px solid #eee; box-sizing: border-box; z-index: 900;
        }

        .footer-info {
            position: fixed; bottom: 0; width: 100%;
            background: #222; color: #ccc;
            text-align: center; padding: 8px 0;
            font-size: 0.85em; border-top: 2px solid var(--gold); z-index: 1000;
        }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-nav { background: var(--btn-blue); color: white; }

        /* LAYAR HASIL AKHIR */
        #layarHasil {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none;
            flex-direction: column; justify-content: center;
            align-items: center; z-index: 10001; text-align: center; padding: 20px;
        }

        .skor-box { font-size: 4em; color: var(--primary-blue); font-weight: 900; margin: 15px 0; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
    </style>
</head>

<body>

<div id="loading">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
    <p id="loadingText" style="margin-top:15px; font-weight:bold; color:var(--primary-blue);">Menghubungkan ke Server...</p>
</div>

<div id="layarHasil">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="100">
    <h2 style="color:var(--primary-blue); margin-top:20px;">Terima Kasih!</h2>
    <p style="font-size:1.1em; color:#555;">Anda telah berhasil melaksanakan asesmen.</p>
    
    <div style="margin: 25px 0; padding:20px; background:#f0f7ff; border-radius:20px; width:100%; max-width:280px;">
        <span style="font-weight:bold; color:#777; font-size:0.9em;">NILAI HASIL TES</span>
        <div class="skor-box" id="nilaiFinal">0</div>
    </div>

    <p style="color: #888; font-size: 0.9em; margin-bottom: 20px;">Klik tombol di bawah untuk keluar dengan aman.</p>
    
    <button class="btn" style="background:var(--btn-red); color:white; padding:15px 50px; font-size:1em;" onclick="logOutSiswa()">
        LOG OUT
    </button>
</div>

<div id="app-content">
    <div class="header">
        <div>
            <b id="displayNama" style="font-size:1.1em;">-</b><br>
            <small id="displayKelas">-</small>
        </div>
        <div class="timer" id="timerDisplay">00:00:00</div>
    </div>

    <div class="main-layout">
        <div class="quiz-container">
            <div id="quizArea"></div>
        </div>

        <div class="sidebar">
            <div style="background:white; padding:20px; border-radius:15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h4 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Navigasi Soal</h4>
                <div id="gridNomor" class="grid-nomor"></div>
                <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
                <button class="btn" style="background:var(--success); color:white; width:100%; font-size:1.1em;" onclick="kirimJawaban()">SELESAI</button>
            </div>
        </div>
    </div>

    <div class="nav-bottom">
        <button class="btn btn-nav" onclick="changeSoal(-1)"> Sebelumnya</button>
        <div id="infoHalaman" style="font-weight:bold; color:var(--primary-blue); padding-top:10px;">Soal -/-</div>
        <button class="btn btn-nav" onclick="changeSoal(1)">Berikutnya </button>
    </div>

    <div class="footer-info" id="footerPengembang">
        <strong>Sistem CBT SMPN 1 Moga</strong> | Dikembangkan oleh: <strong>Yanuar</strong> | v2.6.4
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzTacoBkA6md69TmVNi-uCwtXoUzu15_YlBfwmYqzpHGha_ad-nKnMAPD0c7VkG42Q/exec";

let listSoal = [];
let jawabanSiswa = {};
let currentIdx = 0;
// Mengambil session dari login sebelumnya
let userSession = JSON.parse(localStorage.getItem("user"));

window.onload = async () => {
    // Validasi Session
    if (!userSession) { 
        alert("Sesi berakhir, silakan login kembali.");
        window.location.href = "index.html"; 
        return; 
    }
    
    document.getElementById("displayNama").innerText = userSession.nama;
    document.getElementById("displayKelas").innerText = "Kelas " + userSession.kelas;
    
    await loadSoal();
};

// Fungsi umum untuk komunikasi ke GAS
async function postToGAS(data) {
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: new URLSearchParams(data)
        });
        return await response.json();
    } catch (e) {
        console.error("Kesalahan koneksi server:", e);
    }
}

// Mengambil data soal
async function loadSoal() {
    try {
        const response = await fetch(API_URL + "?action=getSoal&kelas=" + userSession.kelas);
        const resJson = await response.json();
        
        if(resJson.status) {
            listSoal = resJson.soal;
            renderSoal();
            document.getElementById("loading").style.display = "none";
        } else {
            alert("Soal tidak ditemukan untuk kelas ini.");
        }
    } catch (error) { 
        alert("Gagal memuat soal. Periksa koneksi internet."); 
    }
}

// Menampilkan butir soal
function renderSoal() {
    if (listSoal.length === 0) return;
    const s = listSoal[currentIdx]; // s adalah baris dari Spreadsheet Soal
    
    document.getElementById("infoHalaman").innerText = `Soal ${currentIdx + 1} dari ${listSoal.length}`;
    
    // s[3] = Pertanyaan, s[4] = Gambar Soal
    let html = `
        <div class="soal-card">
            <div style="font-size:1.15em; margin-bottom:20px; line-height:1.6;">
                <b>${currentIdx + 1}.</b> ${s[3]}
            </div>`;
    
    if (s[4]) {
        html += `<div style="text-align:center; margin-bottom:15px;"><img src="${s[4]}"></div>`;
    }

    html += `<div class="daftar-opsi">`;
    
    // Mapping Opsi A (Kolom 5) sampai E (Kolom 13)
    ['A', 'B', 'C', 'D', 'E'].forEach((label, i) => {
        const teksOpsi = s[5 + (i * 2)];
        const imgOpsi = s[6 + (i * 2)];
        
        if (teksOpsi || imgOpsi) {
            const isSelected = jawabanSiswa[currentIdx + 1] === label ? 'selected' : '';
            html += `
                <div class="opsi ${isSelected}" onclick="simpanKeServer('${currentIdx + 1}', '${label}')">
                    <strong>${label}.</strong> ${teksOpsi || ''}
                    ${imgOpsi ? `<br><img src="${imgOpsi}" style="max-height:150px;">` : ''}
                </div>`;
        }
    });

    html += `</div></div>`;
    document.getElementById("quizArea").innerHTML = html;
    renderGrid();
}

// Kirim jawaban per nomor secara realtime (Silent Save)
async function simpanKeServer(noSoal, kodeOpsi) {
    jawabanSiswa[noSoal] = kodeOpsi;
    renderSoal();
    
    // Kirim ke GAS (saveJawaban)
    let idMurni = userSession.session_id.split("_")[1];
    postToGAS({
        action: "saveJawaban",
        id: idMurni,
        nama: userSession.nama,
        kelas: userSession.kelas,
        no: noSoal,
        jawaban: kodeOpsi
    });
}

// Menampilkan grid nomor soal di sidebar
function renderGrid() {
    const gridNomor = document.getElementById("gridNomor");
    gridNomor.innerHTML = listSoal.map((s, i) => {
        const sudahDijawab = jawabanSiswa[i + 1] ? 'sudah' : '';
        const sedangAktif = currentIdx === i ? 'aktif' : '';
        return `<div class="kotak-nomor ${sudahDijawab} ${sedangAktif}" onclick="currentIdx=${i};renderSoal()">${i + 1}</div>`;
    }).join('');
}

// Navigasi tombol bawah
function changeSoal(arah) {
    if (currentIdx + arah >= 0 && currentIdx + arah < listSoal.length) {
        currentIdx += arah; 
        renderSoal();
    }
}

// Submit Final
async function kirimJawaban() {
    const jumlahDijawab = Object.keys(jawabanSiswa).length;
    if (!confirm(`Anda menjawab ${jumlahDijawab} dari ${listSoal.length} soal. Selesaikan ujian?`)) return;

    document.getElementById("loading").style.display = "flex";
    document.getElementById("loadingText").innerText = "Mengunci Jawaban & Menghitung Skor...";

    let idMurni = userSession.session_id.split("_")[1];
    
    try {
        const res = await postToGAS({ action: "submit", id: idMurni });
        
        if (res && res.status) {
            setTimeout(() => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("app-content").style.display = "none"; // Ini juga menyembunyikan footer pengembang
                document.getElementById("layarHasil").style.display = "flex";
                document.getElementById("nilaiFinal").innerText = res.nilai;
            }, 1500);
        } else {
            alert(res.message || "Gagal mengakhiri ujian.");
            document.getElementById("loading").style.display = "none";
        }
    } catch (error) {
        alert("Terjadi gangguan koneksi.");
        document.getElementById("loading").style.display = "none";
    }
}

function logOutSiswa() {
    localStorage.removeItem("user");
    window.location.href = "index.html"; 
}
</script>
</body>
</html>
