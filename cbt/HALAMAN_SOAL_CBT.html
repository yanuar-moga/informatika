<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen CBT - SMP Negeri 1 Moga</title>

    <style>
        /* === STYLE SISTEM CBT === */
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--gold);
        }

        .timer { 
            background: white; 
            color: var(--primary-blue); 
            padding: 5px 15px; 
            border-radius: 20px;
            font-weight: bold;
        }

        .main-layout { 
            display: flex; 
            flex-direction: column; 
            max-width: 1100px; 
            margin: 20px auto; 
            gap: 20px; 
            padding: 0 15px 120px;
        }

        @media(min-width: 768px) {
            .main-layout { flex-direction: row; }
        }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .opsi {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .opsi:hover { background: #f0f4f8; }

        .opsi.selected {
            background: #e1ecff;
            border-color: var(--btn-blue);
            font-weight: bold;
            color: var(--primary-blue);
        }

        .grid-nomor {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .kotak-nomor {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .kotak-nomor.sudah {
            background: var(--success);
            color: white;
        }

        .kotak-nomor.aktif {
            border: 3px solid var(--gold);
            transform: scale(1.1);
        }

        .footer-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-top: 3px solid var(--gold);
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-nav {
            background: var(--btn-blue);
            color: white;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loading">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
    <p id="loadingText" style="margin-top:15px; font-weight:bold; color:var(--primary-blue);">Menghubungkan ke Server...</p>
</div>

<div id="app-content">
    <div class="header">
        <div>
            <b id="displayNama" style="font-size:1.1em;">-</b><br>
            <small id="displayKelas">-</small>
        </div>
        <div class="timer" id="timerDisplay">00:00:00</div>
    </div>

    <div class="main-layout">
        <div class="quiz-container">
            <div id="quizArea"></div>
        </div>

        <div class="sidebar">
            <div style="background:white; padding:20px; border-radius:15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h4 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Navigasi Soal</h4>
                <div id="gridNomor" class="grid-nomor"></div>
                <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
                <button class="btn" style="background:var(--success); color:white; width:100%; font-size:1.1em;" onclick="kirimJawaban()">SELESAI</button>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <button class="btn btn-nav" onclick="changeSoal(-1)"> Sebelumnya</button>
        <div id="infoHalaman" style="font-weight:bold; color:var(--primary-blue);">Soal -/-</div>
        <button class="btn btn-nav" onclick="changeSoal(1)">Berikutnya </button>
    </div>
</div>

<script>
// KONFIGURASI API (WAJIB SESUAI DENGAN URL DEPLOY TERBARU)
const API_URL = "https://script.google.com/macros/s/AKfycbzTacoBkA6md69TmVNi-uCwtXoUzu15_YlBfwmYqzpHGha_ad-nKnMAPD0c7VkG42Q/exec";

let listSoal = [];
let jawabanSiswa = {};
let currentIdx = 0;
let userSession = JSON.parse(localStorage.getItem("user"));

// --- INISIALISASI ---
window.onload = async () => {
    if (!userSession) {
        alert("Sesi tidak ditemukan. Silakan login kembali.");
        window.location.href = "index.html"; 
        return;
    }
    
    document.getElementById("displayNama").innerText = userSession.nama;
    document.getElementById("displayKelas").innerText = "Kelas " + userSession.kelas;
    
    // LANGKAH 1: Lapor buka soal ke Sheet SESSION
    await laporMulaiUjian();
    
    // LANGKAH 2: Ambil Soal
    await loadSoal();
};

// --- FUNGSI LAPOR SESI (KE SHEET SESSION) ---
async function laporMulaiUjian() {
    try {
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                action: "mulaiUjian",
                idLogin: userSession.idLogin,
                nama: userSession.nama
            })
        });
        console.log("Status: Waktu mulai ujian telah dicatat di SESSION.");
    } catch (e) {
        console.error("Gagal mencatat waktu mulai:", e);
    }
}

// --- FUNGSI AMBIL SOAL ---
async function loadSoal() {
    try {
        const response = await fetch(API_URL + "?mode=getSoal");
        listSoal = await response.json();
        renderSoal();
        document.getElementById("loading").style.display = "none";
    } catch (error) {
        alert("Gagal memuat soal. Periksa koneksi internet Anda.");
    }
}

// --- TAMPILKAN SOAL ---
function renderSoal() {
    if (listSoal.length === 0) return;
    
    const s = listSoal[currentIdx];
    const quizArea = document.getElementById("quizArea");
    const infoHalaman = document.getElementById("infoHalaman");
    
    infoHalaman.innerText = `Soal ${currentIdx + 1} dari ${listSoal.length}`;
    
    quizArea.innerHTML = `
        <div class="soal-card">
            <div style="font-size:1.2em; margin-bottom:20px; line-height:1.5;">
                <b>${currentIdx + 1}.</b> ${s.pertanyaan}
            </div>
            <div class="daftar-opsi">
                ${['A', 'B', 'C', 'D', 'E'].map(k => {
                    if (!s.opsi[k]) return '';
                    const isSelected = jawabanSiswa[s.no] === k ? 'selected' : '';
                    return `
                        <div class="opsi ${isSelected}" onclick="pilih('${s.no}', '${k}')">
                            <strong>${k}.</strong> ${s.opsi[k]}
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
    renderGrid();
}

function pilih(noSoal, kodeOpsi) {
    jawabanSiswa[noSoal] = kodeOpsi;
    renderSoal();
}

function renderGrid() {
    const gridNomor = document.getElementById("gridNomor");
    gridNomor.innerHTML = listSoal.map((s, i) => {
        const statusSudah = jawabanSiswa[s.no] ? 'sudah' : '';
        const statusAktif = currentIdx === i ? 'aktif' : '';
        return `
            <div class="kotak-nomor ${statusSudah} ${statusAktif}" onclick="lompatKeSoal(${i})">
                ${i + 1}
            </div>
        `;
    }).join('');
}

function changeSoal(arah) {
    const targetIdx = currentIdx + arah;
    if (targetIdx >= 0 && targetIdx < listSoal.length) {
        currentIdx = targetIdx;
        renderSoal();
    }
}

function lompatKeSoal(index) {
    currentIdx = index;
    renderSoal();
}

// --- FUNGSI KIRIM JAWABAN (UPDATE HASIL & SESSION) ---
async function kirimJawaban() {
    const jumlahDijawab = Object.keys(jawabanSiswa).length;
    const pesan = jumlahDijawab < listSoal.length 
        ? `Anda baru menjawab ${jumlahDijawab} dari ${listSoal.length} soal. Yakin ingin mengakhiri?`
        : "Apakah Anda yakin ingin menyelesaikan ujian ini?";

    if (!confirm(pesan)) return;

    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    
    loading.style.display = "flex";
    loadingText.innerText = "Menyimpan jawaban & mengakhiri sesi...";

    const payload = {
        action: "kirimJawaban",
        idLogin: userSession.idLogin,
        nama: userSession.nama,
        kelas: userSession.kelas,
        jawaban: jawabanSiswa
    };

    try {
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors", 
            body: JSON.stringify(payload)
        });

        // Beri waktu GAS untuk proses appendRow dan update SESSION
        setTimeout(() => {
            loading.style.display = "none";
            alert("✅ Berhasil! Jawaban dan Sesi Anda telah tersimpan.");
            localStorage.removeItem("user");
            window.location.reload();
        }, 2500);

    } catch (error) {
        loading.style.display = "none";
        alert("Gagal mengirim data. Coba lagi.");
    }
}
</script>
</body>
</html>
