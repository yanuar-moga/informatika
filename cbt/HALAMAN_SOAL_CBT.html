<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen CBT - SMP Negeri 1 Moga</title>

<style>
/* === TAMPILAN TETAP (TIDAK DIUBAH) === */
:root {
    --primary-blue: #1f4e94;
    --btn-blue: #007bff; 
    --btn-red: #ed1c24;
    --gold: #d4af37;
    --light-bg: #f4f7fa;
    --success: #28a745;
}
body { font-family: 'Segoe UI'; background: var(--light-bg); margin:0; display:flex; flex-direction:column; min-height:100vh;}
.header { background: var(--primary-blue); color:white; padding:10px; display:flex; justify-content:space-between; border-bottom:4px solid var(--gold);}
.timer { background:white; color:var(--primary-blue); padding:5px 12px; border-radius:20px;}
.main-layout { display:flex; flex-direction:column; max-width:1100px; margin:auto; gap:20px; padding:0 15px 120px;}
@media(min-width:768px){.main-layout{flex-direction:row}}
.quiz-container{flex:3}.sidebar{flex:1}
.soal-card{background:white;padding:20px;border-radius:15px;border-left:5px solid var(--primary-blue)}
.opsi{padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;cursor:pointer}
.opsi.selected{background:#e1ecff;font-weight:bold}
.grid-nomor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kotak-nomor{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#e9ecef;border-radius:6px;cursor:pointer}
.kotak-nomor.sudah{background:var(--success);color:white}
.kotak-nomor.aktif{border:2px solid var(--gold)}
.footer-nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-between;background:white;padding:10px;border-top:3px solid var(--gold)}
.btn{padding:10px;border:none;border-radius:8px;cursor:pointer}
.btn-nav{background:var(--btn-blue);color:white}
.hidden{display:none!important}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:white;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}
</style>
</head>

<body>

<div id="loading">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
<p id="loadingText">Menyiapkan Soal...</p>
</div>

<div id="app-content">
<div class="header">
<div>
<b id="displayNama"></b><br>
<small id="displayKelas"></small>
</div>
<div class="timer" id="timerDisplay">00:00:00</div>
</div>

<div class="main-layout">
<div class="quiz-container"><div id="quizArea"></div></div>

<div class="sidebar">
<div style="background:white;padding:15px;border-radius:15px;">
<h4>Nomor Soal</h4>
<div id="gridNomor" class="grid-nomor"></div>
<button class="btn" style="background:var(--success);color:white;width:100%" onclick="kirimJawaban()">SELESAI</button>
</div>
</div>
</div>

<div class="footer-nav">
<button class="btn btn-nav" onclick="changeSoal(-1)">Prev</button>
<div id="infoHalaman"></div>
<button class="btn btn-nav" onclick="changeSoal(1)">Next</button>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec";
const API_SOAL = "https://script.google.com/macros/s/AKfycbzTacoBkA6md69TmVNi-uCwtXoUzu15_YlBfwmYqzpHGha_ad-nKnMAPD0c7VkG42Q/exec";

let listSoal = [];
let jawabanSiswa = {};
let currentIdx = 0;
let userSession = JSON.parse(localStorage.getItem("user"));

window.onload = () => {
    if (!userSession) return alert("Session habis!");
    displayNama.innerText = userSession.nama;
    displayKelas.innerText = "Kelas " + userSession.kelas;
    loadSoal();
};

async function loadSoal() {
    const res = await fetch(API_SOAL + "?mode=getSoal");
    listSoal = await res.json();
    renderSoal();
    loading.style.display = "none";
}

function renderSoal() {
    const s = listSoal[currentIdx];
    infoHalaman.innerText = `Soal ${currentIdx+1}/${listSoal.length}`;
    
    quizArea.innerHTML = `
    <div class="soal-card">
    <b>${currentIdx+1}. ${s.pertanyaan}</b>
    ${['A','B','C','D','E'].map(k=>{
        if(!s.opsi[k]) return '';
        return `<div class="opsi ${jawabanSiswa[s.no]==k?'selected':''}" onclick="pilih('${s.no}','${k}')">${k}. ${s.opsi[k]}</div>`;
    }).join('')}
    </div>`;
    renderGrid();
}

function pilih(no,k){ jawabanSiswa[no]=k; renderSoal(); }

function renderGrid(){
gridNomor.innerHTML=listSoal.map((s,i)=>`
<div class="kotak-nomor ${jawabanSiswa[s.no]?'sudah':''}" onclick="currentIdx=${i};renderSoal()">${i+1}</div>
`).join('');
}

function changeSoal(d){currentIdx+=d;renderSoal();}

async function kirimJawaban(){
loading.style.display="flex";
loadingText.innerText="Mengirim...";

try{
const res = await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
action:"kirimJawaban",
idLogin:userSession.idLogin,
nama:userSession.nama,
kelas:userSession.kelas,
jawaban:jawabanSiswa
})
});

// 🔥 DEBUG WAJIB
const text = await res.text();
console.log("RAW:", text);

let result;
try{
result = JSON.parse(text);
}catch(e){
alert("❌ Response bukan JSON:\n"+text);
return;
}

if(result.status==="success"){
alert("✅ Berhasil! Nilai: "+result.nilai);
}else{
alert("❌ Error server: "+result.msg);
}

}catch(e){
console.error(e);
alert("❌ Gagal koneksi ke server!");
}
}

</script>
</body>
</html>
