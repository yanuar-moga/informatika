<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Asesmen</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  margin: 0;
}

/* LOGIN */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #f2f2f2;
  padding: 28px;
  border-radius: 16px;
  width: 330px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

h2 {
  color: #1f4e94;
  margin-bottom: 15px;
}

/* FORM */
.form-group {
  text-align: left;
  margin-top: 12px;
}

label {
  font-size: 14px;
  display: block;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* CHECKBOX RAPI */
.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
}

.checkbox input {
  width: auto;
}

.checkbox label {
  margin: 0;
  cursor: pointer;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.btn-login {
  background:#1f4e94;
  color:#fff;
}

.btn-login:hover {
  background:#163c73;
}

.btn-jadwal {
  background:#d9534f;
  color:#fff;
}

.btn-jadwal:hover {
  background:#c9302c;
}

#msg {
  margin-top: 10px;
  font-size: 14px;
}

/* DASHBOARD */
#dashboard {
  display: none;
}

.header {
  background: #1f4e94;
  color: white;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header button {
  width: auto;
  padding: 8px 14px;
  background: #fff;
  color: #1f4e94;
}

.content {
  padding: 20px;
}

.box {
  background: white;
  padding: 18px;
  border-radius: 10px;
  line-height: 1.6;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5);
}

.modal-content {
  background:white;
  margin:10% auto;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:10px;
}

table {
  width:100%;
  border-collapse: collapse;
  margin-top:10px;
}

th,td {
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
<div class="card">

<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="logo">
<h2>Aplikasi Login Siswa</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelas"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Masukkan Password">
</div>

<div class="checkbox">
  <input type="checkbox" id="showPass" onclick="togglePassword()">
  <label for="showPass">Tampilkan Password</label>
</div>

<div class="form-group">
<label>Token</label>
<input type="text" id="token" placeholder="Masukkan Token">
</div>

<button class="btn-login" onclick="login()">Masuk</button>
<button class="btn-jadwal" onclick="openModal()">Lihat Jadwal</button>

<p id="msg"></p>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="header">
<div>
<b id="namaHeader"></b><br>
<span id="kelasHeader"></span>
</div>
<button onclick="logout()">Keluar</button>
</div>

<div class="content">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="logo">

<h2>Selamat Datang</h2>
<p id="tanggal"></p>

<div class="box">
<p>Nama : <b id="nama"></b></p>
<p>Kelas : <b id="kelasUser"></b></p>

<hr>

<p><b>Informasi Ujian:</b></p>
<ul>
<li>Jumlah soal: 40</li>
<li>Pilihan ganda: 35</li>
<li>Essay: 5</li>
<li>Durasi: 90 menit</li>
</ul>

<p><b>Penting:</b></p>
<ul>
<li>Dilarang keluar aplikasi</li>
<li>Jangan refresh saat ujian</li>
<li>Kerjakan dengan jujur</li>
</ul>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">
<h3>Jadwal Token</h3>
<table>
<thead>
<tr>
<th>Kelas</th>
<th>Mulai</th>
<th>Selesai</th>
</tr>
</thead>
<tbody id="jadwalBody"></tbody>
</table>
<button onclick="closeModal()">Tutup</button>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxem9pXDrxnWLm_BpcVbqOicnzYEaQa6xJW9uL4ewdKT_hmGtVVvwubQpd46IDKGYJ0/exec";

let siswaData = [];
let ip = "";
let userAgent = navigator.userAgent;

fetch("https://api.ipify.org?format=json")
.then(res=>res.json())
.then(d=>ip=d.ip);

fetch(API_URL)
.then(res=>res.json())
.then(data=>{
  siswaData=data;

  let kelasSet=new Set();
  data.forEach(s=>kelasSet.add(s.kelas));

  let k=document.getElementById("kelas");
  k.innerHTML='<option value="">-- Pilih Kelas --</option>';

  kelasSet.forEach(v=>{
    let o=document.createElement("option");
    o.value=v;
    o.text=v;
    k.appendChild(o);
  });
});

document.getElementById("kelas").addEventListener("change",function(){
  let kelas=this.value;
  let u=document.getElementById("username");

  u.innerHTML='<option value="">-- Pilih Siswa --</option>';

  siswaData.filter(s=>s.kelas===kelas)
  .forEach(s=>{
    let o=document.createElement("option");
    o.value=s.username;
    o.text=s.nama;
    u.appendChild(o);
  });
});

function togglePassword(){
  let p=document.getElementById("password");
  p.type=p.type==="password"?"text":"password";
}

function login(){
  const data={
    username:username.value,
    password:password.value,
    token:token.value,
    ip:ip,
    userAgent:userAgent
  };

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="success"){
      localStorage.setItem("user",JSON.stringify(res));
      showDashboard(res);
    }else{
      msg.innerText=res.msg;
      msg.style.color="red";
    }
  });
}

function showDashboard(user){
  loginPage.style.display="none";
  dashboard.style.display="block";

  nama.innerText=user.nama;
  kelasUser.innerText=user.kelas;
  namaHeader.innerText=user.nama;
  kelasHeader.innerText=user.kelas;

  setTanggal();
}

function setTanggal(){
  const now=new Date();
  const hari=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  tanggal.innerText=
    hari[now.getDay()]+", "+
    now.getDate()+" "+
    bulan[now.getMonth()]+" "+
    now.getFullYear();
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}

window.onload=function(){
  let user=localStorage.getItem("user");
  if(user){
    showDashboard(JSON.parse(user));
  }
};

function openModal(){
  modal.style.display="block";
  loadJadwal();
}

function closeModal(){
  modal.style.display="none";
}

function loadJadwal(){
  fetch(API_URL+"?mode=token")
  .then(r=>r.json())
  .then(data=>{
    jadwalBody.innerHTML="";
    data.forEach(d=>{
      jadwalBody.innerHTML+=`
      <tr>
      <td>${d.kelas}</td>
      <td>${d.mulai}</td>
      <td>${d.selesai}</td>
      </tr>`;
    });
  });
}
</script>

</body>
</html>
