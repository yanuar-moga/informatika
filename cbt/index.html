<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Asesmen</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: #f2f2f2;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

h2 {
  color: #1f4e94;
  margin-bottom: 20px;
}

label {
  display: block;
  text-align: left;
  margin-top: 10px;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

.checkbox {
  display: flex;
  align-items: center;
  margin-top: 8px;
  font-size: 13px;
}

.checkbox input {
  width: auto;
  margin-right: 8px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn-login {
  background: #1f4e94;
  color: white;
}

.btn-login:hover {
  background: #163c73;
}

.btn-jadwal {
  background: #d9534f;
  color: white;
}

.btn-jadwal:hover {
  background: #c9302c;
}

#msg {
  margin-top: 10px;
  font-size: 14px;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  color: #666;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.modal-content {
  background: #fff;
  margin: 10% auto;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border-radius: 10px;
}

.close {
  float: right;
  font-size: 20px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #ccc;
  padding: 6px;
  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>

<div class="card">
  <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="logo">

  <h2>Aplikasi Login Siswa</h2>

  <!-- KELAS -->
  <label>Kelas</label>
  <select id="kelas">
    <option value="">-- Pilih Kelas --</option>
  </select>

  <!-- USERNAME -->
  <label>Username</label>
  <select id="username">
    <option value="">-- Pilih Siswa --</option>
  </select>

  <!-- PASSWORD -->
  <label>Password</label>
  <input type="password" id="password" placeholder="Masukkan Password">

  <!-- CHECKBOX -->
  <div class="checkbox">
    <input type="checkbox" onclick="togglePassword()">
    Tampilkan Password
  </div>

  <!-- TOKEN -->
  <label>Token</label>
  <input type="text" id="token" placeholder="Masukkan Token">

  <!-- BUTTON -->
  <button class="btn-login" onclick="login()">Masuk</button>
  <button class="btn-jadwal" onclick="openModal()">Lihat Jadwal Token</button>

  <p id="msg"></p>

  <div class="footer">
    © 2026 MB All Rights Reserved
  </div>
</div>

<!-- MODAL -->
<div id="modalJadwal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Jadwal Token</h3>

    <table>
      <thead>
        <tr>
          <th>Kelas</th>
          <th>Mulai</th>
          <th>Selesai</th>
        </tr>
      </thead>
      <tbody id="jadwalBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxem9pXDrxnWLm_BpcVbqOicnzYEaQa6xJW9uL4ewdKT_hmGtVVvwubQpd46IDKGYJ0/exec";

let siswaData = [];
let ip = "";
let userAgent = navigator.userAgent;

// ambil IP
fetch("https://api.ipify.org?format=json")
  .then(res => res.json())
  .then(data => ip = data.ip);

// ambil siswa
fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    siswaData = data;

    let kelasSet = new Set();
    data.forEach(s => kelasSet.add(s.kelas));

    let kelasSelect = document.getElementById("kelas");

    kelasSet.forEach(k => {
      let opt = document.createElement("option");
      opt.value = k;
      opt.text = k;
      kelasSelect.appendChild(opt);
    });
  });

// filter username
document.getElementById("kelas").addEventListener("change", function() {
  let kelas = this.value;
  let usernameSelect = document.getElementById("username");

  usernameSelect.innerHTML = '<option value="">-- Pilih Siswa --</option>';

  siswaData
    .filter(s => s.kelas === kelas)
    .forEach(s => {
      let opt = document.createElement("option");
      opt.value = s.username;
      opt.text = s.nama;
      usernameSelect.appendChild(opt);
    });
});

// toggle password
function togglePassword() {
  let pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

// login
function login() {
  const data = {
    username: document.getElementById("username").value,
    password: document.getElementById("password").value,
    token: document.getElementById("token").value,
    ip: ip,
    userAgent: userAgent
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    let msg = document.getElementById("msg");

    if (res.status === "success") {
      msg.style.color = "green";
      msg.innerText = "Login berhasil: " + res.nama;

      // 🔥 nanti di sini bisa redirect / dashboard
      // window.location.href = "dashboard.html";
    } else {
      msg.style.color = "red";
      msg.innerText = res.msg;
    }
  })
  .catch(() => {
    document.getElementById("msg").innerText = "Server error";
  });
}

// modal
function openModal() {
  document.getElementById("modalJadwal").style.display = "block";
  loadJadwal();
}

function closeModal() {
  document.getElementById("modalJadwal").style.display = "none";
}

// jadwal
function loadJadwal() {
  fetch(API_URL + "?mode=token")
    .then(res => res.json())
    .then(data => {
      let tbody = document.getElementById("jadwalBody");
      tbody.innerHTML = "";

      data.forEach(d => {
        tbody.innerHTML += `
          <tr>
            <td>${d.kelas}</td>
            <td>${d.mulai}</td>
            <td>${d.selesai}</td>
          </tr>
        `;
      });
    });
}
</script>

</body>
</html>
