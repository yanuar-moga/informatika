<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Asesmen Informatika</title>

<style>
/* === CSS ASLI KAMU (TIDAK DIUBAH SAMA SEKALI) === */
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  margin: 0;
}

.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #f2f2f2;
  padding: 30px;
  border-radius: 15px;
  width: 340px; 
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  box-sizing: border-box;
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

h2 {
  color: #1f4e94;
  margin-bottom: 20px;
}

label {
  display: block;
  text-align: left;
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
  color: #333;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box; 
  font-size: 14px;
}

.checkbox-container {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  cursor: pointer;
}

.checkbox-container input {
  width: auto;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn-login { background:#1f4e94; color:white; }
.btn-jadwal { background:#d9534f; color:white; }
.btn-start { background:#ff5722; color:white; }

.logout-btn {
  margin-top:5px;
  background:#ff5722;
  color:white;
  padding:6px 12px;
  border-radius:6px;
}

#dashboard { display:none; }

.header {
  background:#1f4e94;
  color:white;
  padding:15px;
  display:flex;
  justify-content:flex-end;
}

.content {
  text-align:center;
  padding:20px;
}

.title {
  font-size:24px;
  color:#1f4e94;
  font-weight:bold;
}

.box {
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:700px;
  margin:20px auto;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <div class="card">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="logo">
    <h2>CBT Asesmen Informatika</h2>

    <label>Kelas</label>
    <select id="kelas"><option value="">-- Pilih Kelas --</option></select>

    <label>Username</label>
    <select id="username"><option value="">-- Pilih Siswa --</option></select>

    <label>Password</label>
    <input type="password" id="password">

    <div class="checkbox-container">
      <input type="checkbox" onclick="togglePassword()"> Tampilkan Password
    </div>

    <label>Token</label>
    <input type="text" id="token">

    <button class="btn-login" onclick="login()">Masuk</button>
    <button class="btn-jadwal" onclick="openModal()">Lihat Jadwal</button>

    <p id="msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="header">
    <div>
      <b id="namaHeader"></b><br>
      <span id="kelasHeader"></span>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="content">
    <div class="title">Asesmen CBT Informatika</div>

    <div class="box">
      <p>Nama : <b id="nama"></b></p>
      <p>Kelas : <b id="kelasUser"></b></p>

      <button class="btn-start" onclick="openConfirm()">Kerjakan Ujian</button>
    </div>
  </div>
</div>

<!-- POPUP KONFIRMASI (ASLI TETAP) -->
<div id="confirmModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);justify-content:center;align-items:center;">
  <div style="background:#fff;padding:25px;border-radius:12px;width:300px;text-align:center;">
    <h3>Konfirmasi Jawaban</h3>
    <p>Apa kamu yakin dengan jawabanmu?</p>

    <div class="checkbox-container" style="justify-content:center;">
      <input type="checkbox" id="checkData">
      <label>Saya yakin jawaban sudah benar</label>
    </div>

    <button onclick="closeConfirm()">Batal</button>
    <button onclick="lanjutUjian()">Kirim</button>
  </div>
</div>

<!-- 🔥 POPUP ALERT BARU -->
<div id="alertPopup" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.2);
backdrop-filter:blur(3px);
z-index:9999;
">
  <div style="
    background:white;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:320px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
  ">
    <h3 style="color:#1f4e94;">Informasi</h3>
    <p id="alertText"></p>

    <button onclick="tutupAlert()" style="
      background:#1f4e94;
      color:white;
      padding:10px 20px;
      border:none;
      border-radius:10px;
    ">OK</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec";

let siswaData = [];

/* ALERT CUSTOM */
function tampilAlert(pesan){
  document.getElementById("alertText").innerText = pesan;
  document.getElementById("alertPopup").style.display = "flex";
}
function tutupAlert(){
  document.getElementById("alertPopup").style.display = "none";
}

/* PASSWORD */
function togglePassword(){
  let p=document.getElementById("password");
  p.type = p.type==="password"?"text":"password";
}

/* LOAD DATA */
fetch(API_URL)
.then(res=>res.json())
.then(data=>{
  siswaData=data;
  let setKelas=new Set();
  data.forEach(s=>setKelas.add(s.kelas));

  setKelas.forEach(k=>{
    document.getElementById("kelas").innerHTML+=`<option value="${k}">${k}</option>`;
  });
});

/* FILTER NAMA */
document.getElementById("kelas").onchange=function(){
  let userSelect=document.getElementById("username");
  userSelect.innerHTML="<option value=''>-- Pilih Siswa --</option>";

  siswaData.filter(s=>s.kelas===this.value)
  .forEach(s=>{
    userSelect.innerHTML+=`<option value="${s.username}">${s.nama}</option>`;
  });
};

/* LOGIN */
function login(){
  let user=document.getElementById("username").value;
  let pass=document.getElementById("password").value;
  let token=document.getElementById("token").value;

  if(!user||!pass||!token){
    tampilAlert("Lengkapi semua data!");
    return;
  }

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({username:user,password:pass,token:token})
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="success"){
      localStorage.setItem("user",JSON.stringify(res));
      showDashboard(res);
    }else{
      tampilAlert(res.msg);
    }
  });
}

/* DASHBOARD */
function showDashboard(user){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").style.display="block";

  document.getElementById("nama").innerText=user.nama;
  document.getElementById("kelasUser").innerText=user.kelas;
  document.getElementById("namaHeader").innerText=user.nama;
  document.getElementById("kelasHeader").innerText=user.kelas;
}

/* KONFIRMASI */
function openConfirm(){
  document.getElementById("confirmModal").style.display="flex";
}
function closeConfirm(){
  document.getElementById("confirmModal").style.display="none";
}
function lanjutUjian(){
  if(!document.getElementById("checkData").checked){
    tampilAlert("Centang dulu konfirmasi!");
    return;
  }
  window.location.href="HALAMAN_SOAL_CBT.html";
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
