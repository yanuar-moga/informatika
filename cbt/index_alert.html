<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Asesmen Informatika</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  margin: 0;
}

/* ================= LOGIN ================= */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #ffffff;
  padding: 30px;
  border-radius: 15px;
  width: 340px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

h2 {
  color: #2563eb;
}

label {
  display: block;
  text-align: left;
  margin-top: 10px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.checkbox-container {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn-login { background:#2563eb; color:white; }
.btn-login:hover { background:#1e40af; }

.btn-jadwal { background:#ef4444; color:white; }
.btn-start { background:#f97316; color:white; }

.logout-btn {
  background:#ef4444;
  color:white;
  padding:6px 12px;
}

/* ================= DASHBOARD ================= */
#dashboard { display:none; }

.header {
  background:#2563eb;
  color:white;
  padding:15px;
  display:flex;
  justify-content:flex-end;
}

.content {
  text-align:center;
  padding:20px;
}

.title {
  font-size:24px;
  color:#2563eb;
  font-weight:bold;
}

.box {
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:700px;
  margin:20px auto;
}

/* ================= POPUP ALERT ================= */
.popup {
  position: fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.25);
  backdrop-filter: blur(3px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.popup-box {
  background:white;
  padding:25px;
  border-radius:16px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.popup-box h3 {
  color:#2563eb;
  margin-bottom:10px;
}

.popup-box p {
  margin:10px 0;
}

.popup-buttons {
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn-blue {
  background:#2563eb;
  color:white;
}

.btn-orange {
  background:#f97316;
  color:white;
}

.btn-red {
  background:#ef4444;
  color:white;
}

/* ================= ANIMASI ================= */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(-20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <div class="card">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" class="logo">
    <h2>CBT Asesmen Informatika</h2>

    <label>Kelas</label>
    <select id="kelas"></select>

    <label>Username</label>
    <select id="username"></select>

    <label>Password</label>
    <input type="password" id="password">

    <div class="checkbox-container">
      <input type="checkbox" onclick="togglePassword()"> Tampilkan Password
    </div>

    <label>Token</label>
    <input type="text" id="token">

    <button class="btn-login" onclick="login()">Masuk</button>
    <button class="btn-jadwal" onclick="openModal()">Lihat Jadwal</button>

    <p id="msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="header">
    <div>
      <b id="namaHeader"></b><br>
      <span id="kelasHeader"></span><br>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="content">
    <div class="title">Asesmen CBT Informatika</div>

    <div class="box">
      <p>Nama : <b id="nama"></b></p>
      <p>Kelas : <b id="kelasUser"></b></p>

      <button class="btn-start" onclick="openConfirm()">Kerjakan Ujian</button>
    </div>
  </div>
</div>

<!-- POPUP KONFIRMASI -->
<div id="confirmPopup" class="popup">
  <div class="popup-box">
    <h3>Konfirmasi Jawaban</h3>
    <p>Apa kamu yakin dengan jawabanmu?</p>

    <div class="checkbox-container">
      <input type="checkbox" id="checkData">
      <label>Saya yakin jawaban sudah benar</label>
    </div>

    <div class="popup-buttons">
      <button class="btn-blue" onclick="closeConfirm()">Batal</button>
      <button class="btn-orange" onclick="lanjutUjian()">Kirim</button>
    </div>
  </div>
</div>

<!-- POPUP ALERT CUSTOM -->
<div id="alertPopup" class="popup">
  <div class="popup-box">
    <h3 id="alertTitle">Informasi</h3>
    <p id="alertMsg"></p>

    <div class="popup-buttons">
      <button class="btn-red" onclick="closeAlert()">OK</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec";

let siswaData = [];

/* ================= ALERT CUSTOM ================= */
function showAlert(msg){
  document.getElementById("alertMsg").innerText = msg;
  document.getElementById("alertPopup").style.display = "flex";
}
function closeAlert(){
  document.getElementById("alertPopup").style.display = "none";
}

/* ================= PASSWORD ================= */
function togglePassword(){
  let p=document.getElementById("password");
  p.type = p.type==="password"?"text":"password";
}

/* ================= LOAD DATA ================= */
fetch(API_URL)
.then(res=>res.json())
.then(data=>{
  siswaData=data;
  let kelasSet=new Set();
  data.forEach(s=>kelasSet.add(s.kelas));
  kelasSet.forEach(k=>{
    kelas.innerHTML+=`<option value="${k}">${k}</option>`;
  });
});

kelas.onchange=function(){
  username.innerHTML="";
  siswaData.filter(s=>s.kelas===this.value)
  .forEach(s=>{
    username.innerHTML+=`<option value="${s.username}">${s.nama}</option>`;
  });
};

/* ================= LOGIN ================= */
function login(){
  let user=username.value;
  let pass=password.value;
  let token=document.getElementById("token").value;

  if(!user||!pass||!token){
    showAlert("Lengkapi semua data!");
    return;
  }

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({username:user,password:pass,token:token})
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="success"){
      localStorage.setItem("user",JSON.stringify(res));
      showDashboard(res);
    }else{
      showAlert(res.msg);
    }
  });
}

/* ================= DASHBOARD ================= */
function showDashboard(user){
  loginPage.style.display="none";
  dashboard.style.display="block";

  nama.innerText=user.nama;
  kelasUser.innerText=user.kelas;
  namaHeader.innerText=user.nama;
  kelasHeader.innerText=user.kelas;
}

/* ================= KONFIRMASI ================= */
function openConfirm(){
  confirmPopup.style.display="flex";
}
function closeConfirm(){
  confirmPopup.style.display="none";
}
function lanjutUjian(){
  if(!checkData.checked){
    showAlert("Centang dulu konfirmasi!");
    return;
  }
  window.location.href="HALAMAN_SOAL_CBT.html";
}

/* ================= LOGOUT ================= */
function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
