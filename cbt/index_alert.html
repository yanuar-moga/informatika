<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Asesmen Informatika</title>

    <style>
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--gold);
        }

        .timer { 
            background: white; 
            color: var(--primary-blue); 
            padding: 5px 15px; 
            border-radius: 20px;
            font-weight: bold;
        }

        .main-layout { 
            display: flex; 
            flex-direction: column; 
            max-width: 1100px; 
            margin: 20px auto; 
            gap: 20px; 
            padding: 0 15px 160px;
        }

        @media(min-width: 768px) { .main-layout { flex-direction: row; } }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-blue);
        }

        .opsi {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .opsi:hover { background: #f0f4f8; }
        .opsi.selected {
            background: #e1ecff;
            border-color: var(--btn-blue);
            font-weight: bold;
            color: var(--primary-blue);
        }

        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .kotak-nomor {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .kotak-nomor.sudah { background: var(--success); color: white; }
        .kotak-nomor.aktif { border: 3px solid var(--gold); transform: scale(1.1); }

        .nav-bottom {
            position: fixed; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between;
            background: white; padding: 10px 20px;
            border-top: 1px solid #eee;
        }

        .footer-info {
            position: fixed; bottom: 0; width: 100%;
            background: #222; color: #ccc;
            text-align: center; padding: 8px 0;
            font-size: 0.85em;
        }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-nav { background: var(--btn-blue); color: white; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:99999;
        }

        .modal-box {
            background:white;
            padding:25px;
            border-radius:15px;
            width:90%;
            max-width:400px;
            text-align:center;
        }

        .modal-title {
            font-weight:bold;
            font-size:1.2em;
            margin-bottom:10px;
        }

        .modal-actions {
            display:flex;
            gap:10px;
            margin-top:20px;
        }

        .btn-batal {
            flex:1;
            background: var(--btn-blue);
            color:white;
        }

        .btn-kirim {
            flex:1;
            background: var(--btn-red);
            color:white;
        }

        #layarHasil {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none;
            flex-direction: column; justify-content: center;
            align-items: center;
        }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
    </style>
</head>

<body>

<!-- MODAL -->
<div id="modalKonfirmasi" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">Konfirmasi Data</div>
        <div id="modalText">-</div>

        <div style="margin-top:10px;">
            <input type="checkbox" id="cekYakin"> Saya yakin data sudah benar
        </div>

        <div class="modal-actions">
            <button class="btn btn-batal" onclick="tutupModal()">Batal</button>
            <button class="btn btn-kirim" onclick="lanjutKirim()">Kirim</button>
        </div>
    </div>
</div>

<div id="loading">
    <p id="loadingText">Menghubungkan ke Server...</p>
</div>

<div id="layarHasil">
    <h2>Terima Kasih!</h2>
    <div id="nilaiFinal">0</div>
    <button onclick="logOutSiswa()">Keluar</button>
</div>

<div id="app-content">
    <div class="header">
        <div>
            <b id="displayNama">-</b><br>
            <small id="displayKelas">-</small>
        </div>
        <div class="timer" id="timerDisplay">00:00:00</div>
    </div>

    <div class="main-layout">
        <div class="quiz-container">
            <div id="quizArea"></div>
        </div>

        <div class="sidebar">
            <div style="background:white; padding:20px; border-radius:15px;">
                <h4>Navigasi Soal</h4>
                <div id="gridNomor" class="grid-nomor"></div>
                <button class="btn" style="background:green; color:white; width:100%;" onclick="kirimJawaban()">SELESAI</button>
            </div>
        </div>
    </div>

    <div class="nav-bottom">
        <button onclick="changeSoal(-1)">Sebelumnya</button>
        <div id="infoHalaman">Soal -/-</div>
        <button onclick="changeSoal(1)">Berikutnya</button>
    </div>

    <div class="footer-info">
         CBT Asesmen Informatika
    </div>
</div>

<script>
let listSoal = [];
let jawabanSiswa = {};
let currentIdx = 0;
let totalSoal = 0;

/* ===== MODAL FUNCTION ===== */
function kirimJawaban() {
    const jumlah = Object.keys(jawabanSiswa).length;
    totalSoal = listSoal.length;

    document.getElementById("modalText").innerText =
        `Anda menjawab ${jumlah}/${totalSoal} soal. Selesaikan ujian?`;

    document.getElementById("modalKonfirmasi").style.display = "flex";
}

function tutupModal() {
    document.getElementById("modalKonfirmasi").style.display = "none";
}

function lanjutKirim() {
    if (!document.getElementById("cekYakin").checked) {
        alert("Centang dulu bahwa data sudah benar!");
        return;
    }

    document.getElementById("modalKonfirmasi").style.display = "none";

    document.getElementById("loading").style.display = "flex";
    document.getElementById("loadingText").innerText = "Menghitung nilai...";

    setTimeout(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("app-content").style.display = "none";
        document.getElementById("layarHasil").style.display = "flex";
        document.getElementById("nilaiFinal").innerText = 80;
    }, 2000);
}

/* dummy function biar ga error */
function changeSoal(){}

function logOutSiswa(){
    location.reload();
}
</script>

</body>
</html>
