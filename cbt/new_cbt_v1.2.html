<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
}

body{
  margin:0;
  font-family:Arial;
  background:#b0bec5;
}

.header{
  background:#1976d2;
  color:#fff;
  padding:12px;
  display:none;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}

.wrap{
  display:flex;
  height:calc(100vh - 50px);
}

.sidebar{
  width:120px;
  background:#fff;
  padding:10px;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.num{
  padding:8px;
  background:#ddd;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.num.active{background:var(--blue);color:#fff}
.num.done{background:#4caf50;color:#fff}

.content{
  flex:1;
  padding:12px;
  overflow:auto;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

.btn{
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}

.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:300px;
  text-align:center;
}

.login-box{
  max-width:420px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
}

.form-group{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  margin-bottom:10px;
}

.row{
  display:flex;
  gap:10px;
}

.row .btn{
  flex:1;
}

@media(max-width:768px){
.wrap{flex-direction:column;}
.sidebar{width:100%;order:2;}
.grid{grid-template-columns:repeat(6,1fr);}
.content{order:1;}
.form-group{grid-template-columns:1fr;}
}
</style>
</head>

<body oncontextmenu="return false">

<div class="header">
<div>CBT SMPN 1 MOGA</div>
<div id="timer"></div>
</div>

<div id="app"></div>

<div id="modal" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<p id="mMsg"></p>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[];

/* ===== MODAL ===== */
function modal(t,m){
document.getElementById("mTitle").innerText=t;
document.getElementById("mMsg").innerText=m;
document.getElementById("modal").style.display="flex";
}
function modalHide(){
document.getElementById("modal").style.display="none";
}

/* ===== LOGIN UI ===== */
function loginUI(){

document.getElementById("app").innerHTML=`
<div class="login-box">

<h2 style="text-align:center">CBT Informatika</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelas"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label>Token</label>
<input id="token">
</div>

<div class="row">
<button class="btn blue" onclick="login()">Masuk</button>
</div>

</div>`;

/* LOAD SISWA */
fetch(API)
.then(r=>r.json())
.then(d=>{

if(!Array.isArray(d)){
modal("Error","Data siswa gagal load");
return;
}

dataSiswa=d;

let kelasList=[...new Set(d.map(x=>x.kelas))];

let kelasEl=document.getElementById("kelas");
kelasEl.innerHTML='<option value="">-- Pilih Kelas --</option>';

kelasList.forEach(k=>{
kelasEl.innerHTML+=`<option value="${k}">${k}</option>`;
});

/* EVENT CHANGE */
kelasEl.addEventListener("change",loadSiswa);

});
}

/* ===== LOAD USERNAME ===== */
function loadSiswa(){

let kelas=document.getElementById("kelas").value;
let userEl=document.getElementById("username");

userEl.innerHTML='<option value="">-- Pilih Username --</option>';

let hasil=dataSiswa.filter(x=>x.kelas==kelas);

hasil.forEach(s=>{
userEl.innerHTML+=`<option value="${s.username}">${s.nama}</option>`;
});
}

/* ===== LOGIN ===== */
function login(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;
let token=document.getElementById("token").value;

if(!username) return modal("Error","Username belum dipilih");
if(!token) return modal("Error","Token wajib diisi");

fetch(API,{
method:"POST",
body:JSON.stringify({
mode:"login",
username:username,
password:password,
token:token
})
})
.then(r=>r.json())
.then(res=>{
if(res.status=="success"){
alert("Login sukses");
}else{
modal("Login gagal",res.msg);
}
})
.catch(e=>{
modal("Error",e.toString());
});
}

/* INIT */
loginUI();
</script>

</body>
</html>
