<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{--blue:#1976d2;--red:#d32f2f}
body{margin:0;font-family:Arial;background:#b0bec5}
.header{background:#1976d2;color:#fff;padding:12px;display:none;justify-content:space-between}
.wrap{display:flex;height:calc(100vh - 50px)}
.sidebar{width:120px;background:#fff;padding:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.num{padding:6px;background:#ddd;text-align:center;border-radius:5px;cursor:pointer}
.num.active{background:#1976d2;color:#fff}
.num.done{background:#4caf50;color:#fff}
.content{flex:1;padding:10px}
.card{background:#fff;padding:15px;border-radius:10px}
.btn{padding:10px;border:none;border-radius:6px;margin-top:10px;cursor:pointer}
.blue{background:#1976d2;color:#fff}
.red{background:#d32f2f;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
.box{background:#fff;padding:20px;border-radius:10px;width:300px;text-align:center}
</style>
</head>

<body oncontextmenu="return false">

<div class="header">
<div>CBT SMPN 1 MOGA</div>
<div id="timer"></div>
</div>

<div id="app"></div>

<div id="modal" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<p id="mMsg"></p>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[],dataToken=[];
let state={soal:[],index:0,jawaban:[],done:false};
let warning=0;

/* ===== MODAL ===== */
function modal(t,m,btns){
mTitle.innerText=t;
mMsg.innerText=m;
mAct.innerHTML="";
btns.forEach(b=>{
let x=document.createElement("button");
x.className="btn "+b.cls;
x.innerText=b.text;
x.onclick=()=>{modalHide();if(b.cb)b.cb()};
mAct.appendChild(x);
});
modal.style.display="flex";
}
function modalHide(){modal.style.display="none"}

/* ===== LOGIN ===== */
function loginUI(){
app.innerHTML=`
<div style="max-width:380px;margin:40px auto;background:#fff;padding:25px;border-radius:20px">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" style="width:80px;display:block;margin:auto">
<h2 style="text-align:center;color:#1e4f8a">CBT Asesmen<br>Informatika</h2>

<label>Kelas</label>
<select id=kelas onchange="loadSiswa()"></select>

<label>Username</label>
<select id=username></select>

<label>Password</label>
<input type=password id=password>

<label><input type=checkbox onclick="password.type=password.type=='password'?'text':'password'"> Tampilkan</label>

<label>Token</label>
<input id=token>

<button class="btn blue" onclick="login()">Masuk</button>
<button class="btn red" onclick="jadwal()">Jadwal</button>
</div>`;

fetch(API).then(r=>r.json()).then(d=>{
dataSiswa=d;
let k=[...new Set(d.map(x=>x.kelas))];
kelas.innerHTML='<option>-- Pilih Kelas --</option>';
k.forEach(x=>kelas.innerHTML+=`<option>${x}</option>`);
});

fetch(API+"?mode=token").then(r=>r.json()).then(d=>dataToken=d);
}

function loadSiswa(){
username.innerHTML='<option>-- Pilih --</option>';
dataSiswa.filter(x=>x.kelas==kelas.value)
.forEach(s=>username.innerHTML+=`<option value="${s.username}">${s.nama}</option>`);
}

function login(){
modal("Login","Memproses...",[]);
fetch(API,{
method:"POST",
body:JSON.stringify({
mode:"login",
username:username.value,
password:password.value||"",
token:token.value
})
})
.then(r=>r.json())
.then(res=>{
modalHide();
if(res.status=="success"){
localStorage.setItem("user",JSON.stringify(res));
startExam();
}else modal("Error",res.msg,[{text:"OK",cls:"red"}]);
});
}

/* ===== CBT ===== */
function startExam(){
document.querySelector(".header").style.display="flex";
enterFullscreen();

fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{
state.soal=d;

// 🔥 LOAD JAWABAN DARI LOCAL
let saved = localStorage.getItem("jawaban");
state.jawaban = saved ? JSON.parse(saved) : new Array(d.length).fill("");

render();
timer(1800);
});
}

function render(){
let side='<div class=sidebar><div class=grid>';
state.soal.forEach((s,i)=>{
let c="num";
if(i==state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});
side+='</div></div>';

let s=state.soal[state.index];
let main=`<div class=content><div class=card>
<h4>Soal ${state.index+1}</h4>
<p>${s.soal}</p>
${s.gambar?`<img src="${s.gambar}" width=100%>`:""}`;

["A","B","C","D"].forEach(o=>{
main+=`<div>
<input type=radio name=o
${state.jawaban[state.index]==o?"checked":""}
onchange="jawab('${o}')"> ${o}. ${s.pilihan[o]}
</div>`;
});

main+=`<button onclick=prev()>Prev</button>
<button onclick=next()>Next</button>
<button class="btn red" onclick=submit()>Kirim</button>
</div></div>`;

app.innerHTML=`<div class=wrap>${side}${main}</div>`;
}

function jawab(v){
state.jawaban[state.index]=v;

// 🔥 SIMPAN LOCAL
localStorage.setItem("jawaban",JSON.stringify(state.jawaban));

render();
}

function next(){if(state.index<state.soal.length-1){state.index++;render()}}
function prev(){if(state.index>0){state.index--;render()}}
function goto(i){state.index=i;render()}

/* ===== TIMER ===== */
function timer(s){
setInterval(()=>{
s--;
timer.innerText=Math.floor(s/60)+":"+("0"+s%60).slice(-2);
if(s<=0)submit();
},1000);
}

/* ===== SUBMIT ===== */
function submit(){
if(state.done)return;
state.done=true;

let u=JSON.parse(localStorage.getItem("user"));

fetch(API,{
method:"POST",
body:JSON.stringify({
mode:"submit",
idLogin:u.idLogin,
nama:u.nama,
jk:u.jk,
kelas:u.kelas,
jawaban:state.jawaban
})
})
.then(r=>r.json())
.then(res=>{

// 🔥 HAPUS LOCAL STORAGE
localStorage.removeItem("jawaban");

modal("Selesai","Nilai: "+res.nilai,[{
text:"OK",
cls:"blue",
cb:()=>location.reload()
}]);
});
}

/* ===== ANTI NYONTEK ===== */
document.addEventListener("visibilitychange",()=>{
if(document.hidden){
warning++;
if(warning>=3){
modal("Dikeluarkan","Anda keluar ujian!",[{text:"OK",cls:"red",cb:submit}]);
}else{
modal("Peringatan","Jangan pindah tab!",[{text:"OK",cls:"blue"}]);
}
}
});

/* ===== FULLSCREEN ===== */
function enterFullscreen(){
let el=document.documentElement;
if(el.requestFullscreen)el.requestFullscreen();
}

/* ===== BLOK INSPECT ===== */
document.onkeydown=function(e){
if(e.key==="F12"||e.ctrlKey&&e.key==="u") return false;
}

/* ===== JADWAL ===== */
function jadwal(){
let t="";
dataToken.forEach(x=>t+=x.kelas+" "+x.mulai+"-"+x.selesai+"\n");
modal("Jadwal",t,[{text:"OK",cls:"blue"}]);
}

/* INIT */
loginUI();
</script>

</body>
</html>
