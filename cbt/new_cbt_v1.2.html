<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
}

body{
  margin:0;
  font-family:Arial;
  background:#b0bec5;
}

/* HEADER */
.header{
  background:#1976d2;
  color:#fff;
  padding:12px;
  display:none;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}

/* FOOTER NORMAL */
.footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#263238;
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:13px;
  z-index:999;
  transition:all .3s ease;
}

/* FOOTER SAAT UJIAN (KECIL) */
.footer.small{
  padding:4px;
  font-size:10px;
  opacity:.85;
}

/* BIAR GA KETUTUP */
.wrap,
.login-box{
  margin-bottom:60px;
}

/* LAYOUT */
.wrap{
  display:flex;
  height:calc(100vh - 50px);
}

.sidebar{
  width:120px;
  background:#fff;
  padding:10px;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.num{
  padding:8px;
  background:#ddd;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.num.active{background:var(--blue);color:#fff}
.num.done{background:#4caf50;color:#fff}

.content{
  flex:1;
  padding:12px;
  overflow:auto;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.btn{
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
  font-size:14px;
}

.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:350px;
  max-height:80vh;
  overflow:auto;
  text-align:center;
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}

.table th,
.table td{
  border:1px solid #ccc;
  padding:6px;
}

.table th{
  background:#1976d2;
  color:#fff;
}

/* LOGIN */
.login-box{
  max-width:420px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.form-group{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  margin-bottom:10px;
  align-items:center;
}

.form-group input,
.form-group select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

.row{
  display:flex;
  gap:10px;
}

.row .btn{
  flex:1;
}

@media(max-width:768px){
.wrap{flex-direction:column;}
.sidebar{width:100%;order:2;}
.grid{grid-template-columns:repeat(6,1fr);}
.content{order:1;}
.form-group{grid-template-columns:1fr;}
.header{font-size:12px;}
}
</style>
</head>

<body oncontextmenu="return false">

<div class="header">
<div>CBT SMPN 1 MOGA</div>
<div id="timer"></div>
</div>

<div id="app"></div>

<!-- FOOTER -->
<div class="footer" id="footer">
CBT Browser Apps by MB<br>
© 2026 MB All Rights Reserved
</div>

<div id="modal" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<div id="mMsg"></div>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[],dataToken=[];
let state={soal:[],index:0,jawaban:[],done:false};
let warning=0;

/* MODAL */
function modal(t,m,btns){
document.getElementById("mTitle").innerText=t;
document.getElementById("mMsg").innerHTML=m;

const act=document.getElementById("mAct");
act.innerHTML="";

btns.forEach(b=>{
let x=document.createElement("button");
x.className="btn "+b.cls;
x.innerText=b.text;
x.onclick=()=>{modalHide();if(b.cb)b.cb()};
act.appendChild(x);
});

document.getElementById("modal").style.display="flex";
}

function modalHide(){
document.getElementById("modal").style.display="none";
}

/* LOGIN UI */
function loginUI(){
document.getElementById("app").innerHTML=`
<div class="login-box">

<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" 
style="width:80px;display:block;margin:auto">

<h2 style="text-align:center;color:#1e4f8a">
CBT Asesmen<br>Informatika
</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelas" onchange="loadSiswa()"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label></label>
<div>
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</div>
</div>

<div class="form-group">
<label>Token</label>
<input id="token">
</div>

<div class="row">
<button class="btn blue" onclick="login()">Masuk</button>
<button class="btn red" onclick="jadwal()">Jadwal</button>
</div>

</div>`;

fetch(API).then(r=>r.json()).then(d=>{
dataSiswa=d;
let k=[...new Set(d.map(x=>x.kelas))];
let el=document.getElementById("kelas");
el.innerHTML='<option>-- Pilih Kelas --</option>';
k.forEach(x=>el.innerHTML+=`<option>${x}</option>`);
});

fetch(API+"?mode=token")
.then(r=>r.json())
.then(d=>dataToken=d);
}

/* JADWAL */
function jadwal(){
let html=`
<table class="table">
<tr>
<th>Kelas</th>
<th>Mulai</th>
<th>Selesai</th>
<th>Token</th>
</tr>`;
dataToken.forEach(x=>{
html+=`
<tr>
<td>${x.kelas}</td>
<td>${x.mulai}</td>
<td>${x.selesai}</td>
<td>${x.token || "-"}</td>
</tr>`;
});
html+=`</table>`;
modal("Jadwal Ujian",html,[{text:"OK",cls:"blue"}]);
}

/* LOGIN */
function login(){
let kelas=document.getElementById("kelas").value;
let username=document.getElementById("username").value;
let token=document.getElementById("token").value;

if(!kelas || kelas.includes("Pilih")){
return modal("Error","Pilih kelas dulu",[ {text:"OK",cls:"red"} ]);
}

if(!username){
return modal("Error","Pilih username dulu",[ {text:"OK",cls:"red"} ]);
}

if(!token){
return modal("Error","Token wajib diisi",[ {text:"OK",cls:"red"} ]);
}

modal("Login","Memproses...",[]);

fetch(API,{
method:"POST",
body:JSON.stringify({mode:"login",username,token})
})
.then(r=>r.json())
.then(res=>{
modalHide();
if(res.status=="success"){
localStorage.setItem("user",JSON.stringify(res));
startExam();
}else{
modal("Gagal Login",res.msg,[{text:"OK",cls:"red"}]);
}
});
}

/* START CBT */
function startExam(){
document.querySelector(".header").style.display="flex";

/* 🔥 KECILKAN FOOTER */
document.getElementById("footer").classList.add("small");

fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{
state.soal=d;
state.jawaban=new Array(d.length).fill("");
render();
startTimer(1800);
});
}

/* RENDER */
function render(){
let side='<div class="sidebar"><div class="grid">';
state.soal.forEach((s,i)=>{
let c="num";
if(i==state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});
side+='</div></div>';

let s=state.soal[state.index];

let main=`<div class="content"><div class="card">
<h4>Soal ${state.index+1}</h4>
<p>${s.soal}</p>`;

["A","B","C","D"].forEach(o=>{
main+=`
<div>
<input type="radio" name="o"
${state.jawaban[state.index]==o?"checked":""}
onchange="jawab('${o}')"> ${o}. ${s.pilihan[o]}
</div>`;
});

main+=`
<button class="btn" onclick="prev()">Prev</button>
<button class="btn blue" onclick="next()">Next</button>
<button class="btn red" onclick="submit()">Kirim</button>
</div></div>`;

document.getElementById("app").innerHTML=`<div class="wrap">${side}${main}</div>`;
}

function jawab(v){
state.jawaban[state.index]=v;
render();
}

function next(){if(state.index<state.soal.length-1){state.index++;render();}}
function prev(){if(state.index>0){state.index--;render();}}
function goto(i){state.index=i;render();}

function startTimer(s){
setInterval(()=>{
s--;
document.getElementById("timer").innerText=
Math.floor(s/60)+":"+("0"+s%60).slice(-2);
if(s<=0)submit();
},1000);
}

function submit(){
modal("Selesai","Jawaban terkirim",[{
text:"OK",
cls:"blue",
cb:()=>location.reload()
}]);
}

/* INIT */
loginUI();
</script>

</body>
</html>
