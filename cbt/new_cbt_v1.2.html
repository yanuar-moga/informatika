<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
}

body{
  margin:0;
  font-family:Arial;
  background:#b0bec5;
}

/* HEADER */
.header{
  background:var(--blue);
  color:#fff;
  padding:12px;
  display:none;
  justify-content:space-between;
}

/* LAYOUT */
.wrap{display:flex;height:calc(100vh - 50px);}
.sidebar{width:120px;background:#fff;padding:10px;overflow:auto;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}

.num{
  padding:8px;
  background:#ddd;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.num.active{background:var(--blue);color:#fff}
.num.done{background:#4caf50;color:#fff}

.content{flex:1;padding:12px;overflow:auto;}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

/* BUTTON */
.btn{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}

/* LOGIN */
.login-box{
  max-width:420px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
}

.form-group{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  margin-bottom:10px;
}

.form-group input,
.form-group select{
  padding:8px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:300px;
}
</style>
</head>

<body>

<div class="header">
<div>CBT SMPN 1 MOGA</div>
<div id="timer"></div>
</div>

<div id="app"></div>

<div id="modal" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<p id="mMsg"></p>
<div id="mAct"></div>
</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa = [];
let state = { soal:[], index:0, jawaban:[], done:false };

/* MODAL */
function modal(t,m){
document.getElementById("mTitle").innerText = t;
document.getElementById("mMsg").innerText = m;
document.getElementById("modal").style.display = "flex";
}
function modalHide(){
document.getElementById("modal").style.display = "none";
}

/* LOGIN UI */
function loginUI(){
document.getElementById("app").innerHTML = `
<div class="login-box">

<h2 style="text-align:center">CBT Informatika</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelas"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label>Token</label>
<input id="token">
</div>

<button class="btn blue" onclick="login()">Masuk</button>

</div>
`;

fetch(API)
.then(r=>r.json())
.then(d=>{
dataSiswa = d || [];

const kelasList = [...new Set(dataSiswa.map(x=>x.kelas))];

let kelasEl = document.getElementById("kelas");
kelasEl.innerHTML = `<option value="">-- Pilih Kelas --</option>`;

kelasList.forEach(k=>{
kelasEl.innerHTML += `<option value="${k}">${k}</option>`;
});

/* event change */
kelasEl.addEventListener("change", loadSiswa);

});
}

/* LOAD USERNAME */
function loadSiswa(){
let kelas = document.getElementById("kelas").value.trim();
let el = document.getElementById("username");

el.innerHTML = `<option value="">-- Pilih --</option>`;

let list = dataSiswa.filter(x => (x.kelas||"").trim() === kelas);

list.forEach(s=>{
el.innerHTML += `<option value="${s.username}">${s.nama}</option>`;
});
}

/* LOGIN */
function login(){
let username = document.getElementById("username").value;
let token = document.getElementById("token").value;

if(!username) return modal("Error","Pilih username");
if(!token) return modal("Error","Isi token");

fetch(API,{
method:"POST",
body:JSON.stringify({mode:"login",username,token})
})
.then(r=>r.json())
.then(res=>{
if(res.status === "success"){
startExam();
}else{
modal("Login Gagal",res.msg || "Error");
}
});
}

/* START CBT */
function startExam(){
document.querySelector(".header").style.display = "flex";

fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{
state.soal = d || [];
state.jawaban = new Array(d.length).fill("");
render();
startTimer(1800);
});
}

/* RENDER */
function render(){
let soal = state.soal[state.index];

let html = `
<div class="wrap">

<div class="sidebar">
<div class="grid">
${state.soal.map((_,i)=>`
<div class="num ${i===state.index?'active':''}" onclick="goto(${i})">${i+1}</div>
`).join("")}
</div>
</div>

<div class="content">
<div class="card">
<h4>Soal ${state.index+1}</h4>
<p>${soal.soal}</p>

${["A","B","C","D"].map(o=>`
<label>
<input type="radio" name="o" 
${state.jawaban[state.index]===o?'checked':''}
onclick="jawab('${o}')">
${o}. ${soal.pilihan[o]}
</label><br>
`).join("")}

<br>
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>
</div>

</div>
`;

document.getElementById("app").innerHTML = html;
}

/* NAV */
function jawab(v){
state.jawaban[state.index] = v;
render();
}
function next(){ if(state.index < state.soal.length-1){state.index++; render();}}
function prev(){ if(state.index > 0){state.index--; render();}}
function goto(i){ state.index = i; render(); }

/* TIMER */
function startTimer(s){
setInterval(()=>{
s--;
document.getElementById("timer").innerText =
Math.floor(s/60)+":"+("0"+s%60).slice(-2);
},1000);
}

/* INIT */
loginUI();
</script>

</body>
</html>
