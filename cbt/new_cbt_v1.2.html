<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
}
body{margin:0;font-family:Arial;background:#b0bec5}

/* HEADER */
.header{
  background:#1976d2;color:#fff;padding:12px;
  display:none;justify-content:space-between;align-items:center;
}

/* LAYOUT */
.wrap{display:flex;height:calc(100vh - 50px)}

/* SIDEBAR */
.sidebar{width:120px;background:#fff;padding:10px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.num{padding:8px;background:#ddd;text-align:center;border-radius:6px;cursor:pointer;font-size:12px}
.num.active{background:var(--blue);color:#fff}
.num.done{background:#4caf50;color:#fff}

/* CONTENT */
.content{flex:1;padding:12px;overflow:auto}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,0.1)}

/* BUTTON */
.btn{padding:12px;border:none;border-radius:8px;margin-top:10px;cursor:pointer}
.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
}
.box{
  background:#fff;padding:20px;border-radius:12px;width:300px;text-align:center;
}

/* LOGIN */
.login-box{
  max-width:420px;margin:40px auto;background:#fff;
  padding:25px;border-radius:20px;
}
.form-group{
  display:grid;grid-template-columns:100px 1fr;
  gap:10px;margin-bottom:10px;
}
.form-group input,.form-group select{
  padding:8px;border-radius:6px;border:1px solid #ccc;
}
.row{display:flex;gap:10px}
.row .btn{flex:1}

/* MOBILE */
@media(max-width:768px){
.wrap{flex-direction:column}
.sidebar{width:100%;order:2}
.grid{grid-template-columns:repeat(6,1fr)}
.content{order:1}
.form-group{grid-template-columns:1fr}
}
</style>
</head>

<body oncontextmenu="return false">

<div class="header">
<div>CBT SMPN 1 MOGA</div>
<div id="timer"></div>
</div>

<div id="app"></div>

<div id="modal" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<p id="mMsg"></p>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[],dataToken=[];
let state={soal:[],index:0,jawaban:[],done:false};
let warning=0;
let timerInterval=null;

/* ===== MODAL ===== */
function modal(t,m,btns){
mTitle.innerText=t;
mMsg.innerHTML=m;
mAct.innerHTML="";
btns.forEach(b=>{
let x=document.createElement("button");
x.className="btn "+b.cls;
x.innerText=b.text;
x.onclick=()=>{modalHide();if(b.cb)b.cb()};
mAct.appendChild(x);
});
modalShow();
}
function modalShow(){modal.style.display="flex"}
function modalHide(){modal.style.display="none"}

/* ===== LOGIN UI ===== */
function loginUI(){
app.innerHTML=`<div class="login-box">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" style="width:80px;margin:auto;display:block">
<h2 style="text-align:center;color:#1e4f8a">CBT Asesmen<br>Informatika</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelas" onchange="loadSiswa()"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label></label>
<div><input type="checkbox" onclick="togglePass()"> Tampilkan Password</div>
</div>

<div class="form-group">
<label>Token</label>
<input id="token">
</div>

<div class="row">
<button class="btn blue" onclick="login()">Masuk</button>
<button class="btn red" onclick="jadwal()">Jadwal</button>
</div>
</div>`;

fetch(API)
.then(r=>r.json())
.then(d=>{
dataSiswa=d;
let k=[...new Set(d.map(x=>x.kelas))];
kelas.innerHTML='<option>-- Pilih Kelas --</option>';
k.forEach(x=>kelas.innerHTML+=`<option>${x}</option>`);
});

fetch(API+"?mode=token").then(r=>r.json()).then(d=>dataToken=d);
}

/* ===== LOGIN ===== */
function login(){
let usernameVal=username.value;
let tokenVal=token.value;

if(!usernameVal) return modal("Error","Pilih username",[ {text:"OK",cls:"red"} ]);
if(!tokenVal) return modal("Error","Token wajib diisi",[ {text:"OK",cls:"red"} ]);

modal("Login","Memproses...",[]);

fetch(API,{
method:"POST",
body:JSON.stringify({
mode:"login",
username:usernameVal,
password:password.value||"",
token:tokenVal
})
})
.then(r=>r.json())
.then(res=>{
modalHide();

if(res.status==="success"){
localStorage.setItem("user",JSON.stringify(res));
startExam();
}else{
modal("Gagal Login",res.msg,[{text:"OK",cls:"red"}]);
}
})
.catch(()=>{
modal("Error","Tidak bisa konek ke server",[ {text:"OK",cls:"red"} ]);
});
}

/* ===== START CBT ===== */
function startExam(){
document.querySelector(".header").style.display="flex";

fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{

if(!d || d.length===0){
modal("Error","Soal tidak ditemukan",[ {text:"OK",cls:"red"} ]);
return;
}

state.soal=d;

let saved=localStorage.getItem("jawaban");
state.jawaban = saved ? JSON.parse(saved) : new Array(d.length).fill("");

render();
startTimer(1800);
});
}

/* ===== RENDER ===== */
function render(){

let side='<div class="sidebar"><div class="grid">';

state.soal.forEach((s,i)=>{
let c="num";
if(i==state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});

side+='</div></div>';

let s=state.soal[state.index];

let main=`<div class="content"><div class="card">
<h4>Soal ${state.index+1}</h4>
<p>${s.soal}</p>
${s.gambar?`<img src="${s.gambar}" style="width:100%">`:""}`;

["A","B","C","D"].forEach(o=>{
main+=`
<div>
<input type="radio" name="o"
${state.jawaban[state.index]==o?"checked":""}
onchange="jawab('${o}')"> ${o}. ${s.pilihan[o]}
</div>`;
});

main+=`
<button class="btn" onclick="prev()">Prev</button>
<button class="btn blue" onclick="next()">Next</button>
<button class="btn red" onclick="submit()">Kirim</button>
</div></div>`;

app.innerHTML=`<div class="wrap">${side}${main}</div>`;
}

/* ===== TIMER ===== */
function startTimer(s){
if(timerInterval) clearInterval(timerInterval);

timerInterval=setInterval(()=>{
s--;
timer.innerText=Math.floor(s/60)+":"+("0"+s%60).slice(-2);
if(s<=0) submit();
},1000);
}

/* ===== SUBMIT ===== */
function submit(){
if(state.done) return;
state.done=true;

let u=JSON.parse(localStorage.getItem("user"));

fetch(API,{
method:"POST",
body:JSON.stringify({
mode:"submit",
idLogin:u.idLogin,
nama:u.nama,
jk:u.jk,
kelas:u.kelas,
jawaban:state.jawaban
})
})
.then(r=>r.json())
.then(res=>{
localStorage.removeItem("jawaban");
modal("Selesai","Nilai: "+res.nilai,[{
text:"OK",
cls:"blue",
cb:()=>location.reload()
}]);
});
}

/* INIT */
loginUI();
</script>

</body>
</html>
