<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBT Informatika</title>

<style>
:root{
--blue:#2f5597;
--red:#e53935;
--orange:#ff5722;
--bg:#a7b3bf;
}

body{margin:0;font-family:Arial;background:var(--bg);}

/* HEADER */
.topbar{
background:var(--blue);
color:#fff;
padding:10px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.topbar button{
background:#ff5722;
border:none;
padding:8px 15px;
border-radius:6px;
color:#fff;
cursor:pointer;
}

/* CENTER */
.center{
text-align:center;
margin-top:20px;
}

/* CARD */
.card{
background:#eee;
max-width:650px;
margin:20px auto;
padding:20px;
border-radius:12px;
text-align:left;
}

/* BUTTON */
.btn{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}
.full{width:100%}
.blue{background:#3f6cc9;color:#fff}
.red{background:#e53935;color:#fff}
.orange{background:#ff5722;color:#fff}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:#fff;
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.wrap{display:flex}
.sidebar{width:120px;background:#fff;padding:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.num{background:#ddd;padding:6px;text-align:center;border-radius:5px;cursor:pointer}
.num.active{background:#2f5597;color:#fff}
.num.done{background:#4caf50;color:#fff}
.content{flex:1;padding:15px}

</style>
</head>

<body>

<div class="topbar">
<div id="userInfo"></div>
<button onclick="keluar()">Keluar</button>
</div>

<div id="app"></div>

<div id="modal" class="modal">
<div class="modal-box">
<h3>Konfirmasi Data</h3>
<p>Pastikan data Anda sudah benar</p>

<div style="text-align:left;margin-top:10px">
<input type="checkbox" id="cekData"> Saya yakin data sudah benar
</div>

<div class="modal-actions">
<button class="btn blue full" onclick="tutupModal()">Batal</button>
<button class="btn red full" onclick="lanjutUjian()">Kirim</button>
</div>

</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let state={soal:[],index:0,jawaban:[]};
let warning=0;

/* LOGIN */
function loginUI(){
app.innerHTML=`
<div style="display:flex;justify-content:center;align-items:center;height:100vh">
<div style="background:#fff;padding:20px;border-radius:12px;width:300px">

<h3 style="text-align:center">CBT Informatika</h3>

<input id="user" placeholder="Username" style="width:100%;margin-bottom:10px">
<input id="pass" type="password" placeholder="Password" style="width:100%;margin-bottom:10px">

<div>
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</div>

<input id="token" placeholder="Token" style="width:100%;margin:10px 0">

<button class="btn blue full" onclick="login()">Masuk</button>
<button class="btn red full" onclick="jadwal()">Jadwal</button>

</div></div>`;
}

/* TOGGLE */
function togglePass(){
let p=document.getElementById("pass");
p.type=p.type==="password"?"text":"password";
}

/* LOGIN */
function login(){
localStorage.setItem("user",JSON.stringify({nama:"Mr. XYZ",kelas:"Guru"}));
showKonfirmasi();
}

/* HALAMAN KONFIRMASI (SESUAI GAMBAR) */
function showKonfirmasi(){
let u=JSON.parse(localStorage.getItem("user"));

userInfo.innerHTML=`${u.nama}<br>${u.kelas}`;

app.innerHTML=`
<div class="center">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
<h2>Asesmen CBT Informatika</h2>
<p>Minggu, 3 Mei 2026</p>
<p>⏱ <span id="jam"></span></p>
</div>

<div class="card">

<p>Nama : <b>${u.nama}</b></p>
<p>Kelas : <b>${u.kelas}</b></p>
<p>Mata Pelajaran : Informatika</p>
<p>Semester : Genap</p>
<p>Tahun Pelajaran : 2026 - 2027</p>

<hr>

<b>Informasi Ujian:</b>
<ul>
<li>Jumlah soal: 40</li>
<li>Pilihan ganda: 35</li>
<li>Essay: 5</li>
<li>Durasi: 90 menit</li>
</ul>

<b>Penting:</b>
<ul>
<li>Dilarang keluar aplikasi</li>
<li>Jangan refresh saat ujian</li>
<li>Kerjakan dengan jujur</li>
</ul>

<button class="btn orange full" onclick="bukaModal()">Kerjakan Ujian</button>

</div>
`;

setInterval(()=>{
let d=new Date();
jam.innerText=d.toLocaleTimeString();
},1000);
}

/* MODAL */
function bukaModal(){modal.style.display="flex";}
function tutupModal(){modal.style.display="none";}

function lanjutUjian(){
if(!cekData.checked){
alert("Centang dulu!");
return;
}
modal.style.display="none";
startExam();
}

/* EXAM */
function startExam(){
fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{
let saved=localStorage.getItem("cbt");
if(saved){state=JSON.parse(saved);}
else{
state.soal=d;
state.jawaban=new Array(d.length).fill("");
}
render();
});
}

/* RENDER */
function render(){
let side='<div class="sidebar"><div class="grid">';
state.soal.forEach((s,i)=>{
let c="num";
if(i===state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});
side+='</div></div>';

let s=state.soal[state.index];

let main=`<div class="content">
<h3>Soal ${state.index+1}</h3>
<p>${s.soal}</p>`;

["A","B","C","D","E"].forEach(o=>{
main+=`
<div>
<input type="radio" ${state.jawaban[state.index]==o?"checked":""}
onclick="jawab('${o}')"> ${o}. ${s.pilihan[o]||""}
</div>`;
});

main+=`<br>
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="submit()">Selesai</button>
</div>`;

app.innerHTML=`<div class="wrap">${side}${main}</div>`;
}

/* NAV */
function jawab(v){state.jawaban[state.index]=v;save();}
function next(){state.index++;save();render();}
function prev(){state.index--;save();render();}
function goto(i){state.index=i;save();render();}

/* SAVE */
function save(){localStorage.setItem("cbt",JSON.stringify(state));}

/* ANTI TAB */
document.addEventListener("visibilitychange",()=>{
if(document.hidden){
warning++;
if(warning>=3) submit();
}
});

/* SUBMIT */
function submit(){
alert("Ujian selesai");
localStorage.clear();
location.reload();
}

/* LOGOUT */
function keluar(){
localStorage.clear();
location.reload();
}

/* JADWAL */
function jadwal(){
alert("Jadwal ujian ditampilkan di sini");
}

loginUI();
</script>

</body>
</html>
