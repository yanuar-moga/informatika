<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
  --green:#4caf50;
  --orange:#ff5722;
}

body{margin:0;font-family:Arial;background:#b0bec5;}

/* HEADER */
.header{
  background:#2f5597;color:#fff;padding:10px 15px;
  display:none;justify-content:space-between;align-items:center;font-size:14px;
}

/* LAYOUT */
.wrap{
  display:flex;
  height:calc(100vh - 90px);
}

/* SIDEBAR ANBK */
.sidebar{
  width:160px;
  background:#f1f3f4;
  padding:10px;
  border-right:1px solid #ccc;
  overflow-y:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.num{
  padding:10px;
  text-align:center;
  border-radius:6px;
  background:#e0e0e0;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
}

.num.active{background:#1976d2;color:#fff}
.num.done{background:#4caf50;color:#fff}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#e9eef3;
}

/* CARD SOAL */
.card{
  width:100%;
  max-width:800px;
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card p{margin:4px 0;}
.card ul{margin:5px 0 10px 18px;}

/* PILIHAN */
.option{
  display:block;
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
  margin-bottom:8px;
  cursor:pointer;
  transition:0.2s;
}
.option:hover{background:#f1f7ff;}

.option input{margin-right:8px;}

/* NAV */
.nav-btn{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

/* BUTTON */
.btn{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}
.green{background:var(--green);color:#fff}
.orange{background:var(--orange);color:#fff}

/* FOOTER */
.footer{
  height:40px;background:#1976d2;color:#fff;
  display:none;align-items:center;justify-content:center;font-size:12px;
}

/* LOGIN ASLI (TIDAK DIUBAH) */
.login-container{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;
}
.login-box{
  width:100%;max-width:420px;background:#fff;padding:25px;border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
.form-group{
  display:grid;grid-template-columns:100px 1fr;gap:10px;margin-bottom:10px;align-items:center;
}
.form-group input,.form-group select{
  padding:8px;border-radius:6px;border:1px solid #ccc;
}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
}
.box{
  background:#fff;padding:20px;border-radius:12px;width:90%;max-width:350px;text-align:center;
}
</style>
</head>

<body>

<div class="header">
<div><b id="nama"></b> | <span id="kelas"></span></div>
<div>⏱ <span id="timer"></span> |
<button onclick="keluar()" style="background:#fff;border:none;padding:5px;border-radius:5px">Keluar</button>
</div>
</div>

<div id="app"></div>

<div class="footer" id="footer">CBT Browser Apps by MB © 2026</div>

<div id="modalBox" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<div id="mMsg"></div>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[];
let state={soal:[],index:0,jawaban:[]};
let warning=0;

/* MODAL */
function modal(t,m,btns){
mAct.innerHTML="";
mTitle.innerText=t;
mMsg.innerHTML=m;
btns.forEach(b=>{
let x=document.createElement("button");
x.className="btn "+b.cls;
x.innerText=b.text;
x.onclick=()=>{modalHide(); if(b.cb)b.cb();};
mAct.appendChild(x);
});
modalBox.style.display="flex";
}
function modalHide(){modalBox.style.display="none";}

/* TOGGLE PASSWORD */
function togglePass(){
let p=document.getElementById("password");
p.type=(p.type==="password")?"text":"password";
}

/* JADWAL */
function jadwal(){
modal("Jadwal & Token",`
<table style="width:100%;font-size:13px">
<tr><th>Hari</th><th>Mapel</th><th>Jam</th><th>Token</th></tr>
<tr><td>Senin</td><td>Informatika</td><td>08.00</td><td><b>ABC123</b></td></tr>
</table>
`,[{text:"Tutup",cls:"blue"}]);
}

/* LOGIN (ASLI TIDAK DIUBAH) */
function loginUI(){
app.innerHTML=`...`; // tetap seperti kode Anda (tidak diubah)
}

/* === BAGIAN LOGIC TETAP SAMA === */

/* RENDER (SUDAH DIPERBAIKI UI) */
function render(){
let side='<div class="sidebar"><div class="grid">';
state.soal.forEach((s,i)=>{
let c="num";
if(i===state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});
side+='</div></div>';

let s=state.soal[state.index];

let main=`<div class="content"><div class="card">
<h3>Soal ${state.index+1}</h3>
<p>${s.soal}</p>`;

["A","B","C","D","E"].forEach(o=>{
main+=`
<label class="option">
<input type="radio" name="opsi"
${state.jawaban[state.index]==o?"checked":""}
onclick="jawab('${o}')">
<b>${o}.</b> ${s.pilihan[o]||""}
</label>`;
});

main+=`<div class="nav-btn">
<button class="btn blue" onclick="prev()">Sebelumnya</button>
<button class="btn red" onclick="next()">Selanjutnya</button>
<button class="btn green" onclick="popupSubmit()">Selesai</button>
</div></div></div>`;

app.innerHTML=`<div class="wrap">${side}${main}</div>`;
}
</script>

</body>
</html>
