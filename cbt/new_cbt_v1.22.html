<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>CBT SMPN 1 MOGA</title>

<style>
:root{
  --blue:#1976d2;
  --red:#d32f2f;
  --green:#4caf50;
  --orange:#ff5722;
}

body{
  margin:0;
  font-family:Arial;
  background:#b0bec5;
}

.header{
  background:#2f5597;
  color:#fff;
  padding:10px;
  display:none;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.wrap{display:flex;height:calc(100vh - 90px);}
.sidebar{width:120px;background:#fff;padding:10px;overflow:auto;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}

.num{
  padding:8px;
  background:#ddd;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.num.active{background:var(--blue);color:#fff}
.num.done{background:#4caf50;color:#fff}

.content{flex:1;padding:12px;overflow:auto;}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.nav-btn{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

.btn{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.blue{background:var(--blue);color:#fff}
.red{background:var(--red);color:#fff}
.green{background:var(--green);color:#fff}
.orange{background:var(--orange);color:#fff}

.footer{
  height:40px;
  background:#1976d2;
  color:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* LOGIN (ASLI TIDAK DIUBAH) */
.login-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.form-group{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  margin-bottom:10px;
  align-items:center;
}

.form-group input,
.form-group select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:350px;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
<div>
<b id="nama"></b> | <span id="kelas"></span>
</div>
<div>
⏱ <span id="timer"></span> |
<button onclick="keluar()" style="background:#fff;border:none;padding:5px;border-radius:5px">Keluar</button>
</div>
</div>

<div id="app"></div>

<div class="footer" id="footer">
CBT Browser Apps by MB © 2026
</div>

<div id="modalBox" class="modal">
<div class="box">
<h3 id="mTitle"></h3>
<div id="mMsg"></div>
<div id="mAct"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFKeH-bb47KADy6577hEQU3zJy4WmkBAAxzIHuRqmqY6dNnPCDaXrl-UP-v78lj72c/exec";

let dataSiswa=[];
let state={soal:[],index:0,jawaban:[]};
let warning=0;

/* MODAL */
function modal(t,m,btns){
mAct.innerHTML="";
mTitle.innerText=t;
mMsg.innerHTML=m;
btns.forEach(b=>{
let x=document.createElement("button");
x.className="btn "+b.cls;
x.innerText=b.text;
x.onclick=()=>{modalHide(); if(b.cb)b.cb();};
mAct.appendChild(x);
});
modalBox.style.display="flex";
}
function modalHide(){modalBox.style.display="none";}

/* TOGGLE PASSWORD */
function togglePass(){
let p=document.getElementById("password");
p.type=(p.type==="password")?"text":"password";
}

/* JADWAL */
function jadwal(){
modal("Jadwal & Token",`
<table style="width:100%;border-collapse:collapse;font-size:13px">
<tr><th>Hari</th><th>Mapel</th><th>Jam</th><th>Token</th></tr>
<tr><td>Senin</td><td>Informatika</td><td>08.00</td><td><b>ABC123</b></td></tr>
</table>
`,[{text:"Tutup",cls:"blue"}]);
}

/* LOGIN UI (ASLI) */
function loginUI(){
app.innerHTML=`<div class="login-container">
<div class="login-box">

<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" 
style="width:80px;display:block;margin:auto">

<h2 style="text-align:center;color:#1e4f8a">
CBT Asesmen<br>Informatika
</h2>

<div class="form-group">
<label>Kelas</label>
<select id="kelasSelect"></select>
</div>

<div class="form-group">
<label>Username</label>
<select id="username"></select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="form-group">
<label></label>
<div>
<input type="checkbox" onclick="togglePass()"> Tampilkan Password
</div>
</div>

<div class="form-group">
<label>Token</label>
<input id="token">
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<button class="btn blue" onclick="login()">Masuk</button>
<button class="btn red" onclick="jadwal()">Jadwal</button>

<div style="height:20px"></div>

<div style="text-align:center;font-size:12px;color:#555">
CBT Browser Apps by MB<br>
© 2026 MB All Rights Reserved
</div>

</div>
</div>
</div>`;

fetch(API).then(r=>r.json()).then(d=>{
dataSiswa=d;
let k=[...new Set(d.map(x=>x.kelas))];
kelasSelect.innerHTML='<option>-- Pilih Kelas --</option>';
k.forEach(x=>kelasSelect.innerHTML+=`<option>${x}</option>`);
kelasSelect.onchange=loadUser;
});
}

/* LOAD USER */
function loadUser(){
let k=kelasSelect.value;
username.innerHTML='<option>-- Pilih --</option>';
dataSiswa.filter(x=>x.kelas==k)
.forEach(s=>{
username.innerHTML+=`<option value="${s.username}">${s.nama}</option>`;
});
}

/* LOGIN */
function login(){
let user=username.value;
let pass=password.value;
let token=document.getElementById("token").value;

fetch(API,{
method:"POST",
body:JSON.stringify({mode:"login",username:user,password:pass,token})
})
.then(r=>r.json())
.then(res=>{
if(res.status==="success"){
localStorage.setItem("user",JSON.stringify(res));
showKonfirmasi();
}else alert(res.msg);
});
}

/* KONFIRMASI SESUAI GAMBAR */
function showKonfirmasi(){
let u=JSON.parse(localStorage.getItem("user"));

document.querySelector(".header").style.display="flex";
footer.style.display="flex";

nama.innerText=u.nama;
kelas.innerText=u.kelas;

app.innerHTML=`
<div style="text-align:center;margin-top:20px">
<img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
<h2>Asesmen CBT Informatika</h2>
<p>Minggu, 3 Mei 2026</p>
<p>⏱ <span id="jam"></span></p>
</div>

<div class="card" style="max-width:650px;margin:20px auto;background:#e0e0e0">

<p>Nama : <b>${u.nama}</b></p>
<p>Kelas : <b>${u.kelas}</b></p>
<p>Mata Pelajaran : Informatika</p>
<p>Semester : Genap</p>
<p>Tahun Pelajaran : 2026 - 2027</p>

<hr>

<b>Informasi Ujian:</b>
<ul>
<li>Jumlah soal: 40</li>
<li>Pilihan ganda: 35</li>
<li>Essay: 5</li>
<li>Durasi: 90 menit</li>
</ul>

<b>Penting:</b>
<ul>
<li>Dilarang keluar aplikasi</li>
<li>Jangan refresh saat ujian</li>
<li>Kerjakan dengan jujur</li>
</ul>

<button class="btn orange" style="width:100%" onclick="popupData()">Kerjakan Ujian</button>

</div>
`;

setInterval(()=>{
let d=new Date();
jam.innerText=d.toLocaleTimeString();
},1000);
}

/* POPUP CHECKBOX */
function popupData(){
modal("Konfirmasi Data",
`
<p>Pastikan data Anda sudah benar</p>
<div style="text-align:left">
<input type="checkbox" id="cek"> Saya yakin data sudah benar
</div>
`,
[
{text:"Batal",cls:"blue"},
{text:"Kirim",cls:"red",cb:cekStart}
]
);
}

function cekStart(){
if(!document.getElementById("cek").checked){
alert("Centang dulu!");
return;
}
startExam();
}

/* START EXAM */
function startExam(){
fetch(API+"?mode=soal")
.then(r=>r.json())
.then(d=>{
let saved=localStorage.getItem("cbt_state");
if(saved){state=JSON.parse(saved);}
else{
state.soal=d;
state.jawaban=new Array(d.length).fill("");
}
render();
startTimer(1800);
});
}

/* RENDER */
function render(){
let side='<div class="sidebar"><div class="grid">';
state.soal.forEach((s,i)=>{
let c="num";
if(i===state.index)c+=" active";
if(state.jawaban[i])c+=" done";
side+=`<div class="${c}" onclick="goto(${i})">${i+1}</div>`;
});
side+='</div></div>';

let s=state.soal[state.index];

let main=`<div class="content"><div class="card">
<h3>Soal ${state.index+1}</h3>
<p>${s.soal}</p>`;

["A","B","C","D","E"].forEach(o=>{
main+=`<div>
<input type="radio" ${state.jawaban[state.index]==o?"checked":""}
onclick="jawab('${o}')"> ${o}. ${s.pilihan[o]||""}
</div>`;
});

main+=`<div class="nav-btn">
<button class="btn blue" onclick="prev()">Sebelumnya</button>
<button class="btn red" onclick="next()">Selanjutnya</button>
<button class="btn green" onclick="submit()">Selesai</button>
</div></div></div>`;

app.innerHTML=`<div class="wrap">${side}${main}</div>`;
}

/* NAV */
function jawab(v){state.jawaban[state.index]=v;save();}
function next(){state.index++;save();render();}
function prev(){state.index--;save();render();}
function goto(i){state.index=i;save();render();}
function save(){localStorage.setItem("cbt_state",JSON.stringify(state));}

/* TIMER */
function startTimer(s){
let end=localStorage.getItem("endTime");
if(!end){
end=Date.now()+s*1000;
localStorage.setItem("endTime",end);
}
setInterval(()=>{
let sisa=Math.floor((end-Date.now())/1000);
if(sisa<=0){submit();return;}
timer.innerText=Math.floor(sisa/60)+":"+("0"+sisa%60).slice(-2);
},1000);
}

/* ANTI TAB */
document.addEventListener("visibilitychange",()=>{
if(document.hidden){
warning++;
if(warning>=3) submit();
}
});

/* SUBMIT */
function submit(){
alert("Ujian selesai");
localStorage.clear();
location.reload();
}

/* LOGOUT */
function keluar(){
localStorage.clear();
location.reload();
}

/* INIT */
loginUI();
</script>

</body>
</html>
