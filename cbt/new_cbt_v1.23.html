<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>CBT SMPN 1 MOGA - Profesional</title>

    <style>
        :root {
            --primary: #2f5597;
            --accent: #ffc107;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f4f7f9;
            --text: #333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: var(--primary);
            color: #fff;
            padding: 0 20px;
            height: 60px;
            display: none; 
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .timer-box {
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
        }

        /* LAYOUT UTAMA */
        .wrap {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        /* KONTEN SOAL */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-soal {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-height: 400px;
        }

        .nomor-soal {
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .teks-soal {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* PILIHAN JAWABAN */
        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opsi-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opsi-item:hover { background: #f0f4ff; }
        .opsi-item input { margin-right: 15px; transform: scale(1.2); }
        .opsi-item.selected {
            background: #e8f0fe;
            border-color: var(--primary);
            font-weight: 600;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 20px;
        }

        .grid-nomor {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .num {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .num.active { border: 2px solid var(--primary); color: var(--primary); }
        .num.done { background: var(--success); color: #fff; border-color: var(--success); }

        .nav-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:disabled { opacity: 0.5; }
        .blue { background: var(--primary); color: #fff; }
        .yellow { background: var(--accent); color: #000; }
        .green { background: var(--success); color: #fff; }
        .red { background: var(--danger); color: #fff; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
        .box { background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px; text-align:center; }
        
        /* LOGIN STYLES */
        .login-container { min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #2f5597 0%, #1976d2 100%); }
        .login-box { width:100%; max-width:400px; background:#fff; padding:40px; border-radius:12px; box-shadow:0 15px 35px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }

        @media (max-width: 768px) {
            .wrap { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #ddd; order: 2; }
            .content { order: 1; }
        }
    </style>
</head>
<body>

<div class="header" id="mainHeader">
    <div>
        <strong id="namaDisp"></strong><br>
        <span id="kelasDisp" style="font-size: 0.75rem; opacity: 0.8;"></span>
    </div>
    <div class="timer-box" id="timer">00:00</div>
    <button onclick="keluar()" class="btn red" style="padding: 5px 10px; font-size: 0.7rem;">KELUAR</button>
</div>

<div id="app"></div>

<div id="modalBox" class="modal">
    <div class="box">
        <h3 id="mTitle"></h3>
        <div id="mMsg" style="margin: 15px 0;"></div>
        <div id="mAct" style="display:flex; justify-content: center; gap: 10px;"></div>
    </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzb6lxGToLfJbgnjbmK_NL5Ikfgr16pH54s_De3AmkSu3xZtgo-6s1veUuIPUlfE_Jo/exec";

let dataSiswa = [];
let state = { soal: [], index: 0, jawaban: [] };
let warning = 0;

function modal(t, m, btns) {
    const mAct = document.getElementById("mAct");
    mAct.innerHTML = "";
    document.getElementById("mTitle").innerText = t;
    document.getElementById("mMsg").innerHTML = m;
    btns.forEach(b => {
        let x = document.createElement("button");
        x.className = "btn " + b.cls;
        x.innerText = b.text;
        x.onclick = () => { document.getElementById("modalBox").style.display = "none"; if (b.cb) b.cb(); };
        mAct.appendChild(x);
    });
    document.getElementById("modalBox").style.display = "flex";
}

function loginUI() {
    document.getElementById("mainHeader").style.display = "none";
    const app = document.getElementById("app");
    app.innerHTML = `
    <div class="login-container">
        <div class="login-box">
            <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" style="width:70px;display:block;margin:0 auto 20px">
            <h2 style="text-align:center; color:var(--primary); margin-bottom:30px">CBT ASESMEN</h2>
            <div class="form-group">
                <label>PILIH KELAS</label>
                <select id="kelasSelect"><option>Memuat kelas...</option></select>
            </div>
            <div class="form-group">
                <label>NAMA SISWA</label>
                <select id="username"><option value="">-- Pilih Nama --</option></select>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="Masukkan Password">
            </div>
            <div class="form-group">
                <label>TOKEN</label>
                <input id="token" style="text-transform: uppercase; font-weight:bold; letter-spacing:2px">
            </div>
            <button id="btnLogin" class="btn blue" style="width:100%; margin-top:10px" onclick="login()">MASUK UJIAN</button>
            <p style="text-align:center; font-size:11px; color:#999; margin-top:20px">© 2026 SMPN 1 MOGA</p>
        </div>
    </div>`;

    fetch(API).then(r => r.json()).then(d => {
        dataSiswa = d;
        let k = [...new Set(d.map(x => x.kelas))];
        let sel = document.getElementById('kelasSelect');
        sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        k.forEach(x => sel.innerHTML += `<option>${x}</option>`);
        sel.onchange = () => {
            let kVal = sel.value;
            let un = document.getElementById('username');
            un.innerHTML = '<option value="">-- Pilih Nama --</option>';
            dataSiswa.filter(x => x.kelas == kVal).forEach(s => {
                un.innerHTML += `<option value="${s.username}" data-nama="${s.nama}">${s.nama}</option>`;
            });
        };
    });
}

function login() {
    let selName = document.getElementById('username');
    let user = selName.value;
    let pass = document.getElementById('password').value;
    let token = document.getElementById('token').value;

    if (!user || !pass || !token) return alert("Lengkapi semua data!");

    document.getElementById('btnLogin').innerText = "Verifikasi...";
    
    fetch(API, {
        method: "POST",
        body: JSON.stringify({ mode: "login", username: user, password: pass, token: token })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "success") {
            localStorage.setItem("user", JSON.stringify(res));
            localStorage.setItem("layer", "konfirmasi");
            init();
        } else {
            alert(res.msg);
            document.getElementById('btnLogin').innerText = "MASUK UJIAN";
        }
    });
}

function showKonfirmasi() {
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("app").innerHTML = `
    <div style="max-width:500px; margin:40px auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.1)">
        <h3>Konfirmasi Data</h3>
        <p>Nama: <b>${u.nama}</b></p>
        <p>Kelas: <b>${u.kelas}</b></p>
        <p>Mata Pelajaran: <b>Informatika</b></p>
        <hr>
        <button class="btn green" style="width:100%" onclick="startExam()">MULAI UJIAN</button>
    </div>`;
}

function startExam() {
    localStorage.setItem("layer", "soal");
    fetch(API + "?mode=soal").then(r => r.json()).then(d => {
        let saved = localStorage.getItem("cbt_state");
        if (saved) {
            state = JSON.parse(saved);
        } else {
            state.soal = d;
            state.jawaban = new Array(d.length).fill("");
            state.index = 0;
            localStorage.setItem("cbt_state", JSON.stringify(state));
        }
        render();
        startTimer();
    });
}

function startTimer() {
    let end = localStorage.getItem("endTime");
    if (!end) {
        end = Date.now() + (90 * 60 * 1000); 
        localStorage.setItem("endTime", end);
    }
    const timerInt = setInterval(() => {
        let sisa = Math.floor((end - Date.now()) / 1000);
        if (sisa <= 0) { clearInterval(timerInt); submitAction(); return; }
        let m = Math.floor(sisa / 60);
        let s = sisa % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

function render() {
    document.getElementById("mainHeader").style.display = "flex";
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("namaDisp").innerText = u.nama;
    document.getElementById("kelasDisp").innerText = u.kelas;

    let s = state.soal[state.index];
    let sideGrid = '';
    state.soal.forEach((_, i) => {
        let cls = "num" + (i === state.index ? " active" : "") + (state.jawaban[i] ? " done" : "");
        sideGrid += `<div class="${cls}" onclick="state.index=${i};render()">${i+1}</div>`;
    });

    let opsHtml = '';
    ["A","B","C","D","E"].forEach(o => {
        if(s.pilihan[o]) {
            let isSel = state.jawaban[state.index] === o;
            opsHtml += `<div class="opsi-item ${isSel?'selected':''}" onclick="jawab('${o}')">
                <input type="radio" ${isSel?'checked':''}> <span><b>${o}.</b> ${s.pilihan[o]}</span>
            </div>`;
        }
    });

    document.getElementById("app").innerHTML = `
    <div class="wrap">
        <div class="content">
            <div class="card-soal">
                <div class="nomor-soal">NOMOR ${state.index + 1}</div>
                ${s.gambar ? `<img src="${s.gambar}" style="max-width:100%; margin-bottom:15px">` : ''}
                <div class="teks-soal">${s.soal}</div>
                <div class="opsi-container">${opsHtml}</div>
                <div class="nav-footer">
                    <button class="btn blue" onclick="state.index--;render()" ${state.index==0?'disabled':''}>KEMBALI</button>
                    ${state.index == state.soal.length-1 
                        ? `<button class="btn green" onclick="popupSubmit()">SELESAI</button>` 
                        : `<button class="btn blue" onclick="state.index++;render()">LANJUT</button>`}
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="grid-nomor">${sideGrid}</div>
        </div>
    </div>`;
}

function jawab(v) {
    state.jawaban[state.index] = v;
    localStorage.setItem("cbt_state", JSON.stringify(state));
    render();
}

function popupSubmit() {
    modal("Selesai?", "Kirim jawaban sekarang?", [{text:"BATAL",cls:"blue"}, {text:"KIRIM",cls:"green",cb:submitAction}]);
}

function submitAction() {
    document.getElementById("app").innerHTML = "<h2>Mengirim... Mohon Tunggu</h2>";
    let u = JSON.parse(localStorage.getItem("user"));
    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            mode: "submit",
            idLogin: u.idLogin,
            nama: u.nama,
            kelas: u.kelas,
            jawaban: state.jawaban
        })
    }).then(() => {
        localStorage.clear();
        document.getElementById("app").innerHTML = "<div style='text-align:center;padding:50px'><h2>TERIMA KASIH</h2><p>Jawaban Berhasil Dikirim.</p><button class='btn blue' onclick='location.reload()'>LOGOUT</button></div>";
    });
}

function keluar() { 
    if(confirm("Keluar dari ujian?")) { localStorage.clear(); location.reload(); }
}

function init() {
    let layer = localStorage.getItem("layer");
    if (!localStorage.getItem("user")) loginUI();
    else if (layer === "konfirmasi") showKonfirmasi();
    else if (layer === "soal") startExam();
}

/* ANTI-CHEAT LOGIC */
document.addEventListener("visibilitychange", () => {
    if (document.hidden && localStorage.getItem("layer") === "soal") {
        warning++;
        if (warning >= 3) {
            alert("Pelanggaran: Anda terlalu sering keluar tab! Ujian dihentikan.");
            submitAction();
        } else {
            alert("Peringatan " + warning + "/3: Dilarang membuka tab lain!");
        }
    }
});

init();
</script>
</body>
</html>
