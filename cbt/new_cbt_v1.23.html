<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>CBT SMPN 1 MOGA - Profesional</title>

    <style>
        :root {
            --primary: #2f5597;
            --accent: #ffc107;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f4f7f9;
            --text: #333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: var(--primary);
            color: #fff;
            padding: 0 20px;
            height: 60px;
            display: none; 
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }

        .timer-box {
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
        }

        /* LAYOUT UTAMA */
        .wrap {
            display: flex;
            height: calc(100vh - 60px);
        }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-soal {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .nomor-soal {
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .teks-soal {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opsi-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opsi-item:hover { background: #f0f4ff; border-color: var(--primary); }
        .opsi-item input { margin-right: 15px; transform: scale(1.2); }
        .opsi-item.selected { background: #e8f0fe; border-color: var(--primary); font-weight: 600; }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .grid-nomor {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
        }

        .num {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .num.active { border: 2px solid var(--primary); color: var(--primary); }
        .num.done { background: var(--success); color: #fff; border-color: var(--success); }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .blue { background: var(--primary); color: #fff; }
        .yellow { background: var(--accent); color: #000; }
        .green { background: var(--success); color: #fff; }
        .red { background: var(--danger); color: #fff; }

        /* LOGIN FORM */
        .login-container { min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #2f5597 0%, #1976d2 100%); }
        .login-box { width:100%; max-width:400px; background:#fff; padding:30px; border-radius:12px; box-shadow:0 15px 35px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Show Password Checkbox Style */
        .show-pass { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #666; margin-top: 5px; cursor: pointer; }
        .show-pass input { width: auto; margin: 0; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
        .box { background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px; text-align:center; }
        
        @media (max-width: 768px) {
            .wrap { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; order: 2; height: auto; border-left: none; border-top: 1px solid #ddd; }
            .content { order: 1; padding: 15px; }
        }
    </style>
</head>

<body>

<div class="header">
    <div id="info-siswa">
        <strong id="namaDisp"></strong><br>
        <span id="kelasDisp" style="opacity: 0.8; font-size: 0.8rem;"></span>
    </div>
    <div class="timer-box" id="timer">00:00</div>
    <button onclick="keluar()" class="btn red" style="padding: 5px 10px; font-size: 0.7rem;">KELUAR</button>
</div>

<div id="app"></div>

<div id="modalBox" class="modal">
    <div class="box">
        <h3 id="mTitle"></h3>
        <div id="mMsg" style="margin: 15px 0;"></div>
        <div id="mAct" style="display:flex; justify-content: center; gap: 10px;"></div>
    </div>
</div>

<script>
// GANTI DENGAN URL WEB APP BARU DARI GAS
const API = "https://script.google.com/macros/s/AKfycbwO6T8u.../exec";

let dataSiswa = [];
let state = { soal: [], index: 0, jawaban: [] };
let warning = 0;

/* MODAL CONTROL */
function modal(t, m, btns) {
    const mAct = document.getElementById("mAct");
    const mTitle = document.getElementById("mTitle");
    const mMsg = document.getElementById("mMsg");
    mAct.innerHTML = "";
    mTitle.innerText = t;
    mMsg.innerHTML = m;
    btns.forEach(b => {
        let x = document.createElement("button");
        x.className = "btn " + b.cls;
        x.innerText = b.text;
        x.onclick = () => { modalHide(); if (b.cb) b.cb(); };
        mAct.appendChild(x);
    });
    document.getElementById("modalBox").style.display = "flex";
}
function modalHide() { document.getElementById("modalBox").style.display = "none"; }

/* LOGIN UI */
function loginUI() {
    document.getElementById("app").innerHTML = `
    <div class="login-container">
        <div class="login-box">
            <h2 style="text-align:center; color:var(--primary); margin-bottom:20px">CBT ASESMEN</h2>
            <div class="form-group">
                <label>PILIH KELAS</label>
                <select id="kelasSelect"><option>Memuat kelas...</option></select>
            </div>
            <div class="form-group">
                <label>NAMA SISWA</label>
                <select id="username"><option>-- Pilih Nama --</option></select>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="Masukkan Password">
                <label class="show-pass">
                    <input type="checkbox" onclick="togglePass()"> Lihat Password
                </label>
            </div>
            <div class="form-group">
                <label>TOKEN</label>
                <input id="token" style="text-transform: uppercase; font-weight:bold; letter-spacing:2px">
            </div>
            <button id="btnLogin" class="btn blue" style="width:100%; margin-top:10px" onclick="login()">MASUK UJIAN</button>
            <p style="text-align:center; font-size:11px; color:#999; margin-top:20px">© 2026 SMPN 1 MOGA</p>
        </div>
    </div>`;

    fetch(API + "?mode=siswa").then(r => r.json()).then(d => {
        dataSiswa = d;
        let k = [...new Set(d.map(x => x.kelas))];
        let sel = document.getElementById('kelasSelect');
        sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        k.forEach(x => sel.innerHTML += `<option>${x}</option>`);
        sel.onchange = loadUser;
    });
}

function togglePass() {
    let x = document.getElementById("password");
    x.type = x.type === "password" ? "text" : "password";
}

function loadUser() {
    let k = document.getElementById('kelasSelect').value;
    let un = document.getElementById('username');
    un.innerHTML = '<option value="">-- Pilih Nama --</option>';
    dataSiswa.filter(x => x.kelas == k).forEach(s => {
        un.innerHTML += `<option value="${s.username}">${s.nama}</option>`;
    });
}

function login() {
    let username = document.getElementById('username').value;
    let password = document.getElementById('password').value;
    let token = document.getElementById('token').value;
    let btn = document.getElementById('btnLogin');

    if (!username || !token) return alert("Pilih Nama & Isi Token!");

    btn.disabled = true;
    btn.innerText = "Mengecek...";

    fetch(API, {
        method: "POST",
        body: JSON.stringify({ mode: "login", username, password, token })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "success") {
            localStorage.setItem("user", JSON.stringify(res));
            localStorage.setItem("layer", "konfirmasi");
            init();
        } else {
            alert(res.msg);
            btn.disabled = false;
            btn.innerText = "MASUK UJIAN";
        }
    }).catch(e => alert("Gagal koneksi ke server"));
}

/* KONFIRMASI */
function showKonfirmasi() {
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("app").innerHTML = `
    <div style="max-width:500px; margin:40px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.1)">
        <h3>Konfirmasi Peserta</h3>
        <p>Nama: <b>${u.nama}</b></p>
        <p>Kelas: <b>${u.kelas}</b></p>
        <hr>
        <button class="btn green" style="width:100%" onclick="startExam()">MULAI KERJAKAN</button>
    </div>`;
}

/* EXAM LOGIC */
function startExam() {
    localStorage.setItem("layer", "soal");
    document.querySelector(".header").style.display = "flex";

    fetch(API + "?mode=soal")
    .then(r => r.json())
    .then(d => {
        let saved = localStorage.getItem("cbt_state");
        if (saved) {
            state = JSON.parse(saved);
        } else {
            state.soal = d;
            state.jawaban = new Array(d.length).fill("");
            state.index = 0;
            save();
        }
        render();
        startTimer();
    });
}

function startTimer() {
    let duration = 90 * 60; // 90 menit
    let end = localStorage.getItem("endTime") || (Date.now() + duration * 1000);
    localStorage.setItem("endTime", end);

    function tick() {
        let sisa = Math.floor((end - Date.now()) / 1000);
        if (sisa <= 0) { submitData(); return; }
        let m = Math.floor(sisa / 60);
        let s = sisa % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' + s : s}`;
        if (sisa > 0) requestAnimationFrame(tick);
    }
    tick();
}

function render() {
    let s = state.soal[state.index];
    let sideGrid = state.soal.map((_, i) => `
        <div class="num ${i === state.index ? 'active' : ''} ${state.jawaban[i] ? 'done' : ''}" onclick="goto(${i})">${i + 1}</div>
    `).join('');

    let optionsHtml = ["A", "B", "C", "D"].map(o => {
        let val = s.pilihan[o];
        if (!val) return '';
        let isSel = state.jawaban[state.index] === o;
        return `
        <div class="opsi-item ${isSel ? 'selected' : ''}" onclick="jawab('${o}')">
            <input type="radio" ${isSel ? 'checked' : ''}>
            <span><b>${o}.</b> ${val}</span>
        </div>`;
    }).join('');

    document.getElementById("app").innerHTML = `
    <div class="wrap">
        <div class="content">
            <div class="card-soal">
                <div class="nomor-soal">SOAL NO ${state.index + 1}</div>
                <div class="teks-soal">${s.soal}</div>
                <div class="opsi-container">${optionsHtml}</div>
                <div style="margin-top:auto; display:flex; justify-content:space-between; padding-top:20px">
                    <button class="btn blue" onclick="prev()" ${state.index === 0 ? 'disabled' : ''}>KEMBALI</button>
                    ${state.index === state.soal.length - 1 ? 
                        `<button class="btn green" onclick="popupSubmit()">SELESAI</button>` : 
                        `<button class="btn blue" onclick="next()">LANJUT</button>`}
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="grid-nomor">${sideGrid}</div>
        </div>
    </div>`;
}

function jawab(v) { state.jawaban[state.index] = v; save(); render(); }
function next() { state.index++; save(); render(); }
function prev() { state.index--; save(); render(); }
function goto(i) { state.index = i; save(); render(); }
function save() { localStorage.setItem("cbt_state", JSON.stringify(state)); }

function popupSubmit() {
    modal("Selesai Ujian?", "Pastikan semua jawaban terisi.", [
        { text: "BELUM", cls: "blue" },
        { text: "YA, SELESAI", cls: "red", cb: submitData }
    ]);
}

function submitData() {
    let u = JSON.parse(localStorage.getItem("user"));
    document.getElementById("app").innerHTML = `<div class="content"><h2>Mengirim Jawaban...</h2></div>`;

    fetch(API, {
        method: "POST",
        body: JSON.stringify({
            mode: "submit",
            idLogin: u.idLogin,
            nama: u.nama,
            kelas: u.kelas,
            jawaban: state.jawaban
        })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "success") {
            localStorage.setItem("layer", "hasil");
            showHasil();
        } else alert(res.msg);
    });
}

function showHasil() {
    document.querySelector(".header").style.display = "none";
    document.getElementById("app").innerHTML = `
    <div class="login-container">
        <div class="login-box" style="text-align:center">
            <h2 style="color:var(--success)">TERKIRIM!</h2>
            <p>Jawaban berhasil disimpan.</p>
            <button class="btn blue" onclick="keluar()">LOGOUT</button>
        </div>
    </div>`;
}

function init() {
    let user = localStorage.getItem("user");
    let layer = localStorage.getItem("layer");
    if (!user) { loginUI(); return; }
    
    let u = JSON.parse(user);
    document.getElementById("namaDisp").innerText = u.nama;
    document.getElementById("kelasDisp").innerText = "Kelas: " + u.kelas;

    if (layer === "soal") startExam();
    else if (layer === "hasil") showHasil();
    else showKonfirmasi();
}

function keluar() { localStorage.clear(); location.reload(); }

init();
</script>
</body>
</html>
