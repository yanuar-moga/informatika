<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin CBT</title>

<style>
body{
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
  margin:0;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

.btn{
  background:#3b82f6;
}

.btn-red{
  background:#ef4444;
}

button:disabled{
  background:#64748b;
}

.status{
  margin-top:10px;
  font-size:14px;
  color:#22c55e;
}
</style>

</head>

<body>

<div class="container">

<div class="card">
  <h2>Dashboard Admin CBT</h2>
</div>

<div class="card">
  <h3>Reset 1 Siswa</h3>
  <input id="id" placeholder="Masukkan ID siswa">
  <button class="btn" onclick="reset1()">Reset Akun</button>
</div>

<div class="card">
  <h3>Reset Per Kelas</h3>
  <input id="kelas" placeholder="Contoh: Kelas 7A">
  <button class="btn" onclick="resetKelas()">Reset Kelas</button>
</div>

<div class="card">
  <h3>Reset Semua Akun</h3>
  <button class="btn-red" onclick="resetAll()">RESET SEMUA</button>
</div>

<div id="status" class="status"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwKKIKuT7ugLEjLzSf5e4cYVi-K3v23z6oNGRF1U73RMRIL3LJSsFPncKdE62qm0l4O/exec";

let loading = false;

// ===== POST =====
async function post(data){
  if(loading) return;
  loading = true;

  let res = await fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams(data)
  });

  let json = await res.json();
  loading = false;

  return json;
}

// ===== STATUS =====
function showStatus(msg, color="#22c55e"){
  let el = document.getElementById("status");
  el.style.color = color;
  el.innerText = msg;
}

// ===== RESET 1 =====
async function reset1(){
  let id = document.getElementById("id").value;

  if(!id) return alert("Isi ID dulu");

  if(!confirm("Yakin reset akun ini?")) return;

  let r = await post({
    action:"resetLogin",
    id:id
  });

  if(r.status){
    showStatus("✅ Akun berhasil di-reset");
  }else{
    showStatus("❌ Gagal reset", "#ef4444");
  }
}

// ===== RESET KELAS =====
async function resetKelas(){
  let kelas = document.getElementById("kelas").value;

  if(!kelas) return alert("Isi kelas dulu");

  if(!confirm("Reset semua siswa di kelas ini?")) return;

  let r = await post({
    action:"resetKelas",
    kelas:kelas
  });

  if(r.status){
    showStatus("✅ Kelas berhasil di-reset");
  }else{
    showStatus("❌ Gagal reset", "#ef4444");
  }
}

// ===== RESET ALL =====
async function resetAll(){
  if(!confirm("⚠️ Yakin reset SEMUA akun?")) return;

  let r = await post({
    action:"resetAll"
  });

  if(r.status){
    showStatus("✅ Semua akun berhasil di-reset");
  }else{
    showStatus("❌ Gagal reset", "#ef4444");
  }
}
</script>

</body>
</html>
