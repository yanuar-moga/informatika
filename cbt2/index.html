<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Asesmen Informatika</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  margin: 0;
}

.center { display:flex; justify-content:center; align-items:center; height:100vh; }

.card {
  background:#f2f2f2;
  padding:30px;
  border-radius:15px;
  width:340px;
  text-align:center;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn-login { background:#1f4e94; color:white; }
.btn-jadwal { background:#d9534f; color:white; }

#dashboard { display:none; }

.header {
  background:#1f4e94;
  color:white;
  padding:10px;
  text-align:right;
}

.box {
  background:white;
  padding:20px;
  margin:20px;
  border-radius:10px;
}

#msg { color:red; font-size:13px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <div class="card">
    <h2>CBT Informatika</h2>

    <label>Kelas</label>
    <select id="kelas"></select>

    <label>Username</label>
    <select id="username"></select>

    <label>Password</label>
    <input type="password" id="password">

    <label>Token</label>
    <input type="text" id="token">

    <button class="btn-login" id="btnLogin">Masuk</button>
    <button class="btn-jadwal" id="btnJadwal">Lihat Token</button>

    <p id="msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="header">
    <span id="namaHeader"></span>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="box">
    <p>Nama: <b id="nama"></b></p>
    <p>Kelas: <b id="kelasUser"></b></p>
    <p id="jam"></p>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyPzHYyvvTG94gsKw3xYF5nj-nEx1vgCj9CEbPTaATUflPNv2iTqBHHd1_xmFQpCxGN/exec";

let siswaData = [];
let ip = "";
let idleTimer;
let sessionChecker;

/* =====================
   🔹 INIT APP
===================== */
window.addEventListener("load", initApp);

function initApp() {
  setupEvents();
  getIP();
  loadSiswa();
  startIdleTimer();

  const saved = localStorage.getItem("user");
  if(saved) showDashboard(JSON.parse(saved));
}

/* =====================
   🔹 EVENT
===================== */
function setupEvents() {
  document.getElementById("btnLogin").addEventListener("click", login);
  document.getElementById("kelas").addEventListener("change", filterUser);

  ["mousemove","click","keypress","touchstart"].forEach(evt=>{
    window.addEventListener(evt, startIdleTimer);
  });
}

/* =====================
   🔹 LOAD SISWA
===================== */
function loadSiswa() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      siswaData = data;

      const kelasSet = [...new Set(data.map(s=>s.kelas))];
      const kelasEl = document.getElementById("kelas");

      kelasEl.innerHTML = "<option value=''>Pilih Kelas</option>";
      kelasSet.forEach(k=>{
        kelasEl.innerHTML += `<option value="${k}">${k}</option>`;
      });
    })
    .catch(()=>{
      document.getElementById("msg").innerText = "Gagal load data siswa";
    });
}

/* =====================
   🔹 FILTER USER
===================== */
function filterUser() {
  const kelas = this.value;
  const userEl = document.getElementById("username");

  userEl.innerHTML = "<option value=''>Pilih Siswa</option>";

  siswaData
    .filter(s=>s.kelas===kelas)
    .forEach(s=>{
      userEl.innerHTML += `<option value="${s.username}">${s.nama}</option>`;
    });
}

/* =====================
   🔐 LOGIN
===================== */
function login() {
  const username = usernameEl.value;
  const password = passwordEl.value;
  const token = tokenEl.value;

  if(!username || !password || !token){
    msg.innerText = "Lengkapi semua data";
    return;
  }

  msg.innerText = "Login...";

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({ username, password, token, ip })
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.status==="success"){
      localStorage.setItem("user", JSON.stringify(res));
      showDashboard(res);
    } else {
      msg.innerText = res.msg;
    }
  })
  .catch(()=> msg.innerText="Server error");
}

/* =====================
   📊 DASHBOARD
===================== */
function showDashboard(user){
  loginPage.style.display="none";
  dashboard.style.display="block";

  nama.innerText = user.nama;
  kelasUser.innerText = user.kelas;
  namaHeader.innerText = user.nama;

  setInterval(()=>{
    jam.innerText = new Date().toLocaleTimeString();
  },1000);

  sessionChecker = setInterval(checkSession,15000);
}

/* =====================
   🔁 SESSION CHECK
===================== */
function checkSession(){
  const user = JSON.parse(localStorage.getItem("user"));
  if(!user) return;

  fetch(`${API_URL}?mode=cek_sesi&idLogin=${user.idLogin}`)
    .then(r=>r.json())
    .then(d=>{
      if(d.status==="off"){
        alert("Sesi dihentikan admin");
        logout();
      }
    });
}

/* =====================
   🔒 AUTO LOGOUT
===================== */
function startIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    alert("Auto logout");
    logout();
  },1200000);
}

/* =====================
   🌐 GET IP
===================== */
function getIP(){
  fetch("https://api.ipify.org?format=json")
    .then(r=>r.json())
    .then(d=>ip=d.ip)
    .catch(()=>ip="unknown");
}

/* =====================
   🚪 LOGOUT
===================== */
function logout(){
  localStorage.removeItem("user");
  clearInterval(sessionChecker);
  location.reload();
}
</script>

</body>
</html>
