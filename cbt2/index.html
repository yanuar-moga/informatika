<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT System</title>

<style>
body{
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
  margin:0;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

button{
  padding:10px 15px;
  border:none;
  background:#22c55e;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:disabled{
  background:#64748b;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}

.option{
  background:#334155;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  cursor:pointer;
}

.option:hover{
  background:#475569;
}

img{
  max-width:100%;
  margin-top:10px;
  border-radius:6px;
}
</style>

</head>

<body>

<div class="container">

<div id="login" class="card">
  <h2>Login CBT</h2>

  <input id="token" placeholder="Masukkan Token">
  <button id="btnToken" onclick="cekToken()">Lanjut</button>

<select id="user"></select> <input id="password" placeholder="Password">

<button id="btnLogin" onclick="login()">Login</button>

</div>

<div id="ujian" class="card" style="display:none">
  <h3 id="info"></h3>
  <div id="soalBox"></div>

  <br>
  <button onclick="submitUjian()">Submit Ujian</button>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwKKIKuT7ugLEjLzSf5e4cYVi-K3v23z6oNGRF1U73RMRIL3LJSsFPncKdE62qm0l4O/exec";

let session = "";
let kelas = "";
let soalData = [];
let current = 0;
let userData = {};
let loading = false;

// ===== POST =====
async function post(data){
  if(loading) return;
  loading = true;

  let res = await fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams(data)
  });

  let json = await res.json();
  loading = false;

  return json;
}

// ===== CEK TOKEN =====
async function cekToken(){
  let btn = document.getElementById("btnToken");
  btn.disabled = true;

  let token = document.getElementById("token").value;

  let r = await post({action:"cekToken", token});

  if(r.status){
    kelas = r.kelas;

    let u = await post({action:"getUsers", kelas});

    let sel = document.getElementById("user");
    sel.innerHTML = "";

    u.users.forEach(x=>{
      let opt = document.createElement("option");
      opt.value = x.id;
      opt.text = x.nama;
      sel.appendChild(opt);
    });

  }else{
    alert(r.message);
  }

  btn.disabled = false;
}

// ===== LOGIN =====
async function login(){
  let btn = document.getElementById("btnLogin");
  btn.disabled = true;

  let id = document.getElementById("user").value;
  let password = document.getElementById("password").value;
  let token = document.getElementById("token").value;

  let r = await post({
    action:"login",
    id, password, token
  });

  if(r.status){
    session = r.session_id;
    userData = r;

    document.getElementById("login").style.display="none";
    document.getElementById("ujian").style.display="block";

    loadSoal();

  }else{
    alert(r.message);
  }

  btn.disabled = false;
}

// ===== LOAD SOAL =====
async function loadSoal(){
  let r = await post({action:"getSoal", kelas});
  soalData = r.soal;

  tampilSoal();
}

// ===== TAMPIL SOAL =====
function tampilSoal(){
  let s = soalData[current];

  let html = "<h3>Soal "+(current+1)+"</h3>";
  html += "<p>"+(s[3] || "")+"</p>";

  if(s[4]) html += `<img src="${s[4]}">`;

  ["A","B","C","D","E"].forEach((x,i)=>{
    let txt = s[5+(i*2)];
    let img = s[6+(i*2)];

    if(txt || img){
      html += `<div class="option" onclick="jawab('${x}')">`;

      if(txt) html += `<div>${txt}</div>`;
      if(img) html += `<img src="${img}">`;

      html += "</div>";
    }
  });

  document.getElementById("soalBox").innerHTML = html;
}

// ===== SIMPAN JAWABAN =====
async function jawab(pil){
  let id = userData.session_id.split("_")[1];

  await post({
    action:"saveJawaban",
    id:id,
    nama:userData.nama,
    kelas:userData.kelas,
    no:current+1,
    jawaban:pil
  });

  current++;

  if(current < soalData.length){
    tampilSoal();
  }else{
    alert("Semua soal selesai, silakan submit");
  }
}

// ===== SUBMIT =====
async function submitUjian(){
  let id = userData.session_id.split("_")[1];

  let r = await post({
    action:"submit",
    id
  });

  if(r.status){
    alert("Nilai Anda: " + r.nilai);
  }else{
    alert(r.message);
  }
}
</script>

</body>
</html>
