<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyPzHYyvvTG94gsKw3xYF5nj-nEx1vgCj9CEbPTaATUflPNv2iTqBHHd1_xmFQpCxGN/exec";

let siswaData = [];
let ip = "";
let userAgent = navigator.userAgent;
let idleTimer;
let sessionChecker;

/* =========================
   🔒 AUTO LOGOUT
========================= */
function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        alert("Sesi berakhir karena tidak ada aktivitas selama 20 menit.");
        logout();
    }, 1200000);
}

/* =========================
   🔁 CEK SESSION
========================= */
function checkSessionStatus() {
    const savedUser = JSON.parse(localStorage.getItem("user"));
    if (!savedUser || !savedUser.idLogin) return;

    fetch(`${API_URL}?mode=cek_sesi&idLogin=${savedUser.idLogin}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "off") {
                alert(data.msg || "Sesi Anda telah dihentikan oleh Admin.");
                logout();
            }
        })
        .catch(() => console.log("Gagal cek sesi"));
}

/* =========================
   🌐 AMBIL IP
========================= */
function getIP() {
  fetch("https://api.ipify.org?format=json")
    .then(res => res.json())
    .then(data => ip = data.ip)
    .catch(() => ip = "Unknown");
}

/* =========================
   📥 LOAD DATA SISWA
========================= */
function loadSiswa() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      siswaData = data;
      const kelasSelect = document.getElementById('kelas');

      let setKelas = new Set();
      data.forEach(s => setKelas.add(s.kelas));

      kelasSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';

      setKelas.forEach(k => {
        kelasSelect.innerHTML += `<option value="${k}">${k}</option>`;
      });
    })
    .catch(() => {
      document.getElementById('msg').innerText = "Gagal memuat data siswa";
    });
}

/* =========================
   🔽 FILTER USER
========================= */
document.getElementById('kelas').onchange = function() {
  const userSelect = document.getElementById('username');
  userSelect.innerHTML = '<option value="">-- Pilih Siswa --</option>';

  siswaData
    .filter(s => s.kelas === this.value)
    .forEach(s => {
      userSelect.innerHTML += `<option value="${s.username}">${s.nama}</option>`;
    });
};

/* =========================
   👁 TOGGLE PASSWORD
========================= */
function togglePassword() {
  const passInput = document.getElementById('password');
  passInput.type = passInput.type === "password" ? "text" : "password";
}

/* =========================
   🔐 LOGIN
========================= */
function login() {
  const userVal = document.getElementById('username').value;
  const passVal = document.getElementById('password').value;
  const tokenVal = document.getElementById('token').value;
  const msgLabel = document.getElementById('msg');

  if(!userVal || !passVal || !tokenVal) {
    msgLabel.innerText = "Lengkapi semua data!";
    return;
  }

  msgLabel.innerText = "Memproses...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      username: userVal,
      password: passVal,
      token: tokenVal,
      ip: ip,
      userAgent: userAgent
    })
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "success") {
      localStorage.setItem("user", JSON.stringify(res));
      showDashboard(res);
    } else {
      msgLabel.innerText = res.msg;
    }
  })
  .catch(() => {
    msgLabel.innerText = "Terjadi kesalahan koneksi.";
  });
}

/* =========================
   📊 DASHBOARD
========================= */
function showDashboard(user) {
  document.getElementById('loginPage').style.display = "none";
  document.getElementById('dashboard').style.display = "block";

  document.getElementById('nama').innerText = user.nama;
  document.getElementById('kelasUser').innerText = user.kelas;
  document.getElementById('namaHeader').innerText = user.nama;
  document.getElementById('kelasHeader').innerText = "Kelas " + user.kelas;

  setTanggal();
  setInterval(getLocalTime, 1000);

  checkSessionStatus();
  sessionChecker = setInterval(checkSessionStatus, 15000);
}

/* =========================
   📅 TANGGAL
========================= */
function setTanggal() {
  const now = new Date();
  const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  document.getElementById('tanggal').innerText =
    hari[now.getDay()] + ", " +
    now.getDate() + " " +
    bulan[now.getMonth()] + " " +
    now.getFullYear();
}

/* =========================
   ⏰ JAM
========================= */
function getLocalTime() {
  document.getElementById('jamServer').innerText =
    "⏰ " + new Date().toLocaleTimeString() + " WIB";
}

/* =========================
   🚪 LOGOUT
========================= */
function logout() {
  localStorage.removeItem("user");
  clearInterval(sessionChecker);
  location.reload();
}

/* =========================
   📋 MODAL
========================= */
function openConfirm() {
  document.getElementById('confirmModal').style.display = "flex";
}
function closeConfirm() {
  document.getElementById('confirmModal').style.display = "none";
}
function lanjutUjian() {
  if(!document.getElementById('checkData').checked) {
    alert("Centang dulu konfirmasi!");
    return;
  }
  window.location.href = "HALAMAN_SOAL_CBT.html";
}

function openModal() {
  document.getElementById('modalJadwal').style.display = "flex";
  const body = document.getElementById('jadwalBody');

  body.innerHTML = "<tr><td colspan='3'>Memuat data...</td></tr>";

  fetch(API_URL + "?mode=token")
    .then(r => r.json())
    .then(data => {
      body.innerHTML = "";
      data.forEach(d => {
        body.innerHTML += `<tr>
          <td>${d.kelas}</td>
          <td>${d.mulai}</td>
          <td>${d.selesai}</td>
        </tr>`;
      });
    });
}
function closeModal() {
  document.getElementById('modalJadwal').style.display = "none";
}

/* =========================
   🚀 INIT (FIX DOUBLE ONLOAD)
========================= */
window.addEventListener("load", function () {
  resetIdleTimer();
  getIP();
  loadSiswa();

  const savedUser = localStorage.getItem("user");
  if(savedUser) {
    showDashboard(JSON.parse(savedUser));
  }

  ["mousemove","mousedown","touchstart","click","keypress"]
    .forEach(evt => window.addEventListener(evt, resetIdleTimer));
});
</script>
