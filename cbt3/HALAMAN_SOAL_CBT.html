<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Asesmen Informatika</title>

    <style>
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .timer { 
            background: white; 
            color: var(--primary-blue); 
            padding: 5px 15px; 
            border-radius: 20px;
            font-weight: bold;
        }

        .main-layout { 
            display: flex; 
            flex-direction: column; 
            max-width: 1100px; 
            margin: 20px auto; 
            gap: 20px; 
            padding: 0 15px 160px;
        }

        @media(min-width: 768px) { .main-layout { flex-direction: row; } }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .opsi {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .opsi:hover { background: #f0f4f8; }
        .opsi.selected {
            background: #e1ecff;
            border-color: var(--btn-blue);
            font-weight: bold;
            color: var(--primary-blue);
        }

        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .kotak-nomor {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .kotak-nomor.sudah { background: var(--success); color: white; }
        .kotak-nomor.aktif { border: 3px solid var(--gold); transform: scale(1.1); }

        .nav-bottom {
            position: fixed; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between;
            background: white; padding: 10px 20px;
            border-top: 1px solid #eee; box-sizing: border-box; z-index: 900;
        }

        .footer-info {
            position: fixed; bottom: 0; width: 100%;
            background: #222; color: #ccc;
            text-align: center; padding: 8px 0;
            font-size: 0.85em; border-top: 2px solid var(--gold); z-index: 1000;
        }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-nav { background: var(--btn-blue); color: white; }

        #layarHasil {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none;
            flex-direction: column; justify-content: center;
            align-items: center; z-index: 10001; text-align: center; padding: 20px;
        }

        .skor-box { font-size: 4em; color: var(--primary-blue); font-weight: 900; margin: 15px 0; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }

        /* ===== CUSTOM ALERT ===== */
        .custom-alert-overlay{
            position:fixed;
            top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.4);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:20000;
        }

        .custom-alert-box{
            background:white;
            padding:25px;
            border-radius:15px;
            width:320px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .alert-title{
            font-weight:bold;
            font-size:18px;
            margin-bottom:10px;
        }

        .alert-text{
            font-size:14px;
            color:#555;
            margin-bottom:20px;
        }

        .alert-actions{
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .btn-blue{
            background:#3b6fd8;
            color:white;
            flex:1;
        }

        .btn-red{
            background:#e53935;
            color:white;
            flex:1;
        }
    </style>
</head>

<body>

<!-- CUSTOM ALERT -->
<div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div class="alert-title" id="alertTitle">Konfirmasi</div>
        <div class="alert-text" id="alertText"></div>
        <div class="alert-actions" id="alertActions"></div>
    </div>
</div>

<div id="loading">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
    <p id="loadingText" style="margin-top:15px; font-weight:bold; color:var(--primary-blue);">Menghubungkan ke Server...</p>
</div>

<div id="layarHasil">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="100">
    <h2 style="color:var(--primary-blue); margin-top:20px;">Terima Kasih!</h2>
    <p style="font-size:1.1em; color:#555;">Anda telah berhasil melaksanakan asesmen.</p>
    
    <div style="margin: 25px 0; padding:20px; background:#f0f7ff; border-radius:20px; width:100%; max-width:280px;">
        <span style="font-weight:bold; color:#777; font-size:0.9em;">NILAI HASIL TES</span>
        <div class="skor-box" id="nilaiFinal">0</div>
    </div>

    <p style="color: #888; font-size: 0.9em; margin-bottom: 20px;">Klik tombol di bawah untuk keluar dengan aman.</p>
    
    <button class="btn" style="background:var(--btn-red); color:white; padding:15px 50px; font-size:1em;" onclick="logOutSiswa()">
        Keluar
    </button>
</div>

<div id="app-content">
    <!-- (SEMUA KODE TETAP SAMA, TIDAK DIUBAH) -->
</div>

<script>
/* ===== CUSTOM ALERT FUNCTION ===== */
function showAlert(pesan){
    document.getElementById("alertTitle").innerText="Pemberitahuan";
    document.getElementById("alertText").innerText=pesan;
    document.getElementById("alertActions").innerHTML=
        `<button class="btn btn-blue" onclick="closeAlert()">Oke</button>`;
    document.getElementById("customAlert").style.display="flex";
}

function showConfirm(pesan,callback){
    document.getElementById("alertTitle").innerText="Konfirmasi Data";
    document.getElementById("alertText").innerText=pesan;
    document.getElementById("alertActions").innerHTML=
        `<button class="btn btn-blue" onclick="closeAlert()">Batal</button>
         <button class="btn btn-red" onclick="confirmYes()">Kirim</button>`;
    document.getElementById("customAlert").style.display="flex";
    window._confirmCallback=callback;
}

function confirmYes(){
    closeAlert();
    if(window._confirmCallback) window._confirmCallback();
}

function closeAlert(){
    document.getElementById("customAlert").style.display="none";
}

/* ===== PERUBAHAN ALERT ===== */
async function loadSoal() {
    try {
        const response = await fetch(API_URL + "?mode=getSoal");
        listSoal = await response.json();
        renderSoal();
        document.getElementById("loading").style.display = "none";
    } catch (error) { showAlert("Gagal memuat soal."); }
}

async function kirimJawaban() {
    const jumlahDijawab = Object.keys(jawabanSiswa).length;

    showConfirm(`Anda menjawab ${jumlahDijawab}/${listSoal.length} soal. Selesaikan ujian?`, async () => {

        document.getElementById("loading").style.display = "flex";
        document.getElementById("loadingText").innerText = "Menyimpan & Menghitung Skor...";

        const payload = {
            action: "kirimJawaban",
            idLogin: userSession.idLogin,
            nama: userSession.nama,
            kelas: userSession.kelas,
            jawaban: jawabanSiswa
        };

        try {
            await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            
            let skorLokal = 0;
            listSoal.forEach(s => { if(jawabanSiswa[s.no] === s.kunci) skorLokal += Number(s.skor); });

            localStorage.removeItem("endTime");
            localStorage.removeItem("jawabanSiswa");

            setTimeout(() => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("app-content").style.display = "none";
                document.getElementById("layarHasil").style.display = "flex";
                document.getElementById("nilaiFinal").innerText = skorLokal;
            }, 2000);

        } catch (error) {
            document.getElementById("layarHasil").style.display = "flex";
        }

    });
}
</script>
</body>
</html>
