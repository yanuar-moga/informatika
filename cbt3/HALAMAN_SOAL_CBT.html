<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Asesmen Informatika</title>

    <style>
        :root {
            --primary-blue: #1f4e94;
            --btn-blue: #007bff; 
            --btn-red: #ed1c24;
            --gold: #d4af37;
            --light-bg: #f4f7fa;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        .header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .timer { 
            background: white; 
            color: var(--primary-blue); 
            padding: 5px 15px; 
            border-radius: 20px;
            font-weight: bold;
        }

        .main-layout { 
            display: flex; 
            flex-direction: column; 
            max-width: 1100px; 
            margin: 20px auto; 
            gap: 20px; 
            padding: 0 15px 160px;
        }

        @media(min-width: 768px) { .main-layout { flex-direction: row; } }

        .quiz-container { flex: 3; }
        .sidebar { flex: 1; }

        .soal-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .opsi {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .opsi:hover { background: #f0f4f8; }
        .opsi.selected {
            background: #e1ecff;
            border-color: var(--btn-blue);
            font-weight: bold;
            color: var(--primary-blue);
        }

        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .kotak-nomor {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .kotak-nomor.sudah { background: var(--success); color: white; }
        .kotak-nomor.aktif { border: 3px solid var(--gold); transform: scale(1.1); }

        .nav-bottom {
            position: fixed; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between;
            background: white; padding: 10px 20px;
            border-top: 1px solid #eee; box-sizing: border-box; z-index: 900;
        }

        .footer-info {
            position: fixed; bottom: 0; width: 100%;
            background: #222; color: #ccc;
            text-align: center; padding: 8px 0;
            font-size: 0.85em; border-top: 2px solid var(--gold); z-index: 1000;
        }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-nav { background: var(--btn-blue); color: white; }

        #layarHasil {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none;
            flex-direction: column; justify-content: center;
            align-items: center; z-index: 10001; text-align: center; padding: 20px;
        }

        .skor-box { font-size: 4em; color: var(--primary-blue); font-weight: 900; margin: 15px 0; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }

        /* ALERT */
        .custom-alert-overlay{
            position:fixed;
            top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.4);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:20000;
        }

        .custom-alert-box{
            background:white;
            padding:25px;
            border-radius:15px;
            width:320px;
            text-align:center;
        }

        .alert-actions{
            display:flex;
            gap:10px;
        }

        .btn-blue{background:#3b6fd8;color:white;flex:1;}
        .btn-red{background:#e53935;color:white;flex:1;}
    </style>
</head>

<body>

<div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div id="alertText"></div>
        <div id="alertActions" class="alert-actions"></div>
    </div>
</div>

<div id="loading">
    <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png" width="80">
    <p id="loadingText">Menghubungkan ke Server...</p>
</div>

<div id="layarHasil">...</div>

<div id="app-content">
    <div class="header">
        <div>
            <b id="displayNama">-</b><br>
            <small id="displayKelas">-</small>
        </div>
        <div class="timer" id="timerDisplay">00:00:00</div>
    </div>

    <div class="main-layout">
        <div class="quiz-container">
            <div id="quizArea"></div>
        </div>

        <div class="sidebar">
            <div style="background:white; padding:20px;">
                <h4>Navigasi Soal</h4>
                <div id="gridNomor" class="grid-nomor"></div>
                <button class="btn" style="background:var(--success); color:white; width:100%;" onclick="kirimJawaban()">SELESAI</button>
            </div>
        </div>
    </div>

    <div class="nav-bottom">
        <button class="btn btn-nav" onclick="changeSoal(-1)">Sebelumnya</button>
        <div id="infoHalaman">Soal</div>
        <button class="btn btn-nav" onclick="changeSoal(1)">Berikutnya</button>
    </div>

    <div class="footer-info">CBT Asesmen Informatika</div>
</div>

<script>
function showAlert(msg){
    document.getElementById("alertText").innerText=msg;
    document.getElementById("alertActions").innerHTML=
    `<button class="btn btn-blue" onclick="closeAlert()">OK</button>`;
    document.getElementById("customAlert").style.display="flex";
}

function showConfirm(msg,cb){
    document.getElementById("alertText").innerText=msg;
    document.getElementById("alertActions").innerHTML=
    `<button class="btn btn-blue" onclick="closeAlert()">Batal</button>
     <button class="btn btn-red" onclick="yes()">Kirim</button>`;
    window._cb=cb;
    document.getElementById("customAlert").style.display="flex";
}

function yes(){closeAlert();window._cb();}
function closeAlert(){document.getElementById("customAlert").style.display="none";}
</script>

</body>
</html>
