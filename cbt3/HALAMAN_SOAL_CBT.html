<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Ujian CBT</title>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  margin:0;
}

.container{
  max-width:900px;
  margin:auto;
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:16px;
}

.header{
  display:flex;
  justify-content:space-between;
}

#timer{
  font-weight:bold;
  color:#2563eb;
}

#nomor{
  display:flex;
  flex-wrap:wrap;
  margin:10px 0;
}

#nomor span{
  width:32px;height:32px;
  margin:3px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#e2e8f0;
  border-radius:6px;
  cursor:pointer;
}

.dijawab{background:#22c55e!important;color:white;}

.opsi{
  padding:12px;
  margin:10px 0;
  border:2px solid #ccc;
  border-radius:10px;
  cursor:pointer;
}

.opsi.aktif{
  border:2px solid #2563eb;
  background:#eff6ff;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.nav{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div id="userInfo"></div>
<div id="timer"></div>
</div>

<h2>Ujian CBT</h2>

<div id="progressBox" style="height:8px;background:#ddd;border-radius:10px;">
<div id="progressBar" style="height:8px;width:0%;background:#2563eb;border-radius:10px;"></div>
</div>

<div id="nomor"></div>
<div id="soal"></div>

<div class="nav">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

<button onclick="submitFinal()" style="margin-top:15px;width:100%;background:#ef4444;color:white;">
Submit Ujian
</button>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec";

let user = JSON.parse(localStorage.getItem("user"));
let soal=[], jawaban=[], no=0;
let waktu=90*60;

// ================= VALIDASI SESSION =================
if(!user){
  alert("Session tidak ditemukan");
  location.href="index.html";
}

// ================= POST =================
function postData(params,callback){
  fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:new URLSearchParams(params)
  })
  .then(res=>res.json())
  .then(callback);
}

// ================= LOAD SOAL =================
function loadSoal(){

  postData({
    action:"getSoal",
    kelas:user.kelas
  },function(res){

    if(!res.status){
      alert("Gagal load soal");
      return;
    }

    soal=res.soal;

    let simpan=localStorage.getItem("jawaban");
    jawaban=simpan?JSON.parse(simpan):new Array(soal.length).fill("");

    document.getElementById("nomor").innerHTML="";

    soal.forEach((s,i)=>{
      document.getElementById("nomor").innerHTML+=
      `<span id="n${i}" onclick="goto(${i})">${i+1}</span>`;
    });

    tampil();
  });
}

// ================= TAMPIL =================
function tampil(){

  let s=soal[no];

  let html=`<div><b>${no+1}.</b> ${s[1]}</div>`;

  if(s[3]){
    html+=`<img src="${s[3]}" style="max-width:100%;margin:10px 0;">`;
  }

  ["A","B","C","D","E"].forEach((k,i)=>{

    let text=s[4+i];
    if(!text) return;

    let aktif = jawaban[no]==k ? "aktif" : "";

    html+=`
    <div class="opsi ${aktif}" onclick="pilih('${k}',this)">
      <b>${k}.</b> ${text}
    </div>`;
  });

  document.getElementById("soal").innerHTML=html;

  updateProgress();
}

// ================= PILIH =================
function pilih(val,el){

  jawaban[no]=val;

  document.querySelectorAll(".opsi").forEach(x=>x.classList.remove("aktif"));
  el.classList.add("aktif");

  document.getElementById("n"+no).classList.add("dijawab");

  localStorage.setItem("jawaban",JSON.stringify(jawaban));

  // SAVE KE GAS
  postData({
    action:"saveJawaban",
    id:user.session_id,
    nama:user.nama,
    kelas:user.kelas,
    no:no+1,
    jawaban:val
  },function(){});

  updateProgress();
}

// ================= NAV =================
function next(){
  if(no<soal.length-1){
    no++; tampil();
  }else{
    submitFinal();
  }
}

function prev(){
  if(no>0){
    no--; tampil();
  }
}

function goto(n){
  no=n;
  tampil();
}

// ================= PROGRESS =================
function updateProgress(){
  let j=jawaban.filter(x=>x!="").length;
  document.getElementById("progressBar").style.width=(j/soal.length*100)+"%";
}

// ================= TIMER =================
function timer(){
  setInterval(()=>{
    waktu--;

    let m=Math.floor(waktu/60);
    let d=waktu%60;
    if(d<10)d="0"+d;

    document.getElementById("timer").innerText=`⏱ ${m}:${d}`;

    if(waktu<=0){
      alert("Waktu habis!");
      submitFinal();
    }

  },1000);
}

// ================= SUBMIT =================
function submitFinal(){

  if(!confirm("Yakin mau submit?")) return;

  postData({
    action:"submit",
    id:user.session_id
  },function(res){

    if(res.status){
      alert("Nilai: "+res.nilai);
      logout();
    }else{
      alert(res.message);
    }

  });
}

// ================= SESSION CHECK =================
setInterval(()=>{
  postData({
    action:"cekSession",
    session_id:user.session_id
  },function(res){
    if(!res.status){
      alert("Session habis");
      logout();
    }
  });
},15000);

// ================= LOGOUT =================
function logout(){

  postData({
    action:"logout",
    session_id:user.session_id
  },function(){
    localStorage.clear();
    location.href="index.html";
  });
}

// ================= ANTI REFRESH =================
window.onbeforeunload=function(){
  return "Jangan refresh!";
};

// ================= INIT =================
window.onload=function(){

  document.getElementById("userInfo").innerText=
    user.nama+" | "+user.kelas;

  loadSoal();
  timer();
};

</script>

</body>
</html>
