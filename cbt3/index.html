<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Asesmen Informatika</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #b3c7d6, #d9e2ec);
  margin: 0;
}

.center {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  background:#f2f2f2;
  padding:30px;
  border-radius:15px;
  width:340px;
  text-align:center;
}

input,select,button {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}

button {
  background:#1f4e94;
  color:white;
  border:none;
  cursor:pointer;
}

#dashboard {display:none;}

.header {
  background:#1f4e94;
  color:white;
  padding:10px;
  text-align:right;
}
</style>
</head>

<body>

<div id="loginPage" class="center">
  <div class="card">
    <h2>CBT Informatika</h2>

    <select id="kelas">
      <option value="">-- Pilih Kelas --</option>
      <option value="X">X</option>
      <option value="XI">XI</option>
      <option value="XII">XII</option>
    </select>

    <select id="username">
      <option value="">-- Pilih Siswa --</option>
    </select>

    <input type="password" id="password" placeholder="Password">
    <input type="text" id="token" placeholder="Token">

    <button onclick="login()">LOGIN</button>
    <p id="msg"></p>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <span id="namaHeader"></span>
    <button onclick="logout()">Logout</button>
  </div>

  <div style="text-align:center;padding:20px;">
    <h2>Dashboard CBT</h2>
    <p id="nama"></p>
    <p id="kelasUser"></p>

    <button onclick="mulai()">Mulai Ujian</button>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwf_Hza9uzl9mdE-iiYZExPQ1Q7e2NsrVKhy48Bn15YtKzZGw_OLRTM3AYDu0d5mx2X/exec";

let sessionChecker;
let idleTimer;

// ================= DEVICE =================
const device = btoa(navigator.userAgent + screen.width + screen.height);

// ================= LOAD USER =================
document.getElementById('kelas').onchange = function(){
  const kelas = this.value;

  fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:new URLSearchParams({
      action:"getUsers",
      kelas:kelas
    })
  })
  .then(res=>res.json())
  .then(res=>{
    const userSelect = document.getElementById('username');
    userSelect.innerHTML = '<option value="">-- Pilih Siswa --</option>';

    if(res.status){
      res.users.forEach(u=>{
        userSelect.innerHTML += `<option value="${u.id}">${u.nama}</option>`;
      });
    }
  });
};

// ================= LOGIN =================
function login(){
  const id = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const token = document.getElementById('token').value;

  if(!id || !password || !token){
    document.getElementById('msg').innerText="Lengkapi data!";
    return;
  }

  fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:new URLSearchParams({
      action:"login",
      id:id,
      password:password,
      token:token,
      device:device
    })
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.status){
      localStorage.setItem("user",JSON.stringify(res));
      showDashboard(res);
    }else{
      document.getElementById('msg').innerText=res.message;
    }
  });
}

// ================= DASHBOARD =================
function showDashboard(user){
  document.getElementById('loginPage').style.display="none";
  document.getElementById('dashboard').style.display="block";

  document.getElementById('nama').innerText=user.nama;
  document.getElementById('kelasUser').innerText=user.kelas;
  document.getElementById('namaHeader').innerText=user.nama;

  startSessionCheck();
  resetIdleTimer();
}

// ================= SESSION =================
function startSessionCheck(){
  sessionChecker = setInterval(()=>{
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user) return;

    fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams({
        action:"cekSession",
        session_id:user.session_id
      })
    })
    .then(res=>res.json())
    .then(res=>{
      if(!res.status){
        alert("Session habis");
        logout();
      }
    });

  },15000);
}

// ================= LOGOUT =================
function logout(){
  const user = JSON.parse(localStorage.getItem("user"));

  if(user){
    fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams({
        action:"logout",
        session_id:user.session_id
      })
    });
  }

  localStorage.removeItem("user");
  clearInterval(sessionChecker);
  location.reload();
}

// ================= FULLSCREEN =================
function enterFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
}

// ================= START =================
function mulai(){
  enterFullscreen();
  alert("Ujian dimulai!");
}

// ================= ANTI TAB =================
let warning=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    warning++;
    alert("Jangan pindah tab!");
    if(warning>=3){
      alert("Dikeluarkan!");
      logout();
    }
  }
});

// ================= ANTI INSPECT =================
document.addEventListener("contextmenu",e=>e.preventDefault());

document.onkeydown=function(e){
  if(e.key==="F12" || (e.ctrlKey && e.shiftKey && ["I","J"].includes(e.key))){
    return false;
  }
};

// ================= IDLE LOGOUT =================
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    alert("Logout karena idle");
    logout();
  },1200000);
}

window.onload=function(){
  resetIdleTimer();

  const saved = localStorage.getItem("user");
  if(saved){
    showDashboard(JSON.parse(saved));
  }
};

window.onmousemove=resetIdleTimer;
window.onkeypress=resetIdleTimer;

</script>

</body>
</html>
