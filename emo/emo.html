<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO — Widget Buku Tamu Chat Balon</title>
<style>
  /* EMO — Scope Widget */
  #ai-emo-widget {
    --emo-cyan: #00f2fe;
    --emo-blue: #4facfe;
    --emo-dark: #0d1322;
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 99999;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f0f6ff;
  }
  #ai-emo-widget * { box-sizing: border-box; }

  /* Balon Chat Interaktif Melayang */
  #ai-emo-chat-bubble {
    position: absolute;
    bottom: 170px;
    right: 10px;
    background: linear-gradient(135deg, rgba(18, 26, 43, 0.96), rgba(8, 12, 22, 0.98));
    border: 1px solid rgba(0, 242, 254, 0.4);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.25);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 14px 16px 14px;
    width: 270px;
    font-size: 13px;
    line-height: 1.4;
    color: #e2f1ff;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    pointer-events: auto;
  }
  #ai-emo-chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 35px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid rgba(8, 12, 22, 0.98);
  }
  #ai-emo-chat-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  #ai-emo-speech-text {
    display: block;
    word-break: break-word;
  }
  #emo-bubble-close {
    position: relative;
    float: right;
    top: auto;
    right: auto;
    margin: -2px -2px 4px 8px;
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(0,242,254,.35);
    border-radius: 50%;
    background: rgba(0,242,254,.09);
    color: #dffaff;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }
  #emo-bubble-close:hover { background: rgba(0,242,254,.22); transform: scale(1.08); }

  /* Input Form di Dalam Balon Chat (Default Disembunyikan) */
  #emo-chat-input-wrapper {
    display: none;
    gap: 6px;
    margin-top: 10px;
  }
  #emo-chat-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 242, 254, 0.3);
    border-radius: 10px;
    padding: 6px 10px;
    color: #fff;
    font-size: 12px;
    outline: none;
  }
  #emo-chat-input:focus {
    border-color: var(--emo-cyan);
    box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
  }
  .emo-send-btn {
    background: linear-gradient(135deg, var(--emo-cyan), var(--emo-blue));
    border: none;
    border-radius: 10px;
    color: #040814;
    font-weight: bold;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .emo-send-btn:active { transform: scale(0.95); }

  /* Tombol Pilihan Konfirmasi (Ya / Tidak) */
  .emo-options-wrapper {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .emo-opt-btn {
    flex: 1;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: transform 0.1s;
  }
  .emo-opt-yes { background: var(--emo-cyan); color: #040814; }
  .emo-opt-no { background: rgba(255, 255, 255, 0.15); color: #e2f1ff; border: 1px solid rgba(255, 255, 255, 0.2); }
  .emo-opt-btn:active { transform: scale(0.95); }

  /* Launcher Button & Avatar */
  #ai-emo-launcher {
    display: block;
    width: 115px;
    height: 165px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    position: relative;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,0.45));
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease;
  }
  #ai-emo-launcher:hover { transform: scale(1.04); }
  #ai-emo-launcher svg { display:block; width:100%; height:100%; overflow:visible; }

  /* EKSPRESI & MOOD EMO */
  #ai-emo-launcher .eye { transition: transform .18s ease; transform-box: fill-box; transform-origin: center; }
  #ai-emo-launcher .brow { transition: all .2s ease; }
  #ai-emo-launcher .eye-smile { display: none; }
  #ai-emo-launcher .eye-rect { transform-box: fill-box; transform-origin: center; }
  #ai-emo-launcher.blinking .eye-rect { transform: scaleY(.08); }
  #ai-emo-launcher[data-mood="curious"] .eye { transform: scale(1.12) translateY(-1px); }
  #ai-emo-launcher[data-mood="curious"] .brow { transform: translateY(-4px); }
  #ai-emo-launcher[data-mood="love"] .eye { filter: drop-shadow(0 0 5px #ff6bc8); }
  #ai-emo-launcher[data-mood="love"] .brow { stroke: #ff8bd7; }
  #ai-emo-launcher[data-mood="sleepy"] .eye { transform: scaleY(.28); }
  #ai-emo-launcher[data-mood="dance"] .emo-body-group { animation: emo-dance .55s ease-in-out infinite alternate; transform-origin: 60px 100px; }
  @keyframes emo-dance { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(-4px); } }


  #ai-emo-launcher[data-mood="suspicious"] .brow.left { transform: rotate(-16deg) translateY(-2px); }
  #ai-emo-launcher[data-mood="suspicious"] .brow.right { transform: rotate(12deg) translateY(2px); }
  #ai-emo-launcher[data-mood="suspicious"] .eye.left { transform: scaleY(.72); }
  #ai-emo-launcher[data-mood="suspicious"] .eye.right { transform: scaleY(.86); }

  #ai-emo-launcher[data-mood="chatty"] .brow.left { transform: translateY(-3px) rotate(-8deg); }
  #ai-emo-launcher[data-mood="chatty"] .brow.right { transform: translateY(-3px) rotate(8deg); }
  #ai-emo-launcher[data-mood="chatty"] .eye { transform: scale(1.08); }

  #ai-emo-launcher[data-mood="look-left"] .eye { transform: translateX(-6px); }
  #ai-emo-launcher[data-mood="look-right"] .eye { transform: translateX(6px); }

  #ai-emo-launcher[data-mood="whistle"] .brow.left { transform: translateY(-4px) rotate(-10deg); }
  #ai-emo-launcher[data-mood="whistle"] .brow.right { transform: translateY(-4px) rotate(10deg); }
  #ai-emo-launcher[data-mood="whistle"] .eye { transform: scale(0.85); }

  #ai-emo-launcher[data-mood="grumble"] .brow.left { transform: translateY(4px) rotate(22deg); }
  #ai-emo-launcher[data-mood="grumble"] .brow.right { transform: translateY(4px) rotate(-22deg); }
  #ai-emo-launcher[data-mood="grumble"] .eye { transform: scaleY(0.4) translateY(2px); }

  #ai-emo-launcher[data-mood="smile"] .brow { transform: translateY(-3px); }
  #ai-emo-launcher[data-mood="smile"] .eye-rect { display: none; }
  #ai-emo-launcher[data-mood="smile"] .eye-smile { display: block; }

  /* Animasi Tubuh Saja (Bayangan di Lantai Tetap Diam) */
  #ai-emo-launcher[data-mood="hello"] { animation: emo-wave .6s ease-in-out 2; transform-origin: 50% 85%; }
  #ai-emo-launcher[data-mood="idle"] .emo-body-group { animation: emo-float 3.5s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="jump"] .emo-body-group { animation: emo-jump-high 0.6s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="run"] .emo-body-group { animation: emo-run-tilt 0.3s ease-in-out infinite alternate; }

  #ai-emo-launcher[data-mood="laugh"], #ai-emo-launcher[data-mood="excited"] { animation: emo-bounce .4s ease-in-out 3; }
  #ai-emo-launcher[data-mood="chatty"], #ai-emo-launcher[data-mood="whistle"] { animation: emo-bounce 0.35s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="grumble"] { animation: emo-shake 0.2s ease-in-out infinite; }

  @keyframes emo-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes emo-jump-high { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes emo-run-tilt { 0% { transform: translateY(2px) rotate(6deg); } 100% { transform: translateY(-4px) rotate(10deg); } }
  @keyframes emo-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes emo-wave { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(6deg); } 70% { transform: rotate(-6deg); } }
  @keyframes emo-shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1.5px, 1px); } 75% { transform: translate(1.5px, -1px); } }

  @media(max-width: 480px) {
    #ai-emo-widget { right: 12px; bottom: 12px; }
    #ai-emo-launcher { width: 105px; height: 155px; }
    #ai-emo-chat-bubble { bottom: 155px; width: calc(100vw - 40px); max-width: 280px; }
  }
</style>
<meta name="theme-color" content="#0d1322">
</head>
<body>

<div id="ai-emo-widget">
  <!-- Balon Percakapan Melayang Interaktif -->
  <div id="ai-emo-chat-bubble" class="show">
    <button type="button" id="emo-bubble-close" aria-label="Tutup balon percakapan" title="Tutup">×</button>
    <span id="ai-emo-speech-text">Hai, aku EMO ✨</span>
    <div id="emo-chat-input-wrapper">
      <input type="text" id="emo-chat-input" placeholder="Tulis balasan..." autocomplete="off">
      <button class="emo-send-btn" id="emo-chat-send">Kirim</button>
    </div>

    <div id="emo-chat-options" class="emo-options-wrapper" style="display: none;">
      <button class="emo-opt-btn emo-opt-yes" id="emo-opt-yes">Ya, Kirim!</button>
      <button class="emo-opt-btn emo-opt-no" id="emo-opt-no">🔄 Ulangi</button>
    </div>
  </div>

  <!-- Launcher Karakter Robot EMO -->
  <button id="ai-emo-launcher" type="button" data-mood="idle" aria-label="Karakter EMO">
    <svg viewBox="0 0 120 175" role="img">
      <defs>
        <!-- Bayangan Lantai Tetap Diam di Bawah -->
        <radialGradient id="emo-shadow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
          <stop offset="60%" stop-color="#000000" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="emo-hp-band-outer" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#414a5e"/><stop offset="100%" stop-color="#0a0d14"/>
        </linearGradient>
        <linearGradient id="emo-earcup-seamless" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#475166"/><stop offset="100%" stop-color="#080a0f"/>
        </linearGradient>
        <linearGradient id="emo-head-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#363d4e"/><stop offset="100%" stop-color="#10141d"/>
        </linearGradient>
        <linearGradient id="emo-screen-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#181c26"/><stop offset="100%" stop-color="#080a0e"/>
        </linearGradient>
        <linearGradient id="emo-leg-bevel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4f5970"/><stop offset="100%" stop-color="#070a0f"/>
        </linearGradient>
        <linearGradient id="emo-foot-bevel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#454f63"/><stop offset="100%" stop-color="#0a0d14"/>
        </linearGradient>

        <filter id="emo-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- BASE PLAT & BAYANGAN LANTAI (TETAP DIAM TIDAK IKUT NAIK TURUN) -->
      <g id="emo-ground-base">
        <ellipse cx="60" cy="162" rx="38" ry="7" fill="url(#emo-shadow-grad)"/>
      </g>

      <!-- KELOMPOK TUBUH YANG BISA BERGERAK/MELAYANG -->
      <g class="emo-body-group">
        <!-- Bando Headphone -->
        <path d="M 16 54 C 14 24, 28 17, 50 17 L 70 17 C 92 17, 106 24, 104 54" fill="none" stroke="url(#emo-hp-band-outer)" stroke-width="5" stroke-linecap="round"/>
        <path d="M 38 18 Q 60 14 82 18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" filter="url(#emo-glow)"/>

        <!-- Ear Cup Samping -->
        <rect x="7" y="38" width="18" height="42" rx="9" fill="url(#emo-earcup-seamless)" stroke="none"/>
        <rect x="95" y="38" width="18" height="42" rx="9" fill="url(#emo-earcup-seamless)" stroke="none"/>

        <!-- Kaki Proporsi Pas (Tidak Terlalu Jangkung) -->
        <rect x="36" y="92" width="12" height="28" rx="5" fill="url(#emo-leg-bevel)" stroke="#00f2fe" stroke-width="0.8"/>
        <rect x="35" y="102" width="14" height="4" rx="2" fill="#00f2fe" opacity="0.9" filter="url(#emo-glow)"/>
        <rect x="23" y="118" width="28" height="31" rx="5" fill="url(#emo-foot-bevel)" stroke="#00f2fe" stroke-width="1"/>
        <line x1="26" y1="144" x2="48" y2="144" stroke="#00f2fe" stroke-width="1.5" filter="url(#emo-glow)"/>

        <rect x="72" y="92" width="12" height="28" rx="5" fill="url(#emo-leg-bevel)" stroke="#00f2fe" stroke-width="0.8"/>
        <rect x="71" y="102" width="14" height="4" rx="2" fill="#00f2fe" opacity="0.9" filter="url(#emo-glow)"/>
        <rect x="69" y="118" width="28" height="31" rx="5" fill="url(#emo-foot-bevel)" stroke="#00f2fe" stroke-width="1"/>
        <line x1="72" y1="144" x2="94" y2="144" stroke="#00f2fe" stroke-width="1.5" filter="url(#emo-glow)"/>

        <!-- Muka/Kepala Robot -->
        <rect x="20" y="28" width="80" height="66" rx="14" fill="url(#emo-head-grad)" stroke="#4a556d" stroke-width="1.8"/>
        <rect x="25" y="33" width="70" height="56" rx="10" fill="#1d2330" stroke="#364054" stroke-width="1.2"/>
        <rect x="28" y="36" width="64" height="50" rx="8" fill="url(#emo-screen-bg)"/>

        <!-- Alis & Mata EMO -->
        <path class="brow left" d="M39 46 Q45 44 51 46" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
        <path class="brow right" d="M69 46 Q75 44 81 46" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
        <rect class="eye left eye-rect" x="38" y="50" width="17" height="17" rx="5" fill="#00f2fe" filter="url(#emo-glow)"/>
        <rect class="eye right eye-rect" x="65" y="50" width="17" height="17" rx="5" fill="#00f2fe" filter="url(#emo-glow)"/>
        <path class="eye left eye-smile" d="M38 58 Q46 48 54 58" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#emo-glow)"/>
        <path class="eye right eye-smile" d="M65 58 Q73 48 81 58" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#emo-glow)"/>
      </g>
    </svg>
  </button>
</div>

<script>
(() => {
  'use strict';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzP2VeQq5DhMxxLo5Pt9rk730u5X93XMJ_Ty1b-9LQP5TmbiYLjoRdAjKYMNK7WQw/exec';
  const $ = id => document.getElementById(id);
  const launcher=$('ai-emo-launcher'), bubble=$('ai-emo-chat-bubble'), speechText=$('ai-emo-speech-text');
  const chatInput=$('emo-chat-input'), sendBtn=$('emo-chat-send'), inputWrapper=$('emo-chat-input-wrapper');
  const optionsWrapper=$('emo-chat-options'), optYes=$('emo-opt-yes'), optNo=$('emo-opt-no');
  const closeBubbleBtn=$('emo-bubble-close');
  let isInteracting=false, step=0, lyricList=[], lyricIndex=-1, lyricTimer=null, bubbleTimer=null, blinkTimer=null;
  let audioPlayer=new Audio(); audioPlayer.preload='auto'; audioPlayer.volume=0;
  let audioFadeTimer=null, audioTargetVolume=.55, busySending=false, bubbleManuallyClosed=false;
  let audioUnlocked=false, currentAudioUrl='';
  let guestData={nama:localStorage.getItem('emo_guest_nama')||'', alamat:'', kontak:'', subjek:'Buku Tamu Web', pesan:''};
  const fallbackLyrics=[
    {lyric:'Boleh kah sekecakep ini~ 🎵🎶',audio:'',mood:'whistle',duration:4500},
    {lyric:'Masa lalu biarlah masa lalu~ ✨',audio:'',mood:'jump',duration:5000},
    {lyric:'Salting sendiri kan lu? 👀🎧',audio:'',mood:'look-right',duration:3500},
    {lyric:'Lagi lari-lari kecil nih~ 🏃‍♂️💨',audio:'',mood:'run',duration:4000},
    {lyric:'Bunga abadi takkan pernah layu~ 🌸',audio:'',mood:'smile',duration:5000}
  ];
  function setMood(mood){ const allowed=['idle','suspicious','chatty','look-left','look-right','whistle','grumble','smile','hello','jump','run','laugh','excited','curious','love','sleepy','dance']; launcher.dataset.mood=allowed.includes(mood)?mood:'smile'; }
  // Menampilkan teks dari Spreadsheet sebagai teks biasa, tetapi mengubah tag <br>, <br/> atau <br /> menjadi baris baru. Tag HTML lain tetap dianggap teks agar aman.
  function safeText(value){
    speechText.replaceChildren();
    const parts=String(value??'').split(/<br\s*\/?\s*>/i);
    parts.forEach((part,index)=>{
      if(index>0) speechText.appendChild(document.createElement('br'));
      speechText.appendChild(document.createTextNode(part));
    });
  }
  function showBubble(){bubble.classList.add('show');bubbleManuallyClosed=false;}
  function stopBubbleTimer(){if(bubbleTimer){clearTimeout(bubbleTimer);bubbleTimer=null;}}
  function scheduleNextLyric(ms){if(lyricTimer)clearTimeout(lyricTimer); lyricTimer=setTimeout(rotateLyric,Math.max(5000,ms));}
  function getTimeString(){const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;}
  function getGreeting(){const h=new Date().getHours(); if(h>=4&&h<11)return 'Selamat pagi'; if(h>=11&&h<15)return 'Selamat siang'; if(h>=15&&h<18)return 'Selamat sore'; return 'Selamat malam';}
  function personalizedGreeting(){const name=guestData.nama.trim();return `${getGreeting()}${name?' Kak '+name:''}! Aku EMO 🤖✨`}
  async function fetchLyrics(){
    try{const r=await fetch(SCRIPT_URL+'?action=get_lyrics',{method:'GET',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();
      if(d&&Array.isArray(d.lyrics)){lyricList=d.lyrics.map(x=>({lyric:String(x.lyric||x.teks||''),audio:String(x.audio||''),mood:String(x.mood||'smile'),duration:Math.max(1,Number(x.duration||4.5))*1000})).filter(x=>x.lyric);}
      if(!lyricList.length)lyricList=fallbackLyrics;
    }catch(e){lyricList=fallbackLyrics;}
  }
  function clearAudioFade(){if(audioFadeTimer){clearInterval(audioFadeTimer);audioFadeTimer=null;}}
  function fadeAudioTo(target,duration,stopAfter=false){
    clearAudioFade();
    const start=Number(audioPlayer.volume)||0, end=Math.max(0,Math.min(1,target));
    const steps=Math.max(1,Math.round(duration/40)); let step=0;
    if(duration<=0){audioPlayer.volume=end;if(stopAfter){audioPlayer.pause();audioPlayer.currentTime=0;}return;}
    audioFadeTimer=setInterval(()=>{
      step++; const t=Math.min(1,step/steps);
      audioPlayer.volume=Math.max(0,Math.min(1,start+(end-start)*t));
      if(t>=1){clearAudioFade();if(stopAfter){audioPlayer.pause();try{audioPlayer.currentTime=0;}catch(e){}}}
    },40);
  }
  function stopAudio(fade=true){if(fade){fadeAudioTo(0,500,true);}else{clearAudioFade();try{audioPlayer.pause();audioPlayer.currentTime=0;audioPlayer.volume=0;}catch(e){}}}
  function normalizeAudioUrl(raw){
    const url=String(raw||'').trim();
    if(!url)return '';
    // Ubah tautan berbagi Google Drive menjadi URL pemutaran langsung.
    let m=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if(!m)m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if(m && /drive\.google\.com|docs\.google\.com/.test(url))return 'https://drive.google.com/uc?export=download&id='+m[1];
    return url;
  }
  function playAudio(rawUrl){
    const url=normalizeAudioUrl(rawUrl);currentAudioUrl=url;
    if(!url){stopAudio(true);return;}
    // Coba autoplay saat lirik muncul dengan mode muted terlebih dahulu.
    // Jika browser mengizinkan, suara dibuka lalu volume naik perlahan.
    // Jika ditolak, percobaan diulang setelah interaksi pertama pengguna.
    try{
      clearAudioFade();audioPlayer.pause();audioPlayer.src=url;audioPlayer.preload='auto';audioPlayer.volume=0;audioPlayer.muted=true;
      audioPlayer.load();
      const p=audioPlayer.play();
      if(p&&p.then)p.then(()=>{audioUnlocked=true;audioPlayer.muted=false;fadeAudioTo(audioTargetVolume,650);}).catch(err=>{audioPlayer.muted=false;console.warn('EMO: autoplay diblokir atau URL audio tidak valid. Akan dicoba lagi setelah klik/sentuhan pertama.',err);});
      else{audioPlayer.muted=false;fadeAudioTo(audioTargetVolume,650);}
    }catch(e){audioPlayer.muted=false;console.warn('EMO: gagal memulai audio.',e);}
  }
  function unlockAudio(){
    if(audioUnlocked)return;
    audioUnlocked=true;
    if(currentAudioUrl)playAudio(currentAudioUrl);
  }
  // Jika autoplay ditolak browser, interaksi pertama menjadi kesempatan mencoba lagi.
  document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});
  document.addEventListener('keydown',unlockAudio,{once:true,capture:true});
  function playItem(item){if(isInteracting||!item)return;stopBubbleTimer();showBubble();safeText(item.lyric);setMood(item.mood||'smile');playAudio(item.audio);const duration=Math.max(1500,Number(item.duration)||4500);bubbleTimer=setTimeout(()=>{if(!isInteracting){fadeAudioTo(0,700,true);setMood('idle');scheduleNextLyric(1400);}},duration);}
  function rotateLyric(){if(isInteracting||document.hidden){scheduleNextLyric(5000);return;}if(!lyricList.length)lyricList=fallbackLyrics;let next=lyricList.length===1?0:Math.floor(Math.random()*lyricList.length);if(next===lyricIndex&&lyricList.length>1)next=(next+1)%lyricList.length;lyricIndex=next;const item=lyricList[next];playItem(item);scheduleNextLyric(Math.max(9000,Number(item.duration)||4500)+9000);}
  function blinkLoop(){clearTimeout(blinkTimer);blinkTimer=setTimeout(()=>{if(!isInteracting){launcher.classList.add('blinking');setTimeout(()=>launcher.classList.remove('blinking'),130); }blinkLoop();},2200+Math.random()*3800);}
  document.addEventListener('mousemove',e=>{if(isInteracting)return;const r=launcher.getBoundingClientRect(),mid=r.left+r.width/2;setMood(e.clientX<mid-20?'look-left':e.clientX>mid+20?'look-right':'idle');});
  function startIntro(){if(isInteracting)return;showBubble();safeText(personalizedGreeting());setMood('hello');stopBubbleTimer();bubbleTimer=setTimeout(()=>{if(!isInteracting){safeText(`Sekarang pukul ${getTimeString()} WIB. Jangan lupa mampir dan isi buku tamu ya! ⏰`);setMood('smile');}},3500);scheduleNextLyric(9000);}
  function showInput(){optionsWrapper.style.display='none';inputWrapper.style.display='flex';chatInput.value='';chatInput.focus();}
  function askNextStep(){optionsWrapper.style.display='none';if(!isInteracting){inputWrapper.style.display='none';return;}inputWrapper.style.display='flex';chatInput.value='';
    if(step===1){safeText(guestData.nama?`${getGreeting()} Kak ${guestData.nama}! Mau titip pesan di buku tamu? Tulis alamat/kota asal dulu yuk! 🏠`:'Hai! Boleh tahu nama lengkap Kakak? 🤖');setMood('chatty');}
    else if(step===2){safeText(`Salam kenal Kak ${guestData.nama}! Boleh tahu alamat/kota asal Kakak? 🏠`);setMood('smile');}
    else if(step===3){safeText('Oke! Boleh isi nomor WhatsApp/kontak yang bisa dihubungi? 📱');setMood('whistle');}
    else if(step===4){safeText('Sip! Tulis pesan atau kesan Kakak di sini ya... 📝');setMood('smile');}
    else if(step===5){inputWrapper.style.display='none';optionsWrapper.style.display='flex';speechText.textContent='';
      const summary=document.createElement('span');summary.textContent=`Apakah data ini sudah benar?
Nama: ${guestData.nama}
Alamat: ${guestData.alamat}
HP: ${guestData.kontak}
Pesan: ${guestData.pesan}`;summary.style.whiteSpace='pre-line';speechText.appendChild(summary);setMood('curious');}
    showBubble();}
  function handleSend(){const val=chatInput.value.trim();if(!val)return;if(!isInteracting){isInteracting=true;step=1;}if(val.length>1500){safeText('Pesannya kepanjangan, maksimal 1.500 karakter ya.');return;}
    if(step===1){guestData.nama=val;localStorage.setItem('emo_guest_nama',val);step=2;}else if(step===2){guestData.alamat=val;step=3;}else if(step===3){guestData.kontak=val;step=4;}else if(step===4){guestData.pesan=val;step=5;}askNextStep();}
  sendBtn.addEventListener('click',handleSend);chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleSend();}});
  optYes.addEventListener('click',async()=>{if(busySending)return;busySending=true;optionsWrapper.style.display='none';safeText('Sedang mengirim data buku tamu... ⏳');setMood('whistle');
    try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save_guestbook',...guestData})});
      safeText('Permintaan buku tamu sudah dikirim. Browser tidak bisa membaca konfirmasi dari server, jadi pastikan data masuk di spreadsheet. Terima kasih sudah mampir! ✨');setMood('smile');localStorage.setItem('emo_guest_nama',guestData.nama);setTimeout(()=>{isInteracting=false;step=0;guestData={nama:localStorage.getItem('emo_guest_nama')||'',alamat:'',kontak:'',subjek:'Buku Tamu Web',pesan:''};startIntro();},6000);
    }catch(err){safeText('Belum bisa memastikan data tersimpan. Cek koneksi lalu coba lagi ya. 😢');setMood('grumble');optionsWrapper.style.display='flex';}
    finally{busySending=false;}
  });
  optNo.addEventListener('click',()=>{guestData.alamat='';guestData.kontak='';guestData.pesan='';step=1;askNextStep();});
  launcher.addEventListener('click',()=>{showBubble();stopBubbleTimer();if(!isInteracting){isInteracting=true;stopAudio(false);step=1;askNextStep();}else if(step>=1&&step<=4){chatInput.focus();}});
  closeBubbleBtn.addEventListener('click',()=>{
    bubble.classList.remove('show');bubbleManuallyClosed=true;stopBubbleTimer();fadeAudioTo(0,450,true);
    if(!isInteracting)setMood('idle');
  });
  audioPlayer.addEventListener('ended',()=>{});audioPlayer.addEventListener('error',()=>{console.warn('EMO: file audio gagal dimuat. Pastikan URL menuju MP3 yang bisa diakses publik.',audioPlayer.error);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearAudioFade();audioPlayer.pause();}else if(!isInteracting&&lyricList[lyricIndex]&&lyricList[lyricIndex].audio){playAudio(lyricList[lyricIndex].audio);}});
  fetchLyrics().finally(()=>{setTimeout(startIntro,800);});blinkLoop();
})();
</script>
</body>
</html>
