<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO — Widget Buku Tamu Chat Balon</title>
<style>
  /* EMO — Scope Widget */
  #ai-emo-widget {
    --emo-cyan: #00f2fe;
    --emo-blue: #4facfe;
    --emo-dark: #0d1322;
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 99999;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f0f6ff;
  }
  #ai-emo-widget * { box-sizing: border-box; }

  /* Balon Chat Interaktif Melayang */
  #ai-emo-chat-bubble {
    position: absolute;
    bottom: 185px;
    right: 10px;
    background: linear-gradient(135deg, rgba(18, 26, 43, 0.96), rgba(8, 12, 22, 0.98));
    border: 1px solid rgba(0, 242, 254, 0.4);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.25);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 12px 16px;
    width: 270px;
    font-size: 13px;
    line-height: 1.4;
    color: #e2f1ff;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    pointer-events: auto;
  }
  #ai-emo-chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 35px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid rgba(8, 12, 22, 0.98);
  }
  #ai-emo-chat-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .emo-bubble-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .emo-bubble-header strong {
    color: var(--emo-cyan);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .emo-close-btn {
    background: transparent;
    border: none;
    color: #8da2fb;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .emo-close-btn:hover { color: #fff; }

  #ai-emo-speech-text {
    display: block;
    word-break: break-word;
  }

  /* Input Form di Dalam Balon Chat (Default Disembunyikan) */
  #emo-chat-input-wrapper {
    display: none;
    gap: 6px;
    margin-top: 10px;
  }
  #emo-chat-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 242, 254, 0.3);
    border-radius: 10px;
    padding: 6px 10px;
    color: #fff;
    font-size: 12px;
    outline: none;
  }
  #emo-chat-input:focus {
    border-color: var(--emo-cyan);
    box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
  }
  .emo-send-btn {
    background: linear-gradient(135deg, var(--emo-cyan), var(--emo-blue));
    border: none;
    border-radius: 10px;
    color: #040814;
    font-weight: bold;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .emo-send-btn:active { transform: scale(0.95); }

  /* Tombol Pilihan Konfirmasi (Ya / Tidak) */
  .emo-options-wrapper {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .emo-opt-btn {
    flex: 1;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: transform 0.1s;
  }
  .emo-opt-yes { background: var(--emo-cyan); color: #040814; }
  .emo-opt-no { background: rgba(255, 255, 255, 0.15); color: #e2f1ff; border: 1px solid rgba(255, 255, 255, 0.2); }
  .emo-opt-btn:active { transform: scale(0.95); }

  /* Launcher karakter SVG transparan, tanpa gambar raster/background */
  #ai-emo-launcher {
    display:block; width:120px; height:175px; padding:0; border:0;
    background:transparent; cursor:pointer; position:relative;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.24));
    -webkit-tap-highlight-color:transparent;
    transform-origin:50% 85%;
    transition:filter .25s ease;
    will-change:transform;
  }
  #ai-emo-launcher:hover { filter:drop-shadow(0 13px 17px rgba(0,0,0,.3)); }
  #ai-emo-launcher svg { display:block; width:100%; height:100%; overflow:visible; }
  #ai-emo-launcher .eye { transition:transform .22s cubic-bezier(.2,.8,.2,1); transform-box:fill-box; transform-origin:center; }
  #ai-emo-launcher .brow { transition:transform .24s cubic-bezier(.2,.8,.2,1); transform-box:fill-box; transform-origin:center; }
  #ai-emo-launcher .eye-smile { display:none; }
  #ai-emo-launcher #emo-ground-shadow { transform-box:fill-box; transform-origin:center; transition:transform .25s ease,opacity .25s ease; }

  /* Ekspresi wajah */
  #ai-emo-launcher[data-mood="suspicious"] .brow.left { transform:rotate(-16deg) translateY(-2px); }
  #ai-emo-launcher[data-mood="suspicious"] .brow.right { transform:rotate(12deg) translateY(2px); }
  #ai-emo-launcher[data-mood="suspicious"] .eye.left { transform:scaleY(.72); }
  #ai-emo-launcher[data-mood="suspicious"] .eye.right { transform:scaleY(.86); }
  #ai-emo-launcher[data-mood="angry"] .brow.left,
  #ai-emo-launcher[data-mood="grumble"] .brow.left { transform:translateY(3px) rotate(22deg); }
  #ai-emo-launcher[data-mood="angry"] .brow.right,
  #ai-emo-launcher[data-mood="grumble"] .brow.right { transform:translateY(3px) rotate(-22deg); }
  #ai-emo-launcher[data-mood="angry"] .eye,
  #ai-emo-launcher[data-mood="grumble"] .eye { transform:scaleY(.48); }
  #ai-emo-launcher[data-mood="chatty"] .brow.left { transform:translateY(-3px) rotate(-8deg); }
  #ai-emo-launcher[data-mood="chatty"] .brow.right { transform:translateY(-3px) rotate(8deg); }
  #ai-emo-launcher[data-mood="chatty"] .eye { transform:scale(1.05); }
  #ai-emo-launcher[data-mood="look-left"] .eye { transform:translateX(-5px); }
  #ai-emo-launcher[data-mood="look-left"] .brow { transform:translateX(-3px); }
  #ai-emo-launcher[data-mood="look-right"] .eye { transform:translateX(5px); }
  #ai-emo-launcher[data-mood="look-right"] .brow { transform:translateX(3px); }
  #ai-emo-launcher[data-mood="whistle"] .brow { transform:translateY(-3px); }
  #ai-emo-launcher[data-mood="whistle"] .eye { transform:scale(.88); }
  #ai-emo-launcher[data-mood="smile"] .brow { transform:translateY(-3px); }
  #ai-emo-launcher[data-mood="smile"] .eye-rect { display:none; }
  #ai-emo-launcher[data-mood="smile"] .eye-smile { display:block; }
  #ai-emo-launcher[data-mood="surprised"] .brow { transform:translateY(-5px); }
  #ai-emo-launcher[data-mood="surprised"] .eye { transform:scale(1.12); }

  /* Idle terasa hidup: badan mengambang halus, kepala mengangguk, kaki bergerak kecil */
  #ai-emo-launcher[data-mood="idle"] { animation:emo-idle-body 3.8s cubic-bezier(.45,0,.55,1) infinite; }
  #ai-emo-launcher[data-mood="idle"] #emo-ground-shadow { animation:emo-shadow-breathe 3.8s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="idle"] #emo-leg-left-group { animation:emo-foot-left 4.4s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="idle"] #emo-leg-right-group { animation:emo-foot-right 4.4s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="hello"] { animation:emo-greet .8s ease-in-out 2; }
  #ai-emo-launcher[data-mood="laugh"], #ai-emo-launcher[data-mood="excited"] { animation:emo-happy-hop .55s cubic-bezier(.25,.7,.25,1) 3; }
  #ai-emo-launcher[data-mood="chatty"] { animation:emo-talk-bob 1.1s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="whistle"] { animation:emo-whistle-bob 1.6s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="grumble"] { animation:emo-grumble .28s ease-in-out infinite; }
  #ai-emo-launcher[data-mood="look-left"] { animation:emo-look .6s ease-out 1; }
  #ai-emo-launcher[data-mood="look-right"] { animation:emo-look .6s ease-out 1; }
  #ai-emo-launcher.emo-jump { animation:emo-jump .9s cubic-bezier(.2,.75,.25,1) 1 !important; }
  #ai-emo-launcher.emo-dance { animation:emo-dance 1.45s ease-in-out 1 !important; }
  #ai-emo-launcher.emo-wiggle { animation:emo-wiggle .75s ease-in-out 1 !important; }

  @keyframes emo-idle-body {
    0%,100% { transform:translate3d(0,0,0) rotate(0) scale(1); }
    24% { transform:translate3d(0,-2px,0) rotate(-.6deg) scale(1.006); }
    52% { transform:translate3d(0,-5px,0) rotate(.5deg) scale(1.01); }
    78% { transform:translate3d(0,-2px,0) rotate(-.25deg) scale(1.004); }
  }
  @keyframes emo-shadow-breathe {
    0%,100% { transform:scale(1); opacity:.68; }
    50% { transform:scale(.83); opacity:.4; }
  }
  @keyframes emo-foot-left { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-2deg) translateY(-1px)} 55%{transform:rotate(0)} }
  @keyframes emo-foot-right { 0%,35%,100%{transform:rotate(0)} 58%{transform:rotate(2deg) translateY(-1px)} 75%{transform:rotate(0)} }
  @keyframes emo-greet { 0%,100%{transform:rotate(0) translateY(0)} 22%{transform:rotate(5deg) translateY(-3px)} 48%{transform:rotate(-5deg) translateY(-1px)} 72%{transform:rotate(3deg)} }
  @keyframes emo-happy-hop { 0%,100%{transform:translateY(0) scale(1,1)} 24%{transform:translateY(-10px) scale(.98,1.04)} 42%{transform:translateY(-12px) scale(1.02,.98)} 62%{transform:translateY(1px) scale(1.04,.94)} 78%{transform:translateY(-3px) scale(.99,1.02)} }
  @keyframes emo-talk-bob { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-2px) rotate(-1deg)} 55%{transform:translateY(-4px) rotate(1deg)} 80%{transform:translateY(-1px)} }
  @keyframes emo-whistle-bob { 0%,100%{transform:translateY(0) rotate(0)} 35%{transform:translateY(-4px) rotate(1.2deg)} 70%{transform:translateY(-2px) rotate(-1deg)} }
  @keyframes emo-grumble { 0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-1.6px) rotate(-1deg)} 75%{transform:translateX(1.6px) rotate(1deg)} }
  @keyframes emo-look { 0%{transform:translateX(0)} 35%{transform:translateX(-2px) rotate(-1deg)} 70%{transform:translateX(2px) rotate(1deg)} 100%{transform:translateX(0)} }
  @keyframes emo-jump { 0%{transform:translateY(0) scale(1,1) rotate(0)} 18%{transform:translateY(2px) scale(1.05,.93)} 42%{transform:translateY(-24px) scale(.97,1.04) rotate(-2deg)} 57%{transform:translateY(-27px) scale(1,1) rotate(2deg)} 76%{transform:translateY(2px) scale(1.06,.91)} 88%{transform:translateY(-3px) scale(.99,1.02)} 100%{transform:translateY(0) scale(1) rotate(0)} }
  @keyframes emo-dance { 0%,100%{transform:translateY(0) rotate(0)} 15%{transform:translateY(-5px) rotate(-5deg)} 30%{transform:translateY(0) rotate(5deg)} 45%{transform:translateY(-7px) rotate(-4deg)} 60%{transform:translateY(0) rotate(4deg)} 78%{transform:translateY(-3px) rotate(-2deg)} }
  @keyframes emo-wiggle { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-4deg)} 40%{transform:rotate(4deg)} 60%{transform:rotate(-3deg)} 80%{transform:rotate(2deg)} }
  @media (prefers-reduced-motion:reduce) {
    #ai-emo-launcher, #ai-emo-launcher *, #ai-emo-launcher #emo-ground-shadow { animation:none !important; transition:none !important; }
  }
  @media(max-width: 480px) {
    #ai-emo-widget { right: 12px; bottom: 12px; }
    #ai-emo-launcher { width: 105px; height: 155px; }
    #ai-emo-chat-bubble { bottom: 165px; width: calc(100vw - 40px); max-width: 280px; }
  }
</style>
</head>
<body>

<div id="ai-emo-widget">
  <!-- Balon Percakapan Melayang Interaktif -->
  <div id="ai-emo-chat-bubble" class="show">
    <div class="emo-bubble-header">
      <strong>EMO</strong>
      <button class="emo-close-btn" id="emo-bubble-close" title="Tutup">✕</button>
    </div>
    <span id="ai-emo-speech-text">Hai, aku EMO ✨</span>
    
    <div id="emo-chat-input-wrapper">
      <input type="text" id="emo-chat-input" placeholder="Tulis balasan..." autocomplete="off">
      <button class="emo-send-btn" id="emo-chat-send">Kirim</button>
    </div>

    <div id="emo-chat-options" class="emo-options-wrapper" style="display: none;">
      <button class="emo-opt-btn emo-opt-yes" id="emo-opt-yes">Ya, Kirim!</button>
      <button class="emo-opt-btn emo-opt-no" id="emo-opt-no">🔄 Ulangi</button>
    </div>
  </div>

  <!-- Launcher Karakter Robot EMO -->
  <button id="ai-emo-launcher" type="button" data-mood="idle" aria-label="Karakter EMO">
    <svg viewBox="0 0 120 185" role="img">
      <defs>
        <!-- Bayangan Kontak Langsung Kaki Menapak Bumi -->
        <radialGradient id="emo-foot-shadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#000000" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Bayangan Area Lantai Utama -->
        <radialGradient id="emo-shadow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.75"/>
          <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Bando Headphone Gradasi -->
        <linearGradient id="emo-hp-band-outer" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#414a5e"/>
          <stop offset="50%" stop-color="#1e2430"/>
          <stop offset="100%" stop-color="#0a0d14"/>
        </linearGradient>

        <!-- Ear Cup Polos Seamless -->
        <linearGradient id="emo-earcup-seamless" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#475166"/>
          <stop offset="35%" stop-color="#2a3242"/>
          <stop offset="85%" stop-color="#121721"/>
          <stop offset="100%" stop-color="#080a0f"/>
        </linearGradient>

        <!-- Gradasi Muka/Kepala -->
        <linearGradient id="emo-head-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#363d4e"/>
          <stop offset="40%" stop-color="#212733"/>
          <stop offset="100%" stop-color="#10141d"/>
        </linearGradient>

        <linearGradient id="emo-screen-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#181c26"/>
          <stop offset="100%" stop-color="#080a0e"/>
        </linearGradient>

        <!-- Gradasi Kaki Bevel Metalik -->
        <linearGradient id="emo-leg-bevel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4f5970"/>
          <stop offset="20%" stop-color="#2a3140"/>
          <stop offset="70%" stop-color="#121620"/>
          <stop offset="100%" stop-color="#070a0f"/>
        </linearGradient>

        <!-- Gradasi Sepatu Metalik Bevel -->
        <linearGradient id="emo-foot-bevel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#454f63"/>
          <stop offset="35%" stop-color="#232936"/>
          <stop offset="100%" stop-color="#0a0d14"/>
        </linearGradient>

        <!-- Glow Effect Cyber Light Blue -->
        <filter id="emo-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- BASE EFEK LANTAI & BAYANGAN PENAPAK (GROUND FOOTING) -->
      <g id="emo-ground-base">
        <!-- Plat Permukaan Lantai Perspektif -->
        <ellipse cx="60" cy="168" rx="46" ry="9" fill="#070a12" stroke="#1c2538" stroke-width="0.8" opacity="0.6"/>
        <ellipse id="emo-ground-shadow" cx="60" cy="168" rx="42" ry="8" fill="url(#emo-shadow-grad)" transform-box="fill-box" transform-origin="center"/>
        <!-- Bayangan Langsung di Bawah Telapak Kaki Kiri & Kanan -->
        <ellipse cx="37" cy="166" rx="16" ry="4" fill="url(#emo-foot-shadow)"/>
        <ellipse cx="83" cy="166" rx="16" ry="4" fill="url(#emo-foot-shadow)"/>
      </g>

      <!-- Bando Headphone Tipis -->
      <path d="M 16 54 C 14 24, 28 17, 50 17 L 70 17 C 92 17, 106 24, 104 54" fill="none" stroke="url(#emo-hp-band-outer)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 38 18 Q 60 14 82 18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" filter="url(#emo-glow)"/>

      <!-- Ear Cup Samping: Seamless Menyatu dengan Kepala -->
      <g id="earcup-left">
        <rect x="7" y="38" width="18" height="44" rx="9" fill="url(#emo-earcup-seamless)" stroke="none"/>
      </g>
      <g id="earcup-right">
        <rect x="95" y="38" width="18" height="44" rx="9" fill="url(#emo-earcup-seamless)" stroke="none"/>
      </g>

      <!-- Kaki Panjang Menapak Kokoh di Lantai -->
      <g id="emo-leg-left-group">
        <rect x="36" y="90" width="12" height="52" rx="5" fill="url(#emo-leg-bevel)" stroke="#00f2fe" stroke-width="0.8"/>
        <rect x="35" y="110" width="14" height="4" rx="2" fill="#00f2fe" opacity="0.9" filter="url(#emo-glow)"/>
        <g id="emo-left-foot">
          <rect x="23" y="136" width="28" height="27" rx="5" fill="url(#emo-foot-bevel)" stroke="#00f2fe" stroke-width="1"/>
          <rect x="23" y="156" width="28" height="7" rx="2" fill="#0c1018" stroke="#2c354a" stroke-width="0.8"/>
          <line x1="26" y1="161" x2="48" y2="161" stroke="#00f2fe" stroke-width="1.5" filter="url(#emo-glow)"/>
        </g>
      </g>

      <g id="emo-leg-right-group">
        <rect x="72" y="90" width="12" height="52" rx="5" fill="url(#emo-leg-bevel)" stroke="#00f2fe" stroke-width="0.8"/>
        <rect x="71" y="110" width="14" height="4" rx="2" fill="#00f2fe" opacity="0.9" filter="url(#emo-glow)"/>
        <g id="emo-right-foot">
          <rect x="69" y="136" width="28" height="27" rx="5" fill="url(#emo-foot-bevel)" stroke="#00f2fe" stroke-width="1"/>
          <rect x="69" y="156" width="28" height="7" rx="2" fill="#0c1018" stroke="#2c354a" stroke-width="0.8"/>
          <line x1="72" y1="161" x2="94" y2="161" stroke="#00f2fe" stroke-width="1.5" filter="url(#emo-glow)"/>
        </g>
      </g>

      <!-- Muka/Kepala Robot -->
      <rect x="20" y="28" width="80" height="68" rx="14" fill="url(#emo-head-grad)" stroke="#4a556d" stroke-width="1.8"/>
      <rect x="25" y="33" width="70" height="58" rx="10" fill="#1d2330" stroke="#364054" stroke-width="1.2"/>
      <rect x="28" y="36" width="64" height="52" rx="8" fill="url(#emo-screen-bg)"/>

      <!-- Alis & Mata EMO -->
      <path class="brow left" d="M39 46 Q45 44 51 46" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
      <path class="brow right" d="M69 46 Q75 44 81 46" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>

      <rect class="eye left eye-rect" x="38" y="51" width="17" height="17" rx="5" fill="#00f2fe" filter="url(#emo-glow)"/>
      <rect class="eye right eye-rect" x="65" y="51" width="17" height="17" rx="5" fill="#00f2fe" filter="url(#emo-glow)"/>

      <path class="eye left eye-smile" d="M38 60 Q46 50 54 60" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#emo-glow)"/>
      <path class="eye right eye-smile" d="M65 60 Q73 50 81 60" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#emo-glow)"/>
    </svg>
  </button>
</div>

<script>
(() => {
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd71ivnmGxMVnULaqIS85Ipw49xtJPVOOUKzXIuPID4MAglan2tBQW6ITFXEiXVlXQvA/exec';

  const launcher = document.getElementById('ai-emo-launcher');
  const bubble = document.getElementById('ai-emo-chat-bubble');
  const speechText = document.getElementById('ai-emo-speech-text');
  const chatInput = document.getElementById('emo-chat-input');
  const sendBtn = document.getElementById('emo-chat-send');
  const inputWrapper = document.getElementById('emo-chat-input-wrapper');
  const optionsWrapper = document.getElementById('emo-chat-options');
  const optYes = document.getElementById('emo-opt-yes');
  const optNo = document.getElementById('emo-opt-no');
  const closeBtn = document.getElementById('emo-bubble-close');

  let isInteracting = false; 
  let step = 0; 
  let audioPlayer = new Audio();
  let lyricList = []; // Menyimpan lirik & audio dari Spreadsheet

  let guestData = {
    nama: localStorage.getItem('emo_guest_nama') || '',
    alamat: '',
    kontak: '',
    subjek: 'Buku Tamu Web',
    pesan: ''
  };

  function setMood(mood) { launcher.dataset.mood = mood; }

  function getTimeString() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  // Ambil Data Lirik Lagu & Audio dari Spreadsheet Apps Script
  async function fetchLyricsFromSpreadsheet() {
    try {
      const res = await fetch(SCRIPT_URL + '?action=get_lyrics');
      const data = await res.json();
      if (data && data.lyrics && data.lyrics.length > 0) {
        lyricList = data.lyrics;
      }
    } catch (e) {
      // Fallback lokal jika spreadsheet belum disetup action=get_lyrics
      lyricList = [
        { lyric: "Boleh kah sekecakep ini~ 🎵🎶", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", mood: "whistle" },
        { msg: "Salting sendiri kan lu? 👀🎧", audio: "", mood: "look-right" }
      ];
    }
  }

  function playAudio(url) {
    if (!url) return;
    try {
      audioPlayer.src = url;
      audioPlayer.play().catch(() => {});
    } catch (e) {}
  }

  // Alur dialog bertahap
  function askNextStep() {
    optionsWrapper.style.display = 'none';

    if (!isInteracting) {
      inputWrapper.style.display = 'none';
      return;
    }

    inputWrapper.style.display = 'flex';

    if (step === 1) {
      if (guestData.nama) {
        speechText.innerHTML = `Halo Kak <b>${guestData.nama}</b>! Mau titip pesan di buku tamu? Tulis alamat asal Kakak dulu yuk! 🏠`;
        step = 2; 
      } else {
        speechText.innerHTML = "Halo! Boleh tau nama lengkap Kakak siapa? 🤖";
      }
      setMood('chatty');
    } else if (step === 2) {
      speechText.innerHTML = `Salam kenal Kak <b>${guestData.nama}</b>! Boleh tau alamat/kota asal Kakak? 🏠`;
      setMood('smile');
    } else if (step === 3) {
      speechText.innerHTML = "Oke! Boleh minta nomor WhatsApp / Kontak yang bisa dihubungi? 📱";
      setMood('whistle');
    } else if (step === 4) {
      speechText.innerHTML = "Sip! Silakan tuliskan pesan/kesan Kakak di sini... 📝";
      setMood('smile');
    } else if (step === 5) {
      inputWrapper.style.display = 'none';
      optionsWrapper.style.display = 'flex';
      speechText.innerHTML = `Apakah data ini sudah yakin benar?<br><b>Nama:</b> ${guestData.nama}<br><b>Alamat:</b> ${guestData.alamat}<br><b>HP:</b> ${guestData.kontak}<br><b>Pesan:</b> ${guestData.pesan}`;
      setMood('suspicious');
    }
  }

  function handleSend() {
    const val = chatInput.value.trim();
    if (!isInteracting) {
      isInteracting = true;
      launcher.classList.remove('emo-jump', 'emo-dance', 'emo-wiggle');
      step = 1;
    }

    if (!val && step !== 0) return;
    chatInput.value = '';

    if (step === 1) {
      guestData.nama = val;
      localStorage.setItem('emo_guest_nama', val);
      step = 2;
      askNextStep();
    } else if (step === 2) {
      guestData.alamat = val;
      step = 3;
      askNextStep();
    } else if (step === 3) {
      guestData.kontak = val;
      step = 4;
      askNextStep();
    } else if (step === 4) {
      guestData.pesan = val;
      step = 5;
      askNextStep();
    }
  }

  sendBtn.addEventListener('click', handleSend);
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  optYes.addEventListener('click', async () => {
    optionsWrapper.style.display = 'none';
    speechText.innerHTML = "Sedang mengirim data pesan Kakak... ⏳";
    setMood('whistle');

    try {
      const body = new URLSearchParams(guestData);
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body
      });

      speechText.innerHTML = "Yeay! Data buku tamu berhasil terkirim ke spreadsheet! Terima kasih Kak ✨🎉";
      setMood('smile');
      setTimeout(() => {
        isInteracting = false;
        step = 0;
        startIntroGreeting();
      }, 5000);
    } catch (err) {
      speechText.innerHTML = "Aduh, gagal mengirim data. Coba lagi nanti ya! 😢";
      setMood('grumble');
    }
  });

  optNo.addEventListener('click', () => {
    step = 1;
    askNextStep();
  });

  closeBtn.addEventListener('click', () => {
    bubble.classList.remove('show');
    setMood('idle');
  });

  launcher.addEventListener('click', () => {
    bubble.classList.add('show');
    if (!isInteracting) {
      isInteracting = true;
      launcher.classList.remove('emo-jump', 'emo-dance', 'emo-wiggle');
      step = 1;
      askNextStep();
    }
    chatInput.focus();
  });

  // Sapaan Awal & Rotasi Lirik + Audio
  async function startIntroGreeting() {
    if (isInteracting) return;

    await fetchLyricsFromSpreadsheet();

    inputWrapper.style.display = 'none';
    optionsWrapper.style.display = 'none';

    speechText.innerHTML = "Hai, aku EMO! 👋";
    bubble.classList.add('show');
    setMood('hello');

    setTimeout(() => {
      if (isInteracting) return;
      speechText.innerHTML = `Sekarang jam ${getTimeString()} WIB nih, jangan lupa isi buku tamu ya! ⏰`;
      setMood('smile');
    }, 3000);

    setTimeout(() => {
      if (isInteracting) return;
      setMood('idle');
    }, 7000);

    // Rotasi Sapaan & Play Audio Otomatis
    setInterval(() => {
      if (isInteracting || document.activeElement === chatInput) return;

      if (lyricList.length > 0) {
        const item = lyricList[Math.floor(Math.random() * lyricList.length)];
        speechText.innerHTML = item.lyric || item.msg;
        setMood(item.mood || 'whistle');
        if (item.audio) playAudio(item.audio);
      } else {
        speechText.innerHTML = `Sekarang jam ${getTimeString()} WIB, tetap semangat! ✨`;
        setMood('chatty');
      }
      
      setTimeout(() => {
        if (!isInteracting) setMood('idle');
      }, 4500);
    }, 13000);
  }


  // Gerakan ambient acak hanya saat EMO tidak sedang menjalankan dialog.
  // Karakter digambar langsung dengan SVG transparan, bukan gambar ber-background.
  let ambientTimer = null;
  function scheduleAmbientMotion() {
    clearTimeout(ambientTimer);
    ambientTimer = setTimeout(() => {
      if (!isInteracting && launcher.dataset.mood === 'idle' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const pick = Math.random();
        launcher.classList.remove('emo-jump', 'emo-dance', 'emo-wiggle');
        if (pick < 0.22) {
          launcher.classList.add('emo-jump');
          setMood('excited');
          setTimeout(() => { launcher.classList.remove('emo-jump'); if (!isInteracting) setMood('idle'); }, 950);
        } else if (pick < 0.42) {
          launcher.classList.add('emo-dance');
          setMood('laugh');
          setTimeout(() => { launcher.classList.remove('emo-dance'); if (!isInteracting) setMood('idle'); }, 1500);
        } else if (pick < 0.58) {
          launcher.classList.add('emo-wiggle');
          setMood('look-left');
          setTimeout(() => { launcher.classList.remove('emo-wiggle'); if (!isInteracting) setMood('idle'); }, 800);
        } else {
          const moods = ['look-left', 'look-right', 'suspicious', 'whistle', 'chatty'];
          setMood(moods[Math.floor(Math.random() * moods.length)]);
          setTimeout(() => { if (!isInteracting) setMood('idle'); }, 1600 + Math.random() * 700);
        }
      }
      scheduleAmbientMotion();
    }, 4800 + Math.random() * 5200);
  }
  scheduleAmbientMotion();

  setTimeout(startIntroGreeting, 800);
})();
</script>
</body>
