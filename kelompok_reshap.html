<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembagi Tugas RESHAP</title>

<style>
html,body{
  margin:0;min-height:100vh;
  background:#0b1220;
  font-family:Segoe UI,Arial,sans-serif;
  color:#e5e7eb;
}

.header{
  background:linear-gradient(135deg,#064e3b,#166534,#22c55e);
  padding:18px 22px;
  border-radius:0 0 24px 24px;
  box-shadow:0 10px 30px rgba(22,101,52,.5);
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:#0f172a;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  margin-bottom:16px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

select, input, button{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
}

button.primary{ background:#16a34a; border:none; font-weight:600; }
button.danger{ background:#ef4444; border:none; font-weight:600; }

.row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}

/* KOTAK TUGAS */
.task-box{
  background:#020617;
  border-radius:16px;
  padding:14px;
  border:1px solid #22c55e;
}

.task-title{
  font-weight:700;
  margin-bottom:8px;
  color:#86efac;
}

.member{
  padding:8px 10px;
  border-radius:10px;
  margin-bottom:6px;
  background:#0f172a;
}

#info{
  margin-top:8px;
  font-size:14px;
  opacity:.9;
}
</style>
</head>

<body>

<div class="header">
  <h2>🧹 Pembagi Tugas Kebersihan RESHAP</h2>
</div>

<div class="container">

<div class="card">
<div class="controls">

<select id="kelasSelect">
  <option value="ALL">Pilih Kelas</option>
</select>

<input id="nPengawas" type="number" min="1" placeholder="Jumlah pengawas">

<button class="primary" id="bagiBtn">BAGI TUGAS</button>
<button class="danger" id="resetBtn">Reset</button>
</div>

<div id="info">Memuat data kelas…</div>
</div>

<div id="hasilArea" class="row"></div>

</div>

<script>
const SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/1alXonfmvgeFORy6B7esA-Zq2zrGQfryXMAj64POLsiE/gviz/tq?tqx=out:csv&sheet=DATA";

let students = [];
let idxNama=0, idxRombel=0;

const kelasSelect = document.getElementById('kelasSelect');
const nPengawas = document.getElementById('nPengawas');
const bagiBtn = document.getElementById('bagiBtn');
const resetBtn = document.getElementById('resetBtn');
const hasilArea = document.getElementById('hasilArea');
const info = document.getElementById('info');

function parseCSV(text){
 const rows=[]; let cur='', arr=[], inQ=false;
 for(let c of text){
  if(c=='"'){inQ=!inQ; continue;}
  if(c==',' && !inQ){arr.push(cur.trim());cur='';continue;}
  if(c=='\n' && !inQ){arr.push(cur.trim());rows.push(arr);arr=[];cur='';continue;}
  cur+=c;
 }
 if(cur||arr.length) arr.push(cur.trim()), rows.push(arr);
 return rows;
}

fetch(SHEET_CSV_URL)
.then(r=>r.text())
.then(t=>{
  const data = parseCSV(t);
  const header = data[0];

  idxNama = header.indexOf('Nama');
  idxRombel = header.indexOf('Rombel');

  students = data.slice(1).filter(r=>r[idxNama]);

  const kelas = [...new Set(students.map(r=>r[idxRombel]))]
                .filter(k=>k).sort();

  kelas.forEach(k=>{
    const opt=document.createElement('option');
    opt.value=k;
    opt.textContent=k;
    kelasSelect.appendChild(opt);
  });

  info.textContent="Pilih kelas lalu klik BAGI TUGAS.";
})
.catch(e=>{
  info.textContent="Gagal memuat Google Sheet";
  console.error(e);
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getSiswaKelas(){
  return students.filter(r=>r[idxRombel]===kelasSelect.value);
}

bagiBtn.onclick = ()=>{
  hasilArea.innerHTML='';

  if(kelasSelect.value==="ALL"){
    alert("Pilih kelas dulu!");
    return;
  }

  let pool = getSiswaKelas();
  if(pool.length===0){
    alert("Tidak ada siswa di kelas ini");
    return;
  }

  let pengawasCount = parseInt(nPengawas.value) || 1;

  let shuffled = shuffle([...pool.map(r=>r[idxNama])]);

  const tugas = {
   "Pengawas kebersihan": [],
   "Membersihkan papan tulis & meja guru": [],
   "Membersihkan lantai kelas (sapu & pel)": [],
   "Membersihkan jendela kelas": [],
   "Membersihkan halaman kelas": []
  };

  // 1) Pengawas (sesuai input)
  for(let i=0;i<pengawasCount && shuffled.length;i++){
    tugas["Pengawas kebersihan"].push(shuffled.pop());
  }

  // 2) Papan tulis & meja guru = 2 orang
  for(let i=0;i<2 && shuffled.length;i++){
    tugas["Membersihkan papan tulis & meja guru"].push(shuffled.pop());
  }

  // 3) Lantai kelas = 5 orang
  for(let i=0;i<5 && shuffled.length;i++){
    tugas["Membersihkan lantai kelas (sapu & pel)"].push(shuffled.pop());
  }

  // 4) Jendela kelas = 5 orang
  for(let i=0;i<5 && shuffled.length;i++){
    tugas["Membersihkan jendela kelas"].push(shuffled.pop());
  }

  // 5) SISANYA → HALAMAN KELAS
  while(shuffled.length){
    tugas["Membersihkan halaman kelas"].push(shuffled.pop());
  }

  // tampilkan hasil
  Object.keys(tugas).forEach(t=>{
    const box=document.createElement('div');
    box.className='task-box';

    const title=document.createElement('div');
    title.className='task-title';
    title.textContent = t + " ("+tugas[t].length+" orang)";
    box.appendChild(title);

    tugas[t].forEach(n=>{
      const div=document.createElement('div');
      div.className='member';
      div.textContent = n;
      box.appendChild(div);
    });

    hasilArea.appendChild(box);
  });

  info.textContent =
   `Kelas ${kelasSelect.value} • ${pool.length} siswa • Tugas dibagi otomatis.`;
};

resetBtn.onclick = ()=>{
  hasilArea.innerHTML='';
  info.textContent="Silakan buat ulang tugas.";
};
</script>

</body>
</html>
