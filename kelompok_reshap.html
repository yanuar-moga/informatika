<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembagi Tugas RESHAP</title>

<!-- Library untuk export Excel -->
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

<style>
html,body{
  margin:0;
  min-height:100vh;
  background:#0b1220;
  font-family:Segoe UI,Arial,sans-serif;
  color:#e5e7eb;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(135deg,#064e3b,#166534,#22c55e);
  padding:16px 14px;
  border-radius:0 0 20px 20px;
  box-shadow:0 10px 30px rgba(22,101,52,.5);
  text-align:center;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1100px;
  margin:16px auto;
  padding:0 10px;
}

/* ===== CARD ===== */
.card{
  background:#0f172a;
  border-radius:18px;
  padding:14px;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  margin-bottom:12px;
}

/* ===== CONTROL BAR ===== */
.controls{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

/* Form */
select, input, button{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-size:14px;
}

/* tombol */
button.primary{ background:#16a34a; border:none; font-weight:600; }
button.secondary{ background:#2563eb; border:none; font-weight:600; }
button.dark{ background:#0f172a; border:1px solid #22c55e; font-weight:600; }
button.danger{ background:#ef4444; border:none; font-weight:600; }

/* ===== GRID HASIL ===== */
.row{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/* KOTAK TUGAS */
.task-box{
  background:#020617;
  border-radius:16px;
  padding:12px;
  border:1px solid #22c55e;
}

.task-title{
  font-weight:700;
  margin-bottom:6px;
  color:#86efac;
  font-size:14px;
}

.member{
  padding:8px 10px;
  border-radius:10px;
  margin-bottom:5px;
  background:#0f172a;
  font-size:13px;
}

#info{
  margin-top:6px;
  font-size:13px;
  opacity:.9;
  text-align:center;
}

/* ===== RESPONSIVE ===== */
@media (min-width: 600px){
  .controls{ grid-template-columns:repeat(2, 1fr); }
  .row{ grid-template-columns:repeat(2, 1fr); }
}

@media (min-width: 900px){
  .controls{ grid-template-columns:repeat(4, 1fr); }
  .row{ grid-template-columns:repeat(3, 1fr); }
}
</style>
</head>

<body>

<div class="header">
  <h2>Pembagi Tugas Kebersihan RESHAP</h2>
</div>

<div class="container">

<div class="card">
<div class="controls">

<select id="kelasSelect">
  <option value="ALL">Pilih Kelas</option>
</select>

<button class="primary" id="bagiBtn">BAGI TUGAS</button>
<button class="secondary" id="dlExcelBtn">Download Excel</button>
<button class="dark" id="dlTxtBtn">Download TXT</button>
<button class="danger" id="resetBtn">Reset</button>
</div>

<div id="info">Memuat data kelas…</div>
</div>

<div id="hasilArea" class="row"></div>

</div>

<script>
const SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/1alXonfmvgeFORy6B7esA-Zq2zrGQfryXMAj64POLsiE/gviz/tq?tqx=out:csv&sheet=DATA";

let students = [];
let idxNama=0, idxRombel=0, idxGender=-1;

const kelasSelect = document.getElementById('kelasSelect');
const bagiBtn = document.getElementById('bagiBtn');
const resetBtn = document.getElementById('resetBtn');
const dlExcelBtn = document.getElementById('dlExcelBtn');
const dlTxtBtn = document.getElementById('dlTxtBtn');
const hasilArea = document.getElementById('hasilArea');
const info = document.getElementById('info');

function parseCSV(text){
 const rows=[]; let cur='', arr=[], inQ=false;
 for(let c of text){
  if(c=='"'){inQ=!inQ; continue;}
  if(c==',' && !inQ){arr.push(cur.trim());cur='';continue;}
  if(c=='\n' && !inQ){arr.push(cur.trim());rows.push(arr);arr=[];cur='';continue;}
  cur+=c;
 }
 if(cur||arr.length) arr.push(cur.trim()), rows.push(arr);
 return rows;
}

fetch(SHEET_CSV_URL)
.then(r=>r.text())
.then(t=>{
  const data = parseCSV(t);
  const header = data[0];

  idxNama = header.findIndex(h=>h.toLowerCase().includes("nama"));
  idxRombel = header.findIndex(h=>h.toLowerCase().includes("rombel"));

  // Cari kolom gender otomatis
  idxGender = header.findIndex(h=>{
    const x = h.toLowerCase();
    return x.includes("jk") || x.includes("jenis") || x.includes("gender") || x.includes("l/p");
  });

  students = data.slice(1).filter(r=>r[idxNama]);

  const kelas = [...new Set(students.map(r=>r[idxRombel]))]
                .filter(k=>k).sort();

  kelas.forEach(k=>{
    const opt=document.createElement('option');
    opt.value=k;
    opt.textContent=k;
    kelasSelect.appendChild(opt);
  });

  info.textContent="Pilih kelas lalu klik BAGI TUGAS.";
})
.catch(e=>{
  info.textContent="Gagal memuat Google Sheet";
  console.error(e);
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getSiswaKelas(){
  return students.filter(r=>r[idxRombel]===kelasSelect.value);
}

let hasilTugas = {}; // untuk export

bagiBtn.onclick = ()=>{
  hasilArea.innerHTML='';
  hasilTugas = {};

  if(kelasSelect.value==="ALL"){
    alert("Pilih kelas dulu!");
    return;
  }

  let pool = getSiswaKelas();
  if(pool.length===0){
    alert("Tidak ada siswa di kelas ini");
    return;
  }

  let shuffled = shuffle([...pool]);

  let laki = idxGender>=0 ? shuffled.filter(r=>{
    const g = (r[idxGender]||"").toLowerCase();
    return g.includes("l") || g.includes("laki");
  }) : [];

  let perempuan = idxGender>=0 ? shuffled.filter(r=>{
    const g = (r[idxGender]||"").toLowerCase();
    return g.includes("p");
  }) : [];

  let sisa = shuffled;

  const tugas = {
   "Koordinator (1 L + 1 P)": [],
   "Membersihkan papan tulis & meja guru": [],
   "Membersihkan lantai kelas (sapu & pel)": [],
   "Membersihkan jendela kelas": [],
   "Membersihkan halaman kelas": []
  };

  // Pilih koordinator
  if(idxGender>=0 && laki.length && perempuan.length){
    tugas["Koordinator (1 L + 1 P)"].push(laki.pop()[idxNama]);
    tugas["Koordinator (1 L + 1 P)"].push(perempuan.pop()[idxNama]);
    sisa = shuffled.filter(r=> !tugas["Koordinator (1 L + 1 P)"].includes(r[idxNama]));
  } else {
    // fallback acak
    tugas["Koordinator (1 L + 1 P)"].push(sisa.pop()[idxNama]);
    tugas["Koordinator (1 L + 1 P)"].push(sisa.pop()[idxNama]);
  }

  for(let i=0;i<2 && sisa.length;i++){
    tugas["Membersihkan papan tulis & meja guru"].push(sisa.pop()[idxNama]);
  }

  for(let i=0;i<5 && sisa.length;i++){
    tugas["Membersihkan lantai kelas (sapu & pel)"].push(sisa.pop()[idxNama]);
  }

  for(let i=0;i<5 && sisa.length;i++){
    tugas["Membersihkan jendela kelas"].push(sisa.pop()[idxNama]);
  }

  while(sisa.length){
    tugas["Membersihkan halaman kelas"].push(sisa.pop()[idxNama]);
  }

  hasilTugas = tugas;

  Object.keys(tugas).forEach(t=>{
    const box=document.createElement('div');
    box.className='task-box';

    const title=document.createElement('div');
    title.className='task-title';
    title.textContent = t + " ("+tugas[t].length+" orang)";
    box.appendChild(title);

    tugas[t].forEach(n=>{
      const div=document.createElement('div');
      div.className='member';
      div.textContent = n;
      box.appendChild(div);
    });

    hasilArea.appendChild(box);
  });

  info.textContent =
   `Kelas ${kelasSelect.value} • ${pool.length} siswa • Tugas dibagi otomatis.`;
};

// ===== DOWNLOAD EXCEL =====
dlExcelBtn.onclick = ()=>{
  if(!Object.keys(hasilTugas).length){
    alert("Bagi tugas dulu!");
    return;
  }

  let rows = [["TUGAS","NAMA"]];
  Object.keys(hasilTugas).forEach(t=>{
    hasilTugas[t].forEach(n=>{
      rows.push([t,n]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Tugas");

  XLSX.writeFile(wb, "Pembagian_Tugas_RESHAP.xlsx");
};

// ===== DOWNLOAD TXT =====
dlTxtBtn.onclick = ()=>{
  if(!Object.keys(hasilTugas).length){
    alert("Bagi tugas dulu!");
    return;
  }

  let txt = `PEMBAGIAN TUGAS RESHAP - KELAS ${kelasSelect.value}\n\n`;

  Object.keys(hasilTugas).forEach(t=>{
    txt += `=== ${t} ===\n`;
    hasilTugas[t].forEach(n=> txt += "- "+n+"\n");
    txt += "\n";
  });

  const blob = new Blob([txt], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Pembagian_Tugas_RESHAP.txt";
  a.click();
};

// ===== RESET =====
resetBtn.onclick = ()=>{
  hasilArea.innerHTML='';
  hasilTugas = {};
  info.textContent="Silakan buat ulang tugas.";
};
</script>

</body>
</html>
