<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai ASAT Informatika Kelas 7 - SMPN 1 Moga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
            /* Kombinasi gradasi lembut Biru SMP dan Putih */
            background-image: radial-gradient(circle at top right, #e0f2fe 0%, #f1f5f9 50%, #ffffff 100%);
            position: relative;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Line Art Pattern Terintegrasi di Background */
        .line-art-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }
        
        /* Glassmorphism Terang Mewah dengan Accent Border */
        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(2, 132, 199, 0.2); 
            box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.15), inset 0 1px 0px rgba(255, 255, 255, 0.6);
        }
        
        /* Paksa Output Teks tidak Kapital Otomatis */
        .item-value { text-transform: none !important; }
        
        /* Efek Stiker Pengumuman Gosok Nilai */
        .nilai-besar { 
            font-size: 76px; 
            font-weight: 800; 
            text-align: center; 
            line-height: 1; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            filter: blur(14px); 
            cursor: pointer; 
            user-select: none; 
        }
        .nilai-clear { filter: blur(0px) !important; }

        /* Animasi Goyang Stiker Penutup Sebelum Dibuka */
        #stikerNilai { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 160px; 
            height: auto; 
            cursor: pointer; 
            z-index: 40; 
            transition: opacity 0.4s ease, transform 0.3s ease; 
            animation: shakeSticker 2s infinite ease-in-out; 
        }
        #stikerNilai.hide { 
            opacity: 0; 
            pointer-events: none; 
            transform: translate(-50%, -50%) scale(0.7); 
        }

        @keyframes shakeSticker {
            0%, 100% { transform: translate(-50%, -48%) rotate(0deg); }
            25% { transform: translate(-53%, -52%) rotate(-3deg); }
            75% { transform: translate(-47%, -50%) rotate(3deg); }
        }
        
        /* Animasi Fade In Lembut */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex items-center justify-center p-4 antialiased selection:bg-sky-500 selection:text-white">

    <!-- Variasi Line Art SVG Keren Tersebar di Latar Belakang -->
    <svg class="line-art-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <!-- Grid Pola Titik -->
        <defs>
            <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1.5" fill="#0284c7" opacity="0.08"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#dotGrid)" />
        
        <!-- Garis Abstrak / Line Art Modern -->
        <g stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.12">
            <circle cx="150" cy="150" r="120" />
            <circle cx="150" cy="150" r="80" stroke-dasharray="5 5" />
            <line x1="0" y1="150" x2="300" y2="150" />
            <line x1="150" y1="0" x2="150" y2="300" />
        </g>
        <g stroke="#eab308" stroke-width="2" fill="none" opacity="0.15">
            <path d="M1200,700 Q1250,550 1400,600 T1600,450" />
            <path d="M1180,720 Q1230,570 1380,620 T1580,470" stroke-dasharray="4 4" />
        </g>
        <g stroke="#0284c7" stroke-width="1" fill="none" opacity="0.1">
            <polygon points="100,700 180,620 250,720 120,780" />
            <polygon points="1300,100 1350,180 1250,220" />
        </g>
    </svg>

    <div class="w-full max-w-md glass-card rounded-3xl p-6 md:p-8 relative overflow-hidden bg-white/90">
        
        <!-- Ornamen Gradasi Sudut Lembut -->
        <div class="absolute -top-16 -right-16 w-44 h-44 bg-gradient-to-br from-sky-400/20 to-yellow-400/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-44 h-44 bg-gradient-to-tr from-sky-300/20 to-white/40 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-6 relative z-10">
            <!-- Badge Logo / Icon dengan warna Biru SMP & Kuning OSIS -->
            <div class="inline-flex p-3 bg-gradient-to-tr from-sky-100 via-white to-amber-500/10 rounded-2xl mb-3 border border-sky-200 shadow-md">
                <svg class="w-8 h-8 text-sky-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-4-9 4 9 5zm0 0l9-5-9-4-9 4 9 5zm0 0v6m0 0l3-3m-3 3l-3-3M3.5 12v4.5A1.5 1.5 0 005 18h14a1.5 1.5 0 001.5-1.5V12"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-sky-800 to-sky-600">SMP NEGERI 1 MOGA</h1>
            <p class="text-[10px] tracking-widest text-amber-500 font-extrabold uppercase mt-1">Sistem Pengumuman Resmi Nilai ASAT</p>
        </div>

        <div id="loginBox" class="space-y-5 relative z-10">
            <div class="bg-sky-50 border border-sky-100 rounded-2xl p-4 text-center">
                <p class="text-xs text-sky-800 font-medium leading-relaxed">Silakan pilih kelas dan nama Anda, lalu masukkan kata sandi pengaman untuk melihat lembar nilai.</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); prosesAksesMasuk();" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">1. Pilih Kelas</label>
                    <select id="kelas" required onchange="sinkronisasiDropdownNama()" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition duration-200 cursor-pointer shadow-sm">
                        <option value="">-- Pilih Kelas Anda --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">2. Pilih Nama Lengkap</label>
                    <select id="username" required disabled class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer shadow-sm">
                        <option value="">-- Pilih Nama Lengkap --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">3. Kata Sandi / PIN</label>
                    <input id="password" type="password" placeholder="Masukkan password akun" required class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition duration-200 placeholder-slate-400 shadow-sm" />
                </div>

                <div class="flex items-center gap-2.5 py-0.5">
                    <input type="checkbox" id="showPassword" onclick="toggleTampilanSandi()" class="w-4 h-4 rounded border-slate-300 bg-white text-sky-600 focus:ring-sky-500 cursor-pointer" />
                    <label for="showPassword" class="text-xs text-slate-600 select-none cursor-pointer hover:text-slate-800">Tampilkan Kata Sandi</label>
                </div>

                <!-- Tombol Biru SMP Utama -->
                <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-sky-600 via-sky-700 to-sky-800 hover:opacity-95 text-white font-extrabold py-3.5 px-4 rounded-xl text-sm transition duration-300 tracking-wide shadow-md shadow-sky-600/20 active:scale-[0.99]">
                    Buka Lembar Hasil &rarr;
                </button>
            </form>

            <div id="loginError" class="transition-all duration-300 hidden"></div>
            <div class="text-center text-[10px] text-slate-400 pt-4 border-t border-slate-200">© 2026 Informatika SMP Negeri 1 Moga</div>
        </div>

        <div id="dashboardBox" class="hidden space-y-5 relative z-10 fade-in">
            
            <!-- Segel Kuning Emas OSIS -->
            <div id="stikerNilai" onclick="bukaSegelStiker()">
                <svg class="w-full h-full drop-shadow-xl filter hover:scale-105 transition" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="url(#gradSticker)" stroke="#d97706" stroke-width="2"/>
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3"/>
                    <path d="M32 72 L50 88 L68 72 L60 62 L40 62 Z" fill="#92400e"/>
                    <text x="50" y="44" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">BUKA</text>
                    <text x="50" y="56" fill="#fff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle">SEGEL NILAI</text>
                    <defs>
                        <linearGradient id="gradSticker" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fbbf24" />
                            <stop offset="100%" stop-color="#d97706" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs shadow-inner">
                <div class="col-span-2 border-b border-slate-200 pb-2">
                    <span class="text-slate-400 uppercase font-bold text-[9px] tracking-wider block mb-0.5">Nama Lengkap Siswa</span>
                    <span id="nama" class="font-bold text-slate-800 text-sm item-value"></span>
                </div>
                <div>
                    <span class="text-slate-400 uppercase font-bold text-[9px] tracking-wider block mb-0.5">Kelas</span>
                    <span id="kelasOut" class="font-bold text-sky-600 text-sm"></span>
                </div>
                <div>
                    <span class="text-slate-400 uppercase font-bold text-[9px] tracking-wider block mb-0.5">Jenis Kelamin</span>
                    <span id="resGender" class="font-semibold text-slate-700 text-sm"></span>
                </div>
            </div>

            <div class="text-center py-6 bg-gradient-to-b from-white to-slate-50 rounded-3xl border border-slate-200 shadow-sm relative overflow-hidden">
                <span class="text-[10px] uppercase tracking-widest font-extrabold text-slate-400 block mb-0.5">NILAI AKHIR ASAT</span>
                
                <div id="nilai" class="nilai-besar text-slate-400 font-mono" onclick="segelUlangNilai()">00</div>
                
                <div id="statusKelulusan" class="text-[10px] font-bold inline-block px-3 py-1 rounded-full mt-3"></div>
            </div>

            <div class="text-center px-1">
                <p id="motivasi" class="text-xs italic text-slate-500 item-value leading-relaxed"></p>
            </div>

            <div id="remidi" class="transition-all duration-300"></div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-[11px] font-extrabold uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-600 to-amber-500 mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                    </svg>
                    Peringkat 5 Besar Kelas
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 font-bold text-[9px] uppercase tracking-wider">
                                <th class="py-2 w-12 text-center">Rank</th>
                                <th class="py-2">Nama Siswa</th>
                                <th class="py-2 text-right">Nilai</th>
                            </tr>
                        </thead>
                        <tbody id="tableRanking" class="divide-y divide-slate-100 text-slate-700 font-medium">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <button onclick="keluarSesi()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-3 rounded-xl font-semibold transition tracking-wide border border-slate-200 shadow-sm">
                &larr; Tutup Lembar Nilai
            </button>
        </div>

    </div>

    <script>
        const BACKEND_GAS_URL = "https://script.google.com/macros/s/AKfycbwca2XUvlQpsqxMMyouKOrIkyq3xI5uxZ0fL_xGgqd9HVUoXyQ0wHEfloGe6KQKa4hd/exec";
        
        let daftarSiswaLokal = [];
        let paketMetadata = { ip: "-", device: "-", browser: "-", provider: "-" };

        window.addEventListener('DOMContentLoaded', () => {
            ambilDataMetadataAkses();
            muatDropdownUtama();
            cekSesiSimpananSiswa();
        });

        function cekSesiSimpananSiswa() {
            const disimpanSiswa = sessionStorage.getItem('sesiSiswa');
            const disimpanRanking = sessionStorage.getItem('sesiRanking');
            
            if (disimpanSiswa && disimpanRanking) {
                alihkanHalamanNilai(JSON.parse(disimpanSiswa), JSON.parse(disimpanRanking));
            }
        }

        async function ambilDataMetadataAkses() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const json = await res.json();
                paketMetadata.ip = json.ip || "-";
                paketMetadata.provider = json.org || "-";
            } catch(e) { 
                console.log("Koneksi API IP Track Terhambat Jaringan."); 
            }

            const agenSistem = navigator.userAgent;
            if (/mobile/i.test(agenSistem)) paketMetadata.device = "Smartphone / Mobile";
            else if (/ipad|tablet/i.test(agenSistem)) paketMetadata.device = "Tablet PC";
            else paketMetadata.device = "Laptop / Desktop PC";

            if (agenSistem.includes("Chrome") && agenSistem.includes("Safari")) paketMetadata.browser = "Google Chrome";
            else if (agenSistem.includes("Firefox")) paketMetadata.browser = "Mozilla Firefox";
            else if (agenSistem.includes("Safari") && !agenSistem.includes("Chrome")) paketMetadata.browser = "Apple Safari";
            else paketMetadata.browser = "Browser Sistem / Unknown";
        }

        async function muatDropdownUtama() {
            try {
                const response = await fetch(BACKEND_GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getDropdown' })
                });
                const callback = await response.json();
                
                if (callback.status === "success") {
                    daftarSiswaLokal = callback.data;
                    const kelasUnik = [...new Set(daftarSiswaLokal.map(item => item.kelas))];
                    const elemenKelas = document.getElementById('kelas');
                    
                    kelasUnik.forEach(kls => {
                        let opt = document.createElement('option');
                        opt.value = kls;
                        opt.innerText = "Kelas " + kls;
                        elemenKelas.appendChild(opt);
                    });
                } else {
                    gagalSistemError("Sinkronisasi database dropdown gagal.");
                }
            } catch (err) {
                gagalSistemError("Gagal terkoneksi dengan Cloud Apps Script.");
            }
        }

        function sinkronisasiDropdownNama() {
            const kelasPilihan = document.getElementById('kelas').value;
            const elemenNama = document.getElementById('username');
            
            elemenNama.innerHTML = '<option value="">-- Pilih Nama Lengkap --</option>';
            
            if (!kelasPilihan) {
                elemenNama.disabled = true;
                return;
            }
            
            const hasilFilter = daftarSiswaLokal.filter(m => m.kelas === kelasPilihan);
            hasilFilter.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.nama;
                opt.innerText = m.nama;
                elemenNama.appendChild(opt);
            });
            elemenNama.disabled = false;
        }

        function toggleTampilanSandi() {
            const sandiField = document.getElementById('password');
            sandiField.type = document.getElementById('showPassword').checked ? "text" : "password";
        }

        async function prosesAksesMasuk() {
            const kls = document.getElementById('kelas').value;
            const nm = document.getElementById('username').value;
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('btnSubmit');
            const err = document.getElementById('loginError');

            err.classList.add('hidden');

            if (!kls || !nm || !pwd) {
                gagalSistemError("Seluruh kolom wajib diisi lengkap!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Memverifikasi Kunci Sandi...";

            try {
                const response = await fetch(BACKEND_GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        kelas: kls,
                        nama: nm,
                        password: pwd,
                        meta: paketMetadata
                    })
                });
                
                const callback = await response.json();
                
                if (callback.status === "success") {
                    sessionStorage.setItem('sesiSiswa', JSON.stringify(callback.siswa));
                    sessionStorage.setItem('sesiRanking', JSON.stringify(callback.ranking));
                    alihkanHalamanNilai(callback.siswa, callback.ranking);
                } else if (callback.status === "belum_siap") {
                    err.className = "text-left bg-amber-50 text-amber-700 p-4 rounded-xl border border-amber-200 space-y-1.5 transition-all duration-300 shadow-sm";
                    err.innerHTML = `
                        <div class="flex items-center gap-2 font-bold text-xs uppercase tracking-wide text-amber-800">
                            ⚠️ Pemberitahuan Resmi
                        </div>
                        <p class="text-[11px] leading-relaxed opacity-90">${callback.message}</p>
                    `;
                    err.classList.remove('hidden');
                    resetTombolUtama(btn);
                } else {
                    gagalSistemError(callback.message);
                    resetTombolUtama(btn);
                }
            } catch (err) {
                gagalSistemError("Masalah interupsi server jaringan.");
                resetTombolUtama(btn);
            }
        }

        function alihkanHalamanNilai(siswa, peringkat) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('dashboardBox').classList.remove('hidden');

            document.getElementById('nama').innerText = siswa.nama;
            document.getElementById('kelasOut').innerText = "Kelas " + siswa.kelas;
            document.getElementById('resGender').innerText = (siswa.gender === "L" || siswa.gender === "Laki-laki") ? "Laki-Laki" : "Perempuan";
            
            const nEl = document.getElementById('nilai');
            nEl.innerText = siswa.nilai;
            nEl.classList.remove('nilai-clear');

            const stiker = document.getElementById('stikerNilai');
            stiker.classList.remove('hide');

            const badge = document.getElementById('statusKelulusan');
            const areaRemedial = document.getElementById('remidi');

            if (siswa.nilai >= siswa.kkm) {
                nEl.className = "nilai-besar text-emerald-600 font-mono";
                badge.innerText = "KOMPETEN / TUNTAS ASAT";
                badge.className = "text-[10px] font-bold inline-block px-3 py-1 rounded-full mt-3 bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm";
                areaRemedial.innerHTML = "";
            } else {
                nEl.className = "nilai-besar text-rose-600 font-mono";
                badge.innerText = "BELUM TUNTAS ASAT";
                badge.className = "text-[10px] font-bold inline-block px-3 py-1 rounded-full mt-3 bg-rose-50 text-rose-700 border border-rose-200 shadow-sm";
                
                areaRemedial.innerHTML = `
                    <div class="p-1 bg-gradient-to-r from-amber-500/10 to-orange-500/10 rounded-2xl border border-amber-200 mt-1 shadow-sm">
                        <a href="${siswa.linkRemedial || '#'}" target="_blank" class="block bg-gradient-to-r from-amber-500 to-orange-500 hover:opacity-95 text-white text-xs font-extrabold py-3.5 px-4 rounded-xl text-center shadow-md transition duration-200 transform hover:-translate-y-0.5">
                            IKUTI REMEDIAL ONLINE
                        </a>
                    </div>
                    <p class="text-[9px] text-amber-600 text-center mt-1.5 font-medium">*Nilai di bawah batas KKM (${siswa.kkm}). Tombol remedial otomatis aktif.</p>
                `;
            }

            document.getElementById('motivasi').innerText = siswa.motivasi || "-";

            const tBody = document.getElementById('tableRanking');
            tBody.innerHTML = '';
            
            peringkat.forEach((r, idx) => {
                let md = idx === 0 ? "🥇 " : idx === 1 ? "🥈 " : idx === 2 ? "🥉 " : "";
                let isUserSiswaRow = (r.nama.toLowerCase() === siswa.nama.toLowerCase());
                
                let barisMarkup = `
                    <tr class="${isUserSiswaRow ? 'bg-sky-50 text-sky-800 font-bold' : 'hover:bg-slate-50'} transition">
                        <td class="py-2.5 text-center font-mono text-[11px]">${md || (idx + 1)}</td>
                        <td class="py-2.5 item-value truncate max-w-[170px]">${r.nama} ${isUserSiswaRow ? '<span class="text-[8px] bg-sky-600 text-white px-1.5 py-0.5 rounded ml-1 font-bold">Kamu</span>' : ''}</td>
                        <td class="py-2.5 text-right font-mono font-bold">${r.nilai}</td>
                    </tr>
                `;
                tBody.innerHTML += barisMarkup;
            });
        }

        function bukaSegelStiker() {
            document.getElementById('stikerNilai').classList.add('hide');
            document.getElementById('nilai').classList.add('nilai-clear');
        }

        function segelUlangNilai() {
            document.getElementById('stikerNilai').classList.remove('hide');
            document.getElementById('nilai').classList.remove('nilai-clear');
        }

        function keluarSesi() {
            sessionStorage.removeItem('sesiSiswa');
            sessionStorage.removeItem('sesiRanking');

            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('password').value = "";
            resetTombolUtama(document.getElementById('btnSubmit'));
        }

        function gagalSistemError(pesan) {
            const box = document.getElementById('loginError');
            box.className = "text-xs font-semibold text-rose-700 text-center bg-rose-50 py-3 px-4 rounded-xl border border-rose-200 transition-all duration-300 shadow-sm";
            box.innerText = pesan;
            box.classList.remove('hidden');
        }

        function resetTombolUtama(btn) {
            btn.disabled = false;
