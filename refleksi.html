<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Siswa</title>

<style>
:root {
  --primary: #0d47a1;
  --secondary: #009688;
  --light: #f4f7fb;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  width: 420px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  overflow: hidden;
}

.header {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 18px;
}

.header h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

.content {
  padding: 20px;
}

.nama {
  font-size: 26px;
  font-weight: bold;
  color: var(--primary);
  text-align: center;
  margin-bottom: 20px;
}

.data {
  display: grid;
  grid-template-columns: 1fr 2fr;
  row-gap: 10px;
}

.label {
  font-weight: 600;
  color: #555;
}

.value {
  color: #222;
}

.footer {
  background: var(--light);
  padding: 15px;
  text-align: center;
}

button {
  background: var(--secondary);
  color: white;
  border: none;
  padding: 8px 16px;
  margin: 5px;
  border-radius: 20px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2>DATA SISWA</h2>
  </div>

  <div class="content">
    <div id="nama" class="nama">Memuat...</div>
    <div id="data" class="data"></div>
  </div>

  <div class="footer">
    <button onclick="prevRow()">⬅ Sebelumnya</button>
    <button onclick="nextRow()">Berikutnya ➡</button>
  </div>
</div>

<script>
const sheetId = "1e_PwQQV-dwlrcPrH3TaP8qMfeIR1ofZqcYxczUbIkk0";
const sheetName = "Sheet1";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let headers = [];
let rows = [];
let index = 0;

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47, text.length - 2));
    headers = json.table.cols.map(col => col.label);
    rows = json.table.rows.map(row =>
      row.c.map(cell => cell ? cell.v : "")
    );
    render();
  });

function render() {
  if (!rows[index]) return;

  const namaIndex = headers.findIndex(h =>
    h.toLowerCase().includes("nama")
  );

  document.getElementById("nama").innerText =
    namaIndex >= 0 ? rows[index][namaIndex] : "Nama Tidak Ditemukan";

  const dataDiv = document.getElementById("data");
  dataDiv.innerHTML = "";

  headers.forEach((header, i) => {
    if (i === namaIndex) return;

    dataDiv.innerHTML += `
      <div class="label">${header}</div>
      <div class="value">${rows[index][i]}</div>
    `;
  });
}

function nextRow() {
  if (index < rows.length - 1) {
    index++;
    render();
  }
}

function prevRow() {
  if (index > 0) {
    index--;
    render();
  }
}
</script>

</body>
</html>
