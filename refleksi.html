<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Refleksi Pembelajaran</title>

<style>
:root {
  --primary: #0d47a1;
  --secondary: #009688;
  --light: #f4f7fb;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  width: 500px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  overflow: hidden;
}

.header {
  background: var(--primary);
  color: white;
  padding: 15px;
  text-align: center;
}

.filter {
  padding: 15px;
  background: var(--light);
  text-align: center;
}

select, button.filter-btn {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
  font-size: 14px;
  margin: 5px;
}

button.filter-btn {
  background: var(--secondary);
  color: white;
  border: none;
  cursor: pointer;
}

.content {
  padding: 20px;
}

.nama {
  font-size: 24px;
  font-weight: bold;
  color: var(--primary);
  text-align: center;
  margin-bottom: 15px;
}

.qa {
  background: var(--light);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.question {
  font-weight: bold;
  margin-bottom: 5px;
}

.answer {
  padding-left: 10px;
  border-left: 4px solid var(--secondary);
  margin-bottom: 10px;
}

.footer {
  padding: 15px;
  text-align: center;
}

button.nav {
  background: var(--secondary);
  color: white;
  border: none;
  padding: 8px 18px;
  margin: 5px;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2>REFLEKSI PEMBELAJARAN</h2>
  </div>

  <div class="filter">
    <select id="kelasSelect">
      <option value="">Pilih Kelas</option>
    </select>
    <br>
    <button class="filter-btn" onclick="tampilkanData()">Tampilkan Data</button>
  </div>

  <div class="content">
    <div id="nama" class="nama">Silakan pilih kelas</div>

    <!-- SEMUA PERTANYAAN & JAWABAN -->
    <div id="qaList"></div>
  </div>

  <div class="footer">
    <button class="nav" onclick="prevRow()">⬅ Sebelumnya</button>
    <button class="nav" onclick="nextRow()">Berikutnya ➡</button>
  </div>

</div>

<script>
const sheetId = "1e_PwQQV-dwlrcPrH3TaP8qMfeIR1ofZqcYxczUbIkk0";
const sheetName = "Sheet1";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let headers = [];
let allRows = [];
let filteredRows = [];
let index = 0;

let idxNama, idxKelas;
let startQ = 3; // Kolom D
let endQ   = 9; // Kolom J (7 pertanyaan)

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47, text.length - 2));
    headers = json.table.cols.map(col => col.label);
    allRows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));

    idxNama  = headers.findIndex(h => h.toLowerCase().includes("nama"));
    idxKelas = headers.findIndex(h => h.toLowerCase().includes("kelas"));

    isiDropdownKelas();
  });

function isiDropdownKelas() {
  const select = document.getElementById("kelasSelect");
  const kelasUnik = [...new Set(allRows.map(r => r[idxKelas]))];

  kelasUnik.forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k;
    select.appendChild(opt);
  });
}

function tampilkanData() {
  const kelas = document.getElementById("kelasSelect").value;
  if (!kelas) {
    alert("Pilih kelas terlebih dahulu");
    return;
  }

  filteredRows = allRows.filter(r => r[idxKelas] === kelas);
  index = 0;
  render();
}

function render() {
  if (!filteredRows[index]) return;

  document.getElementById("nama").innerText =
    filteredRows[index][idxNama];

  const qaList = document.getElementById("qaList");
  qaList.innerHTML = "";

  for (let i = startQ; i <= endQ; i++) {
    if (!headers[i]) continue;

    qaList.innerHTML += `
      <div class="qa">
        <div class="question">
          Pertanyaan : ${headers[i]}
        </div>
        <div class="answer">
          Jawaban : ${filteredRows[index][i] || "-"}
        </div>
      </div>
    `;
  }
}

function nextRow() {
  if (index < filteredRows.length - 1) {
    index++;
    render();
  }
}

function prevRow() {
  if (index > 0) {
    index--;
    render();
  }
}
</script>

</body>
</html>
