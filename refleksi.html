<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refleksi Pembelajaran</title>

<style>
:root {
  --primary: #0d47a1;
  --secondary: #009688;
  --light: #f4f7fb;
}

* { box-sizing: border-box; }

body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
}

/* ===== WRAPPER ===== */
.wrapper {
  display: flex;
  width: 100vw;
  height: 100vh;
  background: white;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  background: var(--light);
  padding: 15px;
  overflow-y: auto;
}

.sidebar h3 {
  margin-top: 0;
  text-align: center;
  color: var(--primary);
}

.sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.sidebar li {
  padding: 10px 12px;
  margin-bottom: 6px;
  background: white;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.sidebar li.active,
.sidebar li:hover {
  background: var(--secondary);
  color: white;
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  background: var(--primary);
  color: white;
  padding: 15px;
  text-align: center;
}

/* ===== FILTER ===== */
.filter {
  padding: 12px;
  background: var(--light);
  text-align: center;
}

select, button {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
  font-size: 14px;
  margin: 4px;
}

button {
  background: var(--secondary);
  color: white;
  border: none;
  cursor: pointer;
}

/* ===== CONTENT ===== */
.content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.nama {
  font-size: 26px;
  font-weight: bold;
  color: var(--primary);
  text-align: center;
  margin-bottom: 20px;
}

.qa {
  background: var(--light);
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
}

.question {
  font-weight: bold;
  margin-bottom: 6px;
}

.answer {
  padding-left: 10px;
  border-left: 4px solid var(--secondary);
}

/* ===== FOOTER ===== */
.footer {
  padding: 12px;
  text-align: center;
  border-top: 1px solid #eee;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .wrapper { flex-direction: column; }
  .sidebar {
    width: 100%;
    max-height: 180px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Daftar Siswa</h3>
    <ul id="siswaList">
      <li>Pilih kelas</li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h2>REFLEKSI PEMBELAJARAN</h2>
    </div>

    <div class="filter">
      <select id="kelasSelect">
        <option value="">Pilih Kelas</option>
      </select>
      <button onclick="tampilkanData()">Tampilkan</button>
    </div>

    <div class="content">
      <div id="nama" class="nama">Silakan pilih kelas</div>
      <div id="qaList"></div>
    </div>

    <div class="footer">
      <button onclick="prevRow()">⬅ Sebelumnya</button>
      <button onclick="nextRow()">Berikutnya ➡</button>
    </div>

  </div>
</div>

<script>
const sheetId = "1e_PwQQV-dwlrcPrH3TaP8qMfeIR1ofZqcYxczUbIkk0";
const sheetName = "Sheet1";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let headers = [];
let allRows = [];
let filteredRows = [];
let index = 0;

let idxNama, idxKelas, startQ;

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47, text.length - 2));
    headers = json.table.cols.map(col => col.label);
    allRows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));

    idxNama  = headers.findIndex(h => h.toLowerCase().includes("nama"));
    idxKelas = headers.findIndex(h => h.toLowerCase().includes("kelas"));

    // Pertanyaan dimulai setelah kolom KELAS
    startQ = idxKelas + 1;

    isiDropdownKelas();
  });

function isiDropdownKelas() {
  const select = document.getElementById("kelasSelect");
  [...new Set(allRows.map(r => r[idxKelas]))].forEach(k => {
    if (!k) return;
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k;
    select.appendChild(opt);
  });
}

function tampilkanData() {
  const kelas = document.getElementById("kelasSelect").value;
  if (!kelas) return alert("Pilih kelas terlebih dahulu");

  filteredRows = allRows.filter(r => r[idxKelas] === kelas);
  index = 0;
  renderSidebar();
  render();
}

function renderSidebar() {
  const ul = document.getElementById("siswaList");
  ul.innerHTML = "";
  filteredRows.forEach((r, i) => {
    const li = document.createElement("li");
    li.textContent = r[idxNama];
    li.onclick = () => {
      index = i;
      render();
    };
    ul.appendChild(li);
  });
}

function render() {
  if (!filteredRows[index]) return;

  document.getElementById("nama").innerText =
    filteredRows[index][idxNama];

  const qaList = document.getElementById("qaList");
  qaList.innerHTML = "";

  for (let i = startQ; i < headers.length; i++) {
    qaList.innerHTML += `
      <div class="qa">
        <div class="question">Pertanyaan : ${headers[i]}</div>
        <div class="answer">Jawaban : ${filteredRows[index][i] || "-"}</div>
      </div>
    `;
  }

  document.querySelectorAll(".sidebar li").forEach((li, i) => {
    li.classList.toggle("active", i === index);
  });
}

function nextRow() {
  if (index < filteredRows.length - 1) {
    index++;
    render();
  }
}

function prevRow() {
  if (index > 0) {
    index--;
    render();
  }
}
</script>

</body>
</html>
