<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reader Google Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .row {
      margin-bottom: 10px;
    }
    .label {
      font-weight: bold;
    }
    button {
      margin: 5px;
      padding: 8px 14px;
    }
  </style>
</head>
<body>

<h2>Data dari Google Sheet</h2>

<div id="output"></div>

<button onclick="prevRow()">⬅ Prev</button>
<button onclick="nextRow()">Next ➡</button>

<script>
const sheetId = "1e_PwQQV-dwlrcPrH3TaP8qMfeIR1ofZqcYxczUbIkk0";
const sheetName = "Sheet1"; // ganti jika nama sheet berbeda
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let headers = [];
let rows = [];
let index = 0;

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47, text.length - 2));
    headers = json.table.cols.map(col => col.label);
    rows = json.table.rows.map(row =>
      row.c.map(cell => cell ? cell.v : "")
    );
    render();
  });

function render() {
  const output = document.getElementById("output");
  output.innerHTML = "";

  if (!rows[index]) {
    output.innerHTML = "<p>Data tidak tersedia</p>";
    return;
  }

  headers.forEach((header, i) => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<span class="label">${header}:</span> ${rows[index][i]}`;
    output.appendChild(div);
  });
}

function nextRow() {
  if (index < rows.length - 1) {
    index++;
    render();
  }
}

function prevRow() {
  if (index > 0) {
    index--;
    render();
  }
}
</script>

</body>
</html>
