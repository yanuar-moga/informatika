<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Jawaban Siswa</title>

<style>
:root {
  --primary: #0d47a1;
  --secondary: #009688;
  --light: #f4f7fb;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  width: 480px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  overflow: hidden;
}

.header {
  background: var(--primary);
  color: white;
  padding: 15px;
  text-align: center;
}

.header h2 {
  margin: 0;
  font-size: 20px;
}

.filter {
  padding: 15px;
  background: var(--light);
  text-align: center;
}

select {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.content {
  padding: 20px;
}

.nama {
  font-size: 24px;
  font-weight: bold;
  color: var(--primary);
  text-align: center;
  margin-bottom: 15px;
}

.qa {
  background: var(--light);
  padding: 15px;
  border-radius: 12px;
}

.question {
  font-weight: bold;
  margin-bottom: 10px;
}

.answer {
  padding-left: 10px;
  border-left: 4px solid var(--secondary);
  color: #333;
}

.footer {
  padding: 15px;
  text-align: center;
}

button {
  background: var(--secondary);
  color: white;
  border: none;
  padding: 8px 18px;
  margin: 5px;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2>REFLEKSI PEMBELAJARAN</h2>
  </div>

  <div class="filter">
    Filter Kelas :
    <select id="kelasFilter" onchange="applyFilter()">
      <option value="">Semua Kelas</option>
    </select>
  </div>

  <div class="content">
    <div id="nama" class="nama">Memuat...</div>

    <div class="qa">
      <div class="question" id="pertanyaan"></div>
      <div class="answer" id="jawaban"></div>
    </div>
  </div>

  <div class="footer">
    <button onclick="prevRow()">⬅ Sebelumnya</button>
    <button onclick="nextRow()">Berikutnya ➡</button>
  </div>

</div>

<script>
const sheetId = "1e_PwQQV-dwlrcPrH3TaP8qMfeIR1ofZqcYxczUbIkk0";
const sheetName = "Sheet1";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let headers = [];
let allRows = [];
let rows = [];
let index = 0;

let idxNama, idxKelas, idxTanya, idxJawab;

fetch(url)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47, text.length - 2));

    headers = json.table.cols.map(col => col.label);
    allRows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));

    idxNama  = headers.findIndex(h => h.toLowerCase().includes("nama"));
    idxKelas = headers.findIndex(h => h.toLowerCase().includes("kelas"));
    idxTanya = headers.findIndex(h => h.toLowerCase().includes("pertanyaan"));
    idxJawab = headers.findIndex(h => h.toLowerCase().includes("jawaban"));

    populateFilter();
    rows = allRows;
    render();
  });

function populateFilter() {
  const select = document.getElementById("kelasFilter");
  const kelasUnik = [...new Set(allRows.map(r => r[idxKelas]))];

  kelasUnik.forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k;
    select.appendChild(opt);
  });
}

function applyFilter() {
  const kelas = document.getElementById("kelasFilter").value;
  rows = kelas ? allRows.filter(r => r[idxKelas] === kelas) : allRows;
  index = 0;
  render();
}

function render() {
  if (!rows[index]) return;

  document.getElementById("nama").innerText = rows[index][idxNama];
  document.getElementById("pertanyaan").innerText =
    "Pertanyaan : " + rows[index][idxTanya];
  document.getElementById("jawaban").innerText =
    "Jawaban : " + rows[index][idxJawab];
}

function nextRow() {
  if (index < rows.length - 1) {
    index++;
    render();
  }
}

function prevRow() {
  if (index > 0) {
    index--;
    render();
  }
}
</script>

</body>
</html>
