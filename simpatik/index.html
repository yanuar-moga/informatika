<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIMPATIK v1.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#1565c0,#1976d2,#42a5f5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.card{
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
    animation:fadeIn .7s ease;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:90px;
}

.title{
    text-align:center;
    color:#1565c0;
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#444;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    background:#f2f5f8;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border:2px solid #1565c0;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1565c0;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#1565c0;
}

.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-content{
    background:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    text-align:center;
    animation:zoomIn .3s ease;
}

.popup-content h2{
    color:#1565c0;
    margin-bottom:10px;
}

.popup-content button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    background:#1565c0;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.footer{
    text-align:center;
    margin-top:15px;
    color:white;
    font-size:13px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes zoomIn{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            <img src="https://yanuar-moga.github.io/guruwali/assets/logo.png">
        </div>

        <div class="title">SIMPATIK</div>
        <div class="subtitle">
            Sistem Monitoring Pemahaman dan Asesmen Tingkat Kompetensi
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Masukkan username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Masukkan password">
        </div>

        <div class="input-group">
            <label>Token</label>
            <input type="text" id="token" placeholder="Masukkan token ujian">
        </div>

        <button class="btn" onclick="login()">
            MASUK
        </button>

        <div class="loading" id="loading">
            Memproses login...
        </div>

    </div>

    <div class="footer">
        SIMPATIK v1.0<br>
        SMPN 1 MOGA
    </div>

</div>


<div class="popup" id="popup">
    <div class="popup-content">
        <h2 id="popupTitle">Informasi</h2>
        <p id="popupMessage"></p>
        <button onclick="closePopup()">Tutup</button>
    </div>
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxBJYaxWNHsfjwhLk6cEIbDuPwpnFo0wWlCIxIhvaTrbyOAMxUc9X8jgL9vvw16_DlUmA/exec";

function showPopup(title,message){
    document.getElementById("popupTitle").innerText=title;
    document.getElementById("popupMessage").innerText=message;
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

async function login(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();
    const token=document.getElementById("token").value.trim();

    if(username==="" || password==="" || token===""){
        showPopup(
            "Peringatan",
            "Username, Password dan Token wajib diisi."
        );
        return;
    }

    document.getElementById("loading").style.display="block";

    try{

        const device=navigator.userAgent;

        let gps="";

        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
                function(position){
                    gps=
                    position.coords.latitude+
                    ","+
                    position.coords.longitude;
                }
            );
        }

        const response = await fetch(SCRIPT_URL,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },
            body:JSON.stringify({
                action:"login",
                username:username,
                password:password,
                token:token,
                device:device,
                gps:gps,
                provider:"",
                ip:""
            })
        });

        const result = await response.json();

        document.getElementById("loading").style.display="none";

        if(result.status){

            localStorage.setItem(
                "sesi_siswa",
                JSON.stringify(result)
            );

            showPopup(
                "Login Berhasil",
                "Selamat datang "+result.nama
            );

            setTimeout(function(){
                window.location.href="dashboard.html";
            },2000);

        }else{

            showPopup(
                "Login Gagal",
                result.message
            );

        }

    }catch(err){

        document.getElementById("loading").style.display="none";

        showPopup(
            "Kesalahan",
            err.toString()
        );

    }

}

</script>

</body>
</html>
