<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ujian - SIMPATIK v1.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary: #1e40af; --success: #22c55e; --text-dark: #1e293b; --text-light: #64748b; --border: #e2e8f0; --belum-tuntas: #ea580c; --tuntas: #16a34a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%); display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 850px; }
        .card { background: white; border-radius: 24px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .wizard-section { display: none; }
        .wizard-section.active { display: block; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:disabled { background: #94a3b8; }
        .info-table { width: 100%; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; border-collapse: collapse; }
        .info-table td { padding: 12px; border-bottom: 1px solid var(--border); }
        .opsi { padding: 15px; border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .opsi.selected { border-color: var(--primary); background: #e0f2fe; }
        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .btn-nomor { padding: 10px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; }
        .btn-nomor.active { background: var(--primary); color: white; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle"></h3>
        <p id="modalText" style="margin: 15px 0; color: var(--text-light);"></p>
        <button class="btn" onclick="document.getElementById('customModal').style.display='none'">OK</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <div id="sec-konfirmasi" class="wizard-section active">
            <h2>Konfirmasi Data</h2>
            <table class="info-table">
                <tr><td>Nama</td><td id="conf-nama">Memuat...</td></tr>
                <tr><td>Kelas</td><td id="conf-kelas">Memuat...</td></tr>
            </table>
            <button class="btn" id="btnMulai" onclick="mulaiUjian()" disabled>Memuat Soal...</button>
        </div>

        <div id="sec-soal" class="wizard-section">
            <h2 id="info-progres">Soal 1 dari X</h2>
            <div id="konten-soal" style="margin: 20px 0; font-size: 18px; line-height: 1.6;"></div>
            <div id="konten-opsi"></div>
            <div class="grid-nomor" id="gridNomor"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="soalSebelumnya()">Sebelumnya</button>
                <button class="btn" onclick="soalBerikutnya()">Selanjutnya</button>
            </div>
        </div>

        <div id="sec-nilai" class="wizard-section">
            <h2>Hasil Ujian</h2>
            <div style="font-size: 50px; text-align: center; margin: 20px;" id="txtSkor">0</div>
            <button class="btn" onclick="location.reload()">Selesai & Keluar</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzthPahlwqQ87mmp5n30Xi4QOCptKngkcKZXCsdKKtRBSqmOuFq-HPenI7Aq521hmxK4g/exec";
    let masterSoal = [], jawabanSiswa = {}, indeks = 0, dataSiswa = {};

    async function init() {
        const session = localStorage.getItem("sesi_siswa");
        if (!session) return location.href = "index.html";
        dataSiswa = JSON.parse(session);
        document.getElementById("conf-nama").innerText = dataSiswa.nama;
        document.getElementById("conf-kelas").innerText = dataSiswa.kelas;

        try {
            const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_soal", username: dataSiswa.username }) });
            const result = await res.json();
            masterSoal = result.data;
            document.getElementById("btnMulai").disabled = false;
            document.getElementById("btnMulai").innerText = "MULAI UJIAN";
        } catch (e) { showModal("Gagal", "Koneksi ke server bermasalah."); }
    }

    function showModal(title, text) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalText").innerText = text;
        document.getElementById("customModal").style.display = "flex";
    }

    function mulaiUjian() {
        document.getElementById("sec-konfirmasi").classList.remove("active");
        document.getElementById("sec-soal").classList.add("active");
        renderSoal(); renderNav();
    }

    function renderSoal() {
        const s = masterSoal[indeks];
        document.getElementById("info-progres").innerText = `Soal ${indeks + 1} dari ${masterSoal.length}`;
        document.getElementById("konten-soal").innerText = s.pertanyaan;
        const oC = document.getElementById("konten-opsi");
        oC.innerHTML = "";
        ['A', 'B', 'C', 'D', 'E'].forEach(h => {
            if (!s[h.toLowerCase()]) return;
            const div = document.createElement("div");
            div.className = `opsi ${jawabanSiswa[indeks] === h ? 'selected' : ''}`;
            div.innerText = `${h}. ${s[h.toLowerCase()]}`;
            div.onclick = () => { jawabanSiswa[indeks] = h; renderSoal(); };
            oC.appendChild(div);
        });
    }

    function renderNav() {
        const grid = document.getElementById("gridNomor");
        grid.innerHTML = "";
        masterSoal.forEach((_, i) => {
            const b = document.createElement("button");
            b.className = `btn-nomor ${i === indeks ? 'active' : ''}`;
            b.innerText = i + 1;
            b.onclick = () => { indeks = i; renderSoal(); renderNav(); };
            grid.appendChild(b);
        });
    }

    function soalSebelumnya() { if (indeks > 0) { indeks--; renderSoal(); renderNav(); } }
    function soalBerikutnya() { 
        if (indeks < masterSoal.length - 1) { indeks++; renderSoal(); renderNav(); }
        else { submitUjian(); }
    }

    async function submitUjian() {
        let benar = 0;
        masterSoal.forEach((s, i) => { if (jawabanSiswa[i] === s.kunci) benar++; });
        const skor = Math.round((benar / masterSoal.length) * 100);
        
        try {
            await fetch(SCRIPT_URL, { 
                method: "POST", 
                body: JSON.stringify({ action: "submit_jawaban", username: dataSiswa.username, skor: skor }) 
            });
            document.getElementById("sec-soal").classList.remove("active");
            document.getElementById("sec-nilai").classList.add("active");
            document.getElementById("txtSkor").innerText = skor;
        } catch (e) { showModal("Gagal", "Gagal menyimpan hasil."); }
    }

    window.onload = init;
</script>
</body>
</html>
