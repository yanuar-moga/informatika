<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Siswa Lab 2</title>
<style>
html,body{margin:0;min-height:100vh;background:#f1f5f9;font-family:Segoe UI,Arial,sans-serif;}
.container{display:grid;grid-template-columns:1fr 320px;gap:20px;padding:20px;max-width:1200px;margin:0 auto;}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);} 
.header{background:#2563eb;color:#fff;border-radius:0 0 16px 16px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
select,button{padding:10px 14px;border-radius:10px;border:1px solid #e2e8f0;font-size:14px;}
button.primary{background:#2563eb;color:white;border:none;font-weight:600;}
button.danger{background:#ef4444;color:white;border:none;font-weight:600;}
.spin-area{display:flex;flex-direction:column;align-items:center;gap:12px;}
#wheelWrap{width:320px;height:320px;border-radius:50%;background:conic-gradient(#2563eb,#22c55e,#eab308,#2563eb);display:flex;align-items:center;justify-content:center;transition:transform 4s cubic-bezier(.17,.67,.32,.99);} 
#centerLabel{width:140px;height:140px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;padding:10px;box-shadow:0 6px 15px rgba(0,0,0,.12);} 
#resultName{font-size:18px;}
.side{display:flex;flex-direction:column;gap:12px;}
.history-header{display:flex;justify-content:space-between;align-items:center;}
#historyList{list-style:none;padding:0;margin:0;}
#historyList li{border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-weight:600;}
#historyList li .num{font-size:28px;font-weight:800;width:36px;text-align:center;}
#historyList li:nth-child(1){background:#e0f2fe;color:#075985;}
#historyList li:nth-child(2){background:#ecfeff;color:#0f766e;}
#historyList li:nth-child(3){background:#fef3c7;color:#92400e;}
#historyList li:nth-child(4){background:#f0fdf4;color:#166534;}
#historyList li:nth-child(5){background:#f5f3ff;color:#5b21b6;}
.popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);} 
.popup .box{background:white;border-radius:20px;padding:24px 28px;text-align:center;min-width:280px;box-shadow:0 15px 40px rgba(0,0,0,.2);} 
.popup h2{margin:0 0 8px 0;} 
.popup button{margin-top:12px;} 
</style>
</head>
<body>
<div class="header"><h2>🎓 Spin Acak Siswa Lab 2</h2></div>
<div class="container">
<div class="card">
<div class="controls">
<select id="kelasSelect"><option value="ALL">Semua Kelas</option></select>
<select id="genderSelect"><option value="ALL">Semua</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
<button class="primary" id="spinBtn">SPIN SEKARANG</button>
</div>
<div class="spin-area">
<div id="wheelWrap"><div id="centerLabel"><div id="resultName">Klik SPIN</div></div></div>
<div id="countInfo">Memuat data…</div>
</div>
</div>
<div class="card side">
<div class="history-header">
<h3>📋 5 Hasil Terakhir</h3>
<button class="danger" id="resetBtn">Reset Daftar</button>
</div>
<ul id="historyList"></ul>
</div>
</div>
<div class="popup" id="popup">
<div class="box">
<h2>🎯 Terpilih</h2>
<div id="popupName" style="font-size:20px;font-weight:700;"></div>
<button id="closePopup">Tutup</button>
</div>
</div>
<script>
const SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/1alXonfmvgeFORy6B7esA-Zq2zrGQfryXMAj64POLsiE/gviz/tq?tqx=out:csv&sheet=DATA";
let students = [];
let history = [];
const kelasSelect = document.getElementById('kelasSelect');
const genderSelect = document.getElementById('genderSelect');
const spinBtn = document.getElementById('spinBtn');
const wheel = document.getElementById('wheelWrap');
const resultName = document.getElementById('resultName');
const countInfo = document.getElementById('countInfo');
const historyList = document.getElementById('historyList');
const resetBtn = document.getElementById('resetBtn');
const popup = document.getElementById('popup');
const popupName = document.getElementById('popupName');
document.getElementById('closePopup').onclick = ()=> popup.style.display='none';
function parseCSV(text){
 const rows = [];
 let cur='', arr=[], inQ=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c=='"'){ inQ=!inQ; continue; }
  if(c==',' && !inQ){ arr.push(cur.trim()); cur=''; continue; }
  if(c=='\n' && !inQ){ arr.push(cur.trim()); rows.push(arr); arr=[]; cur=''; continue; }
  cur+=c;
 }
 if(cur||arr.length) arr.push(cur.trim()), rows.push(arr);
 return rows;
}
fetch(SHEET_CSV_URL).then(r=>r.text()).then(t=>{
 const data=parseCSV(t);
 const header=data[0];
 const idxNama=header.indexOf('Nama');
 const idxJK=header.indexOf('Jenis Kelamin');
 const idxRombel=header.indexOf('Rombel');
 students=data.slice(1).filter(r=>r[idxNama]);
 const rombelSet=[...new Set(students.map(r=>r[idxRombel]))].sort();
 rombelSet.forEach(k=>{
  const opt=document.createElement('option');opt.value=k;opt.textContent=k;kelasSelect.appendChild(opt);
 });
 updateCount();
}).catch(e=>{countInfo.textContent='Gagal load Sheet';});
function getFiltered(){
 return students.filter(r=>{
  const nama=r[students[0]?0:0]; // placeholder
  const jk=r[2];
  const rombel=r[3];
  const okK = kelasSelect.value==='ALL' || rombel===kelasSelect.value;
  const okG = genderSelect.value==='ALL' || jk===genderSelect.value;
  return okK && okG;
 });
}
function updateCount(){
 const f=getFiltered();
 countInfo.textContent = f.length+" siswa tersedia";
}
kelasSelect.onchange=updateCount;
genderSelect.onchange=updateCount;
function renderHistory(){
 historyList.innerHTML='';
 history.slice(0,5).forEach((name,i)=>{
  const li=document.createElement('li');
  const num=document.createElement('div'); num.className='num'; num.textContent=i+1;
  const span=document.createElement('span'); span.textContent=name;
  li.appendChild(num); li.appendChild(span);
  historyList.appendChild(li);
 });
}
resetBtn.onclick=()=>{history=[];renderHistory();};
spinBtn.onclick=()=>{
 const pool=getFiltered();
 if(pool.length===0){alert('Tidak ada data untuk filter ini');return;}
 wheel.style.transform='rotate(1080deg)';
 setTimeout(()=>{
  wheel.style.transform='rotate(0deg)';
  const pick = pool[Math.floor(Math.random()*pool.length)][1];
  resultName.textContent=pick;
  history.unshift(pick);
  if(history.length>5) history.pop();
  renderHistory();
  popupName.textContent=pick;
  popup.style.display='flex';
 },4000);
};
</script>
</body>
</html>
