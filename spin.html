<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spinwheel Acak Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --primary:#3b82f6;
  --secondary:#22c55e;
  --accent:#f59e0b;
  --text:#e5e7eb;
}
*{box-sizing:border-box}
html,body{
  margin:0; padding:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:var(--text);
  min-height:100vh;
}
.app{max-width:960px;margin:0 auto;padding:20px}
header{text-align:center;padding:15px}
header h1{
  margin:0;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
header p{opacity:.8;font-size:14px}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:15px 0 25px;
}
.panel{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:12px;
  backdrop-filter:blur(8px);
}
.panel h3{margin:0 0 8px;font-size:15px}

.select{
  width:100%;padding:8px 10px;border-radius:10px;
  background:#020617;color:var(--text);border:1px solid rgba(255,255,255,.2)
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;transition:.2s;
}
.btn:hover{background:var(--primary)}
.btn.active{background:var(--secondary);color:#020617}

.wheel-wrap{display:flex;justify-content:center;position:relative;margin-top:10px}
#wheel{
  width:360px;height:360px;border-radius:50%;border:8px solid var(--primary);
  display:grid;place-items:center;
  transition:transform 1.2s cubic-bezier(.17,.67,.12,.99);
  position:relative;
}
#wheel-segments{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
}
.segment{
  position:absolute;inset:0;
  display:flex;align-items:flex-start;justify-content:center;
  transform-origin:50% 50%;
  padding-top:25px;
  font-size:12px;font-weight:600;color:#020617;text-align:center;
}
#wheel-inner{
  width:180px;height:180px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;
  box-shadow:0 0 20px rgba(0,0,0,.6);z-index:5;color:var(--text);
}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:48px;color:var(--accent);z-index:10}

#result{margin-top:15px;font-size:20px;font-weight:700;text-align:center}
.spin-row{text-align:center;margin-top:20px}
#spinBtn{
  padding:12px 30px;font-size:16px;border-radius:999px;border:none;
  background:linear-gradient(90deg,var(--primary),var(--secondary));color:#020617;font-weight:700;cursor:pointer;
}
#spinBtn:hover{filter:brightness(1.1)}

.stats{text-align:center;margin-top:15px;opacity:.8;font-size:14px}
footer{text-align:center;font-size:12px;margin-top:25px;opacity:.7}

/* ========== POPUP CELEBRATION ========== */
#celebrate-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;z-index:999;
}
#celebrate-box{
  background:linear-gradient(135deg,#2563eb,#22c55e);
  padding:30px 40px;border-radius:20px;text-align:center;color:#fff;
  box-shadow:0 0 30px rgba(0,0,0,.6);
  animation:popIn .5s ease-out;
}
#celebrate-name{font-size:32px;font-weight:800;margin:10px 0}
#closePop{
  margin-top:15px;padding:8px 18px;border-radius:999px;border:none;
  background:#fff;color:#020617;font-weight:700;cursor:pointer;
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:1000}

@media(max-width:700px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="celebrate-overlay">
  <div id="celebrate-box">
    <div>🎉 SELAMAT! 🎉</div>
    <div id="celebrate-name"></div>
    <button id="closePop">Tutup</button>
  </div>
</div>

<div class="app">
  <header>
    <h1>🎡 Spinwheel Acak Siswa</h1>
    <p>Spin khusus Rombel • Spin khusus Jenis Kelamin • Terhubung ke Google Sheet</p>
  </header>

  <div class="controls">
    <div class="panel">
      <h3>🎓 Pilih Kelas / Rombel</h3>
      <select id="kelasSelect" class="select">
        <option value="all">Memuat kelas...</option>
      </select>
    </div>

    <div class="panel">
      <h3>🚻 Pilih Jenis Kelamin</h3>
      <div class="btn-row">
        <button class="btn active" data-gender="all">Semua</button>
        <button class="btn" data-gender="L">Laki-laki</button>
        <button class="btn" data-gender="P">Perempuan</button>
      </div>
    </div>
  </div>

  <div class="wheel-wrap">
    <div class="pointer">▼</div>
    <div id="wheel">
      <div id="wheel-segments"></div>
      <div id="wheel-inner">
        <div id="center-text">Memuat data...</div>
      </div>
    </div>
  </div>

  <div id="result"></div>

  <div class="spin-row">
    <button id="spinBtn">SPIN SEKARANG</button>
  </div>

  <div class="stats">
    Siswa sesuai filter: <span id="count">0</span>
  </div>

  <footer>
    Pastikan Google Sheet disetel: Share → Anyone with link → Viewer
  </footer>
</div>

<script>
const SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1alXonfmvgeFORy6B7esA-Zq2zrGQfryXMAj64POLsiE/gviz/tq?tqx=out:csv&sheet=DATA";

let students = [];
let gender = "all";
let kelas = "all";
let rotation = 0;

// ===== CONFETTI EFFECT =====
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);
let pieces=[];
function launchConfetti(){
  pieces=[];
  for(let i=0;i<200;i++){
    pieces.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-200,
      r:Math.random()*6+2,
      d:Math.random()*3+1,
      color:['#fde68a','#93c5fd','#86efac','#fca5a5'][Math.floor(Math.random()*4)]});
  }
  animateConfetti();
}
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    p.y+=p.d; p.x+=Math.sin(p.y/20);
    if(p.y>canvas.height) p.y=-10;
    ctx.beginPath();ctx.fillStyle=p.color;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(animateConfetti);
}

// --- Safe CSV split (handles commas inside quotes) ---
function splitCSVLine(line){
  const regex = /,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/;
  return line.split(regex).map(v=>v.replace(/^"|"$/g,'').trim());
}

async function loadSheet(){
  try{
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    const rows = text.trim().split(/\r?\n/).filter(r=>r.trim());
    const headers = splitCSVLine(rows[0]);

    students = rows.slice(1).map(r=>{
      const cols = splitCSVLine(r);
      const obj = {};
      headers.forEach((h,i)=>obj[h] = (cols[i]||'').trim());
      return obj;
    }).filter(r=>r.Nama);

    buildKelasOptions();
    rebuildWheel();
    updateCount();
    document.getElementById('center-text').innerText = 'Klik SPIN';
  }catch(e){
    document.getElementById('center-text').innerText='Gagal load Sheet';
    console.error(e);
  }
}

function buildKelasOptions(){
  const select = document.getElementById('kelasSelect');
  const set = new Set(students.map(s=>s.Rombel).filter(Boolean));
  select.innerHTML = '<option value="all">Semua Rombel</option>';
  [...set].sort().forEach(k=>{
    const opt=document.createElement('option');opt.value=k;opt.textContent=k;select.appendChild(opt);
  });
}

function getFiltered(){
  return students.filter(s=>{
    const okKelas = kelas==='all' || s.Rombel===kelas;
    const jk=(s['Jenis Kelamin']||'').toUpperCase();
    const okGender = gender==='all' || jk.startsWith(gender);
    return okKelas && okGender;
  });
}

function updateCount(){document.getElementById('count').innerText=getFiltered().length}

function rebuildWheel(){
  const list=getFiltered();
  const container=document.getElementById('wheel-segments');
  container.innerHTML='';
  if(!list.length) return;
  const n=list.length;
  const angle=360/n;
  list.forEach((s,i)=>{
    const div=document.createElement('div');div.className='segment';
    div.style.transform=`rotate(${i*angle}deg)`;
    div.style.background = i%2===0?'#93c5fd':'#fde68a';
    div.innerHTML=`<span style='transform:rotate(${angle/2}deg)'>${s.Nama}</span>`;
    container.appendChild(div);
  });
}

function showPopup(name){
  document.getElementById('celebrate-name').innerText = name;
  document.getElementById('celebrate-overlay').style.display='flex';
  launchConfetti();
}

function spin(){
  const list=getFiltered();
  if(!list.length){
    alert('Data belum terbaca atau Sheet belum dibuka untuk publik. Pastikan: Share → Anyone with link → Viewer');
    return;
  }
  rebuildWheel();
  rotation += 1800 + Math.random()*720;
  document.getElementById('wheel').style.transform=`rotate(${rotation}deg)`;
  const pick=list[Math.floor(Math.random()*list.length)];
  setTimeout(()=>{
    document.getElementById('center-text').innerText=pick.Nama;
    document.getElementById('result').innerText=`Terpilih: ${pick.Nama}`;
    showPopup(pick.Nama);
  },1200);
}

// events
document.querySelectorAll('.btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    gender=btn.dataset.gender;rebuildWheel();updateCount();
  });
});

document.getElementById('kelasSelect').addEventListener('change',e=>{kelas=e.target.value;rebuildWheel();updateCount()});

document.getElementById('spinBtn').addEventListener('click',spin);

document.getElementById('closePop').addEventListener('click',()=>{
  document.getElementById('celebrate-overlay').style.display='none';
});

loadSheet();
</script>
</body>
</html>
