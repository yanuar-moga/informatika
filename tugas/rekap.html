<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Rekap Tugas</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:20px;
}

h2{ margin-bottom:15px; }

.topbar{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

select,button{
  padding:8px;
}

button{
  background:#0A4FA3;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{ background:#083d82; }

.stat{
  margin:10px 0;
  font-weight:bold;
}

.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.box{
  flex:1;
  min-width:250px;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

ul{
  padding-left:18px;
  font-size:14px;
  max-height:250px;
  overflow:auto;
}

.sudah{ color:green; }
.belum{ color:red; }

canvas{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
  margin-top:20px;
}
</style>
</head>

<body>

<h2>📊 Dashboard Rekap Pengumpulan Tugas</h2>

<div class="topbar">
  <select id="filterKelas">
    <option value="ALL">Semua Kelas</option>
  </select>

  <select id="filterJudul">
    <option value="ALL">Semua Judul Tugas</option>
  </select>

  <button onclick="exportExcel()">📥 Export Excel</button>
</div>

<div class="stat" id="statistik">Memuat data...</div>

<div class="container">
  <div class="box">
    <h3 class="sudah">🟢 Sudah Mengirim</h3>
    <ul id="sudahList"></ul>
  </div>

  <div class="box">
    <h3 class="belum">🔴 Belum Mengirim</h3>
    <ul id="belumList"></ul>
  </div>
</div>

<canvas id="chartBar" height="120"></canvas>

<script>

const url="https://script.google.com/macros/s/AKfycbx0pBzQehWLYRcH20TRjIdHzBlRJy_EvDGPuhZJGx1J0VTieGjNbxFCfmILLK_q2J5v/exec";

let semuaSiswa=[];
let semuaTugas=[];
let chart;

/* LOAD DATA */
Promise.all([
  fetch(url+"?action=getDataSiswa").then(r=>r.json()),
  fetch(url+"?action=getDataTugas").then(r=>r.json())
])
.then(([siswa,tugas])=>{
  semuaSiswa=siswa;
  semuaTugas=tugas;
  initFilter();
  renderData();
})
.catch(()=>{
  document.getElementById("statistik").innerHTML="Gagal mengambil data";
});


function initFilter(){

  const kelasSelect=document.getElementById("filterKelas");
  const judulSelect=document.getElementById("filterJudul");

  [...new Set(semuaSiswa.map(s=>s.rombel))]
  .sort()
  .forEach(r=>{
    kelasSelect.innerHTML+=`<option value="${r}">${r}</option>`;
  });

  [...new Set(semuaTugas.map(t=>t.judul))]
  .sort()
  .forEach(j=>{
    judulSelect.innerHTML+=`<option value="${j}">${j}</option>`;
  });

  kelasSelect.onchange=renderData;
  judulSelect.onchange=renderData;
}


function renderData(){

  const kelas=document.getElementById("filterKelas").value;
  const judul=document.getElementById("filterJudul").value;

  let siswaFilter=kelas==="ALL"
    ? semuaSiswa
    : semuaSiswa.filter(s=>s.rombel===kelas);

  let tugasFilter=judul==="ALL"
    ? semuaTugas
    : semuaTugas.filter(t=>t.judul===judul);

  const sudahKirim=[...new Set(tugasFilter.map(t=>t.nama))];

  const sudah=siswaFilter.filter(s=>sudahKirim.includes(s.nama));
  const belum=siswaFilter.filter(s=>!sudahKirim.includes(s.nama));

  document.getElementById("statistik").innerHTML=
    `Total: ${siswaFilter.length} | Sudah: ${sudah.length} | Belum: ${belum.length}`;

  document.getElementById("sudahList").innerHTML=
    sudah.map(s=>`<li>${s.nama}</li>`).join("");

  document.getElementById("belumList").innerHTML=
    belum.map(s=>`<li>${s.nama}</li>`).join("");

  renderChart(sudah.length,belum.length);
}


function renderChart(jumlahSudah,jumlahBelum){

  const ctx=document.getElementById("chartBar").getContext("2d");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"bar",
    data:{
      labels:["Sudah","Belum"],
      datasets:[{
        label:"Jumlah Siswa",
        data:[jumlahSudah,jumlahBelum],
        backgroundColor:["green","red"]
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{ display:false }
      }
    }
  });
}


/* EXPORT EXCEL */
function exportExcel(){

  const kelas=document.getElementById("filterKelas").value;
  const judul=document.getElementById("filterJudul").value;

  let siswaFilter=kelas==="ALL"
    ? semuaSiswa
    : semuaSiswa.filter(s=>s.rombel===kelas);

  let tugasFilter=judul==="ALL"
    ? semuaTugas
    : semuaTugas.filter(t=>t.judul===judul);

  const sudahKirim=[...new Set(tugasFilter.map(t=>t.nama))];

  let csv="Nama,Kelas,Status\n";

  siswaFilter.forEach(s=>{
    const status=sudahKirim.includes(s.nama)?"Sudah":"Belum";
    csv+=`${s.nama},${s.rombel},${status}\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="rekap_tugas.csv";
  link.click();
}

</script>

</body>
</html>
