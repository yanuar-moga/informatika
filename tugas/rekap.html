<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rekap Pengumpulan Tugas</title>

<style>
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:20px;
}

h2{ margin-bottom:10px; }

.stat{
  margin-bottom:15px;
  font-weight:bold;
}

select{
  padding:8px;
  margin-bottom:15px;
}

.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.box{
  flex:1;
  min-width:250px;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

ul{
  padding-left:18px;
  font-size:14px;
}

.sudah{ color:green; }
.belum{ color:red; }
</style>
</head>

<body>

<h2>📊 Rekap Pengumpulan Tugas</h2>

<select id="filterKelas">
  <option value="ALL">Semua Rombel</option>
</select>

<div class="stat" id="statistik">Memuat data...</div>

<div class="container">
  <div class="box">
    <h3 class="sudah">🟢 Sudah Mengirim</h3>
    <ul id="sudahList"></ul>
  </div>

  <div class="box">
    <h3 class="belum">🔴 Belum Mengirim</h3>
    <ul id="belumList"></ul>
  </div>
</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbwl_F3KnbrgDNq4zMTKEKwoILyRHY-yifteuAiqlEFPGkBxFNzNbXaaqF4X3JiRGxiv/exec";

let semuaSiswa = [];
let semuaTugas = [];

fetch(url)
.then(res => res.json())
.then(data => {

  semuaTugas = data.tugas.slice(1);
  semuaSiswa = data.siswa.slice(1);

  initFilter();
  renderData("ALL");

})
.catch(()=>{
  document.getElementById("statistik").innerHTML = "Gagal mengambil data";
});

function initFilter(){
  const select = document.getElementById("filterKelas");

  const rombels = [...new Set(semuaSiswa.map(s=>s[3]))];

  rombels.forEach(r=>{
    select.innerHTML += `<option value="${r}">${r}</option>`;
  });

  select.addEventListener("change",function(){
    renderData(this.value);
  });
}

function renderData(kelas){

  const siswaFilter = kelas==="ALL"
    ? semuaSiswa
    : semuaSiswa.filter(s=>s[3]===kelas);

  let sudahKirim = semuaTugas.map(t=>t[2]);
  sudahKirim = [...new Set(sudahKirim)];

  const sudah = siswaFilter.filter(s=>sudahKirim.includes(s[1]));
  const belum = siswaFilter.filter(s=>!sudahKirim.includes(s[1]));

  document.getElementById("statistik").innerHTML =
    "Total: " + siswaFilter.length +
    " | Sudah: " + sudah.length +
    " | Belum: " + belum.length;

  const sudahList = document.getElementById("sudahList");
  const belumList = document.getElementById("belumList");

  sudahList.innerHTML="";
  belumList.innerHTML="";

  sudah.forEach(s=>{
    sudahList.innerHTML += `<li>${s[1]}</li>`;
  });

  belum.forEach(s=>{
    belumList.innerHTML += `<li>${s[1]}</li>`;
  });

}

</script>

</body>
</html>
