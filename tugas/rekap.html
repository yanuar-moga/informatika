<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rekap Pengumpulan Tugas</title>

<style>
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:20px;
}

h2{ margin-bottom:10px; }

.stat{
  margin-bottom:15px;
  font-weight:bold;
}

select{
  padding:8px;
  margin-bottom:15px;
}

.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.box{
  flex:1;
  min-width:250px;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

ul{
  padding-left:18px;
  font-size:14px;
}

.sudah{ color:green; }
.belum{ color:red; }
</style>
</head>

<body>

<h2>📊 Rekap Pengumpulan Tugas</h2>

<select id="filterKelas">
  <option value="ALL">Semua Rombel</option>
</select>

<div class="stat" id="statistik">Memuat data...</div>

<div class="container">
  <div class="box">
    <h3 class="sudah">🟢 Sudah Mengirim</h3>
    <ul id="sudahList"></ul>
  </div>

  <div class="box">
    <h3 class="belum">🔴 Belum Mengirim</h3>
    <ul id="belumList"></ul>
  </div>
</div>

<script>

const url="https://script.google.com/macros/s/AKfycbx0pBzQehWLYRcH20TRjIdHzBlRJy_EvDGPuhZJGx1J0VTieGjNbxFCfmILLK_q2J5v/exec";

let semuaSiswa=[];
let semuaTugas=[];

/* =========================
   LOAD DATA
========================= */
Promise.all([
  fetch(url+"?action=getDataSiswa").then(r=>r.json()),
  fetch(url+"?action=getDataTugas").then(r=>r.json())
])
.then(([siswa,tugas])=>{

  semuaSiswa=siswa;
  semuaTugas=tugas;

  initFilter();
  renderData("ALL");

})
.catch(()=>{
  document.getElementById("statistik").innerHTML="Gagal mengambil data";
});


/* =========================
   INIT FILTER
========================= */
function initFilter(){

  const select=document.getElementById("filterKelas");

  const rombels=[...new Set(semuaSiswa.map(s=>s.rombel))];

  rombels.sort();

  rombels.forEach(r=>{
    select.innerHTML+=`<option value="${r}">${r}</option>`;
  });

  select.addEventListener("change",function(){
    renderData(this.value);
  });

}


/* =========================
   RENDER DATA
========================= */
function renderData(kelas){

  const siswaFilter=kelas==="ALL"
    ? semuaSiswa
    : semuaSiswa.filter(s=>s.rombel===kelas);

  const sudahKirim=[...new Set(semuaTugas.map(t=>t.nama))];

  const sudah=siswaFilter.filter(s=>sudahKirim.includes(s.nama));
  const belum=siswaFilter.filter(s=>!sudahKirim.includes(s.nama));

  document.getElementById("statistik").innerHTML=
    "Total: "+siswaFilter.length+
    " | Sudah: "+sudah.length+
    " | Belum: "+belum.length;

  const sudahList=document.getElementById("sudahList");
  const belumList=document.getElementById("belumList");

  sudahList.innerHTML="";
  belumList.innerHTML="";

  sudah.sort((a,b)=>a.nama.localeCompare(b.nama));
  belum.sort((a,b)=>a.nama.localeCompare(b.nama));

  sudah.forEach(s=>{
    sudahList.innerHTML+=`<li>${s.nama}</li>`;
  });

  belum.forEach(s=>{
    belumList.innerHTML+=`<li>${s.nama}</li>`;
  });

}

</script>

</body>
</html>
