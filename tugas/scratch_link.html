<script>

const url = "https://script.google.com/macros/s/AKfycbyKVxj7AUjLf836pJ403S2WsigeOF4pP-3xIHG8Ui36cKllT3RLY1i4W8tISbS212s/exec";

let semuaSiswa = [];

// Ambil data siswa
fetch(url)
.then(res => res.json())
.then(data => {
  semuaSiswa = data.slice(1); // hapus header
})
.catch(() => alert("Gagal mengambil data siswa"));


// Saat kelas dipilih
document.getElementById("kelas").addEventListener("change", function(){

  const kelasDipilih = this.value;
  const selectNama = document.getElementById("nama");

  selectNama.innerHTML = "<option value=''>Memuat...</option>";

  if(!kelasDipilih){
    selectNama.innerHTML = "<option value=''>Pilih Kelas Dulu</option>";
    return;
  }

  // FILTER BERDASARKAN KOLOM ROMBEL (index 3)
  const siswaFilter = semuaSiswa.filter(s => 
    s[3] === kelasDipilih
  );

  selectNama.innerHTML = "<option value=''>Pilih Nama</option>";

  if(siswaFilter.length === 0){
    selectNama.innerHTML += "<option value=''>Tidak ada siswa</option>";
    return;
  }

  // AMBIL NAMA DI KOLOM INDEX 1
  siswaFilter.forEach(s => {
    selectNama.innerHTML += `
      <option value="${s[1]}">${s[1]}</option>
    `;
  });

});


// Kirim data
function kirim(){

  const btn = document.getElementById("btnKirim");

  const judul = document.getElementById("judul").value.trim();
  const kelas = document.getElementById("kelas").value;
  const nama = document.getElementById("nama").value;
  const link = document.getElementById("link").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if(!judul || !kelas || !nama || !link){
    alert("Semua field wajib diisi!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Mengirim...";

  fetch(url,{
    method:"POST",
    body:new URLSearchParams({
      judul,
      nama,
      kelas,
      link,
      catatan
    })
  })
  .then(res=>res.text())
  .then(res=>{

    if(res === "SUCCESS"){
      alert("Tugas berhasil dikirim!");

      document.getElementById("judul").value="";
      document.getElementById("kelas").value="";
      document.getElementById("nama").innerHTML="<option value=''>Pilih Kelas Dulu</option>";
      document.getElementById("link").value="";
      document.getElementById("catatan").value="";
    }else{
      alert("Gagal mengirim data");
    }

    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  })
  .catch(()=>{
    alert("Terjadi kesalahan koneksi");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  });

}

</script>
