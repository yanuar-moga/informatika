<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pengumpulan Tugas - Informatika</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#e3f2fd,#bbdefb);
  display: flex;
  align-items: center;
  justify-content: center;
  padding:20px;
}

.card {
  width: 420px;
  background: #fff;
  border-radius: 18px;
  padding: 28px 26px 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.15);
  text-align: center;
}

.logo {
  width: 80px;
  margin-bottom: 10px;
}

.title {
  margin: 6px 0 18px;
  color: #0A4FA3;
  font-size: 20px;
}

.form { text-align: left; }

.field {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.label-text {
  font-size: 13px;
  margin-bottom: 5px;
  color: #444;
}

.input-field, select, textarea {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  outline: none;
}

.input-field:focus, select:focus, textarea:focus {
  border-color: #0A4FA3;
}

textarea { resize: none; }

.btn-primary {
  width: 100%;
  padding: 11px;
  background: #0A4FA3;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top:10px;
}

.btn-primary:hover {
  background: #083d82;
}

.btn-primary:disabled{
  background:#7a9bc7;
  cursor:not-allowed;
}

.btn-secondary{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#f1f1f1;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="card">

  <img src="assets/logo.png" alt="Logo Sekolah" class="logo" />
  <h1 class="title">Form Pengumpulan Tugas</h1>

  <div class="form">

    <div class="field">
      <span class="label-text">Judul Tugas</span>
      <input id="judul" class="input-field" required />
    </div>

    <div class="field">
      <span class="label-text">Nama Lengkap</span>
      <input id="nama" class="input-field" required />
    </div>

    <div class="field">
      <span class="label-text">Kelas</span>
      <select id="kelas" required>
        <option value="">Pilih Kelas</option>
        <option>7A</option>
        <option>7B</option>
        <option>7C</option>
        <option>7D</option>
        <option>7E</option>
        <option>7F</option>
        <option>7G</option>
        <option>7H</option>
        <option>7I</option>
      </select>
    </div>

    <div class="field">
      <span class="label-text">Link Tugas</span>
      <input id="link" type="url" class="input-field" required />
    </div>

    <div class="field">
      <span class="label-text">Catatan</span>
      <textarea id="catatan" rows="2"></textarea>
    </div>

    <button id="btnKirim" class="btn-primary" onclick="kirim()">Kirim Tugas</button>

  </div>

  <div class="footer">© 2026 Tugas Informatika</div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbwl_F3KnbrgDNq4zMTKEKwoILyRHY-yifteuAiqlEFPGkBxFNzNbXaaqF4X3JiRGxiv/exec";

function kirim(){

  const btn = document.getElementById("btnKirim");
  const judul = document.getElementById("judul").value.trim();
  const nama = document.getElementById("nama").value.trim();
  const kelas = document.getElementById("kelas").value;
  const link = document.getElementById("link").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if(!judul || !nama || !kelas || !link){
    alert("Semua field wajib diisi!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Mengirim...";

  fetch(url,{
    method:"POST",
    body:new URLSearchParams({
      judul:judul,
      nama:nama,
      kelas:kelas,
      link:link,
      catatan:catatan
    })
  })
  .then(res=>res.text())
  .then(res=>{
    if(res === "SUCCESS"){
      alert("Tugas berhasil dikirim!");
      document.getElementById("judul").value="";
      document.getElementById("nama").value="";
      document.getElementById("kelas").value="";
      document.getElementById("link").value="";
      document.getElementById("catatan").value="";
    }else{
      alert("Gagal mengirim data: " + res);
    }
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  })
  .catch(err=>{
    alert("Terjadi kesalahan koneksi");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  });

}

</script>

</body>
</html>
