<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pengumpulan Tugas</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:380px;
  background:#fff;
  border-radius:18px;
  padding:28px 26px 22px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  text-align:center;
}

.logo{
  width:80px;
  margin-bottom:10px;
}

.title{
  margin:6px 0 18px;
  color:#0A4FA3;
  font-size:20px;
}

.form{text-align:left}

.field{
  display:flex;
  flex-direction:column;
  margin-bottom:14px;
}

.label-text{
  font-size:13px;
  margin-bottom:5px;
  color:#444;
}

.input-field,select,textarea{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  height:42px;
  outline:none;
}

textarea{
  height:65px;
  resize:none;
}

.input-field:focus,select:focus,textarea:focus{
  border-color:#0A4FA3;
}

.btn-primary{
  width:100%;
  padding:11px;
  background:#0A4FA3;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary:hover{
  background:#083d82;
}

.btn-primary:disabled{
  background:#7a9bc7;
  cursor:not-allowed;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <img src="assets/logo.png" class="logo" alt="Logo">
  <h1 class="title">Form Pengumpulan Tugas</h1>

  <form id="formTugas" class="form">

    <div class="field">
      <span class="label-text">Kelas</span>
      <select id="kelas" required>
        <option value="">Pilih Kelas</option>
        <option>Kelas 7A</option>
        <option>Kelas 7B</option>
        <option>Kelas 7C</option>
        <option>Kelas 7D</option>
        <option>Kelas 7E</option>
        <option>Kelas 7F</option>
        <option>Kelas 7G</option>
        <option>Kelas 7H</option>
        <option>Kelas 7I</option>
      </select>
    </div>

    <div class="field">
      <span class="label-text">Nama Lengkap</span>
      <select id="nama" required disabled>
        <option value="">Memuat data...</option>
      </select>
    </div>

    <div class="field">
      <span class="label-text">Judul Tugas</span>
      <input id="judul" class="input-field" required>
    </div>

    <div class="field">
      <span class="label-text">Link Tugas</span>
      <input id="link" type="url" class="input-field" required>
    </div>

    <div class="field">
      <span class="label-text">Catatan</span>
      <textarea id="catatan"></textarea>
    </div>

    <button type="submit" id="btnKirim" class="btn-primary">
      Kirim Tugas
    </button>

  </form>

  <div class="footer">© 2026 Informatika</div>
</div>


<script>
document.addEventListener("DOMContentLoaded", function(){

const url="https://script.google.com/macros/s/AKfycbwsgOOQS-GHxjTAx_LzaS9odx6djVlIZxigZpBTEtjFpVWhu-Sh5K6qb5Afp5fH4PSh/exec";

let semuaSiswa=[];

const kelasSelect=document.getElementById("kelas");
const namaSelect=document.getElementById("nama");
const formTugas=document.getElementById("formTugas");
const btn=document.getElementById("btnKirim");
const judul=document.getElementById("judul");
const link=document.getElementById("link");
const catatan=document.getElementById("catatan");

if(!kelasSelect || !namaSelect || !formTugas){
  console.error("Element form tidak ditemukan.");
  return;
}

namaSelect.disabled=true;

/* =======================
   AMBIL DATA SISWA
======================= */
fetch(url+"?action=getDataSiswa")
.then(res=>{
  if(!res.ok) throw new Error("Response error");
  return res.json();
})
.then(data=>{
  semuaSiswa=data;
  namaSelect.innerHTML='<option value="">Pilih Kelas Dulu</option>';
})
.catch(err=>{
  console.error("Gagal ambil data:",err);
});


/* =======================
   FILTER BERDASARKAN KELAS
======================= */
kelasSelect.addEventListener("change",function(){

  const kelasDipilih=this.value;

  if(!kelasDipilih){
    namaSelect.innerHTML='<option value="">Pilih Kelas Dulu</option>';
    namaSelect.disabled=true;
    return;
  }

  const siswaFilter = semuaSiswa.filter(s =>
    s.rombel && s.rombel.trim().toUpperCase() === kelasDipilih.trim().toUpperCase()
  );

  namaSelect.innerHTML='<option value="">Pilih Nama</option>';
  namaSelect.disabled=false;

  siswaFilter.forEach(s=>{
    namaSelect.innerHTML +=
      `<option value="${s.nama}">${s.nama}</option>`;
  });

});


/* =======================
   SUBMIT FORM
======================= */
formTugas.addEventListener("submit",function(e){

  e.preventDefault();

  if(!kelasSelect.value || !namaSelect.value || !judul.value || !link.value){
    alert("Semua field wajib diisi!");
    return;
  }

  btn.disabled=true;
  btn.innerText="Mengirim...";

  const fd=new URLSearchParams();
  fd.append("action","submitTugas");
  fd.append("kelas",kelasSelect.value);
  fd.append("nama",namaSelect.value);
  fd.append("judul",judul.value);
  fd.append("link",link.value);
  fd.append("catatan",catatan.value);

  fetch(url,{
    method:"POST",
    body:fd
  })
  .then(res=>res.json())
  .then(res=>{

    if(res.status==="success"){
      alert("Tugas berhasil dikirim!");
      formTugas.reset();
      namaSelect.innerHTML='<option value="">Pilih Kelas Dulu</option>';
      namaSelect.disabled=true;
    }else{
      alert(res.message || "Gagal mengirim");
    }

    btn.disabled=false;
    btn.innerText="Kirim Tugas";

  })
  .catch(err=>{
    console.error("Submit error:",err);
    alert("Terjadi kesalahan koneksi");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  });

});

});
</script>

</body>
</html>
