<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pengumpulan Tugas</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:380px;
  background:#fff;
  border-radius:18px;
  padding:28px 26px 22px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  text-align:center;
}

.title{
  margin:6px 0 18px;
  color:#0A4FA3;
  font-size:20px;
}

.form{text-align:left}

.field{
  display:flex;
  flex-direction:column;
  margin-bottom:14px;
}

.label-text{
  font-size:13px;
  margin-bottom:5px;
  color:#444;
}

.input-field,select,textarea{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  height:42px;
  outline:none;
}

textarea{
  height:65px;
  resize:none;
}

.input-field:focus,select:focus,textarea:focus{
  border-color:#0A4FA3;
}

.btn-primary{
  width:100%;
  padding:11px;
  background:#0A4FA3;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary:hover{
  background:#083d82;
}

.btn-secondary{
  display:block;
  width:100%;
  margin-top:10px;
  padding:11px;
  background:#4CAF50;
  border-radius:10px;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
}

.btn-secondary:hover{
  background:#3e8e41;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <h1 class="title">Form Pengumpulan Tugas</h1>

  <form id="formTugas" class="form">

    <!-- KELAS -->
    <div class="field">
      <span class="label-text">Kelas</span>
      <select id="kelas" required>
        <option value="">Pilih Kelas</option>
        <option>Kelas 7A</option>
        <option>Kelas 7B</option>
        <option>Kelas 7C</option>
        <option>Kelas 7D</option>
        <option>Kelas 7E</option>
        <option>Kelas 7F</option>
        <option>Kelas 7G</option>
        <option>Kelas 7H</option>
        <option>Kelas 7I</option>
      </select>
    </div>

    <!-- NAMA KELOMPOK -->
    <div class="field">
      <span class="label-text">Nama (Kelompok)</span>
      <input type="text" id="nama" class="input-field" placeholder="Contoh: Kelompok 1 / Nama Anggota" required>
    </div>

    <!-- JUDUL -->
    <div class="field">
      <span class="label-text">Judul Tugas</span>
      <select id="judul" required>
        <option value="Tugas Kolaborasi Video SPMB">Tugas Kolaborasi Video SPMB</option>
      </select>
    </div>

    <!-- LINK -->
    <div class="field">
      <span class="label-text">Link Tugas</span>
      <input id="link" type="url" class="input-field" required>
    </div>

    <!-- CATATAN -->
    <div class="field">
      <span class="label-text">Catatan</span>
      <textarea id="catatan"></textarea>
    </div>

    <!-- BUTTON -->
    <button type="submit" id="btnKirim" class="btn-primary">
      Kirim Tugas
    </button>

    <!-- REKAP -->
    <a href="https://yanuar-moga.github.io/informatika/tugas_kelompok/rekap" target="_blank" class="btn-secondary">
      Lihat Rekap Pengiriman Tugas
    </a>

  </form>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 MB All Rights Reserved
  </div>
</div>

<script>
const url="https://script.google.com/macros/s/AKfycbw7UWmQGgF-yBoN6wWnZmlGkSB1qfUZGF_BtD9bnRINz766P846T1MOiXd83FKGZsYQ/exec";

const formTugas=document.getElementById("formTugas");
const btn=document.getElementById("btnKirim");

formTugas.addEventListener("submit",function(e){
  e.preventDefault();

  const kelas=document.getElementById("kelas").value;
  const nama=document.getElementById("nama").value;
  const judul=document.getElementById("judul").value;
  const link=document.getElementById("link").value;
  const catatan=document.getElementById("catatan").value;

  if(!kelas || !nama || !judul || !link){
    alert("Semua field wajib diisi!");
    return;
  }

  btn.disabled=true;
  btn.innerText="Mengirim...";

  const fd=new URLSearchParams();
  fd.append("action","submitTugas");
  fd.append("kelas",kelas);
  fd.append("nama",nama);
  fd.append("judul",judul);
  fd.append("link",link);
  fd.append("catatan",catatan);

  fetch(url,{
    method:"POST",
    body:fd
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.status==="success"){
      alert("Tugas berhasil dikirim!");
      formTugas.reset();
    }else{
      alert("Gagal mengirim");
    }

    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  })
  .catch(()=>{
    alert("Terjadi kesalahan koneksi");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  });

});
</script>

</body>
</html>
