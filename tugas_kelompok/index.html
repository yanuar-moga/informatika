<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pengumpulan Tugas</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:400px;
  background:#fff;
  border-radius:18px;
  padding:28px 26px 22px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  text-align:center;
}

.logo{
  width:80px;
  margin-bottom:10px;
}

.title{
  margin:6px 0 18px;
  color:#0A4FA3;
}

.form{text-align:left}

.field{
  margin-bottom:14px;
}

.label-text{
  font-size:13px;
  margin-bottom:6px;
  display:block;
  color:#444;
}

.input-field,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

textarea{
  height:65px;
  resize:none;
}

.checkbox-list{
  max-height:140px;
  overflow-y:auto;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
}

.checkbox-item{
  display:flex;
  align-items:center;
  margin-bottom:5px;
  font-size:13px;
}

.checkbox-item input{
  margin-right:6px;
}

.btn-primary{
  width:100%;
  padding:11px;
  background:#0A4FA3;
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.btn-secondary{
  display:block;
  width:100%;
  margin-top:10px;
  padding:11px;
  background:#4CAF50;
  border-radius:10px;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:bold;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">

<img src="assets/logo.png" class="logo">
<h1 class="title">Form Pengumpulan Tugas</h1>

<form id="formTugas" class="form">

<div class="field">
  <span class="label-text">Nama Kelompok</span>
  <input type="text" id="kelompok" class="input-field" required>
</div>

<div class="field">
  <span class="label-text">Kelas</span>
  <select id="kelas" required>
    <option value="">Pilih Kelas</option>
    <option>Kelas 7A</option>
    <option>Kelas 7B</option>
    <option>Kelas 7C</option>
    <option>Kelas 7D</option>
    <option>Kelas 7E</option>
    <option>Kelas 7F</option>
    <option>Kelas 7G</option>
    <option>Kelas 7H</option>
    <option>Kelas 7I</option>
  </select>
</div>

<div class="field">
  <span class="label-text">Nama Anak (maksimal 6)</span>
  <div id="listNama" class="checkbox-list">
    Memuat data...
  </div>
</div>

<div class="field">
  <span class="label-text">Judul Tugas</span>
  <select id="judul">
    <option>Tugas Kolaborasi Video SPMB</option>
  </select>
</div>

<div class="field">
  <span class="label-text">Link Tugas</span>
  <input id="link" type="url" class="input-field" required>
</div>

<div class="field">
  <span class="label-text">Catatan</span>
  <textarea id="catatan"></textarea>
</div>

<button type="submit" id="btnKirim" class="btn-primary">
  Kirim Tugas
</button>

<a href="https://yanuar-moga.github.io/informatika/tugas_kelompok/rekap" target="_blank" class="btn-secondary">
  Lihat Rekap Pengiriman Tugas
</a>

</form>

<div class="footer">© 2026 MB All Rights Reserved</div>

</div>

<script>
const url="https://script.google.com/macros/s/AKfycbw7UWmQGgF-yBoN6wWnZmlGkSB1qfUZGF_BtD9bnRINz766P846T1MOiXd83FKGZsYQ/exec";

let semuaSiswa=[];

const kelas=document.getElementById("kelas");
const listNama=document.getElementById("listNama");

/* LOAD DATA */
fetch(url+"?action=getDataSiswa")
.then(res=>res.json())
.then(data=>{
  semuaSiswa=data || [];
  listNama.innerHTML="Pilih kelas dulu";
});

/* FILTER */
kelas.addEventListener("change",function(){
  const k=this.value.toUpperCase().trim();

  const filter=semuaSiswa.filter(s=>
    s.rombel && s.rombel.toUpperCase().trim()===k
  );

  listNama.innerHTML="";

  filter.forEach(s=>{
    const div=document.createElement("div");
    div.className="checkbox-item";

    div.innerHTML = `
      <input type="checkbox" value="${s.nama}">
      <label>${s.nama}</label>
    `;

    listNama.appendChild(div);
  });
});

/* BATASI 6 */
listNama.addEventListener("change",function(){
  const checked = listNama.querySelectorAll("input:checked");

  if(checked.length > 6){
    alert("Maksimal 6 anak!");
    event.target.checked = false;
  }
});

/* SUBMIT */
document.getElementById("formTugas").addEventListener("submit",function(e){
  e.preventDefault();

  const kelompok=document.getElementById("kelompok").value;
  const kelasVal=kelas.value;

  const nama = [...listNama.querySelectorAll("input:checked")]
    .map(i=>i.value).join(", ");

  const link=document.getElementById("link").value;
  const catatan=document.getElementById("catatan").value;

  if(!kelompok || !kelasVal || !nama || !link){
    alert("Lengkapi data!");
    return;
  }

  const btn=document.getElementById("btnKirim");
  btn.disabled=true;
  btn.innerText="Mengirim...";

  const fd=new URLSearchParams();
  fd.append("action","submitTugas");
  fd.append("kelompok",kelompok);
  fd.append("kelas",kelasVal);
  fd.append("nama",nama);
  fd.append("judul","Tugas Kolaborasi Video SPMB");
  fd.append("link",link);
  fd.append("catatan",catatan);

  fetch(url,{method:"POST",body:fd})
  .then(res=>res.json())
  .then(res=>{
    alert(res.status==="success" ? "Berhasil!" : "Gagal!");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  })
  .catch(()=>{
    alert("Error koneksi");
    btn.disabled=false;
    btn.innerText="Kirim Tugas";
  });

});
</script>

</body>
</html>
