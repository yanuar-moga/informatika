<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Presentation Timer</title>

<style>

body{
margin:0;
font-family:Segoe UI, Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

#container{
width:90%;
}

#clock{
font-size:80px;
font-weight:bold;
}

#elapsed{
font-size:30px;
color:#38bdf8;
margin-top:10px;
}

#activity{
font-size:50px;
margin-top:40px;
color:#facc15;
}

#countdown{
font-size:120px;
margin-top:20px;
color:#ef4444;
font-weight:bold;
}

#buttons{
margin-top:40px;
}

button{
font-size:24px;
padding:12px 30px;
margin:10px;
border-radius:12px;
border:none;
background:#f1f5f9;
color:black;
cursor:pointer;
}

button:hover{
background:#e2e8f0;
}

</style>

</head>

<body>

<div id="container">

<div id="clock">00:00:00</div>
<div id="elapsed">Elapsed: 00:00</div>

<div id="activity"></div>

<div id="countdown"></div>

<div id="buttons">
<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>
</div>

</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/1482QVxSy6BcsBgWXVjf_BUqpWYmdlsEDkDhfvZpj0vQ/gviz/tq?tqx=out:csv"

let schedule=[]
let running=false
let startTime=null
let active=false
let countdown=0
let used={}

async function loadSchedule(){

let res=await fetch(SHEET_URL)
let text=await res.text()

let rows=text.split("\n").slice(1)

schedule=[]

rows.forEach(r=>{

let c=r.split(",")

if(c.length>=3){

schedule.push({
time:c[0].trim(),
duration:parseInt(c[1]),
activity:c[2]
})

}

})

}

function updateClock(){

let now=new Date()

let h=String(now.getHours()).padStart(2,"0")
let m=String(now.getMinutes()).padStart(2,"0")
let s=String(now.getSeconds()).padStart(2,"0")

document.getElementById("clock").innerText=`${h}:${m}:${s}`

if(running){

let diff=Math.floor((now-startTime)/1000)

let em=Math.floor(diff/60)
let es=diff%60

document.getElementById("elapsed").innerText=
`Elapsed: ${String(em).padStart(2,"0")}:${String(es).padStart(2,"0")}`

checkSchedule()

}

setTimeout(updateClock,1000)

}

function startTimer(){

running=true
startTime=new Date()
used={}

}

function stopTimer(){

running=false
active=false

document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

function checkSchedule(){

if(active) return

let now=new Date()

let key=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")

schedule.forEach(item=>{

if(item.time===key && !used[key]){

countdown=item.duration*60
active=true
used[key]=true

document.getElementById("activity").innerText=item.activity

runCountdown()

}

})

}

function runCountdown(){

if(countdown>=0 && active){

let m=Math.floor(countdown/60)
let s=countdown%60

document.getElementById("countdown").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

countdown--

setTimeout(runCountdown,1000)

}else{

active=false
document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

}

async function init(){

await loadSchedule()
updateClock()

}

init()

</script>

</body>
</html>
