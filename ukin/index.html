<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teaching Timeline Timer</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Segoe UI;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

#container{
width:90%;
}

#elapsed{
font-size:90px;
font-weight:bold;
}

#label{
font-size:30px;
color:#38bdf8;
}

#activity{
font-size:60px;
margin-top:30px;
color:#facc15;
}

#countdown{
font-size:120px;
margin-top:20px;
color:#ef4444;
}

#buttons{
margin-top:40px;
}

button{
font-size:24px;
padding:12px 40px;
margin:10px;
border-radius:12px;
border:none;
background:#f1f5f9;
color:black;
cursor:pointer;
}

</style>

</head>

<body>

<div id="container">

<div id="label">Waktu Berjalan</div>
<div id="elapsed">00:00</div>

<div id="activity"></div>

<div id="countdown"></div>

<div id="buttons">
<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>
</div>

</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/1482QVxSy6BcsBgWXVjf_BUqpWYmdlsEDkDhfvZpj0vQ/gviz/tq?tqx=out:csv"

let schedule=[]
let running=false
let startTime=null
let active=false
let countdown=0
let used={}

async function loadSchedule(){

let res=await fetch(SHEET_URL)
let text=await res.text()

let rows=text.split("\n").slice(1)

schedule=[]

rows.forEach(r=>{

let c=r.split(",")

if(c.length>=3){

schedule.push({
minute:parseInt(c[0]),
duration:parseInt(c[1]),
activity:c[2]
})

}

})

}

function startTimer(){

running=true
startTime=new Date()
used={}

}

function stopTimer(){

running=false
active=false

document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

function updateTimer(){

if(running){

let now=new Date()

let diff=Math.floor((now-startTime)/1000)

let m=Math.floor(diff/60)
let s=diff%60

document.getElementById("elapsed").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

checkSchedule(m)

}

setTimeout(updateTimer,1000)

}

function checkSchedule(currentMinute){

if(active) return

schedule.forEach(item=>{

if(item.minute===currentMinute && !used[item.minute]){

countdown=item.duration*60
active=true
used[item.minute]=true

document.getElementById("activity").innerText=item.activity

runCountdown()

}

})

}

function runCountdown(){

if(countdown>=0 && active){

let m=Math.floor(countdown/60)
let s=countdown%60

document.getElementById("countdown").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

countdown--

setTimeout(runCountdown,1000)

}else{

active=false
document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

}

async function init(){

await loadSchedule()
updateTimer()

}

init()

</script>

</body>
</html>
