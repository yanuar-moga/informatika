<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teaching Timeline Timer</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#app{
width:90%;
max-width:1100px;
text-align:center;
}

.panel{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

/* ELAPSED TIME */

#elapsedLabel{
font-size:20px;
color:#38bdf8;
}

#elapsed{
font-size:70px;
margin-top:5px;
}

/* ACTIVITY */

#activity{
font-size:50px;
margin-top:20px;
color:#facc15;
}

/* COUNTDOWN */

#countdown{
font-size:120px;
color:#ef4444;
margin-top:10px;
}

button{
padding:12px 30px;
margin:10px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:18px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:8px;
}

input{
width:90%;
padding:6px;
}

.delete{
background:#ef4444;
color:white;
}

</style>

</head>

<body>

<div id="app">

<div class="panel">

<div id="elapsedLabel">Waktu Berjalan</div>

<div id="elapsed">00:00</div>

<div id="activity"></div>

<div id="countdown"></div>

<div>

<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>

</div>

</div>

<div class="panel">

<h2>Timeline Editor</h2>

<table id="timeline">

<thead>
<tr>
<th>Menit</th>
<th>Durasi</th>
<th>Kegiatan</th>
<th></th>
</tr>
</thead>

<tbody></tbody>

</table>

<br>

<button onclick="addRow()">Tambah</button>
<button onclick="saveTimeline()">Simpan Timeline</button>

</div>

</div>

<script>

let schedule=[]
let running=false
let startTime=null
let active=false
let countdown=0
let used={}

function loadTimeline(){

let data=localStorage.getItem("teachingTimeline")

if(data){

schedule=JSON.parse(data)

}else{

schedule=[
{minute:0,duration:2,activity:"Salam dan Pembukaan"},
{minute:2,duration:3,activity:"Apersepsi"}
]

}

renderTable()

}

function renderTable(){

let tbody=document.querySelector("#timeline tbody")

tbody.innerHTML=""

schedule.forEach((item,i)=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td><input value="${item.minute}"></td>
<td><input value="${item.duration}"></td>
<td><input value="${item.activity}"></td>
<td><button class="delete" onclick="deleteRow(${i})">X</button></td>
`

tbody.appendChild(tr)

})

}

function addRow(){

schedule.push({minute:0,duration:1,activity:"Kegiatan Baru"})

renderTable()

}

function deleteRow(i){

schedule.splice(i,1)

renderTable()

}

function saveTimeline(){

let rows=document.querySelectorAll("#timeline tbody tr")

schedule=[]

rows.forEach(r=>{

let inputs=r.querySelectorAll("input")

schedule.push({

minute:parseInt(inputs[0].value),
duration:parseInt(inputs[1].value),
activity:inputs[2].value

})

})

schedule.sort((a,b)=>a.minute-b.minute)

localStorage.setItem("teachingTimeline",JSON.stringify(schedule))

alert("Timeline tersimpan")

}

function startTimer(){

running=true
startTime=new Date()
used={}

}

function stopTimer(){

running=false
active=false

document.getElementById("activity").innerText=""
document.getElementById("countdown").innerText=""

}

function updateTimer(){

if(running){

let now=new Date()

let diff=Math.floor((now-startTime)/1000)

let m=Math.floor(diff/60)
let s=diff%60

document.getElementById("elapsed").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

checkSchedule(m)

}

setTimeout(updateTimer,1000)

}

function checkSchedule(currentMinute){

if(active) return

for(let item of schedule){

if(item.minute===currentMinute && !used[item.minute]){

countdown=item.duration*60
active=true
used[item.minute]=true

document.getElementById("activity").innerText=item.activity

runCountdown()

break

}

}

}

function runCountdown(){

if(countdown>=0 && active){

let m=Math.floor(countdown/60)
let s=countdown%60

document.getElementById("countdown").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

countdown--

setTimeout(runCountdown,1000)

}else{

active=false

}

}

loadTimeline()
updateTimer()

</script>

</body>
</html>
