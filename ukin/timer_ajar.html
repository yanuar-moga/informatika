<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teaching Timeline Timer</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#app{
width:90%;
max-width:1200px;
text-align:center;
}

/* GLASS PANEL */

.panel{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
border-radius:20px;
padding:35px;
box-shadow:0 25px 50px rgba(0,0,0,0.5);
margin-bottom:25px;
}

/* LABEL */

#label{
font-size:26px;
color:#38bdf8;
margin-bottom:10px;
}

/* ELAPSED TIME */

#elapsed{
font-size:110px;
font-weight:700;
letter-spacing:4px;
color:white;
text-shadow:0 0 20px rgba(255,255,255,0.35);
}

/* ACTIVITY */

#activity{
font-size:50px;
margin-top:20px;
color:#facc15;
}

/* COUNTDOWN */

#countdown{
font-size:120px;
margin-top:10px;
color:#ef4444;
font-weight:700;
}

/* BUTTONS */

button{
font-size:18px;
padding:12px 30px;
margin:8px;
border:none;
border-radius:12px;
background:white;
color:#111;
cursor:pointer;
transition:all .2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 6px 12px rgba(0,0,0,0.25);
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
color:#94a3b8;
font-weight:500;
padding:8px;
}

td{
padding:8px;
}

input{
width:95%;
padding:6px;
border-radius:6px;
border:none;
}

.delete{
background:#ef4444;
color:white;
}

</style>
</head>

<body>

<div id="app">

<div class="panel">

<div id="label">Waktu Berjalan</div>

<div id="elapsed">00:00</div>

<div id="activity"></div>

<div id="countdown"></div>

<div style="margin-top:20px">

<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>

</div>

</div>

<div class="panel">

<h2 style="margin-top:0">Timeline Editor</h2>

<table id="timeline">

<thead>
<tr>
<th>Menit</th>
<th>Durasi</th>
<th>Kegiatan</th>
<th></th>
</tr>
</thead>

<tbody></tbody>

</table>

<br>

<button onclick="addRow()">Tambah</button>
<button onclick="saveTimeline()">Simpan Timeline</button>

</div>

</div>

<script>

let schedule=[]
let running=false
let startTime=null
let active=false
let countdown=0
let used={}

/* LOAD DATA */

function loadTimeline(){

let data=localStorage.getItem("teachingTimeline")

if(data){

schedule=JSON.parse(data)

}else{

schedule=[
{minute:0,duration:2,activity:"Salam dan Pembukaan"},
{minute:2,duration:3,activity:"Apersepsi"},
{minute:5,duration:10,activity:"Penyampaian Materi"}
]

}

renderTable()

}

/* RENDER TABLE */

function renderTable(){

let tbody=document.querySelector("#timeline tbody")

tbody.innerHTML=""

schedule.forEach((item,i)=>{

let tr=document.createElement("tr")

tr.innerHTML=`

<td><input value="${item.minute}"></td>
<td><input value="${item.duration}"></td>
<td><input value="${item.activity}"></td>
<td><button class="delete" onclick="deleteRow(${i})">X</button></td>

`

tbody.appendChild(tr)

})

}

/* ADD ROW */

function addRow(){

schedule.push({minute:0,duration:1,activity:"Kegiatan Baru"})

renderTable()

}

/* DELETE */

function deleteRow(i){

schedule.splice(i,1)

renderTable()

}

/* SAVE TIMELINE */

function saveTimeline(){

let rows=document.querySelectorAll("#timeline tbody tr")

schedule=[]

rows.forEach(r=>{

let inputs=r.querySelectorAll("input")

schedule.push({

minute:parseInt(inputs[0].value),
duration:parseInt(inputs[1].value),
activity:inputs[2].value

})

})

schedule.sort((a,b)=>a.minute-b.minute)

localStorage.setItem("teachingTimeline",JSON.stringify(schedule))

alert("Timeline tersimpan!")

}

/* START TIMER */

function startTimer(){

running=true
startTime=new Date()
used={}

checkSchedule(0)

}

/* STOP TIMER */

function stopTimer(){

running=false
active=false

document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

/* UPDATE TIMER */

function updateTimer(){

if(running){

let now=new Date()

let diff=Math.floor((now-startTime)/1000)

let m=Math.floor(diff/60)
let s=diff%60

document.getElementById("elapsed").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")

checkSchedule(m)

}

setTimeout(updateTimer,1000)

}

/* CHECK SCHEDULE */

function checkSchedule(currentMinute){

if(active) return

for(let item of schedule){

if(item.minute===currentMinute && !used[item.minute]){

countdown=item.duration*60
active=true
used[item.minute]=true

document.getElementById("activity").innerText=item.activity

runCountdown()

break

}

}

}

/* COUNTDOWN */

function runCountdown(){

if(countdown>=0 && active){

let m=Math.floor(countdown/60)
let s=countdown%60

document.getElementById("countdown").innerText=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")

countdown--

setTimeout(runCountdown,1000)

}else{

active=false
document.getElementById("countdown").innerText=""
document.getElementById("activity").innerText=""

}

}

loadTimeline()
updateTimer()

</script>

</body>
</html>
