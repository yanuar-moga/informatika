<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teaching Timeline Timer</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Segoe UI,Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

#container{
width:85%;
max-width:1400px;
}

#label{
font-size:30px;
color:#38bdf8;
}

#elapsed{
font-size:90px;
font-weight:bold;
margin-top:10px;
}

/* KEGIATAN */

#activity{
font-size:44px;
margin-top:30px;
color:#facc15;
line-height:1.3;
word-wrap:break-word;
}

/* SLIDE */

#slide{
font-size:32px;
margin-top:15px;
color:#67e8f9;
line-height:1.4;
}

/* COUNTDOWN */

#countdown{
font-size:110px;
margin-top:20px;
color:#ef4444;
font-weight:bold;
}

#buttons{
margin-top:40px;
}

button{
font-size:22px;
padding:12px 40px;
margin:10px;
border-radius:10px;
border:none;
background:#f1f5f9;
color:black;
cursor:pointer;
}

button:hover{
background:#e2e8f0;
}

</style>
</head>

<body>

<div id="container">

<div id="label">Waktu Berjalan</div>
<div id="elapsed">00:00</div>

<div id="activity"></div>
<div id="slide"></div>

<div id="countdown"></div>

<div id="buttons">
<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>
</div>

</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/1482QVxSy6BcsBgWXVjf_BUqpWYmdlsEDkDhfvZpj0vQ/export?format=csv"

let schedule=[]
let running=false
let startTime=null
let active=false
let countdown=0
let used={}

/* LOAD GOOGLE SHEET */

async function loadSchedule(){

try{

let res=await fetch(SHEET_URL)
let text=await res.text()

let rows=text.split("\n")

schedule=[]

for(let i=1;i<rows.length;i++){

let r=rows[i].trim()

if(r==="") continue

/* split hanya 3 koma pertama agar teks tidak rusak */

let cols=r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)

let minute=parseInt(cols[0])
let duration=parseInt(cols[1])
let activity=cols[2]
let slide=cols[3]

if(!isNaN(minute)){

schedule.push({
minute:minute,
duration:duration,
activity:activity,
slide:slide
})

}

}

schedule.sort((a,b)=>a.minute-b.minute)

console.log(schedule)

}catch(e){

console.log("Error load sheet",e)

}

}

/* START */

function startTimer(){

running=true
startTime=new Date()
used={}

checkSchedule(0)

}

/* STOP */

function stopTimer(){

running=false
active=false

document.getElementById("activity").innerText=""
document.getElementById("slide").innerText=""
document.getElementById("countdown").innerText=""

}

/* TIMER */

function updateTimer(){

if(running){

let now=new Date()

let diff=Math.floor((now-startTime)/1000)

let minutes=Math.floor(diff/60)
let seconds=diff%60

document.getElementById("elapsed").innerText=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0")

checkSchedule(minutes)

}

setTimeout(updateTimer,1000)

}

/* CEK KEGIATAN */

function checkSchedule(currentMinute){

if(active) return

for(let item of schedule){

if(item.minute===currentMinute && !used[item.minute]){

countdown=item.duration*60
active=true
used[item.minute]=true

document.getElementById("activity").innerText=item.activity
document.getElementById("slide").innerText="Slide: "+item.slide

runCountdown()

break

}

}

}

/* COUNTDOWN */

function runCountdown(){

if(countdown>=0 && active){

let m=Math.floor(countdown/60)
let s=countdown%60

document.getElementById("countdown").innerText=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")

countdown--

setTimeout(runCountdown,1000)

}else{

active=false
document.getElementById("countdown").innerText=""

}

}

/* INIT */

async function init(){

await loadSchedule()
updateTimer()

}

init()

</script>

</body>
</html>
